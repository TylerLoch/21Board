<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#eaf6ff"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e3a8a"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1040" cy="130" r="70" fill="#fcd34d"/>
  <g stroke="#f59e0b" stroke-width="10" stroke-linecap="round">
    <path d="M1040 30v-20M1040 250v-20M940 130h-20M1160 130h-20M969 59l-14-14M1125 215l-14-14M969 201l-14 14M1125 45l-14 14"/>
  </g>
  <!-- cloud -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="4" transform="translate(60 60)">
    <path d="M330 220c-40 0-70-28-70-62s30-62 70-62c12-40 52-66 98-66 52 0 94 32 104 76 40 2 72 30 72 64 0 28-24 50-56 50z"/>
  </g>
  <!-- rain -->
  <g stroke="#2563eb" stroke-width="7" stroke-linecap="round" transform="translate(60 40)">
    <path d="M330 260l-14 34M380 270l-14 34M430 260l-14 34M480 270l-14 34M355 320l-14 34M405 330l-14 34M455 320l-14 34"/>
  </g>
  <!-- mountains -->
  <path d="M0 640L200 380L330 520L460 330L640 640z" fill="#6b8f71"/>
  <path d="M400 410L460 330L520 410L490 400L460 420L430 400z" fill="#ffffff"/>
  <!-- ground and lake -->
  <path d="M0 620h1200v180H0z" fill="#8fbf6a"/>
  <path d="M560 680c60-50 520-60 640-10v130H560z" fill="#3b82f6"/>
  <path d="M640 700c80-20 200-24 300-14" stroke="#93c5fd" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- evaporation -->
  <g stroke="#1e3a8a" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#ar)">
    <path d="M900 660C880 560 920 480 880 380"/>
    <path d="M980 660C960 560 1000 480 960 380"/>
  </g>
  <!-- condensation: water vapor to the cloud -->
  <path d="M860 330C800 240 740 210 685 205" stroke="#1e3a8a" stroke-width="5" fill="none" marker-end="url(#ar)"/>
  <!-- collection: runoff to the lake -->
  <path d="M380 600C460 650 520 680 600 700" stroke="#1e3a8a" stroke-width="5" fill="none" marker-end="url(#ar)"/>
  <!-- labels -->
  <g font-size="40" font-weight="700" fill="#0f172a">
    <text x="690" y="100">Condensation</text>
    <text x="60" y="350">Precipitation</text>
    <text x="855" y="530" text-anchor="end">Evaporation</text>
    <text x="250" y="720">Collection</text>
  </g>
  <text x="40" y="70" font-size="52" font-weight="800" fill="#1e3a8a">The Water Cycle</text>
</svg>

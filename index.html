    /* ---------------------------------------------------------------- Desk */

      background-color: var(--board-bg);

    }
    /* Board patterns: in CSS px on the whole desk, margins included. --pu scales them down for the previews in

    .pattern-dots { background-image: radial-gradient(var(--pattern) max(1.1px, calc(1.6 * var(--pu, 1px))), transparent max(1.4px, calc(1.8 * var(--pu, 1px)))); background-size: calc(32 * var(--pu, 1px)) calc(32 * var(--pu, 1px)); background-position: calc(16 * var(--pu, 1px)) calc(16 * var(--pu, 1px)); }
    .pattern-grid {

      background-size: calc(48 * var(--pu, 1px)) calc(48 * var(--pu, 1px));

    .pattern-lines { background-image: linear-gradient(to bottom, var(--pattern) 1px, transparent 1px); background-size: 100% calc(48 * var(--pu, 1px)); }
    /* Handwriting: rows of 128 px for big writing on a smartboard. A solid top line, a dashed midline and a solid
       base line 64 px below the top, then room for descenders. (The dash is a conic-gradient corner: one gradient
       can't be dashed across and repeat down.) */
    .pattern-handwriting {
      --r: calc(128 * var(--pu, 1px));
      background-image: conic-gradient(at calc(14 * var(--pu, 1px)) 2px, transparent 75%, var(--pattern-strong) 0),

          transparent calc(var(--r) * .75), var(--pattern-strong) 0, var(--pattern-strong) calc(var(--r) * .75 + 2px), transparent 0);
      background-size: calc(24 * var(--pu, 1px)) var(--r), 100% var(--r);
      background-position: 0 calc(var(--r) * .5 - 1px), 0 0;
    }
    /* Graph paper: 24 px squares, a stronger line every 5 squares. */
    .pattern-graph {
      background-image: linear-gradient(to right, var(--pattern-strong) 1px, transparent 1px), linear-gradient(to bottom, var(--pattern-strong) 1px, transparent 1px),
        linear-gradient(to right, var(--pattern) 1px, transparent 1px), linear-gradient(to bottom, var(--pattern) 1px, transparent 1px);
      background-size: calc(120 * var(--pu, 1px)) calc(120 * var(--pu, 1px)), calc(120 * var(--pu, 1px)) calc(120 * var(--pu, 1px)), calc(24 * var(--pu, 1px)) calc(24 * var(--pu, 1px)), calc(24 * var(--pu, 1px)) calc(24 * var(--pu, 1px));

    /* Resize grips: corners and side centers. Hit areas are larger than what's drawn. */
    /* Resize grips are only shown (and only grabbable) on the focused window. */

    /* When the board is zoomed out, handles are scaled back up (--zi) around their point on the edge. */
    .grip.n { transform-origin: 50% 16px; } .grip.s { transform-origin: 50% calc(100% - 16px); }
    .grip.w { transform-origin: 16px 50%; } .grip.e { transform-origin: calc(100% - 16px) 50%; }
    .grip.nw { transform-origin: 14px 14px; } .grip.ne { transform-origin: calc(100% - 14px) 14px; }
    .grip.sw { transform-origin: 14px calc(100% - 14px); } .grip.se { transform-origin: calc(100% - 14px) calc(100% - 14px); }

    .grip::after { content: ""; position: absolute; pointer-events: none; transition: background-color .2s, border-color .2s; } /* only the grip box takes touches */

    .grip.dragging::after { border-color: var(--focus-ring); }
    .grip.n.dragging::after, .grip.s.dragging::after, .grip.e.dragging::after, .grip.w.dragging::after { background-color: var(--focus-ring); }

    .grip.n { top: -16px; } .grip.s { bottom: -16px; }

    .grip.e::after { right: 6px; } .grip.w::after { left: 6px; }

    .grip.nw { left: -14px; top: -14px; cursor: nwse-resize; }
    .grip.ne { right: -14px; top: -14px; cursor: nesw-resize; }
    .grip.sw { left: -14px; bottom: -14px; cursor: nesw-resize; }
    .grip.se { right: -14px; bottom: -14px; cursor: nwse-resize; }
    /* Handles sit just outside the window edge (and its focus ring) so they read as separate tabs. */

    .grip.ne::after { right: 5px; top: 5px; border-left: 0; border-bottom: 0; border-top-right-radius: 21px; }
    .grip.sw::after { left: 5px; bottom: 5px; border-right: 0; border-top: 0; border-bottom-left-radius: 21px; }
    .grip.se::after { right: 5px; bottom: 5px; border-left: 0; border-top: 0; border-bottom-right-radius: 21px; }

    .win.at-l .grip.w::after { left: 19px; }  .win.at-r .grip.e::after { right: 19px; }
    /* A corner next to a board edge: the handle goes inside the window and curves around the window's own corner
       (same center, 12px in), reaching 1px past the window's edge so it overlaps the focus ring with no seam. */
    .win.at-t .grip.nw::after, .win.at-l .grip.nw::after { left: 13px; top: 13px; border-top-left-radius: 13px; }
    .win.at-t .grip.ne::after, .win.at-r .grip.ne::after { right: 13px; top: 13px; border-top-right-radius: 13px; }
    .win.at-b .grip.sw::after, .win.at-l .grip.sw::after { left: 13px; bottom: 13px; border-bottom-left-radius: 13px; }
    .win.at-b .grip.se::after, .win.at-r .grip.se::after { right: 13px; bottom: 13px; border-bottom-right-radius: 13px; }
    .win::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 12px; border: 0 solid var(--focus-ring); }
    .win.focused:not(.maximized).at-l::before { border-left-width: calc(var(--focus-ring-width) * var(--zi, 1)); }
    .win.focused:not(.maximized).at-t::before { border-top-width: calc(var(--focus-ring-width) * var(--zi, 1)); }
    .win.focused:not(.maximized).at-r::before { border-right-width: calc(var(--focus-ring-width) * var(--zi, 1)); }
    .win.focused:not(.maximized).at-b::before { border-bottom-width: calc(var(--focus-ring-width) * var(--zi, 1)); }
    .win.no-resize .grip, .win.maximized .grip { display: none; }

    .win.maximized .win-body { border-radius: 0; }

    /* ---------------------------------------------------------- Widget Picker */
    .picker-btn {

    .picker-btn svg { width: 28px; height: 28px; }
    .picker-btn.active { background: var(--active-bg); color: var(--primary); box-shadow: none; border-color: transparent; backdrop-filter: none; }
    .picker-btn[hidden] { display: none; }
    .picker-btn .dot, .ctl .dot { position: absolute; top: 7px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); }
    /* "Not saved" (SaveNote in board.js): stays above the Widget Picker button while the board isn't stored.
       "Reconnect folder" and the like (FolderNote): the same, while the linked Google Drive folder can't be used. */
    .save-note, .save-note:hover, .folder-note, .folder-note:hover {
      position: fixed; z-index: 999; bottom: calc(86px + env(safe-area-inset-bottom)); height: 40px; padding: 0 14px 0 12px;   /* (an open panel or Settings covers it) */
      border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap;
      background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; box-shadow: var(--shadow);
    }
    body.dark .save-note, body.dark .save-note:hover, body.dark .folder-note, body.dark .folder-note:hover { background: #3b2a06; color: #fcd34d; border-color: #b45309; }
    .save-note.left, .folder-note.left { left: calc(16px + env(safe-area-inset-left)); }
    .save-note.right, .folder-note.right { right: calc(16px + env(safe-area-inset-right)); }
    .save-note[hidden], .folder-note[hidden] { display: none; }

    .panel {
      position: fixed; bottom: calc(4px + env(safe-area-inset-bottom)); z-index: 1000;
      display: none; flex-direction: column; gap: 10px;
      padding: 12px; max-height: calc(100% - 8px); max-width: calc(100% - 8px);
      background: var(--toolbar-bg); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transform-origin: bottom left;
    }
    .panel.left { left: calc(4px + env(safe-area-inset-left)); }
    .panel.right { right: calc(4px + env(safe-area-inset-right)); transform-origin: bottom right; }

    @keyframes panel-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    .panel-widgets {
      display: grid; grid-template-columns: repeat(var(--cols, 4), 92px); gap: 6px;
      overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 2px;
    }

      position: relative; width: 92px; height: 98px; flex-direction: column; gap: 7px;
      border-radius: 16px; color: var(--text); font-size: 13px; font-weight: 500; line-height: 1.15; text-align: center; padding: 4px;
    }
    .widget-tile:active { background: var(--active-bg); }
    .widget-icon {
      width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; color: #fff;
      background: var(--c, #64748b); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14), 0 2px 6px rgba(0, 0, 0, .12);
    }

      position: absolute; top: 2px; right: 12px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
      background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700; display: grid; place-items: center;
      border: 2px solid var(--surface);
    }
    .widget-tile .devtag { position: absolute; top: 4px; left: 8px; font-size: 9px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
    .panel-sep { height: 1px; background: var(--border); margin: 0 6px; flex: 0 0 auto; }
    .panel-controls { display: flex; align-items: center; gap: 6px; flex: 0 0 56px; }
    .panel.right .panel-controls { flex-direction: row-reverse; }
    .picker-spacer { width: 56px; height: 56px; flex: 0 0 56px; }
    .ctl { position: relative; width: 50px; height: 50px; border-radius: 14px; }
    .ctl svg { width: 26px; height: 26px; }
    .ctl[hidden] { display: none; }
    .ctl[data-ctl="quit"] { color: var(--danger); } /* kiosk mode: a plain red X */
    .ctl[data-ctl="quit"] svg { stroke-width: 2.6; }

    /* -------------------------------------------------------- Window menu */
    .menu {
      position: fixed; z-index: 1100; min-width: 220px; max-width: min(320px, calc((100vw - 16px) / var(--ui, 1)));
      max-height: calc((100vh - 16px) / var(--ui, 1)); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      padding: 6px; display: none; flex-direction: column;
      background: var(--toolbar-bg); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .menu.open { display: flex; animation: panel-in .14s ease-out; }
    .menu-item {
      width: 100%; min-height: 46px; flex: 0 0 auto; padding: 0 14px; gap: 14px; justify-content: flex-start;
      font-size: 15px; font-weight: 500; color: var(--text); border-radius: 9px; text-align: left;
    }
    .menu-item svg { width: 20px; height: 20px; color: var(--icon-color); }
    .menu-item .icon-slot { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 20px; }
    .menu-item .label { flex: 1; }
    .menu-item .check { width: 18px; height: 18px; color: var(--primary); }
    .menu-item.danger, .menu-item.danger svg { color: var(--danger); }
    @media (hover: hover) { .menu-item.danger:hover { background: var(--danger-soft); } }
    .menu-item:disabled { opacity: .45; cursor: default; }
    .menu-sep { height: 1px; flex: 0 0 auto; background: var(--border); margin: 5px 8px; }
    .menu-confirm { flex: 0 0 auto; padding: 10px 12px 6px; font-size: 14px; color: var(--muted); max-width: 280px; line-height: 1.35; }
    /* Widget menu extras: section headings and a row of color swatches. */
    .menu-heading { flex: 0 0 auto; padding: 8px 14px 2px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
    .menu-swatches { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 12px 8px; max-width: 300px; }
    .swatch {
      width: 38px; height: 38px; min-width: 0; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      background: radial-gradient(circle, var(--sw) 0 45%, var(--swbg) 47%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2);
    }
    .swatch[aria-checked="true"] { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2), 0 0 0 2px var(--toolbar-bg), 0 0 0 5px var(--primary); }
    .menu.compact .swatch { width: 32px; height: 32px; }
    .menu.compact .menu-heading { padding-top: 4px; }
    .menu.tight .swatch { width: 26px; height: 26px; }
    .menu.tight .menu-heading { padding: 2px 12px 0; font-size: 11px; }
    /* Very short screens: tighter rows so the whole menu still fits without scrolling. */
    .menu.compact .menu-item { min-height: 38px; font-size: 14px; }
    .menu.compact .menu-sep { margin: 3px 8px; }
    .menu.tight { padding: 4px; }
    .menu.tight .menu-item { min-height: 30px; font-size: 13px; }
    .menu.tight .menu-sep { margin: 2px 8px; }
    .menu.open.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, max-content); column-gap: 4px; max-width: calc(100vw / var(--ui, 1) - 16px); }

    /* ------------------------------------------------------------ Settings */
    .sheet {
      position: fixed; z-index: 1050; bottom: calc(84px + env(safe-area-inset-bottom)); top: 16px;
      width: min(460px, calc(100vw / var(--ui, 1) - 32px)); display: none; flex-direction: column; /* zoomed: see --ui */
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25); overflow: hidden;
    }
    .sheet.left { left: calc(16px + env(safe-area-inset-left)); transform-origin: bottom left; }
    .sheet.right { right: calc(16px + env(safe-area-inset-right)); transform-origin: bottom right; }
    .sheet.open { display: flex; animation: panel-in .18s ease-out; }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 12px 12px 20px; border-bottom: 1px solid var(--border); }
    .sheet-head h2 { flex: 1; font-size: 20px; }
    .sheet-head button { width: 44px; height: 44px; }
    .sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 6px 20px 24px; }
    .sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 48px; padding: 4px 0; }
    .row + .row { border-top: 1px solid var(--border); }
    .row.save-warn { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #fef3c7; color: #78350f; }
    .row.save-warn .hint { color: inherit; }
    body.dark .row.save-warn { background: rgba(251, 191, 36, .14); color: #fcd34d; }
    /* "A new version of 21Board is ready" (Settings.refreshStatus in board.js). */
    .row.update-note { margin-top: 14px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--active-bg); }
    .row.update-note[hidden] { display: none; }
    .row .lbl { font-size: 15px; font-weight: 500; }
    .row .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-weight: 400; line-height: 1.35; }
    .row.stack { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px 0; }
    .seg { display: inline-flex; background: var(--hover-bg); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .seg button { height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text); }
    .seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    .seg.disabled { opacity: .45; pointer-events: none; }
    .switch { position: relative; width: 52px; height: 32px; flex: 0 0 52px; border-radius: 16px; background: var(--border); transition: background-color .2s; }
    .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(20px); }
    @media (hover: hover) { .switch:hover { background: var(--border); } .switch.on:hover { background: var(--primary); } }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); position: relative; }
    .swatch.on { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--primary); }
    /* Settings → Appearance → Background (backgroundSettings in board.js): a live preview, then Color, Pattern, Photo. */
    .bg-block { gap: 14px; }
    .bg-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .bg-preview { position: relative; flex: 0 0 auto; width: 136px; border-radius: 8px; overflow: hidden; --pu: .25px; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); }
    .bg-preview .ph { position: absolute; inset: 0; background-repeat: no-repeat; }
    .bg-preview .ph::after { content: ""; position: absolute; inset: 0; background: var(--fade-color, var(--board-bg)); opacity: var(--fade, 0); }
    .bg-part { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
    .bg-sub { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .bg-sub .lbl { font-size: 14px; font-weight: 600; }
    .bg-now { font-size: 13.5px; color: var(--muted); }
    .bg-cap { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
    .bg-block .swatches { gap: 6px; }
    .bg-block .swatch { width: 44px; height: 44px; flex: 0 0 auto; }
    .bg-block .swatch.on { box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35), 0 0 0 2px var(--surface), 0 0 0 4.5px var(--primary); }
    /* The chosen color, theme or pattern also gets a check (not only the ring's color). */
    .bg-block .tick { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: var(--on-primary); box-shadow: 0 0 0 2px var(--surface); display: grid; place-items: center; pointer-events: none; }
    .bg-block .tick svg { width: 13px; height: 13px; stroke-width: 3.5; }
    /* "Theme": half light (sun), half dark (moon), so it reads as "follows light or dark". */
    .bg-block .swatch.auto { background: linear-gradient(135deg, #f3f4f6 50%, #121212 50%); }
    .bg-block .swatch.auto > svg { width: 44px; height: 44px; stroke-width: 1.5; }
    /* "Custom…": a labelled pill with a rainbow dot (the chosen color once there is one). */
    .bg-block .swatch.pill { display: inline-flex; align-items: center; width: auto; padding: 0 14px 0 9px; gap: 7px; border-radius: 22px; background: var(--hover-bg); color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .bg-block .pill .dot { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45); background: conic-gradient(#ef4444, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444); }
    .bg-block .custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .pat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pat-tile { position: relative; flex-direction: column; align-items: stretch; gap: 4px; padding: 4px 4px 6px; min-height: 44px; border-radius: 12px; color: var(--text); font-size: 13px; font-weight: 500; }
    .pat-tile .pv { height: 48px; border-radius: 8px; --pu: .5px; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); }
    .pat-tile.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; box-shadow: inset 0 0 0 2px var(--primary); }
    .pat-tile .tick { top: -4px; right: -4px; }
    .pat-tile .pv.pattern-handwriting { background-position: 0 calc(var(--r) * .5 - 9px), 0 -8px; }   /* one whole row in view */
    .pat-tiles.disabled { opacity: .45; }
    .pat-tiles.disabled .pat-tile { cursor: default; }
    .bg-note { font-size: 13px; line-height: 1.35; color: var(--text); background: var(--hover-bg); border-radius: 10px; padding: 8px 10px; }
    .text-input { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; }
    .text-input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .btn { height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--hover-bg); color: var(--text); gap: 8px; white-space: nowrap; }
    .btn svg { width: 18px; height: 18px; }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.danger { background: var(--danger-soft); color: var(--danger); }
    .btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
    @media (hover: hover) { .btn:hover { filter: brightness(.96); } .btn.primary:hover { background: var(--primary); filter: brightness(1.08); } }
    .inst-list { display: flex; flex-direction: column; gap: 6px; }
    .inst { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--hover-bg); }
    .inst .widget-icon { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px; }
    .inst .widget-icon svg { width: 20px; height: 20px; }
    .inst .meta { flex: 1; min-width: 0; }
    .inst .meta b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inst .meta span { font-size: 12px; color: var(--muted); }
    .inst button.icon { width: 36px; height: 36px; border-radius: 9px; }
    .inst button.icon svg { width: 18px; height: 18px; }
    .empty-note { font-size: 13px; color: var(--muted); padding: 6px 0; }
    .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
    .status-dot.ok { background: #16a34a; } .status-dot.warn { background: #d97706; }
    .about { font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* -------------------------------------------------------------- Modal */
    #modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .45); }
    #modal.open { display: flex; }
    .modal-card { width: min(420px, 100%); background: var(--surface); border-radius: 18px; padding: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, .3); animation: panel-in .16s ease-out; }
    .modal-card h3 { font-size: 19px; margin-bottom: 8px; }
    .modal-card p { color: var(--muted); font-size: 15px; line-height: 1.45; margin-bottom: 20px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .modal-actions .btn { height: 46px; font-size: 15px; justify-content: center; }
    .modal-actions .choice { height: auto; min-height: 60px; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; text-align: left; }
    .modal-actions .choice small { font-weight: 400; font-size: 13px; opacity: .8; white-space: normal; line-height: 1.35; }

    /* -------------------------------------------------------------- Toast */
    #toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: calc(100vw / var(--ui, 1) - 180px); }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; min-height: 46px; border-radius: 23px; background: #1f2937; color: #fff; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: toast-in .2s ease-out; }
    body.dark .toast { background: #f3f4f6; color: #111827; }
    .toast button { color: #93c5fd; font-weight: 700; padding: 0 10px; height: 32px; border-radius: 16px; }
    body.dark .toast button { color: #1d4ed8; }
    .toast button.quiet { color: #cbd5e1; font-weight: 500; }
    body.dark .toast button.quiet { color: #475569; }
    .toast.out { opacity: 0; transform: translateY(8px); transition: all .25s; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* Board chrome is drawn at the board's scale (Settings → Size of windows and menus; board.js sets --ui). */
    .picker-btn, .save-note, .folder-note, .panel, .menu, .sheet, #toasts, .modal-card, #shape-hint { zoom: var(--ui, 1); }
    .sheet { top: calc(16px / var(--ui, 1)); }

    /* A note in the shaded margin when the 16:9 board leaves much of the window unused. */
    #shape-hint {
      position: fixed; z-index: 900; display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
      padding: 16px 18px 18px; border-radius: 18px; background: var(--toolbar-bg); border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--muted); font-size: 14px; line-height: 1.4; width: max-content; max-width: 290px; box-sizing: border-box;
    }
    #shape-hint[hidden] { display: none; }
    #shape-hint .msg { padding-right: 26px; text-wrap: balance; }   /* (clear of the ✕) */
    #shape-hint .msg b { display: block; margin-bottom: 6px; color: var(--text); font-size: 15px; font-weight: 600; text-wrap: balance; }
    #shape-hint .acts { display: flex; gap: 6px; align-items: center; }
    #shape-hint .hide { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); }
    #shape-hint .hide svg { width: 18px; height: 18px; }

    /* − 80% + */
    .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--hover-bg); border-radius: 10px; padding: 3px; flex: 0 0 auto; }
    .stepper button { width: 38px; height: 34px; border-radius: 8px; font-size: 20px; font-weight: 600; color: var(--text); }
    .stepper button:disabled { opacity: .35; cursor: default; }
    @media (hover: hover) { .stepper button:not(:disabled):hover { background: var(--surface); } }
    .stepper output { min-width: 52px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Background photo: covers the board (not the shaded margins); --fade blends it toward the board color. */
    #board-bg { position: absolute; z-index: 0; pointer-events: none; background-repeat: no-repeat; background-color: var(--fade-color, transparent); }
    #board-bg::after { content: ""; position: absolute; inset: 0; background: var(--fade-color, var(--board-bg)); opacity: var(--fade, 0); }
    #board-bg[hidden] { display: none; }
    .photo-edit { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .photo-thumb { position: relative; width: 100%; margin: 0 auto; border-radius: 10px; background-color: var(--hover-bg); background-repeat: no-repeat; box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
    .photo-thumb.pick { cursor: crosshair; touch-action: pan-y; } /* a swipe over it still scrolls Settings */
    .photo-thumb::after { content: ""; position: absolute; inset: 0; background: var(--fade-color, var(--board-bg)); opacity: var(--fade, 0); pointer-events: none; }
    .photo-thumb.off { filter: grayscale(1) opacity(.5); }
    .photo-thumb .focus { position: absolute; z-index: 1; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .55), inset 0 0 0 1.5px rgba(0, 0, 0, .55); pointer-events: none; }
    .photo-ctrls { display: flex; flex-direction: column; gap: 10px; }
    .photo-ctrls .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
    .photo-ctrls .line.end { justify-content: flex-end; }
    .photo-ctrls input[type="range"] { flex: 0 1 220px; accent-color: var(--primary); }

    /* Board history (section 13c in board.js) */
    .hist-intro { color: var(--muted); font-size: 14px; margin: 12px 0 8px; }
    .hist-day { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 6px; }
    .hist-row, .hist-hero { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px; border-radius: 12px; text-align: left; color: var(--text); justify-content: flex-start; }
    .hist-row:hover, .hist-hero:hover { background: var(--hover-bg); }
    .hist-row.sel { background: var(--primary-soft); }
    .hist-row .minimap, .hist-hero .minimap { width: 64px; height: 36px; flex: 0 0 64px; border-radius: 6px; box-shadow: 0 0 0 1px var(--border); }
    .hist-row .meta2 { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .hist-row .when { font-size: 17px; font-weight: 700; line-height: 1.1; }
    .hist-row .what { font-size: 13px; color: var(--muted); }
    .hist-hero { margin: 4px 0 6px; background: var(--hover-bg); border: 1px solid var(--border); padding: 10px; }
    .hist-hero .minimap { width: 96px; height: 54px; flex-basis: 96px; }
    .hist-hero > span { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
    .hist-hero b { font-size: 15px; color: var(--text); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip, .tag, .pill { font-size: 11.5px; line-height: 1.5; padding: 1px 8px; border-radius: 9px; background: var(--hover-bg); color: var(--muted); white-space: nowrap; }
    .hist-row.sel .chip { background: var(--surface); }
    .tag { background: var(--primary-soft); color: var(--primary); }
    .tag.big, .pill.diff { background: #fef3c7; color: #92400e; }
    body.dark .tag.big, body.dark .pill.diff { background: rgba(251, 191, 36, .18); color: #fcd34d; }
    .hist-detail { margin: 4px 0 12px; padding: 12px; border-radius: 14px; background: var(--hover-bg); display: flex; flex-direction: column; gap: 10px; }
    .hist-detail .minimap { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; box-shadow: 0 0 0 1px var(--border); }
    .hist-detail p { margin: 0; font-size: 14px; }
    .hist-detail .inst { background: var(--surface); }
    .hist-detail > .btn.primary { min-height: 48px; justify-content: center; }
    .hist-undo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; margin: 6px 0; border-radius: 12px; background: var(--primary-soft); font-size: 14px; }
    .hist-foot { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .hist-foot .btn { min-height: 48px; justify-content: center; }
    #history .inst-list { margin: 6px 0; }
    #history .btn.small { white-space: nowrap; }
    #empty-hint .rescue { margin-top: 20px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: clamp(14px, 1.5vw, 18px); }
    #empty-hint .rescue[hidden] { display: none; }
    #empty-hint .rescue button { pointer-events: auto; }
    #empty-hint[hidden] .rescue { visibility: hidden; }
    .modal-input { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 14px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="desk" aria-label="Board">
    <div id="board-bg" hidden></div>
    <div id="layout-frame" hidden></div>
    <div id="empty-hint" hidden>
      <div class="big">Your board is ready</div>
      <div class="small">Tap <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1.2"/><rect x="9.5" y="3" width="5" height="5" rx="1.2"/><rect x="16" y="3" width="5" height="5" rx="1.2"/><rect x="3" y="9.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/><rect x="16" y="9.5" width="5" height="5" rx="1.2"/><rect x="3" y="16" width="5" height="5" rx="1.2"/><rect x="9.5" y="16" width="5" height="5" rx="1.2"/><rect x="16" y="16" width="5" height="5" rx="1.2"/></svg> in either bottom corner to open a widget.</div>
      <div class="rescue" hidden>Windows gone? <button class="btn small primary">Go back to an earlier version</button></div>
    </div>
  </main>

  <div id="shape-hint" role="note" hidden></div>
  <button class="picker-btn left" data-side="left" aria-label="Widgets and settings" aria-haspopup="dialog" aria-expanded="false"></button>
  <button class="picker-btn right" data-side="right" aria-label="Widgets and settings" aria-haspopup="dialog" aria-expanded="false"></button>
  <div id="boot-note">21Board is taking a long time to start. Check the connection, then reload the page.</div>

  <div id="panel" class="panel" role="dialog" aria-label="Widgets">
    <div class="panel-widgets" role="list"></div>
    <div class="panel-sep"></div>
    <div class="panel-controls">
      <span class="picker-spacer" aria-hidden="true"></span>
      <button class="ctl" data-ctl="export" title="Export" aria-label="Export"></button>
      <button class="ctl" data-ctl="import" title="Import" aria-label="Import"></button>
      <button class="ctl" data-ctl="theme" title="Dark mode" aria-label="Dark mode"></button>
      <button class="ctl" data-ctl="fullscreen" title="Fullscreen" aria-label="Fullscreen"></button>
      <button class="ctl" data-ctl="settings" title="Settings" aria-label="Settings"></button>
      <button class="ctl" data-ctl="quit" title="Quit" aria-label="Quit" hidden></button>
    </div>
  </div>

  <div id="menu" class="menu" role="menu"></div>

  <section id="settings" class="sheet" role="dialog" aria-label="Settings">
    <div class="sheet-head"><h2>Settings</h2><button data-close aria-label="Close settings"></button></div>
    <div class="sheet-body"></div>
  </section>

  <section id="history" class="sheet" role="dialog" aria-label="Board history">
    <div class="sheet-head"><h2>Board history</h2><button data-close aria-label="Close board history"></button></div>
    <div class="sheet-body"></div>
  </section>

  <div id="modal" role="dialog" aria-modal="true"><div class="modal-card"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="import-input" accept=".21board,application/json" hidden>
  <input type="file" id="photo-input" accept="image/*" hidden>

  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#111;font:18px system-ui">21Board needs JavaScript turned on.</div></noscript>

  <script src="widgets/registry.js"></script>
  <script src="board.js"></script>
</body>
</html>

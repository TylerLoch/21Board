<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer</title>
<script src="../../sdk/board21.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font);
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: background-color .3s;
  }
  .bar { height: max(6px, 1.6vh); background: var(--b21-surface-2); flex: 0 0 auto; }
  .bar > div { height: 100%; width: 100%; background: var(--b21-accent); transform-origin: left; transition: transform .25s linear, background-color .3s; }
  .display {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0;
    font-size: min(27vw, 44vh); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1;
  }
  .controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: min(2vh, 10px); padding: 0 min(3vw, 14px) min(3vh, 14px); }
  .row { display: flex; gap: min(2vw, 8px); justify-content: center; }
  button {
    font: inherit; color: var(--b21-text); background: var(--b21-surface-2); border: 0; cursor: pointer;
    border-radius: 999px; height: clamp(34px, 11vh, 64px); min-width: clamp(34px, 11vh, 64px); padding: 0 clamp(8px, 3vw, 22px);
    font-size: clamp(13px, 4.2vh, 22px); font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active { filter: brightness(.92); }
  button.primary { background: var(--b21-accent); color: var(--b21-on-accent); min-width: clamp(70px, 26vw, 160px); }
  button svg { width: 1.1em; height: 1.1em; fill: currentColor; }
  button svg.line { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .chips button { height: clamp(28px, 8vh, 44px); font-size: clamp(12px, 3.4vh, 17px); padding: 0 clamp(6px, 2vw, 14px); background: transparent; box-shadow: inset 0 0 0 1.5px var(--b21-border); }
  .chips button.on { box-shadow: inset 0 0 0 2px var(--b21-accent); color: var(--b21-accent); }
  @media (max-height: 210px) { .chips { display: none; } }
  @media (max-height: 130px) { .controls { display: none; } }
  /* Finished: flashes for 10 seconds, then stays red (and doesn't flash at all when the device asks for less motion). */
  body.done { background: var(--b21-danger); color: #fff; animation: flash 1s steps(2) 10; }
  body.done .bar { visibility: hidden; }
  @keyframes flash { 50% { background: var(--b21-bg); color: var(--b21-danger); } }
  @media (prefers-reduced-motion: reduce) { body.done { animation: none; } }
  body.done button { background: rgba(255,255,255,.25); color: inherit; }
  body.done .chips button { box-shadow: inset 0 0 0 1.5px currentColor; background: transparent; }
</style>
</head>
<body>
  <div class="bar"><div id="bar"></div></div>
  <div class="display" id="display">05:00</div>
  <div class="controls">
    <div class="row chips" id="chips"></div>
    <div class="row">
      <button id="minus" aria-label="Subtract one minute">−1:00</button>
      <button id="go" class="primary" aria-label="Start"></button>
      <button id="reset" aria-label="Reset"><svg class="line" viewBox="0 0 24 24"><path d="M4.87 11.48A7.5 7.5 0 1 0 13.19 6.4"/><path d="M7.2 6.3L12 2.3L12 10.3Z" fill="currentColor" stroke-width="1.5"/></svg></button>
      <button id="plus" aria-label="Add one minute">+1:00</button>
    </div>
  </div>
<script>
  const PRESETS = [1, 2, 3, 5, 10, 15];
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const $ = id => document.getElementById(id);

  // Content (saved with Board21.save):  { duration, remaining, endsAt }
  //   endsAt is a wall-clock time while running, so every open copy of 21Board shows the same countdown.
  // Config (Board21.saveConfig):          { sound: 'beep' | 'chime' | 'bell' | 'marimba' | 'gentle' | 'alarm' | 'off' }
  //   (older timers saved sound: true/false, read as 'beep'/'off')
  let state = { duration: 5 * 60000, remaining: 5 * 60000, endsAt: null };
  let config = { sound: 'beep' };
  let finishedAlerted = false;
  const DAY = 24 * 3600000;

  // Saved content can come from an imported file, so it is checked before it is used: times are numbers of
  // milliseconds, a day at most.
  function readState(d) {
    const ms = (v, or) => typeof v === 'number' && v >= 0 && v <= DAY ? v : or;
    const duration = ms(d && d.duration, state.duration);
    return { duration, remaining: ms(d && d.remaining, duration), endsAt: d && typeof d.endsAt === 'number' && d.endsAt - Date.now() <= DAY ? d.endsAt : null };
  }

  const running = () => state.endsAt !== null;
  const left = () => running() ? Math.max(0, state.endsAt - Date.now()) : state.remaining;

  function fmt(ms) {
    const total = Math.ceil(ms / 1000);
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
  }

  function save() { Board21.save(state); }

  function render() {
    const ms = left();
    const done = ms <= 0 && state.duration > 0;
    $('display').textContent = fmt(ms);
    $('bar').style.transform = `scaleX(${state.duration ? ms / state.duration : 0})`;
    // Only touch the button when it changes: replacing its icon under a finger would lose the press.
    const label = running() ? 'Pause' : 'Start';
    if ($('go').getAttribute('aria-label') !== label || !$('go').firstChild) { $('go').innerHTML = running() ? PAUSE : PLAY; $('go').setAttribute('aria-label', label); }
    document.body.classList.toggle('done', done);
    document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', +b.dataset.min * 60000 === state.duration));
    Board21.window.setTitle(done ? 'Done!' : running() ? 'Running' : (ms < state.duration ? 'Paused' : ''));
  }

  function tick() {
    if (running() && left() <= 0) {
      state = { duration: state.duration, remaining: 0, endsAt: null };
      save();
      alertDone();
    }
    plan();
    render();
  }

  function alertDone() {
    if (finishedAlerted) return;
    finishedAlerted = true;
    Board21.window.requestAttention();
    if (soundName() === 'off' || (alarm && alarm.at <= audio.currentTime + 0.5)) return;   // silent, or ringing already
    // The alarm wasn't set ahead here (Start was tapped in another copy of 21Board, or before the page was
    // loaded again), or the sound's clock fell behind: ring now, unless another copy is the one to ring.
    const ring = () => { if (running() || left() > 0 || !openAudio()) return false; setAlarm(soundName(), audio.currentTime + 0.05); return true; };
    const ask = () => navigator.locks.request(LOCK(), { ifAvailable: true }, lock => lock && ring() ? new Promise(r => { unlock = r; }) : null).catch(() => {});
    if (audio || unlock || !navigator.locks) ring();
    else if (tapped()) ask();
    else setTimeout(ask, 1500);   // a copy that can't make sound yet lets one that can go first
  }

  // Alarm sounds, made with Web Audio (no sound files, so they work offline).
  // Each note: [start (s), frequency (Hz), length (s), wave, volume].
  const SOUNDS = {
    beep:    { label: 'Beep',    notes: [[0, 880, 0.28, 'sine', 0.4], [0.35, 880, 0.28, 'sine', 0.4], [0.7, 880, 0.28, 'sine', 0.4]] },
    chime:   { label: 'Chime',   notes: [[0, 1318.5, 1.2, 'sine', 0.3], [0.45, 1046.5, 1.6, 'sine', 0.3]] },
    bell:    { label: 'Bell',    notes: [[0, 660, 2.2, 'sine', 0.35], [0, 1821.6, 1.2, 'sine', 0.12], [0, 3564, 0.6, 'sine', 0.06]] },
    marimba: { label: 'Marimba', notes: [[0, 523.25, 0.4, 'triangle', 0.45], [0.15, 659.25, 0.4, 'triangle', 0.45], [0.3, 783.99, 0.4, 'triangle', 0.45], [0.45, 1046.5, 0.7, 'triangle', 0.45]] },
    gentle:  { label: 'Gentle',  notes: [[0, 392, 1.4, 'sine', 0.22], [0.6, 523.25, 1.6, 'sine', 0.22]], slowAttack: true },
    alarm:   { label: 'Alarm',   notes: [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75].map((t, i) => [t, i % 2 ? 660 : 880, 0.22, 'square', 0.12]) }
  };
  const soundName = () => config.sound === true || config.sound === undefined ? 'beep' : config.sound === false ? 'off'
    : (Object.prototype.hasOwnProperty.call(SOUNDS, config.sound) || config.sound === 'off') ? config.sound : 'beep';

  // Puts a sound's notes on `ctx`, to start at its time `when`. Answers { name, at, end, out }: `out` carries
  // the notes to the speakers (disconnect it to call the sound off).
  function addNotes(ctx, name, when) {
    const snd = SOUNDS[name], out = ctx.createGain();
    let end = 0;
    for (const [t, f, len, wave, vol] of snd.notes) {
      const o = ctx.createOscillator(), g = ctx.createGain(), at = when + t;
      o.type = wave; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + (snd.slowAttack ? 0.25 : 0.015));
      g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g).connect(out); o.start(at); o.stop(at + len + 0.05);
      end = Math.max(end, t + len);
    }
    out.connect(ctx.destination);
    return { name, at: when, end: when + end, out };
  }

  // Plays a sound now (picking one in the menu).
  function playSound(name) {
    if (!SOUNDS[name]) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const snd = addNotes(ctx, name, ctx.currentTime);
      setTimeout(() => ctx.close(), (snd.end - snd.at + 0.5) * 1000);
    } catch (e) { /* audio unavailable */ }
  }

  // ---- The alarm at the end of the countdown.
  // Browsers only let a page make sound once it has been tapped, and run its clock late while it is behind
  // another tab or window. So the tap on Start gets the sound ready and sets the alarm ahead, on the sound's own
  // clock: it rings on time even while 21Board isn't the tab or window on screen. An alarm that can't sound yet
  // (the page was loaded again and hasn't been tapped since) rings as soon as 21Board is tapped.
  // Several copies of 21Board can be open, and only one should ring: the copy with the alarm set holds a lock
  // (shared by the copies) until its timer is started again or reset, and another copy rings at the end only
  // if nobody holds it.
  const LOCK = () => '21Board timer alarm ' + (Board21.context ? Board21.context.instance : '');
  let audio = null;    // the sound, from the tap on Start until the alarm has rung
  let alarm = null;    // the alarm that is set: { name, at, end, out } (times on the sound's clock)
  let unlock = null;   // lets go of the lock
  const tapped = () => !navigator.userActivation || navigator.userActivation.hasBeenActive;

  function openAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state !== 'running') audio.resume().catch(() => {});
    } catch (e) { audio = null; /* audio unavailable */ }
    return !!audio;
  }
  function setAlarm(name, at) {
    if (alarm) alarm.out.disconnect();
    alarm = SOUNDS[name] ? addNotes(audio, name, at) : null;
  }
  function closeAudio() {
    setAlarm(null);
    if (audio) audio.close().catch(() => {});
    audio = null;
  }
  // The tap on Start, in this copy of 21Board.
  function arm() {
    if (!openAudio()) return;
    // (Taken from whoever has it: Start was tapped here last.)
    if (!unlock && navigator.locks) navigator.locks.request(LOCK(), { steal: true }, () => audio && new Promise(r => { unlock = r; })).catch(() => {});
    plan();
  }
  // Keeps the alarm set for the moment the countdown ends. Called after every change and on every tick: the
  // sound's clock stops while the device sleeps, so it can fall behind.
  function plan() {
    if (audio) {
      const now = audio.currentTime, name = soundName();
      if (audio.state === 'suspended' && navigator.userActivation && navigator.userActivation.hasBeenActive) audio.resume().catch(() => {});
      if (running() && left() > 0) {
        if (!alarm || alarm.name !== name || Math.abs(alarm.at - now - left() / 1000) > 0.5) setAlarm(name, now + left() / 1000);
      } else if (!running()) {
        if (alarm && (left() > 0 || now > alarm.end)) setAlarm(null);   // paused or reset, or it has rung
        if (!alarm) closeAudio();
      }
    }
    if (unlock && !audio && (running() || left() > 0 || !state.duration)) { unlock(); unlock = null; }   // (kept while it says Done)
  }
  addEventListener('pointerdown', () => { if (audio && audio.state !== 'running') audio.resume().catch(() => {}); }, true);

  function setDuration(ms) {
    ms = Math.max(0, Math.min(ms, DAY));
    finishedAlerted = false;
    state = { duration: ms, remaining: ms, endsAt: null };
    save(); plan(); render();
  }

  $('go').onclick = () => {
    if (running()) state = { duration: state.duration, remaining: left(), endsAt: null };
    else {
      if (left() <= 0) state.remaining = state.duration;
      if (state.remaining <= 0) return;
      finishedAlerted = false;
      state = { duration: state.duration, remaining: state.remaining, endsAt: Date.now() + state.remaining };
      arm();
    }
    save(); plan(); render();
  };
  $('reset').onclick = () => setDuration(state.duration);
  $('plus').onclick = () => adjust(60000);
  $('minus').onclick = () => adjust(-60000);

  function adjust(delta) {
    finishedAlerted = false;
    if (running()) {
      state.endsAt = Math.max(Date.now(), state.endsAt + delta);
      state.duration = Math.max(state.duration + delta, left());
    } else {
      const fresh = state.remaining === state.duration || state.remaining <= 0;
      const r = Math.max(0, (state.remaining <= 0 ? state.duration : state.remaining) + delta);
      state = { duration: fresh ? r : Math.max(state.duration + delta, r), remaining: r, endsAt: null };
    }
    save(); plan(); render();
  }

  $('chips').innerHTML = PRESETS.map(m => `<button data-min="${m}">${m}m</button>`).join('');
  $('chips').onclick = e => { const b = e.target.closest('button'); if (b) setDuration(+b.dataset.min * 60000); };

  // Window menu: pick the alarm sound (picking one plays it), or turn it off.
  function setMenu() {
    const cur = soundName();
    Board21.menu.set([
      ...Object.keys(SOUNDS).map(k => ({ id: 'sound:' + k, label: SOUNDS[k].label, checked: cur === k })),
      { id: 'sound:off', label: 'No sound', checked: cur === 'off' },
      { separator: true },
      { id: 'test', label: 'Play alarm sound', disabled: cur === 'off' }
    ]);
  }

  Board21.on('menu', id => {
    if (id.startsWith('sound:')) {
      config.sound = id.slice(6);
      Board21.saveConfig(config); setMenu(); plan();
      if (config.sound !== 'off') playSound(config.sound);
    }
    if (id === 'test') playSound(soundName());
  });

  // Another 21Board tab (or an import) changed this timer.
  Board21.on('data', data => {
    if (data) {
      const was = running();
      state = readState(data);
      if (left() > 0) finishedAlerted = false;
      if (running() && !was) closeAudio();   // started in the other copy: the alarm is set there
      else if (was && !running() && left() <= 0 && state.duration > 0) alertDone();   // the other copy saw it end first
      plan();
    }
    render();
  });
  Board21.on('config', c => { config = { sound: c ? c.sound : 'beep' }; setMenu(); plan(); });

  Board21.ready().then(ctx => {
    if (ctx.data) state = readState(ctx.data);
    if (ctx.config) config = { sound: ctx.config.sound };
    if (left() <= 0 && state.duration > 0) finishedAlerted = true; // finished while closed
    setMenu();
    render();
    setInterval(tick, 200);
  });
</script>
</body>
</html>

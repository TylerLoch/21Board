<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<script src="../../sdk/board21.js"></script>
<style>
  /* Crayon Libre: hand-drawn chalk lettering, bundled so the Chalkboard theme looks the same on every
     device (Chromebooks included) and works offline. CC0 (public domain), see fonts/CrayonLibre-LICENSE.txt.
     Edited for the classroom (two-dot colon, barred capital I, print l, flagged 1, plain Q) by tools/build-chalk-font.py. */
  @font-face { font-family: "Crayon Libre"; src: url("fonts/CrayonLibre-21Board.woff2") format("woff2"); font-display: swap; }
  /* Excalifont: hand-drawn marker lettering for the Whiteboard theme. SIL Open Font License, see fonts/Excalifont-OFL.txt. */
  @font-face { font-family: "Excalifont"; src: url("fonts/Excalifont-Regular.woff2") format("woff2"); font-display: swap; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: var(--note, #fef08a); color: var(--ink, #1f2937); font-family: var(--note-font, var(--b21-font));
    overflow: hidden; transition: background-color .25s;
    --pad: clamp(10px, 4vmin, 28px);
  }
  /* The note is drawn twice: #view (with tappable links) when reading, #t (the textarea) while typing. */
  .layer {
    position: absolute; inset: 0; margin: 0; box-sizing: border-box; padding: var(--pad);
    font: inherit; font-size: var(--size, 32px); line-height: 1.3; color: inherit;
    white-space: pre-wrap; overflow-wrap: break-word; tab-size: 4;
  }
  textarea.layer { width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; overflow: auto; }
  textarea.layer::placeholder { color: inherit; opacity: .45; }
  #view { overflow: auto; cursor: text; outline: none; }
  #view .placeholder { opacity: .45; }
  #view a { color: var(--link, #1d4ed8); text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .12em; cursor: pointer; }
  body:not(.editing) #t { visibility: hidden; }
  body.editing #view { display: none; }
  /* Measures how big the text can be; same typography, never shown. */
  #sizer { visibility: hidden; height: auto; inset: auto; left: 0; top: 0; overflow: hidden; overflow-wrap: normal; pointer-events: none; }
  /* Chalkboard theme: faint chalk dust and a soft chalk edge on the letters. */
  body.chalk {
    background-image:
      radial-gradient(rgba(255, 255, 255, .045) 1px, transparent 1.6px),
      radial-gradient(rgba(255, 255, 255, .03) 1px, transparent 1.6px),
      radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, .06), transparent 60%);
    background-size: 7px 7px, 11px 11px, 100% 100%;
    background-position: 0 0, 3px 5px, 0 0;
  }
  body.chalk .layer { text-shadow: 0 0 1px rgba(255, 255, 255, .45), 0 0 .08em rgba(255, 255, 255, .15); letter-spacing: .01em; }
  /* Whiteboard theme: a glossy white board with faint traces of old writing; marker ink bleeds a little.
     A bit more line spacing, because this font's accented capitals are tall. */
  body.whiteboard {
    background-image:
      linear-gradient(115deg, rgba(255, 255, 255, 0) 28%, rgba(255, 255, 255, .75) 44%, rgba(255, 255, 255, 0) 58%),
      radial-gradient(ellipse 60% 35% at 72% 78%, rgba(110, 120, 135, .07), transparent 70%),
      radial-gradient(ellipse 45% 25% at 22% 28%, rgba(110, 120, 135, .05), transparent 70%);
  }
  body.whiteboard .layer { line-height: 1.38; text-shadow: 0 0 .6px currentColor; }
  /* "Note cleared. Undo", shown for a while after Clear note. */
  #undo {
    position: absolute; left: 50%; bottom: var(--pad); transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    max-width: calc(100% - 16px); box-sizing: border-box; padding: 6px 6px 6px 16px; border-radius: 999px; white-space: nowrap;
    background: #1f2937; color: #fff; font: 500 clamp(13px, 4.5vmin, 17px) var(--b21-font); box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
  }
  #undo[hidden] { display: none; }
  #undo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* (in a very small note the words give way to the button) */
  #undo button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; min-height: 36px; padding: 0 16px; background: #fff; color: #1f2937; cursor: pointer; }
</style>
</head>
<body>
  <div id="view" class="layer" tabindex="0" role="textbox" aria-multiline="true" aria-readonly="true" aria-label="Note (tap to edit)"></div>
  <textarea id="t" class="layer" placeholder="Type a note…" spellcheck="true" aria-label="Note"></textarea>
  <div id="sizer" class="layer" aria-hidden="true"></div>
  <div id="undo" role="status" hidden><span>Note cleared.</span><button type="button">Undo</button></div>
<script>
  // Content: { text }
  // Config:  { theme, color, chalk, marker, fit, px }
  //   theme:  'sticky' (default) | 'chalkboard' | 'whiteboard'
  //   color:  the sticky note's paper color; chalk: the chalk color; marker: the marker color
  //           (each theme keeps its own color, so switching back and forth doesn't lose it)
  //   fit: true  = text is as large as possible while all of it fits in the window (default)
  //   fit: false = fixed size px (set with Larger/Smaller text)
  //   (older notes saved { color, size }, or color 'chalkboard' / 'whiteboard' for those themes)
  // The bundled fonts (see @font-face), then look-alikes that come with devices, just in case.
  const CHALK_FONT = '"Crayon Libre", "Chalkboard SE", Chalkboard, "Comic Sans MS", "Comic Neue", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const MARKER_FONT = '"Excalifont", "Segoe Print", "Comic Sans MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  // Sticky note paper: [paper, text, link] for the light and dark board themes.
  const PAPERS = {
    yellow: { light: ['#fef08a', '#1f2937', '#1d4ed8'], dark: ['#4d4416', '#fef9c3', '#93c5fd'], label: 'Yellow' },
    pink:   { light: ['#fbcfe8', '#1f2937', '#1d4ed8'], dark: ['#4f2240', '#fce7f3', '#93c5fd'], label: 'Pink' },
    blue:   { light: ['#bfdbfe', '#1f2937', '#1e40af'], dark: ['#1e3a5f', '#dbeafe', '#bfdbfe'], label: 'Blue' },
    green:  { light: ['#bbf7d0', '#1f2937', '#1d4ed8'], dark: ['#1d4a30', '#dcfce7', '#93c5fd'], label: 'Green' },
    purple: { light: ['#e9d5ff', '#1f2937', '#1d4ed8'], dark: ['#3d2a5c', '#f3e8ff', '#93c5fd'], label: 'Purple' },
    plain:  { light: null, dark: null, label: 'Plain' }
  };
  // Chalk and marker colors: [writing, link]. Links get a different color than the writing.
  const CHALKS = {
    white:  { ink: '#f4f7f2', link: '#bfe3ff', label: 'White chalk' },
    yellow: { ink: '#fde68a', link: '#bfe3ff', label: 'Yellow chalk' },
    pink:   { ink: '#f9b4d6', link: '#bfe3ff', label: 'Pink chalk' },
    blue:   { ink: '#a8d4ff', link: '#fde68a', label: 'Blue chalk' },
    green:  { ink: '#a7f0c2', link: '#bfe3ff', label: 'Green chalk' },
    orange: { ink: '#fdbb8a', link: '#bfe3ff', label: 'Orange chalk' }
  };
  const MARKERS = {
    black:  { ink: '#1b1f24', link: '#1d4ed8', label: 'Black marker' },
    blue:   { ink: '#1d4ed8', link: '#6d28d9', label: 'Blue marker' },
    red:    { ink: '#c81e1e', link: '#1d4ed8', label: 'Red marker' },
    green:  { ink: '#15803d', link: '#1d4ed8', label: 'Green marker' },
    purple: { ink: '#6d28d9', link: '#1d4ed8', label: 'Purple marker' }
  };
  const THEMES = {
    sticky:     { label: 'Sticky note', colors: PAPERS, key: 'color', fallback: 'yellow', heading: 'Paper color' },
    chalkboard: { label: 'Chalkboard', colors: CHALKS, key: 'chalk', fallback: 'white', heading: 'Chalk color', font: CHALK_FONT, board: { light: '#2f4a3a', dark: '#223a2c' }, look: 'chalk' },
    whiteboard: { label: 'Whiteboard', colors: MARKERS, key: 'marker', fallback: 'black', heading: 'Marker color', font: MARKER_FONT, board: { light: '#fbfcfd', dark: '#d5d9df' }, look: 'whiteboard' }
  };
  const has = (obj, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(obj, k);
  const MIN_PX = 12, MAX_PX = 400;
  const DEFAULTS = { theme: 'sticky', color: 'yellow', chalk: 'white', marker: 'black', fit: true, px: null };
  let config = Object.assign({}, DEFAULTS);
  const t = document.getElementById('t'), view = document.getElementById('view'), sizer = document.getElementById('sizer');
  const body = document.body;

  // ---- Links: http(s)://… or www.… become tappable while reading.
  const URL_RE = /\b(?:https?:\/\/|www\.)[^\s<>"']*[^\s<>"'.,;:!?)\]}]/gi;
  let linksOn = true;   // off in kiosk mode, where a link can't open a new window (it would seem to do nothing)
  function renderView() {
    view.textContent = '';
    const text = t.value;
    if (!text) { const p = document.createElement('span'); p.className = 'placeholder'; p.textContent = t.placeholder; view.appendChild(p); return; }
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while (linksOn && (m = URL_RE.exec(text))) {
      if (m.index > last) view.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.textContent = m[0];                       // exactly the typed characters, so taps map back to the text
      a.href = /^www\./i.test(m[0]) ? 'https://' + m[0] : m[0];
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      view.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) view.appendChild(document.createTextNode(text.slice(last)));
  }

  // ---- Reading vs typing.
  function startEditing(caret) {
    if (body.classList.contains('editing')) return;
    const top = view.scrollTop;
    body.classList.add('editing');
    t.focus();
    const pos = Math.max(0, Math.min(caret == null ? t.value.length : caret, t.value.length));
    t.setSelectionRange(pos, pos);
    t.scrollTop = top;
  }
  function stopEditing() {
    if (!body.classList.contains('editing')) return;
    const top = t.scrollTop;
    body.classList.remove('editing');
    renderView();
    view.scrollTop = top;
  }
  // Where in the text was tapped? (The view holds the same characters in the same order.)
  function offsetAt(x, y) {
    let node = null, off = 0;
    if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (p) { node = p.offsetNode; off = p.offset; } }
    else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); if (r) { node = r.startContainer; off = r.startOffset; } }
    if (!node || !view.contains(node) || node.nodeType !== 3 || (node.parentNode && node.parentNode.classList && node.parentNode.classList.contains('placeholder'))) return null;
    let count = 0;
    const walk = document.createTreeWalker(view, NodeFilter.SHOW_TEXT);
    while (walk.nextNode()) { if (walk.currentNode === node) return count + off; count += walk.currentNode.nodeValue.length; }
    return null;
  }
  view.addEventListener('click', e => {
    if (e.target.closest('a')) return;                          // links open in a new tab
    if (String(window.getSelection())) return;                  // someone selected text to copy
    startEditing(offsetAt(e.clientX, e.clientY));
  });
  view.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startEditing(); } });
  t.addEventListener('blur', stopEditing);
  t.addEventListener('keydown', e => { if (e.key === 'Escape') t.blur(); });

  // ---- Size: largest that fits (binary search on a hidden copy), or a fixed size.
  let fitQueued = false;
  function fitSoon() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); } }
  function fit() {
    if (!config.fit) { body.style.setProperty('--size', Math.round(config.px || 32) + 'px'); return; }
    const w = t.clientWidth, h = t.clientHeight;
    if (!w || !h) return;
    sizer.style.width = w + 'px';
    sizer.textContent = (t.value || t.placeholder) + '​'; // the zero-width space keeps a trailing new line counted
    const fits = px => { sizer.style.fontSize = px + 'px'; return sizer.scrollHeight <= h + 0.5 && sizer.scrollWidth <= w + 0.5; };
    let lo = MIN_PX, hi = Math.max(MIN_PX, Math.min(MAX_PX, h * 0.6)), best = MIN_PX;
    if (fits(hi)) best = hi;
    else for (let i = 0; i < 14 && hi - lo > 0.5; i++) { const mid = (lo + hi) / 2; if (fits(mid)) { best = mid; lo = mid; } else hi = mid; }
    body.style.setProperty('--size', Math.floor(best) + 'px');
  }
  const currentPx = () => parseFloat(getComputedStyle(t).fontSize) || 32;

  const themeOf = () => THEMES[has(THEMES, config.theme) ? config.theme : 'sticky'];
  const colorOf = th => (has(th.colors, config[th.key]) ? config[th.key] : th.fallback);

  function applyLook() {
    const th = themeOf(), dark = Board21.theme === 'dark';
    if (th.board) {
      const c = th.colors[colorOf(th)];
      body.style.setProperty('--note', th.board[dark ? 'dark' : 'light']);
      body.style.setProperty('--ink', c.ink);
      body.style.setProperty('--link', c.link);
      body.style.setProperty('--note-font', th.font);
      // The font file loads the first time it's used: fit the text again once it's in.
      if (document.fonts && document.fonts.load) document.fonts.load('32px ' + th.font.split(',')[0]).then(fitSoon, () => {});
    } else {
      const set = PAPERS[colorOf(th)][dark ? 'dark' : 'light'];
      body.style.setProperty('--note', set ? set[0] : 'var(--b21-bg)');
      body.style.setProperty('--ink', set ? set[1] : 'var(--b21-text)');
      body.style.setProperty('--link', set ? set[2] : 'var(--b21-accent)');
      body.style.removeProperty('--note-font');
    }
    body.classList.toggle('chalk', th.look === 'chalk');
    body.classList.toggle('whiteboard', th.look === 'whiteboard');
    fitSoon();
  }

  // Window menu: the theme, then that theme's colors as a row of swatches, then text size.
  function setMenu() {
    const th = themeOf(), cur = colorOf(th), dark = Board21.theme === 'dark';
    const swatch = k => {
      if (th.board) return { color: th.colors[k].ink, background: th.board[dark ? 'dark' : 'light'] };
      const set = PAPERS[k][dark ? 'dark' : 'light'];
      return { color: set ? set[0] : (dark ? '#1f2937' : '#ffffff') };
    };
    Board21.menu.set([
      { heading: true, label: 'Theme' },
      ...Object.keys(THEMES).map(k => ({ id: 'theme:' + k, label: THEMES[k].label, checked: themeOf() === THEMES[k] })),
      { heading: true, label: th.heading },
      { id: 'colors', label: th.heading, swatches: Object.keys(th.colors).map(k => Object.assign({ id: th.key + ':' + k, label: th.colors[k].label, checked: cur === k }, swatch(k))) },
      { separator: true },
      { id: 'fit', label: 'Fit text to the note', checked: !!config.fit },
      { id: 'bigger', label: 'Larger text', disabled: !config.fit && config.px >= MAX_PX },
      { id: 'smaller', label: 'Smaller text', disabled: !config.fit && config.px <= MIN_PX },
      { separator: true },
      { id: 'clear', label: 'Clear note', disabled: !t.value }
    ]);
  }

  // ---- Clear note: the text can be put back for a while (as after Reset and Close all).
  const undo = document.getElementById('undo');
  let cleared = '', undoTimer;
  function offerUndo(text) {
    cleared = text;
    undo.hidden = !text;
    clearTimeout(undoTimer);
    if (text) undoTimer = setTimeout(offerUndo, 20000, '');
  }
  function setText(text) { t.value = text; Board21.save({ text }); renderView(); fitSoon(); setMenu(); }
  undo.querySelector('button').onclick = () => { const text = cleared; offerUndo(''); if (!t.value) setText(text); };

  let menuTimer;
  t.addEventListener('input', () => {
    offerUndo('');   // typing a new note: the cleared one is not put back over it
    Board21.save({ text: t.value });
    fitSoon();
    clearTimeout(menuTimer);
    menuTimer = setTimeout(setMenu, 400); // keeps "Clear note" enabled/disabled correctly
  });

  Board21.on('menu', id => {
    const [kind, value] = id.split(':');
    if (kind === 'theme' && has(THEMES, value)) config.theme = value;
    else if (value !== undefined && Object.keys(THEMES).some(k => THEMES[k].key === kind)) {
      const th = Object.values(THEMES).find(x => x.key === kind);
      if (has(th.colors, value)) config[kind] = value;
    }
    else if (id === 'fit') config.fit = !config.fit;
    else if (id === 'bigger' || id === 'smaller') {
      const from = config.fit ? currentPx() : (config.px || currentPx());
      config.px = Math.round(Math.max(MIN_PX, Math.min(MAX_PX, id === 'bigger' ? from * 1.2 : from / 1.2)));
      config.fit = false;
    } else if (id === 'clear') { const text = t.value; setText(''); offerUndo(text); return; }
    Board21.saveConfig(config);
    applyLook(); setMenu();
  });

  // Edited in another 21Board tab: update without losing the cursor if we're typing here too.
  Board21.on('data', data => {
    const text = readText(data);
    if (text === t.value) return;
    offerUndo('');
    const focused = document.activeElement === t;
    const s = t.selectionStart, e = t.selectionEnd;
    t.value = text;
    if (focused) t.setSelectionRange(Math.min(s, text.length), Math.min(e, text.length));
    else renderView();
    fitSoon(); setMenu();
  });
  // Saved content and settings can come from an imported file, so they are checked before they are used.
  const readText = data => (data && typeof data.text === 'string' ? data.text : '');
  const readConfig = c => {
    const out = Object.assign({}, DEFAULTS, c || {});
    out.fit = !c || c.fit !== false; // (notes saved before auto-fit have no `fit`)
    out.px = typeof out.px === 'number' && out.px >= MIN_PX && out.px <= MAX_PX ? out.px : null;
    // Notes saved when Chalkboard and Whiteboard were paper colors.
    if (c && !has(THEMES, c.theme) && has(THEMES, c.color)) { out.theme = c.color; out.color = DEFAULTS.color; }
    if (!has(THEMES, out.theme)) out.theme = 'sticky';
    for (const th of Object.values(THEMES)) if (!has(th.colors, out[th.key])) out[th.key] = th.fallback;
    return out;
  };
  Board21.on('config', c => { config = readConfig(c); applyLook(); setMenu(); });
  Board21.on('theme', () => { applyLook(); setMenu(); });   // the board's light/dark theme
  addEventListener('resize', fitSoon);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);

  Board21.ready().then(ctx => {
    t.value = readText(ctx.data);
    linksOn = !ctx.kiosk;
    config = readConfig(ctx.config);
    renderView(); applyLook(); setMenu();
  });
</script>
</body>
</html>

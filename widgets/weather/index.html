<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3d4654; }

  button, input { font: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@property --inset { syntax: "<length>"; inherits: true; initial-value: 0px; }
/* ===== The widget's own look (the approved mockup's): each window draws its sky from the weather. No text under 14 px:
   every size smaller than the base is floored there, as max(14px, …). ===== */
.wx { --u: 1; --fs: 16px; position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff; isolation: isolate;
  font: 400 max(14px, calc(var(--fs) * var(--u))) / 1.25 var(--b21-font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  background: linear-gradient(180deg, var(--s1), var(--s2)); text-shadow: 0 1px 3px rgba(0,0,0,.16);
  --card: rgba(6,26,58,.2); --edge: rgba(255,255,255,.15); --dim: rgba(255,255,255,.9); --track: rgba(0,0,0,.2); --inset: .9em; }
.wx * { box-sizing: border-box; }
.wx svg { display: block; flex: none; }
.wx .ic { width: 1.3em; height: 1.3em; }
.wx [data-go], .wx [data-wear], .wx [data-act] { cursor: pointer; }
.wx [data-go]:focus-visible, .wx [data-wear]:focus-visible, .wx button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.sc-clear-d  { --s1: #1462c4; --s2: #3a85cc; }
.sc-partly-d { --s1: #2869b3; --s2: #5a8cc0; }
.sc-cloudy-d { --s1: #4c5c70; --s2: #6a7a8e; --card: rgba(18,28,44,.2); }
.sc-fog-d    { --s1: #55606c; --s2: #6c7682; --card: rgba(18,28,44,.2); }
.sc-rain-d   { --s1: #3b4a5e; --s2: #5f7085; --card: rgba(8,18,34,.22); }
.sc-snow-d   { --s1: #4c6080; --s2: #6a7d97; --card: rgba(14,30,56,.22); }
.sc-storm    { --s1: #1d2033; --s2: #44445e; --card: rgba(255,255,255,.08); }
.sc-clear-n  { --s1: #071129; --s2: #1b3060; --card: rgba(255,255,255,.08); }
.sc-partly-n, .sc-cloudy-n, .sc-fog-n { --s1: #131a29; --s2: #333f54; --card: rgba(255,255,255,.08); }
.sc-rain-n   { --s1: #10161f; --s2: #2a3444; --card: rgba(255,255,255,.07); }
.sc-snow-n   { --s1: #1d2840; --s2: #42506b; --card: rgba(255,255,255,.08); }
.sc-warm-d   { --s1: #0f6fc9; --s2: #45b1e6; }

.sc-off      { --s1: #3d4654; --s2: #5f6979; --card: rgba(255,255,255,.08); }

.wx .fx i { position: absolute; display: block; }

.wx .dglow { inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 108%, rgba(255,206,128,.55), rgba(255,206,128,0)); }
.wx .stars { inset: 0 0 30% 0; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='white'><circle cx='9' cy='14' r='.9' opacity='.8'/><circle cx='47' cy='7' r='.6' opacity='.6'/><circle cx='83' cy='22' r='1.1' opacity='.9'/><circle cx='112' cy='9' r='.6' opacity='.5'/><circle cx='28' cy='48' r='.7' opacity='.6'/><circle cx='66' cy='57' r='.9' opacity='.8'/><circle cx='101' cy='70' r='.6' opacity='.5'/><circle cx='14' cy='92' r='1' opacity='.7'/><circle cx='54' cy='101' r='.6' opacity='.5'/><circle cx='89' cy='108' r='.8' opacity='.7'/></g></svg>") 0 0 / 7.5em 7.5em;
  -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent); }
.wx .cl { width: 34em; height: 11em; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,var(--a,.22)), rgba(255,255,255,0)); animation: wx-drift 80s linear infinite alternate; }
.wx .rain-a, .wx .rain-b, .wx .snow-a, .wx .snow-b { left: 0; right: 0; bottom: 0; will-change: transform; }
/* Rain: each drop fades in from the top, faintest where it starts */
.wx .rain-a { top: -7.5em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='120'><defs><linearGradient id='d' x2='0' y2='1'><stop offset='0' stop-color='white' stop-opacity='0'/><stop offset='1' stop-color='white' stop-opacity='.24'/></linearGradient></defs><g fill='url(%23d)'><rect x='6' y='4' width='1.3' height='18' rx='.65'/><rect x='30' y='36' width='1.3' height='18' rx='.65'/><rect x='18' y='68' width='1.3' height='18' rx='.65'/><rect x='41' y='94' width='1.3' height='18' rx='.65'/></g></svg>") 0 0 / 3em 7.5em; animation: wx-fall75 1.5s linear infinite; }
.wx .rain-b { top: -10em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='160'><defs><linearGradient id='d' x2='0' y2='1'><stop offset='0' stop-color='white' stop-opacity='0'/><stop offset='1' stop-color='white' stop-opacity='.16'/></linearGradient></defs><g fill='url(%23d)'><rect x='14' y='10' width='1.7' height='26' rx='.85'/><rect x='46' y='64' width='1.7' height='26' rx='.85'/><rect x='30' y='116' width='1.7' height='26' rx='.85'/></g></svg>") 0 0 / 4em 10em; animation: wx-fall10 1.25s linear infinite; }
.wx .sway { inset: 0 -3em; }
.wx .sw-a { animation: wx-sway-a 5.3s ease-in-out infinite alternate; }
.wx .sw-b { animation: wx-sway-b 8.7s ease-in-out -3s infinite alternate; }
.wx .snow-a { top: -11em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='176' height='176'><defs><radialGradient id='f'><stop offset='0' stop-color='white'/><stop offset='.55' stop-color='white' stop-opacity='.8'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><g fill='url(%23f)'><circle cx='120' cy='111' r='2.9' opacity='0.47'/><circle cx='137' cy='140' r='3.0' opacity='0.48'/><circle cx='44' cy='5' r='3.6' opacity='0.44'/><circle cx='16' cy='137' r='3.8' opacity='0.41'/><circle cx='11' cy='172' r='3.1' opacity='0.53'/><circle cx='107' cy='11' r='4.4' opacity='0.43'/><circle cx='24' cy='163' r='3.6' opacity='0.44'/><circle cx='141' cy='25' r='2.9' opacity='0.58'/><circle cx='97' cy='62' r='3.5' opacity='0.47'/><circle cx='10' cy='149' r='3.0' opacity='0.41'/><circle cx='40' cy='166' r='4.2' opacity='0.57'/></g></svg>") 0 0 / 11em 11em; animation: wx-fall11 12s linear infinite; }
.wx .snow-b { top: -15em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><defs><radialGradient id='f'><stop offset='0' stop-color='white'/><stop offset='.55' stop-color='white' stop-opacity='.8'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><g fill='url(%23f)'><circle cx='181' cy='139' r='2.5' opacity='0.40'/><circle cx='114' cy='197' r='1.7' opacity='0.29'/><circle cx='210' cy='99' r='2.7' opacity='0.32'/><circle cx='93' cy='236' r='2.1' opacity='0.33'/><circle cx='25' cy='171' r='1.6' opacity='0.45'/><circle cx='118' cy='132' r='2.2' opacity='0.40'/><circle cx='146' cy='133' r='1.9' opacity='0.37'/><circle cx='43' cy='84' r='1.8' opacity='0.44'/><circle cx='143' cy='75' r='2.0' opacity='0.27'/><circle cx='194' cy='185' r='1.7' opacity='0.32'/><circle cx='161' cy='213' r='2.4' opacity='0.44'/><circle cx='234' cy='228' r='2.1' opacity='0.37'/><circle cx='118' cy='91' r='2.7' opacity='0.30'/><circle cx='41' cy='20' r='2.7' opacity='0.41'/><circle cx='116' cy='199' r='2.5' opacity='0.26'/><circle cx='71' cy='101' r='1.9' opacity='0.28'/><circle cx='82' cy='214' r='1.7' opacity='0.45'/><circle cx='115' cy='62' r='2.5' opacity='0.44'/></g></svg>") 0 0 / 15em 15em; animation: wx-fall15 26s linear infinite; }
.wx .flash { inset: 0; background: #fff; opacity: 0; animation: wx-flash 9s infinite; }
.wx .fog-a, .wx .fog-b { left: -40%; right: -40%; height: 9em; border-radius: 50%; opacity: .5; background: radial-gradient(closest-side, rgba(255,255,255,.22), rgba(255,255,255,0)); animation: wx-drift 50s ease-in-out infinite alternate; }
@keyframes wx-drift { to { transform: translateX(7em); } }
@keyframes wx-fall11 { to { transform: translateY(11em); } }
@keyframes wx-fall15 { to { transform: translateY(15em); } }
@keyframes wx-sway-a { from { transform: translateX(-1.4em); } to { transform: translateX(1.4em); } }
@keyframes wx-sway-b { from { transform: translateX(1em); } to { transform: translateX(-1em); } }
@keyframes wx-fall75 { to { transform: translateY(7.5em); } }
@keyframes wx-fall10 { to { transform: translateY(10em); } }
@keyframes wx-flash { 0%, 90%, 100% { opacity: 0; } 91% { opacity: .3; } 92% { opacity: 0; } 93.5% { opacity: .18; } 95% { opacity: 0; } }
.wx.still .fx i { animation: none; }
@media (prefers-reduced-motion: reduce) { .wx .fx i { animation: none; } }

.wx .in { position: relative; height: 100%; display: grid; gap: .75em; padding: 1em; min-height: 0; }
.wx .hero { padding-inline: var(--inset); min-width: 0; }
.wx .place { font-weight: 600; font-size: 1.05em; overflow-wrap: anywhere; }
.wx .temp { white-space: nowrap; font-weight: 300; line-height: .92; letter-spacing: -.045em; font-size: 4.4em; font-variant-numeric: lining-nums; }
.wx .temp .deg { letter-spacing: 0; }
.wx .temp .unit { font-size: max(14px, .3em); font-weight: 500; color: var(--dim); opacity: .8; vertical-align: top; position: relative; top: .34em; margin-left: .05em; letter-spacing: 0; }
.wx .src { font-size: max(14px, .68em); color: var(--dim); font-weight: 600; letter-spacing: .01em; }
.wx .cond { display: flex; align-items: center; gap: .35em; font-weight: 600; }
.wx .hl, .wx .more { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
.wx .hl b { color: #fff; font-weight: 600; }
.wx .more { display: flex; align-items: center; gap: .35em; flex-wrap: wrap; }
.wx .aqd { width: .62em; height: .62em; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 .12em rgba(0,0,0,.18); }
.wx .foot { font-size: max(14px, .66em); color: var(--dim); font-weight: 500; }

/* Alerts and offline: a band across the top, tapped for more */
.wx .band { display: flex; align-items: center; gap: .45em; border-radius: .8em; padding: .45em .75em .45em .6em; font-weight: 700; font-size: max(14px, .82em); line-height: 1.2; text-shadow: none; min-width: 0; }
.wx .band svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.wx .band span { font-weight: 500; }
.wx .band .go { margin-left: auto; opacity: .7; }
.wx .band { padding-left: calc(var(--inset) + 1px); }
.wx .band.warn { background: #ff8a3d; color: #2a1000; }
.wx .band.watch { background: #ffd54d; color: #2a2100; }
.wx .band.off { background: rgba(255,255,255,.9); color: #1f2937; }

.wx .card { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 1em; padding: .7em var(--inset) .8em; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.wx h3 { margin: 0 0 .55em; font-size: max(14px, .74em); font-weight: 600; color: var(--dim); display: flex; align-items: center; gap: .4em; padding-bottom: .55em; border-bottom: 1px solid var(--edge); letter-spacing: .01em; flex: none; white-space: nowrap; }
.wx h3 svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wx h3 .when { margin-left: auto; color: #fff; font-weight: 700; }
.wx h3 .chev { margin-left: auto; width: 1em; height: 1em; opacity: .8; }
.wx h3 .when + .chev { margin-left: .2em; }
.wx h3 .cr { margin-left: auto; font-weight: 500; font-size: max(14px, .9em); }
.wx h3 .cr + .chev { margin-left: .35em; }

/* Hours */
.wx .sum { font-size: max(14px, .9em); font-weight: 500; margin: -.1em 0 .6em; }
.wx .hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); flex: 1; align-items: center; }
.wx .hours.two { grid-auto-flow: row; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); row-gap: .6em; }
.wx .hr { display: grid; justify-items: center; gap: .3em; text-align: center; grid-template-rows: auto auto .7em auto; }
.wx .hr .pop { grid-row: 3; }
.wx .hr .v { grid-row: 4; }
.wx .hr .t { font-size: max(14px, .8em); font-weight: 600; color: var(--dim); white-space: nowrap; }
.wx .hr:first-child .t { color: #fff; }
.wx .hr .hi { width: 1.9em; height: 1.9em; }
.wx .hr .v { font-size: 1.1em; font-weight: 600; }
.wx .hr .v.sm { font-size: max(14px, .8em); }
.wx .pop { font-size: max(14px, .66em); font-weight: 800; color: #c4ecff; line-height: 1; }

/* Seven days */
.wx .days { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-rows: minmax(0, 1fr); flex: 1; }
.wx .days li { display: grid; grid-template-columns: 3.4em 2.2em 2.5em minmax(2em, 1fr) 2.5em; align-items: center; gap: .55em; border-top: 1px solid var(--edge); min-height: 2.1em; }
.wx .days li:first-child { border-top: 0; }
.wx .days .d { font-weight: 600; }
.wx .days .di { display: grid; justify-items: center; gap: .1em; }
.wx .days .di svg { width: 1.6em; height: 1.6em; }
.wx .days .lo { color: var(--dim); text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.wx .days .hi { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.wx .bar { position: relative; height: .36em; border-radius: 1em; background: var(--track); }
.wx .bar i { position: absolute; top: 0; bottom: 0; border-radius: 1em; }
.wx .bar b { position: absolute; top: 50%; width: .62em; height: .62em; margin: -.31em 0 0 -.31em; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .14em rgba(0,0,0,.28); }

/* What to wear */
.wx .items { display: flex; gap: .75em; flex-wrap: wrap; align-items: flex-start; }
.wx .items figure { margin: 0; display: grid; justify-items: center; gap: .3em; }
.wx .dot { width: 2.7em; height: 2.7em; border-radius: 50%; background: rgba(255,255,255,.17); display: grid; place-items: center; }
.wx .dot svg { width: 1.65em; height: 1.65em; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.wx figcaption { font-size: max(14px, .74em); font-weight: 600; color: #fff; }
.wx .advice { font-weight: 650; font-size: 1.12em; line-height: 1.2; margin: 0 0 .55em; text-wrap: balance; }
.wx .eg { font-size: max(14px, .7em); font-weight: 600; color: var(--dim); margin: 0 0 .35em; }
.wx .note { font-size: max(14px, .85em); color: var(--dim); font-weight: 500; margin: .6em 0 0; }
.wx .wear .body { flex: 1; display: grid; align-content: center; min-height: 0; }
.wx .tg { display: inline-flex; background: rgba(0,0,0,.2); border-radius: 2em; padding: .18em; gap: .1em; flex: none; }
.wx .tg b { font-weight: 600; padding: .35em .85em; border-radius: 2em; color: var(--dim); min-width: 3.6em; text-align: center; white-space: nowrap; }
.wx .tg b.on { background: #fff; color: #17406f; text-shadow: none; }
.wx .wear .tg { justify-self: start; margin-top: .7em; font-size: max(14px, .9em); }

/* Sun, moon, wind, and air */
.wx .arc { width: 100%; height: auto; flex: 1; min-height: 0; }
.wx .sunrow { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; margin-top: .3em; gap: .5em; }
.wx .sunrow div { display: grid; }
.wx .sunrow div:last-child { text-align: right; }
.wx .sunrow small, .wx .k { font-size: max(14px, .72em); color: var(--dim); font-weight: 600; }
.wx .sunrow b { font-weight: 600; white-space: nowrap; }
.wx .daylight { font-size: max(14px, .78em); color: var(--dim); margin-top: .35em; font-weight: 500; }
.wx .moonline { display: flex; align-items: center; gap: .45em; margin-top: .55em; padding-top: .55em; border-top: 1px solid var(--edge); font-size: max(14px, .85em); font-weight: 500; }
.wx .moonline svg { width: 1.4em; height: 1.4em; }
.wx .moonbody { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 1em; align-items: center; min-height: 0; }
.wx .moonbody svg { width: 5.4em; height: 5.4em; }
.wx .windbody { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 1em; align-items: center; min-height: 0; }
.wx .compass { width: 6.2em; height: 6.2em; }
.wx .big { font-size: 2em; font-weight: 400; line-height: 1; letter-spacing: -.02em; }
.wx .big small { font-size: max(14px, .45em); font-weight: 600; letter-spacing: 0; margin-left: .15em; }
.wx .stack { display: grid; gap: .35em; align-content: center; min-width: 0; }
.wx .stack span { color: var(--dim); font-size: max(14px, .85em); font-weight: 500; }
.wx .stack .name { color: #fff; font-weight: 600; font-size: 1.05em; }
.wx .aqpill { justify-self: start; font-weight: 700; font-size: max(14px, .85em); padding: .2em .7em; border-radius: 1em; text-shadow: none; }
.wx .aqscale { position: relative; height: .45em; border-radius: 1em; margin: .8em 0 .2em; background: linear-gradient(90deg, #00e400 0 16.6%, #ffff00 16.6% 33.3%, #ff7e00 33.3% 50%, #ff0000 50% 66.6%, #8f3f97 66.6% 83.3%, #7e0023 83.3%); }
.wx .aqscale b { position: absolute; top: 50%; width: .8em; height: .8em; margin: -.4em 0 0 -.4em; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .15em rgba(0,0,0,.35); }

/* Small: just now */
.L-s .in { place-content: center; justify-items: center; text-align: center; gap: .5em; }
.L-s .hero { display: grid; justify-items: center; gap: .12em; padding: 0; }
.L-s .temp { font-size: 4.5em; margin: .04em 0 .06em .2em; }
.L-s .cond .ic { width: 1.45em; height: 1.45em; }
.L-s .band { margin-bottom: .3em; }
.L-s.has-band .temp { font-size: 3.4em; }
.L-s.has-band .in { gap: .3em; }
.L-s.has-band .band { margin-bottom: 0; }
.L-s.V-detail .in { place-content: stretch; justify-items: stretch; text-align: left; }
.L-s .scroll { -webkit-mask: linear-gradient(#000 80%, transparent); mask: linear-gradient(#000 80%, transparent); padding-bottom: 1em; }

/* Medium: now, the week, and what to wear */
.L-m .in { grid-template-rows: auto minmax(0, 1fr) auto; gap: .65em; }
.L-m.has-band .in { grid-template-rows: auto auto minmax(0, 1fr) auto; gap: .55em; }
.L-m.has-band h3 { margin-bottom: .25em; padding-bottom: .3em; }
.L-m .right .cond .chev { width: .85em; height: .85em; opacity: .8; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.L-m.has-band .temp { font-size: 3.4em; }
.L-m .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: .5em; }
.L-m .hero > .left { display: grid; gap: .12em; min-width: 0; }
.L-m .temp { font-size: 3.9em; margin-left: -.04em; }
.L-m .right { display: grid; justify-items: end; text-align: right; gap: .15em; padding-bottom: .15em; }
.L-m .right .bigic { width: 2.5em; height: 2.5em; margin-bottom: .1em; }
.L-m h3 { margin-bottom: .35em; padding-bottom: .4em; }
.L-m .week { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); align-items: center; flex: 1; }
.L-m .week .col { display: grid; justify-items: center; gap: .18em; text-align: center; font-variant-numeric: tabular-nums; }
.L-m .week .col + .col { border-left: 1px solid var(--edge); }
.L-m .week .n { font-size: max(14px, .82em); font-weight: 600; color: var(--dim); }
.L-m .week .col:first-child .n { color: #fff; }
.L-m .week svg { width: 1.8em; height: 1.8em; }
.L-m .week .h { font-weight: 600; font-size: 1.05em; }
.L-m .week .l { color: var(--dim); font-size: max(14px, .88em); }

<script>
  // Content (Board21.save): { saved: { at, place, days, wear, from } }, the last forecast drawn, for offline.
  //   at     when what's saved last changed, in ms. place: the place's GeoNames id. from: "nws" when the Weather
  //          Service's forecast was the backup (else left out).
  //   days   the 7 days as drawn: { date: 'YYYY-MM-DD' (the place's), code, low, high, rain }, °F unrounded.
  //   wear   What to wear for today and the next school day, by date: { label, advice, items, feels8, high, at }, or
  //          { label, none: true } past the forecast. Never "Feels like … now": it changes every half hour.
  //   Saved only when it would draw differently (whole degrees, tens of percent), never because time passed.
  // Config (Board21.saveConfig): { place: { id, name, region, country, lat, lon, tz }, units: 'f' | 'c',
  //   hide: [...parts], simple, still, date: 'YYYY-MM-DD' | null }. Every menu setting and the place: no student's data.
  // Each window asks on its own: its own place, clocks, and saves. Nothing is kept outside the board.
  'use strict';
  const HOST = { forecast: 'https://api.open-meteo.com', air: 'https://air-quality-api.open-meteo.com', archive: 'https://archive-api.open-meteo.com',
    search: 'https://geocoding-api.open-meteo.com', nws: 'https://api.weather.gov' };
  const SITE = 'https://open-meteo.com/';
  const WHEELING = { id: 4916311, name: 'Wheeling', region: 'Illinois', country: 'United States', lat: 42.13919, lon: -87.92896, tz: 'America/Chicago' };
  const PARTS = [['hourly', 'Hourly forecast'], ['days', '7-day forecast'], ['wear', 'What to wear'], ['sun', 'Sunrise and sunset'], ['moon', 'Moon'], ['wind', 'Wind'], ['air', 'Air quality'], ['watches', 'Watches']];
  const MIN = 6e4, HOUR = 36e5;
  const EVERY = { now: 30 * MIN, forecast: HOUR, air: 4 * HOUR, alerts: 5 * MIN };
  const WAIT = 10000;          // a request's longest wait
  const TOO_OLD = 90 * MIN;    // Now from the Weather Service, before it comes from Open-Meteo instead
  const AIR_KEEP = 8 * HOUR;   // air quality from an older answer is hidden
  const NB = ' ';
  const EXT_ICON = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>';
  const CAL = self.B21WeatherCalendar || { noSchool: [], halfDays: [] };
  const NO_SCHOOL = new Set(CAL.noSchool), HALF = new Set(CAL.halfDays);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fin = v => typeof v === 'number' && isFinite(v);
  const num0 = v => (fin(v) ? v : null);
  // A time a date can be made from, in unix seconds: from 1900 to 2100. (Intl throws on one too far out.)
  const okT = t => fin(t) && t > -2208988800 && t < 4102444800;
  // A temperature that could be real, in °F: the air within ±150°, feels like within ±200° (a heat index can pass 150°).
  const tF = (v, max = 150) => (fin(v) && v > -max && v < max ? v : null);

  // ---- Dates and times, in the place's time zone. Every time is rounded to the minute before it is shown.
  const fmts = new Map();
  const fmt = (tz, o) => { const k = tz + JSON.stringify(o); if (!fmts.has(k)) fmts.set(k, new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz }, o))); return fmts.get(k); };
  function partsOf(ms, tz) {
    const o = {};
    for (const p of fmt(tz, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(ms)) o[p.type] = p.value;
    return { ymd: `${o.year}-${o.month}-${o.day}`, h: +o.hour % 24, m: +o.minute };
  }
  const ymdOf = (ms, tz) => partsOf(ms, tz).ymd;
  const round = ms => Math.round(ms / MIN) * MIN;
  function clock(ms, tz) { const p = partsOf(round(ms), tz), h12 = p.h % 12 || 12; return (p.m ? `${h12}:${String(p.m).padStart(2, '0')}` : `${h12}`) + NB + (p.h < 12 ? 'AM' : 'PM'); }
  const dUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const addDays = (s, n) => new Date(dUTC(s) + n * 864e5).toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 864e5);
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const wd = s => new Date(dUTC(s)).getUTCDay();
  const monthDay = s => `${MON[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}`;
  const YMD = /^\d{4}-\d{2}-\d{2}$/;
  const realDay = s => typeof s === 'string' && YMD.test(s) && new Date(dUTC(s)).toISOString().slice(0, 10) === s;
  // "Today", "Tue" within 6 days, then "Mon, Nov 30".
  const label = (d, today) => { const n = daysBetween(today, d); return n <= 6 ? WD[wd(d)] : `${WD[wd(d)]}, ${monthDay(d)}`; };
  // "7:02 AM" today, "Fri 7:02 AM" within 6 days, "Nov 20" before that.
  function updated(ms, tz) { const d = ymdOf(ms, tz), n = daysBetween(d, ymdOf(Date.now(), tz)); return n <= 0 ? clock(ms, tz) : n <= 6 ? `${WD[wd(d)]} ${clock(ms, tz)}` : monthDay(d); }
  // Quiet hours, by the device's own clock: no timed requests from 8 PM until 6 AM and this window's own minute.
  const OFFSET = Math.floor(Math.random() * 15);
  function quiet(ms) { const t = new Date(ms), h = t.getHours(); return h >= 20 || h < 6 || (h === 6 && t.getMinutes() < OFFSET); }

  // ---- School days: the district's calendar, whatever the place. After it, weekdays.
  const isSchool = s => { const d = wd(s); return d > 0 && d < 6 && !NO_SCHOOL.has(s); };
  function nextSchool(s) { for (let i = 1; i < 400; i++) { const d = addDays(s, i); if (isSchool(d)) return d; } return addDays(s, 1); }
  const schoolHours = s => (HALF.has(s) ? [8, 11] : [8, 15]);
  // Which day What to wear shows: Today on a school day before 2 PM, else the next school day (Today a tap away).
  function plan(ms) {
    const p = partsOf(ms, config.place.tz), school = isSchool(p.ymd), next = nextSchool(p.ymd);
    return { today: school ? p.ymd : null, show: school && p.h < 14 ? 'today' : 'next', next, label: label(next, p.ymd), day: p.ymd };
  }

  // ---- What to wear: by feels like over the school hours (°F, whatever the units). The coldest hour picks the row.
  const CLOTHES = { coat: 'Coat', jacket: 'Jacket', rain: 'Rain jacket', hat: 'Hat', gloves: 'Gloves', scarf: 'Scarf', boots: 'Boots', tshirt: 'T-shirt', shorts: 'Shorts' };
  const TIER = { 'very cold': ['coat', 'hat', 'gloves', 'scarf'], cold: ['coat', 'hat', 'gloves'], chilly: ['coat'], cool: ['jacket'], mild: ['tshirt'], warm: ['tshirt', 'shorts'] };
  function advise(list) {
    const f = list.map(h => h.feels).filter(fin);
    if (!f.length) return null;
    const lo = Math.min(...f), hi = Math.max(...f);
    const tier = lo < 10 ? 'very cold' : lo < 32 ? 'cold' : lo < 45 ? 'chilly' : lo < 60 ? 'cool' : hi >= 75 ? 'warm' : 'mild';
    const rain = list.some(h => h.pop >= 40 && h.temp > 32), snow = list.some(h => h.pop >= 40 && fin(h.temp) && h.temp <= 32);
    return { tier, advice: `Dress for ${tier} weather.` + (rain ? ' Bring a rain jacket.' : '') + (snow ? ' Wear boots.' : ''),
      items: TIER[tier].concat(rain ? ['rain'] : [], snow ? ['boots'] : []) };
  }
  const ADVICE = /^Dress for (very cold|cold|chilly|cool|mild|warm) weather\.( Bring a rain jacket\.)?( Wear boots\.)?$/;
  // A day's What to wear from the hourly forecast, or none when the forecast doesn't reach its school hours. Today, the
  // hours still ahead are enough: the Weather Service's forecast starts at this hour.
  function wearFor(day, hours, today) {
    const [a, b] = schoolHours(day), tz = config.place.tz, hr = h => partsOf(h.t * 1000, tz).h;
    const in_ = hours.filter(h => { const p = partsOf(h.t * 1000, tz); return p.ymd === day && p.h >= a && p.h <= b && p.m === 0; });
    const from = day === today ? Math.max(a, partsOf(Date.now(), tz).h) : a;
    const whole = in_.length >= b - a + 1 || (from <= b && in_.filter(h => hr(h) >= from).length >= b - from + 1);
    const got = whole && advise(in_);
    if (!got) return { label: day === today ? 'Today' : label(day, today), none: true };
    let high = null, at = null;
    for (const h of in_) if (fin(h.temp) && (high === null || h.temp > high)) { high = h.temp; at = h.t; }
    const h8 = in_.find(h => partsOf(h.t * 1000, tz).h === 8);
    return { label: day === today ? 'Today' : label(day, today), advice: got.advice, items: got.items, feels8: h8 ? num0(h8.feels) : null, high, at };
  }

  // ---- Sun and moon, worked out on the device (NOAA sunrise and sunset, Meeus moon phases), for the place's day.
  const RAD = Math.PI / 180;
  function moonEventJd(k) {
    const T = k / 1236.85, q = Math.round((k - Math.floor(k)) * 4) % 4, s = Math.sin, E = 1 - 0.002516 * T;
    const M = (2.5534 + 29.1053567 * k) * RAD, m = (201.5643 + 385.81693528 * k + 0.0107582 * T * T) * RAD, F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T) * RAD;
    let jd = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T - 69 / 86400;   // minus delta T, about 69 s
    if (q % 2 === 0) jd += (q ? -0.40614 : -0.4072) * s(m) + (q ? 0.17302 : 0.17241) * E * s(M) + 0.01608 * s(2 * m) + 0.01039 * s(2 * F) + 0.00739 * E * s(m - M) - 0.00514 * E * s(m + M) + 0.00208 * E * E * s(2 * M);
    else jd += -0.62801 * s(m) + 0.17172 * E * s(M) - 0.01183 * E * s(m + M) + 0.00862 * s(2 * m) + 0.00804 * s(2 * F) + 0.00454 * E * s(m - M) + 0.00204 * E * E * s(2 * M) + (q === 1 ? 1 : -1) * (0.00306 - 0.00038 * E * Math.cos(M) + 0.00026 * Math.cos(m));
    return jd;
  }
  const MAIN = ['New moon', 'First quarter', 'Full moon', 'Last quarter'];
  // The moon at a moment: the four main names on the place's calendar day of the event, the in-between names on other
  // days, the fraction lit, and the times of the main phases from this lunation on.
  function moonPhase(ms, tz) {
    const jd = ms / 864e5 + 2440587.5, toMs = j => (j - 2440587.5) * 864e5;
    let k = Math.floor((jd - 2451550.09766) / 29.530588861);
    if (moonEventJd(k) > jd) k--;
    if (moonEventJd(k + 1) <= jd) k++;
    const ev = [0, 0.25, 0.5, 0.75, 1].map(f => moonEventJd(k + f));
    const T = (jd - 2451545) / 36525, s = Math.sin;
    const D = (297.8501921 + 445267.1114034 * T) * RAD, Ms = (357.5291092 + 35999.0502909 * T) * RAD, Mm = (134.9633964 + 477198.8675055 * T) * RAD;
    const i = Math.PI - D - (6.289 * s(Mm) - 2.1 * s(Ms) + 1.274 * s(2 * D - Mm) + 0.658 * s(2 * D) + 0.214 * s(2 * Mm) + 0.11 * s(D)) * RAD;
    const day = ymdOf(ms, tz);
    let seg = 0;
    while (seg < 3 && jd >= ev[seg + 1]) seg++;
    let name = ['Waxing crescent', 'Waxing gibbous', 'Waning gibbous', 'Waning crescent'][seg];
    for (let n = 0; n < 5; n++) if (ymdOf(toMs(ev[n]), tz) === day) name = MAIN[n % 4];
    const phases = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75].map(f => ({ name: MAIN[Math.round(f * 4) % 4], at: round(toMs(moonEventJd(k + f))) }));
    return { fraction: (1 + Math.cos(i)) / 2, waxing: seg < 2, name, phases };
  }
  // "Full moon today", "… tomorrow", "… on Thursday" within 6 days, or "… on Dec 23".
  function nextPhase(m, ms, tz) {
    const today = ymdOf(ms, tz), p = m.phases.find(x => ymdOf(x.at, tz) >= today);
    if (!p) return '';
    const d = ymdOf(p.at, tz), n = daysBetween(today, d);
    return p.name + (n === 0 ? ' today' : n === 1 ? ' tomorrow' : n <= 6 ? ` on ${WDL[wd(d)]}` : ` on ${monthDay(d)}`);
  }
  // Sunrise and sunset on the place's calendar day s, rounded to the minute. null for a sun that doesn't rise or set.
  function sunTimes(s, lat, lon) {
    const day0 = dUTC(s);
    function event(dir, min) {
      for (let pass = 0; pass < 2; pass++) {
        const T = ((day0 + min * 6e4) / 864e5 + 2440587.5 - 2451545) / 36525;

    const c = d.air && aqCat(d.air.aqi);
    return `<div class="hero"${go('now')}>${place}${temp}${src(d, L)}<div class="cond">${use(icon(CODE[g], day))}${words(g, day)}</div>
      <div class="hl">High <b>${hi}</b>&nbsp;&nbsp; Low <b>${lo}</b></div>
      ${n ? `<div class="more">Feels like ${T(n.feels, o)}${shown('wind') ? wind : ''}</div>` : ''}
      ${shown('air') && d.air ? `<div class="more">${aqd(d.air.aqi)}Air quality ${d.air.aqi}, ${c[1].toLowerCase()}</div>` : ''}
      <div class="foot">${credit(d)}, ${d.updated}</div></div>`;
  }

  function hourly(d, o, max, two, compact) {
    const list = d.hours.slice(0, max);
    const items = list.map(h => h[2] === 'sunset' || h[2] === 'sunrise'
      ? `<div class="hr"><span class="t">${h[0]}</span>${use(h[2] === 'sunset' ? 'w-sset' : 'w-srise', 'hi')}<span class="v sm">${h[2] === 'sunset' ? 'Sunset' : 'Sunrise'}</span></div>`
      : `<div class="hr"><span class="t">${h[0]}</span>${use(icon(h[2], h[3]), 'hi')}${h[4] >= 30 ? `<span class="pop">${Math.round(h[4])}%</span>` : ''}<span class="v">${T(h[1], o)}</span></div>`).join('');
    return `<section class="card hourly"${go('hours')}><h3>${use('u-clock')}Hourly forecast${compact && d.src !== 'nws' ? '<span class="cr">Open-Meteo</span>' : ''}${chev}</h3>${compact ? '' : `<p class="sum">${d.sum}</p>`}<div class="hours${two ? ' two' : ''}${list.some(h => typeof h[2] === 'number' && h[4] >= 30) ? ' pops' : ''}"${two ? ` style="--cols:${Math.ceil(list.length / 2)}"` : ''}>${items}</div></section>`;
  }

  function days(d, o) {
    const lows = d.days.map(x => x[2]).filter(fin), highs = d.days.map(x => x[3]).filter(fin);
    const lo = Math.min(...lows, ...highs), hi = Math.max(...highs, ...lows), span_ = hi - lo || 1;
    const pct = v => ((v - lo) / span_ * 100).toFixed(1);
    const rows = d.days.map((x, i) => {
      const a = fin(x[2]) ? x[2] : x[3], b = fin(x[3]) ? x[3] : x[2];
      const now = i === 0 && !d.offline && d.now && fin(d.now.t) ? `<b style="left:${Math.max(0, Math.min(100, pct(d.now.t)))}%"></b>` : '';
      const barI = fin(a) && fin(b) ? `<i style="left:${pct(a)}%;right:${(100 - pct(b)).toFixed(1)}%;background:linear-gradient(90deg,${tcol(a)},${tcol(b)})"></i>` : '';
      return `<li><span class="d">${x[0]}</span><span class="di">${use(icon(x[1], 1))}${x[4] >= 30 ? `<span class="pop">${Math.round(x[4])}%</span>` : ''}</span>
        <span class="lo">${T(x[2], o)}</span><span class="bar">${barI}${now}</span><span class="hi">${T(x[3], o)}</span></li>`;
    }).join('');
    return `<section class="card daysc"${go('days')}><h3>${use('u-cal')}7-day forecast${chev}</h3><ol class="days">${rows}</ol></section>`;
  }

  // What to wear: Today, or the next school day
  const pickOf = (d, o) => (!d.wear ? null : o.wear === 'next' || !d.wear.today ? 'next' : 'today');
  const toggle = (d, o) => (!d.wear.today ? `<span class="tg"><b class="on">${esc(d.wear.next.label)}</b></span>`
    : `<span class="tg" role="group" aria-label="What to wear"><b data-wear="today" role="button" tabindex="0"${pickOf(d, o) === 'today' ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"'}>Today</b><b data-wear="next" role="button" tabindex="0"${pickOf(d, o) === 'next' ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"'}>${esc(d.wear.next.label)}</b></span>`);
  function wearItems(items, caps) {
    return `<div class="items">${items.map(k => `<figure data-item="${k}"><span class="dot"${caps === false ? ` role="img" aria-label="${CLOTHES[k]}"` : ''}>${use('c-' + k)}</span>${caps === false ? '' : `<figcaption>${CLOTHES[k]}</figcaption>`}</figure>`).join('')}</div>`;
  }
  function note(d, o, k) {
    const w = d.wear[k], tz = pl().tz, high = fin(w.high) && fin(w.at) ? `High of ${T(w.high, o)} at ${clock(w.at * 1000, tz)}.` : '';
    if (k === 'today') return (!d.offline && d.now && fin(d.now.feels) ? `Feels like ${T(d.now.feels, o)} now. ` : '') + high;
    return (fin(w.feels8) ? `Feels like ${T(w.feels8, o)} at 8${NB}AM. ` : '') + high;
  }
  function wear(d, o) {
    const k = pickOf(d, o), w = d.wear[k];
    const body = w.none ? '<p class="advice">Its forecast isn’t out yet.</p>'
      : `<p class="advice">${w.advice}</p><p class="eg">For example</p>${wearItems(w.items)}<p class="note">${note(d, o, k).trim()}</p>`;
    return `<section class="card wear"><h3>${use('u-shirt')}What to wear</h3><div class="body">${body}${toggle(d, o)}</div></section>`;
  }
  // Medium shows up to 4: rain jacket and boots first, then the row's clothes.
  function wearLine(d, o) {
    const w = d.wear[pickOf(d, o)];
    if (w.none) return `<section class="card wl">${toggle(d, o)}<span class="says">Its forecast isn’t out yet.</span></section>`;
    const items = w.items.filter(i => i === 'rain' || i === 'boots').concat(w.items.filter(i => i !== 'rain' && i !== 'boots')).slice(0, 4);
    return `<section class="card wl">${toggle(d, o)}${wearItems(items, false)}<span class="says">${w.advice}</span></section>`;
  }

  function sunArc(f) {
    const parts = ['<path d="M6 72H194" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>',
      '<path d="M16 72A84 58 0 0 1 184 72" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>'];
    if (f != null) {
      const th = Math.PI * (1 - f), x = (100 + 84 * Math.cos(th)).toFixed(1), y = (72 - 58 * Math.sin(th)).toFixed(1);
      parts.push(`<path d="M16 72A84 58 0 0 1 ${x} ${y}" fill="none" stroke="#FFD66B" stroke-width="3" stroke-linecap="round"/>`,
        `<circle cx="${x}" cy="${y}" r="13" fill="#FFD66B" opacity=".22"/><circle cx="${x}" cy="${y}" r="7" fill="#FFD66B"/>`);
    }
    return `<svg class="arc" viewBox="0 0 200 80" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${parts.join('')}</svg>`;
  }
  function sun(d, o, L) {
    const s = d.sun, m = d.moon;
    const moonline = L === 'xl' || !shown('moon') ? '' : `<div class="moonline">${moonSvg(m.fraction, m.waxing)}${m.next}</div>`;
    return `<section class="card sun"${go('sun')}><h3>${use('u-sun')}Sunrise and sunset${chev}</h3>${sunArc(s.f)}
      <div class="sunrow"><div><small>Sunrise</small><b>${s.rise}</b></div><div><small>Sunset</small><b>${s.set}</b></div></div>
      ${s.daylight ? `<div class="daylight">${s.daylight} of daylight</div>` : ''}${moonline}</section>`;
  }
  function moon(d) {
    const m = d.moon;
    return `<section class="card moon"${go('sun')}><h3>${use('u-moon')}Moon${chev}</h3><div class="moonbody">${moonSvg(m.fraction, m.waxing)}<div class="stack"><span class="name">${m.name}</span><span>${m.next}</span><span>${Math.round(m.fraction * 100)}% lit</span></div></div></section>`;
  }
  // The arrow points where the wind blows to. A calm report has no direction: no arrow.
  function compass(dir) {
    let ticks = '';
    for (let a = 0; a < 360; a += 30) ticks += `<path d="M50 7v${a % 90 ? 4 : 7}" transform="rotate(${a} 50 50)"/>`;
    const arrow = fin(dir) ? `<g transform="rotate(${(dir + 180) % 360} 50 50)"><path d="M50 74V30" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M50 18l-7 13h14z" fill="#fff"/><circle cx="50" cy="76" r="4" fill="none" stroke="#fff" stroke-width="2.5"/></g>` : '';
    return `<svg class="compass" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
      <g stroke="rgba(255,255,255,.55)" stroke-width="1.5">${ticks}</g>
      <g class="nesw" fill="rgba(255,255,255,.85)" font-size="13" font-weight="700" text-anchor="middle" font-family="inherit"><text x="50" y="29">N</text><text x="79" y="55">E</text><text x="50" y="83">S</text><text x="21" y="55">W</text></g>${arrow}</svg>`;
  }
  function wind(d, o, here) {
    const n = d.now, calm = !fin(n.dir) || Math.round(n.wind) === 0;
    return `<section class="card windc"${here ? '' : go('now')}><h3>${use('u-wind')}Wind${here ? '' : chev}</h3><div class="windbody">${compass(calm ? null : n.dir)}
      <div class="stack"><div class="big">${fin(n.wind) ? speedN(n.wind, o) : '–'}<small>${o.c ? 'km/h' : 'mph'}</small></div>
      ${fin(n.gust) && Math.round(n.gust) > 0 ? `<span>Gusts ${speed(n.gust, o)}</span>` : ''}${calm ? '' : `<span>From the ${DIRS[dirIdx(n.dir)]}</span>`}</div></div></section>`;
  }
  function airCard(d, mini, here) {
    const v = d.air.aqi, c = aqCat(v), pill = `<span class="aqpill" style="background:${c[2]};color:${c[3]}">${c[1]}</span>`;
    const head = `<h3>${use('u-air')}Air quality${here ? '' : chev}</h3>`, tap = here ? '' : go('air');
    if (mini) return `<section class="card air"${tap}>${head}<div class="stack" style="flex:1"><div class="row1"><span class="big">${v}</span>${pill}</div></div></section>`;
    return `<section class="card air"${tap}>${head}<div class="stack" style="flex:1"><div class="big">${v}</div>${pill}<div class="aqscale"><b style="left:${aqPos(v)}%"></b></div></div></section>`;
  }
  function week5(d, o) {
    const list = d.days.slice(0, 5);
    const cols = list.map(x => `<div class="col"><span class="n">${x[0]}</span>${use(icon(x[1], 1))}<span class="h">${T(x[3], o)}</span><span class="l">${T(x[2], o)}</span></div>`).join('');
    return `<section class="card"${go('days')}><h3>${use('u-cal')}7-day forecast${d.src !== 'nws' ? '<span class="cr">Open-Meteo</span>' : ''}${chev}</h3><div class="week" style="--n:${list.length}">${cols}</div></section>`;
  }

  function frame(L, sc, o, body, extra, grid) {
    const [rw, rh, fs] = REF[L];
    // (Filling the board, the strips its corner buttons and padlocks take are left out.)
    const u = Math.max(0.7, Math.min(1.8, Math.min(o.w / rw, (o.h - (o.max ? corners.low + corners.top : 0)) / rh)));
    return `<div class="wx L-${L} sc-${sc}${o.still ? ' still' : ''}${o.max ? ' filled' : ''}${extra || ''}" style="--u:${u.toFixed(3)};--fs:${fs}px">${sky(sc)}<div class="in"${grid ? ` style='${grid}'` : ''}>${body}</div></div>`;
  }
  // Grids that close up around hidden parts
  const tpl = (cols, rows, areas) => `grid-template-columns:${cols};grid-template-rows:${rows.join(' ')};grid-template-areas:${areas.map(a => `"${a}"`).join(' ')}`;
  function solo(band, wear) {
    const rows = [], areas = [];
    if (band) { rows.push('auto'); areas.push(wear ? 'band band' : 'band'); }
    rows.push('minmax(0,1fr)'); areas.push(wear ? 'hero wear' : 'hero');
    return tpl(wear ? 'minmax(0,1fr) minmax(0,1fr)' : 'minmax(0,1fr)', rows, areas);
  }
  function gridL(band, wear, top, bot) {
    if (!top && !bot) return solo(band, wear);
    const rows = [], areas = [], last = wear || (top && bot);
    if (band) { rows.push('auto'); areas.push(`band ${top || bot}`); }
    rows.push('minmax(0,1fr)'); areas.push(`hero ${top || bot}`);
    if (last) { rows.push('auto'); areas.push(`${wear ? 'wear' : 'hero'} ${bot || top}`); }
    return tpl('minmax(0,1fr) minmax(0,1.08fr)', rows, areas);
  }
  function gridXL(band, wear, hr, dy, sm) {
    const lower = dy && sm ? 'days smalls' : dy ? 'days days' : sm ? 'smalls smalls' : '';
    const r1 = hr ? 'hourly hourly' : lower, r2 = hr ? lower || 'hourly hourly' : lower;
    if (!r1) return solo(band, wear);
    const rows = [], areas = [];
    if (band) { rows.push('auto'); areas.push('band band band'); }
    rows.push(hr && lower ? 'auto' : 'minmax(0,1fr)', 'minmax(0,1fr)'); areas.push(`hero ${r1}`, `${wear ? 'wear' : 'hero'} ${r2}`);
    return tpl('minmax(0,1.2fr) minmax(0,1.15fr) minmax(0,1.9fr)', rows, areas);
  }
  const sceneOf = d => {
    if (d.offline) return scene(group(d.days[0][1]), isDay(Date.now()));
    if (d.warm) return 'warm-d';
    return d.now ? scene(group(d.now.code), d.now.day, d.now.dusk) : scene(group(d.days[0][1]), isDay(Date.now()));
  };

  function render(d, o) {
    if (d.empty) return message(o, d.loading ? ['Getting the weather…'] : !online() ? ['You’re offline.', 'The weather shows once you’re online.'] : ['Can’t get the weather.', 'It tries again on its own.'], d.loading);
    if (o.simple) return simple(d, o);
    const L = layout(o.w, o.h, o.max);
    let v = o.view;
    if (d.offline && v !== 'days' && v !== 'sun') v = 'main';
    if ((v === 'alert' && !d.alerts.some(watchesOk)) || (v === 'air' && !d.air) || (L === 's' && v !== 'alert')) v = 'main';
    if (v !== 'main') return detail(d, o, v, L);
    const b = band(d, o, L);
    let body, grid = '', extra = (b ? ' has-band' : '') + (d.offline ? ' is-off' : '');   // (fit() closes up a short window)
    if (L === 's') body = b + hero(d, o, L);
    else if (L === 'm') {
      const mid = shown('days') ? week5(d, o) : shown('hourly') && !d.offline ? hourly(d, o, 6, false, true) : '';
      const wl = shown('wear') && d.wear ? wearLine(d, o) : '';
      body = b + hero(d, Object.assign({}, o, { mCredit: !mid }), L) + mid + wl;
      grid = 'grid-template-rows:' + [b && 'auto', mid ? 'auto' : 'minmax(0,1fr)', mid && 'minmax(0,1fr)', wl && 'auto'].filter(Boolean).join(' ');
      if (!mid) extra += ' m-big';
    } else if (L === 'l') {
      const top = shown('days') ? days(d, o) : '', wr = shown('wear') && d.wear ? wear(d, o) : '';
      const bot = shown('sun') ? sun(d, o, L) : shown('moon') ? moon(d) : '';
      body = b + hero(d, o, L) + top + wr + bot;
      grid = gridL(!!b, !!wr, top && 'days', bot && (shown('sun') ? 'sun' : 'moon'));
      if (!top && !bot) extra += ' l-solo';
    } else {
      const hr = shown('hourly') && !d.offline ? hourly(d, o, 12 + (d.hours.slice(0, 13).some(h => typeof h[2] !== 'number') ? 1 : 0)) : '';
      const wr = shown('wear') && d.wear ? wear(d, o) : '', dy = shown('days') ? days(d, o) : '';
      const sm = [shown('sun') && sun(d, o, L), !d.offline && shown('wind') && d.now && wind(d, o), shown('moon') && moon(d), !d.offline && shown('air') && d.air && airCard(d)].filter(Boolean);
      body = b + hero(d, o, L) + hr + wr + dy + (sm.length ? `<div class="smalls n${sm.length}">${sm.join('')}</div>` : '');
      grid = gridXL(!!b, !!wr, !!hr, !!dy, !!sm.length);
    }
    return frame(L, sceneOf(d), o, body, extra, grid);
  }

  // Details: one part, filling the window. ‹ Back returns.
  const back = title => `<div class="bar2"><button type="button" class="rb" data-go="main">${use('u-left')}Back</button><span class="title">${title}</span></div>`;
  function detail(d, o, v, L0) {
    const L = L0 === 's' ? 's' : 'm', n = d.now;
    const foot = `<p class="foot">${credit(d)}</p>`, noHead = s => s.replace(/<h3>[\s\S]*?<\/h3>/, '').replace(/ data-go="\w+" role="button" tabindex="0"/, '');
    let body;
    if (v === 'days') body = back('7-day forecast') + noHead(days(d, o)) + foot;
    else if (v === 'hours') body = back('Hourly forecast') + noHead(hourly(d, o, 13, true)) + foot;
    else if (v === 'sun') {
      const cs = [shown('sun') && sun(d, o, 'xl'), shown('moon') && moon(d)].filter(Boolean).map(c => c.replace(chev, '').replace(/ data-go="sun" role="button" tabindex="0"/, ''));
      if (!cs.length) cs.push(sun(d, o, 'xl').replace(chev, '').replace(/ data-go="sun" role="button" tabindex="0"/, ''));
      body = back(shown('sun') || !shown('moon') ? (shown('moon') ? 'Sun and moon' : 'Sunrise and sunset') : 'Moon') + `<div class="cards" style="display:grid;grid-template-columns:${cs.length > 1 ? '1.3fr 1fr' : '1fr'};gap:.6em;min-height:0">${cs.join('')}</div>`;
    } else if (v === 'air') {
      const a = d.air.aqi, c = aqCat(a);
      body = back('Air quality') + `<div class="dair"><div class="big">${a}</div><span class="aqpill" style="background:${c[2]};color:${c[3]}">${c[1]}</span>
        <div class="aqscale"><b style="left:${aqPos(a)}%"></b></div><p>${c[4]}</p>${d.air.later ? `<p>${d.air.later}</p>` : ''}</div><p class="foot">U.S. Air Quality Index from Open-Meteo and Copernicus</p>`;
    } else if (v === 'alert') {
      const list = d.alerts.filter(watchesOk).map(a => `<div class="alert"><h4>${esc(a.event)}</h4><span class="k">${span(a)}</span>${a.text.map(p => `<p>${esc(p)}</p>`).join('')}${a.todo.length ? `<p class="lab">What to do</p>${a.todo.map(p => `<p>${esc(p)}</p>`).join('')}` : ''}</div>`).join('');
      body = back('Watches and warnings') + `<div class="scroll">${list}</div><p class="foot">From the National Weather Service</p>`;
    } else {
      const g = n ? group(n.code) : 'cloudy', day = n ? n.day : true;
      const cards = [shown('wind') && n ? wind(d, o, true) : '', shown('air') && d.air ? airCard(d, true) : '',
        n && fin(n.feels) ? `<section class="card"><h3>${use('u-thermo')}Feels like</h3><div class="stack" style="flex:1"><div class="big">${T(n.feels, o)}</div>${n.why ? `<span>${n.why}</span>` : ''}</div></section>` : ''].filter(Boolean);
      const hl = d.src === 'nws' ? 'High and low from the National Weather Service' : shown('air') && d.air ? 'High, low, and air quality from Open-Meteo' : 'High and low from Open-Meteo';
      body = back('Now') + `<div class="dnow"><div class="hero"><div class="temp">${n ? num(n.t, o) : '–'}<span class="deg">°</span>${U(o)}</div><div class="cond">${use(icon(CODE[g], day))}${words(g, day)}</div>${src(d, 'l')}<div class="hl">High <b>${T(d.today.hi, o)}</b>&nbsp;&nbsp; Low <b>${T(d.today.lo, o)}</b></div></div>
        <div class="cards n${cards.length}">${cards.join('')}</div></div><p class="foot">${hl}</p>`;
    }
    return frame(L, sceneOf(d), o, body, ' V-detail');
  }
  function message(o, lines, loading) {
    return frame('m', 'off', o, `<b>${lines[0]}</b>${lines[1] ? `<span>${lines[1]}</span>` : ''}`, loading ? ' loading' : '').replace('class="in"', 'class="in offmsg"');
  }

  // On a date: the day's high, its sky, the low, feels like at its lowest, the strongest wind, snow and rain, the day's
  // temperatures, sunrise and sunset worked out here, and the day compared with today.
  // The day's temperatures, each at its own time (the archive keeps standard time all year, so a summer day starts at
  // 1 AM), with a gap where one is missing. The low sits on the base line, as in the mockup. The words are HTML over the
  // drawing, so they stay 14 px or more.
  function chart(hs, o, date) {
    const W = 300, H = 100, X0 = 10, X1 = 290, Y0 = 16, Y1 = 100, tz = pl().tz, c = f => (o.c ? (f - 32) * 5 / 9 : f);
    const t0 = hs[0].t, span = hs[hs.length - 1].t - t0 || 1, ok = hs.filter(h => h.f !== null);
    const vals = ok.map(h => c(h.f)), mn = Math.min(...vals), sp = Math.max(...vals) - mn || 1;
    const x = h => X0 + (X1 - X0) * (h.t - t0) / span, y = h => Y0 + (Y1 - Y0) * (1 - (c(h.f) - mn) / sp);
    const segs = [[]];
    for (const h of hs) { if (h.f === null) segs.push([]); else segs[segs.length - 1].push(h); }
    const P = h => x(h).toFixed(1) + ',' + y(h).toFixed(1), runs = segs.filter(g => g.length);
    const line = runs.map(g => 'M' + g.map(P).join('L')).join('');
    const area = runs.filter(g => g.length > 1).map(g => `M${x(g[0]).toFixed(1)},${H}L${g.map(P).join('L')}L${x(g[g.length - 1]).toFixed(1)},${H}Z`).join('');
    const pc = (v, of) => (v / of * 100).toFixed(2) + '%';
    const hi = ok.reduce((a, b) => (b.f > a.f ? b : a)), lo = ok.reduce((a, b) => (b.f < a.f ? b : a));
    const mark = (h, k) => `<i class="pt" style="left:${pc(x(h), W)};top:${pc(y(h), H)}"></i><b class="lab ${k}${x(h) / W > .6 ? ' end' : ''}" style="left:${pc(x(h), W)};top:${pc(y(h), H)}">${T(h.f, o)}</b>`;
    const ticks = hs.map(h => [h, partsOf(h.t * 1000, tz)]).filter(([h, p]) => p.ymd === date && p.m === 0 && p.h % 6 === 0)
      .map(([h, p]) => `<span class="tk${x(h) - X0 < 1 ? ' first' : ''}${p.h % 12 ? ' six' : ''}" style="left:${pc(x(h), W)}">${clock(h.t * 1000, tz)}</span>`).join('');
    const stroke = 'vector-effect="non-scaling-stroke"';
    return `<div class="chart"><div class="plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M${X0} ${H}H${X1}" stroke="rgba(255,255,255,.3)" ${stroke}/><path d="${area}" fill="rgba(255,255,255,.14)"/>
      <path d="${line}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${stroke}/></svg>${mark(hi, 'hi')}${hi === lo ? '' : mark(lo, 'lo')}</div><div class="tks">${ticks}</div></div>`;
  }
  const longDate = s => `${WD[wd(s)]}, ${MONL[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}, ${s.slice(0, 4)}`;
  const shortDate = s => `${monthDay(s)}, ${s.slice(0, 4)}`;
  function renderDate(o, today) {
    const L0 = layout(o.w, o.h, o.max), small = L0 === 's' || L0 === 'm', dt = config.date, y = yesterday(), cls = ' V-date' + (L0 === 's' ? ' d-s' : L0 === 'm' ? ' d-m' : '');
    const bar = `<div class="bar2"><button type="button" class="rb sq" data-act="prev" aria-label="Day before"${dt <= '1940-01-01' ? ' disabled' : ''}>${use('u-left')}</button>`
      + `<span class="rb pick">${use('u-cal')}<span class="dl">${longDate(dt)}</span><span class="ds">${shortDate(dt)}</span><input type="date" min="1940-01-01" max="${y}" value="${dt}" aria-label="Date"></span>`
      + `<button type="button" class="rb sq" data-act="next" aria-label="Day after"${dt >= y ? ' disabled' : ''}>${use('u-right')}</button><button type="button" class="rb solid" data-act="today">Back to today</button></div>`;
    const st = day && day.date === dt ? day.state : 'wait';
    if (st !== 'ok') {
      const msg = st === 'off' ? 'On a date needs the Internet.' : st === 'none' ? 'No weather for that date.' : st === 'fail' ? 'Can’t get the weather.' : 'Getting the weather…';
      return frame('l', 'off', o, bar + `<div class="offmsg" style="display:grid;place-content:center;text-align:center"><b>${msg}</b></div>`, cls, "grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:'bar' 'msg'");
    }
    const h = day, g = group(h.code), s = sunTimes(dt, pl().lat, pl().lon), tz = pl().tz;
    let cmp = '';
    if (today && fin(today.hi)) {
      const diff = Math.round(o.c ? (h.hi - today.hi) * 5 / 9 : h.hi - today.hi);
      cmp = `<b>${diff === 0 ? 'Same as today' : `${Math.abs(diff)}° ${diff > 0 ? 'warmer' : 'colder'}`}</b><span>Today’s high is ${T(today.hi, o)}.</span>`;
    }
    const parts = `<div class="hero"><div class="place">${esc(pl().name)}</div><div class="cond">${use(icon(h.code, 1))}${words(g, 1)}</div><div class="hilabel">High</div>
        <div class="temp">${num(h.hi, o)}<span class="deg">°</span>${U(o)}</div>
        <div class="hl">Low <b>${T(h.lo, o)}</b></div>
        <div class="more">Feels like ${T(h.feels, o)} · Wind ${speed(h.wind, o)}</div><div class="more">Snow ${amount(h.snow, o)} · Rain ${amount(h.rain, o)}</div><div class="foot">From Open-Meteo</div></div>
      ${h.hours ? `<section class="card chartc"><h3>${use('u-chart')}Through the day</h3>${chart(h.hours, o, dt)}</section>` : ''}
      <div class="side"><section class="card"><h3>${use('u-sun')}Sun</h3><div class="sunrow"><div><small>Sunrise</small><b>${s.rise ? clock(s.rise, tz) : '–'}</b></div><div><small>Sunset</small><b>${s.set ? clock(s.set, tz) : '–'}</b></div></div></section>
        ${cmp ? `<section class="card cmp"><h3>${use('u-thermo')}Compared with today</h3>${cmp}</section>` : ''}</div>`;
    // (Smaller windows: the chart after the rest, all of it scrolling under the bar.)
    const body = small ? bar + `<div class="scroll dscroll">${parts.replace(/(<section class="card chartc">[\s\S]*?<\/section>)([\s\S]*)$/, '$2$1')}</div>` : bar + parts;
    return frame('l', scene(g, 1), o, body, cls);
  }

  // Simple words, for K–2: one big picture, one sentence, and the clothes, for the day What to wear shows.
  function simple(d, o) {
    const L = layout(o.w, o.h, o.max), k = pickOf(d, o), w = k && d.wear[k];
    let code, day = true;
    if (k === 'today' && d.now) { code = d.now.code; day = d.now.day; }
    else { const want = k === 'today' ? d.plan.today : d.plan.next, x = (d.allDays || []).find(x => x.date === want); code = x ? x.code : d.days[0][1]; }
    const g = group(code), skyw = { clear: day ? 'sunny' : 'clear', mostly: day ? 'sunny' : 'clear', partly: 'cloudy', cloudy: 'cloudy', fog: 'foggy', drizzle: 'rainy', rain: 'rainy', snow: 'snowy', storm: 'stormy' }[g];
    const tier = w && !w.none ? (w.advice.match(/for (.+?) weather/) || [, 'cold'])[1] : null;
    const say = tier ? `${tier[0].toUpperCase() + tier.slice(1)} and ${skyw}.` : 'Its forecast isn’t out yet.';
    const chip = d.now && !d.offline ? `<span class="chip">${T(d.now.t, o)}</span>` : '';
    const body = `${chip}${use(icon(code, day), 'bigic')}<div class="say">${say}</div>${L === 's' || !tier ? '' : wearItems(w.items)}<div class="src">${d.now && d.now.station && !d.offline ? 'At ' + esc(d.now.station) + '. ' : ''}${credit(d)}</div>`;
    return frame(L === 's' ? 's' : 'm', sceneOf(d), o, body, ' V-simple').replace('class="in"', 'class="in simple"');
  }

  // ---- The window: drawn again only when what it shows changes. The moving sky carries on while the sky stays the same:
  // it stays in the page, and only the rest is drawn again. (Taken out of the page, even for a moment, it starts over.)
  let drawn = '', titleWas = null, menuWas = '';
  function draw() {
    if (!started) return;
    const info = Board21.context && Board21.context.window;
    const o = { w: innerWidth, h: innerHeight, max: !!(info && info.maximized), c: config.units === 'c', view, wear: wearPick || plan(Date.now()).show, still: config.still, simple: config.simple };
    let html;
    if (config.date) { const m = model(); html = renderDate(o, m.today); }
    else { const m = model(); if (!m.empty) m.allDays = !m.offline && fc ? fc.days : (saved && saved.place === pl().id ? saved.days : []); html = render(m, o); }
    if (html !== drawn) {
      const v = $('view'), a = document.activeElement, keyOf = e => e && e.closest && e.closest('#view') && ['data-go', 'data-wear', 'data-act'].map(k => e.getAttribute(k) || '').join('|');
      const focusKey = keyOf(a), t = document.createElement('template');
      t.innerHTML = html;
      const nw = t.content.firstElementChild, ow = v.firstElementChild, nf = nw && nw.querySelector(':scope > .fx'), of = ow && ow.querySelector(':scope > .fx');
      if (of && nf && of.dataset.sc === nf.dataset.sc && v.childNodes.length === 1 && t.content.childNodes.length === 1) {
        for (const { name } of [...ow.attributes]) if (!nw.hasAttribute(name)) ow.removeAttribute(name);
        for (const { name, value } of [...nw.attributes]) if (ow.getAttribute(name) !== value) ow.setAttribute(name, value);
        for (const k of [...ow.childNodes]) if (k !== of) k.remove();
        nf.remove(); ow.append(...nw.childNodes);
      } else v.replaceChildren(t.content);
      if (focusKey) { const e = [...v.querySelectorAll('[data-go], [data-wear], [data-act]')].find(e => keyOf(e) === focusKey); if (e) e.focus(); }
      drawn = html;
    }
    fit();
    const title = config.date ? shortDate(config.date) : '';
    if (title !== titleWas) { titleWas = title; Board21.window.setTitle(title); }
    setMenu();
  }
  // ---- Fitting what's drawn, measured: the mockup's sizes, closed up a step at a time while a part runs out of its card,
  // or Now out of its row (a short window, the board's corner strips, a long warning, wider letters). A card may run
  // 2 px into its own padding. Run on every draw, so a new size or text style is measured again.
  const STEPS = ['tight', 'tighter', 'tightest'];
  const wraps = e => { e.style.whiteSpace = 'nowrap'; const w = e.scrollWidth > e.clientWidth + 1; e.style.whiteSpace = ''; return w; };
  // Now, centered in its row, may run a little into the space around it, but never onto another part, under the board's
  // corner marks, or past half the window's margin.
  function spills(hero, inn) {
    const r = inn.getBoundingClientRect(), s = getComputedStyle(inn), near = [...inn.children].filter(e => e !== hero).map(e => e.getBoundingClientRect()).filter(q => q.height);
    const top = r.top + Math.max(parseFloat(s.paddingTop) / 2, corners.top), bottom = r.bottom - Math.max(parseFloat(s.paddingBottom) / 2, corners.low);
    return [...hero.children].some(k => { const q = k.getBoundingClientRect(); return q.height && (q.top < top - 1 || q.bottom > bottom + 1 || near.some(o => q.top < o.bottom - 1 && q.bottom > o.top + 1 && q.left < o.right - 1 && q.right > o.left + 1)); });
  }
  function fit() {
    const wx = $('view').querySelector('.wx'), inn = wx && wx.querySelector(':scope > .in');
    if (!inn) return;
    wx.classList.remove(...STEPS, 'brief', 'short-date', 'lift');
    const band = inn.querySelector(':scope > .band.warn, :scope > .band.watch');
    const over = () => inn.scrollHeight > inn.clientHeight + 1 || [...inn.querySelectorAll('.card')].some(c => c.scrollHeight > c.clientHeight + 2) || [...inn.querySelectorAll(':scope > .hero')].some(h => spills(h, inn));
    // A warning in Medium keeps to one line, without its time span if need be. Tapped, it shows the span.
    if (band && wx.classList.contains('L-m') && wraps(band)) wx.classList.add('brief');
    if (!wx.matches('.V-simple, .V-date, .L-s:not(.V-detail)')) for (const k of STEPS) { if (!over()) break; wx.classList.add(k); }
    if (band && over()) wx.classList.add('brief');
    // Simple words: the sentence and the clothes keep clear of the credit under them (lift).
    const cr = wx.classList.contains('V-simple') && inn.querySelector(':scope > .src'), above = cr && cr.previousElementSibling;
    if (above && above.getBoundingClientRect().bottom > cr.getBoundingClientRect().top - 1) wx.classList.add('lift');
    // On a date: the long date while the bar holds it on one line.
    const bar = wx.classList.contains('V-date') && inn.querySelector(':scope > .bar2');
    if (bar) { const k = [...bar.children], top = k[0].getBoundingClientRect().bottom; if (bar.scrollWidth > bar.clientWidth + 1 || k.some(e => e.getBoundingClientRect().top >= top - 1)) wx.classList.add('short-date'); }
    // Words drawn in a picture keep to 14 px: the compass's N, E, S, and W, scaled to it, or left out when it's small.
    // W and E move in as they grow, clear of the ticks beside them.
    for (const c of wx.querySelectorAll('svg.compass')) {
      const g = c.querySelector('.nesw'), k = c.getBoundingClientRect().width / 100;
      if (!g || !k) continue;
      const size = Math.max(13, 14 / k), x = 14.5 + 0.6 * size, [, e, , w] = g.querySelectorAll('text');
      g.setAttribute('font-size', size.toFixed(1)); g.style.display = 14 / k > 17 ? 'none' : '';
      w.setAttribute('x', x.toFixed(1)); e.setAttribute('x', (100 - x).toFixed(1));
    }
    // On a date's chart: 12 AM and 12 PM only, when 6 AM and 6 PM would touch them.
    for (const ch of wx.querySelectorAll('.chart')) {
      ch.classList.remove('few');
      const r = [...ch.querySelectorAll('.tk')].map(t => t.getBoundingClientRect());
      if (r.some((a, i) => i && a.left < r[i - 1].right + 8)) ch.classList.add('few');
    }
  }
  let drawSoon = 0;
  const redraw = () => { if (!drawSoon) drawSoon = requestAnimationFrame(() => { drawSoon = 0; fitCorners(); draw(); }); };

  // ---- The window menu: the Show list, On a date, Location, Simple words, No motion, units, and the credits.
  // On a date… has a calendar page with one day marked, and Location… a map pin.
  const DATE_ICON = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/><circle cx="12" cy="15.2" r="1.7" fill="currentColor" stroke="none"/></svg>';
  const PLACE_ICON = '<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
  function setMenu() {
    const items = [{ heading: true, label: 'Show' }, ...PARTS.map(([k, l]) => ({ id: 'show:' + k, label: l, checked: shown(k) })), { separator: true },
      { id: 'date', label: 'On a date…', icon: DATE_ICON }, { id: 'place', label: 'Location…', icon: PLACE_ICON }, { id: 'simple', label: 'Simple words', checked: config.simple }, { id: 'still', label: 'No motion', checked: config.still },
      { separator: true }, { heading: true, label: 'Units' }, { id: 'units:f', label: '°F and mph', checked: config.units === 'f' }, { id: 'units:c', label: '°C and km/h', checked: config.units === 'c' },
      { separator: true }, ...(kiosk ? [] : [{ id: 'open', label: 'Forecast from Open-Meteo', icon: EXT_ICON }]),
      ...(nws && nws.abroad ? [] : [{ id: 'credit-nws', label: 'Now from the National Weather Service', disabled: true }]),
      { id: 'credit-air', label: 'Air quality from Open-Meteo and Copernicus', disabled: true }];
    const key = JSON.stringify(items);
    if (key !== menuWas) { menuWas = key; Board21.menu.set(items); }
  }
  Board21.on('menu', id => {
    id = String(id);
    if (id.startsWith('show:') && PARTS.some(p => p[0] === id.slice(5))) {
      const k = id.slice(5), hide = shown(k) ? config.hide.concat(k) : config.hide.filter(x => x !== k);
      config.hide = PARTS.map(p => p[0]).filter(x => hide.includes(x)); saveConfig(); draw();
    } else if (id === 'date') setDate(config.date || yesterday());
    else if (id === 'place') openSheet();
    else if (id === 'simple') { config.simple = !config.simple; saveConfig(); draw(); }
    else if (id === 'still') { config.still = !config.still; saveConfig(); draw(); }
    else if (id === 'units:f' || id === 'units:c') { config.units = id.slice(6); saveConfig(); draw(); }
    else if (id === 'open' && !kiosk) window.open(SITE, '_blank', 'noopener,noreferrer');
  });

  // ---- Location: search for a town. Other towns named Wheeling never show. No location services.
  let searchTimer = 0, searchTurn = 0;
  function openSheet() {
    const s = $('sheet');
    s.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Location"><h4>Location</h4><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>`
      + '<input type="search" placeholder="Search for a town" aria-label="Search for a town" autocomplete="off" spellcheck="false"></label><ul class="res"></ul><p class="msg" role="status"></p></div>';
    s.hidden = false;
    const input = s.querySelector('input');
    input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(input.value), 300); });
    showResults([pl()], '');
    try { window.focus(); } catch (e) { /* the board keeps the focus */ }
    input.focus();
  }
  function closeSheet() { clearTimeout(searchTimer); searchTurn++; $('sheet').hidden = true; $('sheet').textContent = ''; }
  function showResults(list, msg) {
    const s = $('sheet'), ul = s.querySelector('.res');
    if (!ul) return;
    ul.textContent = '';
    for (const p of list) {
      const li = document.createElement('li'), box = document.createElement('div'), b = document.createElement('b'), small = document.createElement('small');
      li.tabIndex = 0; b.textContent = p.name; small.textContent = [p.region, p.country].filter(Boolean).join(', ');
      box.append(b, small); li.append(box);
      if (p.id === pl().id) { const ok = document.createElement('span'); ok.className = 'ok'; ok.textContent = '✓'; li.append(ok); li.setAttribute('aria-current', 'true'); }
      li.addEventListener('click', () => choose(p));
      li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(p); } });
      ul.append(li);
    }
    s.querySelector('.msg').textContent = msg;
  }
  function search(text) {
    const t = String(text || '').trim().slice(0, 80), turn = ++searchTurn;
    if (t.length < 2) return showResults([pl()], '');
    if (!online()) return showResults([], 'Search needs the Internet.');
    get(`${HOST.search}/v1/search?` + q({ name: t, count: 10, language: 'en', format: 'json' })).then(j => {
      if (turn !== searchTurn) return;
      const wheeling = /^wheeling/i.test(t);
      const list = arr(j, 'results').map(r => r && readPlace({ id: r.id, name: r.name, region: r.admin1 || '', country: r.country || '', lat: r.latitude, lon: r.longitude, tz: r.timezone })).filter(Boolean)
        .filter(p => (wheeling ? p.id === WHEELING.id : !(/^wheeling$/i.test(p.name) && p.id !== WHEELING.id)));
      showResults(list, list.length ? '' : 'No towns found.');
    }).catch(e => { if (turn === searchTurn) showResults([], e && e.status ? 'No towns found.' : 'Search needs the Internet.'); });
  }
  function choose(p) {
    closeSheet();
    if (p.id === pl().id) return;
    config.place = p; config.date = null; saveConfig();
    newPlace(); draw();
  }
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

  // ---- Taps, keys, and the date picker.
  $('view').addEventListener('click', e => {
    const t = e.target.closest('[data-go], [data-wear], [data-act]');
    if (!t) return;
    if (t.dataset.wear) { wearPick = t.dataset.wear; draw(); }
    else if (t.dataset.go) { view = t.dataset.go; draw(); }
    else if (t.dataset.act === 'today') setDate(null);
    else if (t.dataset.act === 'prev' || t.dataset.act === 'next') { const d = addDays(config.date, t.dataset.act === 'prev' ? -1 : 1); if (d >= '1940-01-01' && d <= yesterday()) setDate(d); }
  });
  $('view').addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('[data-go]:not(button), [data-wear]');
    if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
  });
  $('view').addEventListener('change', e => {
    if (!e.target.matches('input[type="date"]')) return;
    const v = e.target.value;
    if (realDay(v) && v >= '1940-01-01' && v <= yesterday()) setDate(v);
  });
  $('view').addEventListener('click', e => { const i = e.target.closest('input[type="date"]'); if (i && i.showPicker) try { i.showPicker(); } catch (err) { /* the browser opens it itself */ } });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('sheet').hidden) { e.preventDefault(); closeSheet(); } else if (view !== 'main' && !config.date) { e.preventDefault(); view = 'main'; draw(); }
  });

  // ---- The board's own buttons and padlocks over a window that fills it: the parts keep clear of them.
  function fitCorners() {
    const w = Board21.context && Board21.context.window, c = w && w.maximized && w.corners;
    const px = v => Math.min(2000, Math.max(0, Number(v) || 0));
    const low = c && (px(c.left) || px(c.right)) ? px(c.height) : 0;
    const t = c && c.top, top = t && (px(t.left) || px(t.right)) ? px(t.height) : 0;
    document.documentElement.style.setProperty('--low', low + 'px'); document.documentElement.style.setProperty('--top', top + 'px');
    corners.low = low; corners.top = top;
  }
  const corners = { low: 0, top: 0 };

  // ---- Changed in another tab or on another device, or by an import. Checked, taken, drawn. Never saved from here.
  Board21.on('config', c => {
    const was = config.place;
    config = readConfig(c);
    const p = config.place;
    if (p.id !== was.id || p.lat !== was.lat || p.lon !== was.lon || p.tz !== was.tz) newPlace();
    if (config.date) askDay(); else day = null;
    draw();
  });
  Board21.on('data', d => { saved = readSaved(d); draw(); });
  Board21.on('resize', redraw);
  addEventListener('resize', redraw);
  addEventListener('online', () => { stale(true); if (config.date) { day = null; askDay(); } draw(); });
  addEventListener('offline', () => { if (config.date) { day = null; askDay(); } draw(); });
  document.addEventListener('visibilitychange', () => { if (visible()) { stale(false); draw(); } });

  // The widget's own rules, for its tests: which day What to wear shows, a day's name, school hours, the advice.
  self.B21Weather = { plan: ms => plan(ms), label, hours: schoolHours, advise, refresh: () => stale(true) };

  async function start() {
    const ctx = await Board21.ready();
    kiosk = !!ctx.kiosk;
    config = readConfig(ctx.config);
    saved = readSaved(ctx.data);
    started = true;
    const p = plan(Date.now()); planWas = p.day + p.show;
    fitCorners();
    if (config.date) askDay();
    draw();
    stale(true);
    setInterval(tick, 20000);
  }
  start();
</script>
</body>
</html>

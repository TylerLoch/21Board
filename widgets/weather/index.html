<style>

@property --inset { syntax: "<length>"; inherits: true; initial-value: 0px; }
/* ===== The widget's own look (the approved mockup's): each window draws its sky from the weather. No text under 14 px:
   every size smaller than the base is floored there, as max(14px, …). ===== */
.wx { --u: 1; --fs: 16px; position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff; isolation: isolate;
  font: 400 max(14px, calc(var(--fs) * var(--u))) / 1.25 var(--b21-font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  background: linear-gradient(180deg, var(--s1), var(--s2)); text-shadow: 0 1px 3px rgba(0,0,0,.16);
  --card: rgba(6,26,58,.2); --edge: rgba(255,255,255,.15); --dim: rgba(255,255,255,.9); --track: rgba(0,0,0,.2); --inset: 1.15em; }
.wx * { box-sizing: border-box; }

.sc-clear-d  { --s1: #1462c4; --s2: #3a85cc; }
.sc-partly-d { --s1: #2869b3; --s2: #5a8cc0; }
.sc-cloudy-d { --s1: #4c5c70; --s2: #6a7a8e; --card: rgba(18,28,44,.2); }
.sc-fog-d    { --s1: #55606c; --s2: #6c7682; --card: rgba(18,28,44,.2); }
.sc-rain-d   { --s1: #3b4a5e; --s2: #5f7085; --card: rgba(8,18,34,.22); }
.sc-snow-d   { --s1: #4c6080; --s2: #6a7d97; --card: rgba(14,30,56,.22); }
.sc-storm    { --s1: #1d2033; --s2: #44445e; --card: rgba(255,255,255,.08); }
.sc-clear-n  { --s1: #071129; --s2: #1b3060; --card: rgba(255,255,255,.08); }
.sc-partly-n, .sc-cloudy-n, .sc-fog-n { --s1: #131a29; --s2: #333f54; --card: rgba(255,255,255,.08); }
.sc-rain-n   { --s1: #10161f; --s2: #2a3444; --card: rgba(255,255,255,.07); }
.sc-snow-n   { --s1: #1d2840; --s2: #42506b; --card: rgba(255,255,255,.08); }

.wx .stars { inset: 0 0 30% 0; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='white'><circle cx='9' cy='14' r='.9' opacity='.8'/><circle cx='47' cy='7' r='.6' opacity='.6'/><circle cx='83' cy='22' r='1.1' opacity='.9'/><circle cx='112' cy='9' r='.6' opacity='.5'/><circle cx='28' cy='48' r='.7' opacity='.6'/><circle cx='66' cy='57' r='.9' opacity='.8'/><circle cx='101' cy='70' r='.6' opacity='.5'/><circle cx='14' cy='92' r='1' opacity='.7'/><circle cx='54' cy='101' r='.6' opacity='.5'/><circle cx='89' cy='108' r='.8' opacity='.7'/></g></svg>") 0 0 / 7.5em 7.5em;
  -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent); }
.wx .cl { width: 34em; height: 11em; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,var(--a,.22)), rgba(255,255,255,0)); animation: wx-drift 80s linear infinite alternate; }
.wx .rain-a, .wx .rain-b, .wx .snow-a, .wx .snow-b { left: 0; right: 0; bottom: 0; will-change: transform; }
/* Rain: each drop fades in from the top, faintest where it starts */
.wx .rain-a { top: -7.5em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='120'><defs><linearGradient id='d' x2='0' y2='1'><stop offset='0' stop-color='white' stop-opacity='0'/><stop offset='1' stop-color='white' stop-opacity='.24'/></linearGradient></defs><g fill='url(%23d)'><rect x='6' y='4' width='1.3' height='18' rx='.65'/><rect x='30' y='36' width='1.3' height='18' rx='.65'/><rect x='18' y='68' width='1.3' height='18' rx='.65'/><rect x='41' y='94' width='1.3' height='18' rx='.65'/></g></svg>") 0 0 / 3em 7.5em; animation: wx-fall75 1.5s linear infinite; }
.wx .rain-b { top: -10em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='160'><defs><linearGradient id='d' x2='0' y2='1'><stop offset='0' stop-color='white' stop-opacity='0'/><stop offset='1' stop-color='white' stop-opacity='.16'/></linearGradient></defs><g fill='url(%23d)'><rect x='14' y='10' width='1.7' height='26' rx='.85'/><rect x='46' y='64' width='1.7' height='26' rx='.85'/><rect x='30' y='116' width='1.7' height='26' rx='.85'/></g></svg>") 0 0 / 4em 10em; animation: wx-fall10 1.25s linear infinite; }
.wx .sway { inset: 0 -3em; }
.wx .sw-a { animation: wx-sway-a 5.3s ease-in-out infinite alternate; }
.wx .sw-b { animation: wx-sway-b 8.7s ease-in-out -3s infinite alternate; }
.wx .snow-a { top: -11em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='176' height='176'><defs><radialGradient id='f'><stop offset='0' stop-color='white'/><stop offset='.55' stop-color='white' stop-opacity='.8'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><g fill='url(%23f)'><circle cx='120' cy='111' r='2.9' opacity='0.47'/><circle cx='137' cy='140' r='3.0' opacity='0.48'/><circle cx='44' cy='5' r='3.6' opacity='0.44'/><circle cx='16' cy='137' r='3.8' opacity='0.41'/><circle cx='11' cy='172' r='3.1' opacity='0.53'/><circle cx='107' cy='11' r='4.4' opacity='0.43'/><circle cx='24' cy='163' r='3.6' opacity='0.44'/><circle cx='141' cy='25' r='2.9' opacity='0.58'/><circle cx='97' cy='62' r='3.5' opacity='0.47'/><circle cx='10' cy='149' r='3.0' opacity='0.41'/><circle cx='40' cy='166' r='4.2' opacity='0.57'/></g></svg>") 0 0 / 11em 11em; animation: wx-fall11 12s linear infinite; }
.wx .snow-b { top: -15em; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><defs><radialGradient id='f'><stop offset='0' stop-color='white'/><stop offset='.55' stop-color='white' stop-opacity='.8'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><g fill='url(%23f)'><circle cx='181' cy='139' r='2.5' opacity='0.40'/><circle cx='114' cy='197' r='1.7' opacity='0.29'/><circle cx='210' cy='99' r='2.7' opacity='0.32'/><circle cx='93' cy='236' r='2.1' opacity='0.33'/><circle cx='25' cy='171' r='1.6' opacity='0.45'/><circle cx='118' cy='132' r='2.2' opacity='0.40'/><circle cx='146' cy='133' r='1.9' opacity='0.37'/><circle cx='43' cy='84' r='1.8' opacity='0.44'/><circle cx='143' cy='75' r='2.0' opacity='0.27'/><circle cx='194' cy='185' r='1.7' opacity='0.32'/><circle cx='161' cy='213' r='2.4' opacity='0.44'/><circle cx='234' cy='228' r='2.1' opacity='0.37'/><circle cx='118' cy='91' r='2.7' opacity='0.30'/><circle cx='41' cy='20' r='2.7' opacity='0.41'/><circle cx='116' cy='199' r='2.5' opacity='0.26'/><circle cx='71' cy='101' r='1.9' opacity='0.28'/><circle cx='82' cy='214' r='1.7' opacity='0.45'/><circle cx='115' cy='62' r='2.5' opacity='0.44'/></g></svg>") 0 0 / 15em 15em; animation: wx-fall15 26s linear infinite; }
.wx .flash { inset: 0; background: #fff; opacity: 0; animation: wx-flash 9s infinite; }
.wx .fog-a, .wx .fog-b { left: -40%; right: -40%; height: 9em; border-radius: 50%; opacity: .5; background: radial-gradient(closest-side, rgba(255,255,255,.22), rgba(255,255,255,0)); animation: wx-drift 50s ease-in-out infinite alternate; }
@keyframes wx-drift { to { transform: translateX(7em); } }
@keyframes wx-fall11 { to { transform: translateY(11em); } }
@keyframes wx-fall15 { to { transform: translateY(15em); } }
@keyframes wx-sway-a { from { transform: translateX(-1.4em); } to { transform: translateX(1.4em); } }
@keyframes wx-sway-b { from { transform: translateX(1em); } to { transform: translateX(-1em); } }
@keyframes wx-fall75 { to { transform: translateY(7.5em); } }
@keyframes wx-fall10 { to { transform: translateY(10em); } }
@keyframes wx-flash { 0%, 90%, 100% { opacity: 0; } 91% { opacity: .3; } 92% { opacity: 0; } 93.5% { opacity: .18; } 95% { opacity: 0; } }
.wx.still .fx i { animation: none; }
@media (prefers-reduced-motion: reduce) { .wx .fx i { animation: none; } }

.wx .in { position: relative; height: 100%; display: grid; gap: .75em; padding: 1em; min-height: 0; }
.wx .hero { padding-inline: var(--inset); min-width: 0; }
.wx .place { font-weight: 600; font-size: 1.05em; overflow-wrap: anywhere; }
.wx .temp { white-space: nowrap; font-weight: 700; line-height: .92; letter-spacing: -.045em; font-size: 4.4em; font-variant-numeric: lining-nums; }
.wx .temp .deg { letter-spacing: -.08em; }
/* The temperature in bold. The unit letter: as big as the digits, on their baseline, dim, regular */
.wx .temp .unit { color: var(--dim); opacity: .8; letter-spacing: 0; font-weight: 400; }
.wx .src { font-size: max(14px, .68em); color: var(--dim); font-weight: 600; letter-spacing: .01em; }
.wx .cond { display: flex; align-items: center; gap: .35em; font-weight: 600; }
.wx .hl, .wx .more { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
/* Now: the temperature's block (left) and the sky's (right), one over the other, or side by side (side, stk). Lines
   that may wrap take no width of their own (they wrap at Now's width), so the key lines set Now's shape. */
.wx:not(.L-m) .hero > .left, .wx:not(.L-m) .hero > .right { display: grid; gap: inherit; min-width: 0; align-content: center; justify-self: stretch; }
.wx:is(.laid, .probe) .hero :is(.src, .foot, .place, .more, .hilabel) { width: 0; min-width: 100%; }
.wx:is(.laid, .probe) .hero :is(.src, .foot, .more) { width: auto; min-width: 0; white-space: nowrap; }
/* Filling the window: Now's block lines up with the cards and the band in its column, or sits in the middle of a cell
   it has to itself (mid). The sun's arc sits over its times in the middle of its card. */
.wx.laid .hero.mid { justify-content: center; }
.wx.laid .sun .arc { flex: 0 1 auto; height: auto; min-height: 2.6em; aspect-ratio: 5 / 2; margin-top: auto; }
.wx.laid .sun > :last-child { margin-bottom: auto; }
/* (A tall, narrow sun card: sunrise over sunset, so the times can grow.) */
.wx.laid .sun.col .sunrow { flex-direction: column; gap: .4em; }
.wx.laid .sun.col .sunrow div:last-child { text-align: left; }
.wx.laid .sun.col .daylight { text-wrap: balance; }
/* (A wide, short sun card: sunrise, the arc, and sunset in one row, so the times grow with the card's height. The arc
   takes the room between them: --arch.) */
.wx.laid .sun.row { display: grid; grid-template-columns: max-content minmax(5em, 1fr) max-content; grid-template-rows: auto minmax(min-content, 1fr) auto auto; column-gap: .8em; }
.wx.laid .sun.row > :not(.arc, .sunrow) { grid-column: 1 / -1; }
.wx.laid .sun.row .sunrow { display: contents; }
.wx.laid .sun.row .sunrow > div { grid-area: 2 / 1; align-self: center; }
.wx.laid .sun.row .sunrow > div:last-child { grid-area: 2 / 3; }
.wx.laid .sun.row .arc { grid-area: 2 / 2; height: var(--arch, 2em); width: auto; max-width: 100%; min-height: 0; margin: 0; justify-self: center; align-self: center; }
.wx.laid .sun.row .daylight { text-align: center; }
.wx.laid .sun.row .moonline { justify-content: center; }
.wx:is(.laid, .probe) .hero .temp { min-width: var(--tw, 0); }
.wx:is(.laid, .probe) .hero .cond { min-width: var(--cw, 0); }
.wx:not(.L-m) .hero.side { grid-template-columns: max-content max-content; justify-content: center; align-items: center; column-gap: 1.3em; }
.wx:not(.L-m) .hero.side > .right { padding-top: .2em; }
.wx.laid:not(.L-s) .hero.side:not(.mid) { justify-content: start; }
/* (The sky's lines grow into the room beside the temperature, to its height: --sky.) */
.wx.laid:not(.L-s) .hero.side > .right { font-size: calc(var(--sky, 1) * 1em); }
/* The sky's words keep to their side of the room the longest sky takes: right in Medium, in the middle in Small */
.L-m .hero:not(.stk) .right .cond { justify-content: flex-end; }
.L-s .hero:not(.side) .cond { justify-content: center; }
.L-s .hero.side { text-align: left; }
.L-s .hero.side > .left, .L-s .hero.side > .right { justify-items: start; }
.L-m .hero.stk { grid-template-columns: minmax(0, 1fr); align-items: start; align-content: center; }
.L-m.laid .hero.stk { grid-template-columns: minmax(0, max-content); }
.L-m .hero.stk .right { justify-items: start; text-align: left; grid-template-columns: auto auto; justify-content: start; align-items: center; column-gap: .6em; }
.L-m .hero.stk .right .bigic { grid-row: span 2; margin-bottom: 0; }
.wx .hl b { color: #fff; font-weight: 600; }
.wx .more { display: flex; align-items: center; gap: .35em; flex-wrap: wrap; }
.wx:is(.laid, .probe) .more { flex-wrap: nowrap; }
.wx .aqd { width: .62em; height: .62em; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 .12em rgba(0,0,0,.18); }
.wx .foot { font-size: max(14px, .66em); color: var(--dim); font-weight: 500; }

/* Alerts and offline: a band across the top, tapped for more */
.wx .band { display: flex; align-items: center; gap: .45em; border-radius: .8em; padding: .45em .75em .45em .6em; font-weight: 700; font-size: max(14px, .82em); line-height: 1.2; text-shadow: none; min-width: 0; }
.wx .band svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.wx .band span { font-weight: 500; }
.wx .band .go { margin-left: auto; opacity: .7; }
.wx .band { padding-left: calc(var(--inset) + 1px); }
.wx .band.warn { background: #ff8a3d; color: #2a1000; }
.wx .band.watch { background: #ffd54d; color: #2a2100; }
.wx .band.off { background: rgba(255,255,255,.9); color: #1f2937; }

.wx .card { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 1em; padding: .8em var(--inset) .9em; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.wx h3 { margin: 0 0 .55em; font-size: max(14px, .74em); font-weight: 600; color: var(--dim); display: flex; align-items: center; gap: .4em; padding-bottom: .55em; border-bottom: 1px solid var(--edge); letter-spacing: .01em; flex: none; white-space: nowrap; }
.wx h3 svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wx h3 .when { margin-left: auto; color: #fff; font-weight: 700; }
.wx h3 .chev { margin-left: auto; width: 1em; height: 1em; opacity: .8; }
.wx h3 .when + .chev { margin-left: .2em; }
.wx h3 .cr { margin-left: auto; font-weight: 500; font-size: max(14px, .9em); }
.wx h3 .cr + .chev { margin-left: .35em; }

/* Hours */
.wx .sum { font-size: max(14px, .9em); font-weight: 500; margin: -.1em 0 .6em; }
.wx .card > .sum:first-child { margin-top: 0; }
.wx .hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); flex: 1; align-items: center; }
.wx .hours.two { grid-auto-flow: row; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); row-gap: 1.6em; align-content: center; }
.wx .hr { display: grid; justify-items: center; gap: .3em; text-align: center; grid-template-rows: auto auto .7em auto; }
.wx .hr .pop { grid-row: 3; }
/* (Two rows: each hour's lines close together, and the rows well apart, so a temperature reads with its own hour.) */
.wx .hours.two .hr { row-gap: .15em; }
.wx .hours.two:not(.pops) .hr { grid-template-rows: auto auto 0 auto; }
.wx .hr .v { grid-row: 4; }
/* (Medium: 6 hours, in one row or two. A tall window may show 12 in two rows: all.) */
.L-m:not(.V-detail) .hours:not(.all) > .hr:nth-child(n+7) { display: none; }
.L-m .hours.two.all { grid-template-columns: repeat(var(--cols, 6), minmax(max-content, 1fr)); }
.wx .hr .t { font-size: max(14px, .8em); font-weight: 600; color: var(--dim); white-space: nowrap; }
.wx .hr:first-child .t { color: #fff; }
.wx .hr .hi { width: 1.9em; height: 1.9em; }
.wx .hr .v { font-size: 1.1em; font-weight: 600; }
.wx .hr .v.sm { font-size: max(14px, .8em); }
.wx .pop { font-size: max(14px, .66em); font-weight: 800; color: #c4ecff; line-height: 1; }

/* Seven days */
.wx .days { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-rows: minmax(0, 1fr); flex: 1; }
.wx .days li { display: grid; grid-template-columns: 3.4em 2.2em max(2.5em, var(--dw, 0em)) minmax(var(--barmin, 2em), 1fr) max(2.5em, var(--dw, 0em)); align-items: center; gap: .55em; border-top: 1px solid var(--edge); min-height: 2.1em; }
.wx .days li:first-child { border-top: 0; }
.wx .days .d { font-weight: 600; }
.wx .days .di { display: grid; justify-items: center; gap: .1em; }
.wx .days .di svg { width: 1.6em; height: 1.6em; }
.wx .days .lo { color: var(--dim); text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.wx .days .hi { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
/* (Filling the window, the range bar keeps at least a third of its row: the words give way first.) */
.wx.laid .days li { --barmin: max(3.5em, 35%); }
.wx .bar { position: relative; height: .36em; border-radius: 1em; background: var(--track); }
.wx .bar i { position: absolute; top: 0; bottom: 0; border-radius: 1em; }
.wx .bar b { position: absolute; top: 50%; width: .62em; height: .62em; margin: -.31em 0 0 -.31em; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .14em rgba(0,0,0,.28); }

/* What to wear */
.wx .items { display: flex; gap: .75em; flex-wrap: wrap; align-items: flex-start; }
.wx .items figure { margin: 0; display: grid; justify-items: center; gap: .3em; }
.wx .dot { width: 2.7em; height: 2.7em; border-radius: 50%; background: rgba(255,255,255,.17); display: grid; place-items: center; }
.wx .dot svg { width: 1.65em; height: 1.65em; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.wx figcaption { font-size: max(14px, .74em); font-weight: 600; color: #fff; }
.wx .advice { font-weight: 650; font-size: 1.12em; line-height: 1.2; margin: 0 0 .55em; text-wrap: balance; }
.wx :is(.advice, .says) .nw { white-space: nowrap; }
.wx .eg { font-size: max(14px, .7em); font-weight: 600; color: var(--dim); margin: 0 0 .35em; }
.wx .note { font-size: max(14px, .85em); color: var(--dim); font-weight: 500; margin: .6em 0 0; text-wrap: pretty; }
.wx .wear .body { flex: 1; display: grid; align-content: center; min-height: 0; }
.wx:is(.laid, .probe) .wear :is(.advice, .note) { width: 0; min-width: 100%; }
.wx.probe .wear .body { min-width: 11em; }
.wx .wear.side .body { grid-template-columns: minmax(0, max-content) max-content; grid-template-areas: "a e" "n i" "t i"; column-gap: 1.6em; justify-content: start; }
.wx .wear.side .advice { grid-area: a; }
.wx .wear.side .eg { grid-area: e; align-self: end; }
.wx .wear.side .items { grid-area: i; align-self: start; }
.wx .wear.side .note { grid-area: n; }
.wx .wear.side .tg { grid-area: t; align-self: start; }
.wx:is(.laid, .probe) .wear.side :is(.advice, .note) { width: auto; min-width: 0; }
/* (In a card wider than they need, the clothes sit in the middle of the room the words leave.) */
.wx.laid .wear.side .body { grid-template-columns: minmax(0, max-content) minmax(max-content, 1fr); }

.wx.V-date .dscroll .side { grid-template-columns: minmax(0, 1fr); gap: .5em; }
.wx.V-date .dscroll .chartc { grid-column: 1 / -1; min-height: 14.7em; }
.wx.V-date .dscroll .temp { font-size: 3.4em; }
.wx.V-date .dscroll .cmp b { font-size: 1.3em; }
.wx.V-date.d-m .bar2, .wx.V-date.d-s .bar2 { flex-wrap: wrap; row-gap: .4em; }
.wx.V-date .dscroll h3 { white-space: normal; }

/* Offline */
.wx .hilabel { font-size: max(14px, .7em); font-weight: 700; color: var(--dim); letter-spacing: .02em; }
.wx .in.offmsg { grid-template-rows: auto auto; align-content: center; place-content: center; justify-items: center; text-align: center; gap: .4em; }
.wx .offmsg b { font-size: 1.15em; }
.wx .offmsg span { color: var(--dim); }

/* Simple words */
.wx .simple { place-content: center; justify-items: center; text-align: center; gap: .55em; grid-template-rows: repeat(4, auto); }
.wx .simple .bigic { width: 5.6em; height: 5.6em; }
.wx .simple .say { font-size: 2.1em; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.wx .simple .items { justify-content: center; }
.wx .simple .src { position: absolute; bottom: .9em; left: 0; right: 0; }
/* (Its words and picture grow with the window; the credit stays the window's size, centered, clear of the corners.) */
.wx .simple > .src { font-size: max(14px, calc(var(--fs) * var(--u) * .68)); text-align: center; bottom: calc(max(.9em, var(--low, 0px) + 4px)); }
.wx.filled .simple > .chip { top: max(.9em, var(--top, 0px) + 4px); }
.V-simple.lift .simple { padding-bottom: 3.4em; }
.V-simple.lift .simple .bigic { width: 4em; height: 4em; }
.wx .simple.side { grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 1em; justify-items: start; text-align: left; align-items: center; }
.wx .simple.side .bigic { grid-row: span 2; }
.wx .simple.side .items { justify-content: start; }
.wx .chip { position: absolute; top: .9em; right: 1em; font-weight: 700; background: rgba(255,255,255,.2); border-radius: 1em; padding: .2em .65em; }

/* Short for its size: text stays at 14 px or more, so the spacing closes up instead, a step at a time (tight, tighter,
   tightest), until every part fits. fit() measures each step as drawn. A band in Medium keeps to one line (brief). */
.wx.brief .band > span { display: none; }
/* (The cards' sides close up too: part way at tight, then to .9em.) */
.wx.tight { --inset: 1em; }
.wx:is(.tighter, .tightest) { --inset: .9em; }
.L-m.tight .in { padding: .7em .8em; gap: .45em; }
.L-m.tight .temp { font-size: 3.1em; }
.L-m.tight .hero > .left, .L-m.tight .right { gap: 0; }
.L-m.tight .card { padding-top: .5em; padding-bottom: .55em; }
.L-m.tight h3 { margin-bottom: .2em; padding-bottom: .25em; }
.L-m.tight .week .col { gap: .05em; }
.L-m.tight .week svg { width: 1.6em; height: 1.6em; }
.L-m.tight .wl { padding: .35em .65em; }
.L-m.tight .wl .tg b { padding: .3em .65em; }
.L-m.tight.has-band .in { gap: .4em; }
.L-m.tight.has-band .band { padding-top: .3em; padding-bottom: .3em; }
.L-m.tighter .right .bigic { width: 2em; height: 2em; }
.L-m.tighter .week svg { width: 1.3em; height: 1.3em; }
.L-m.tighter .wl .dot { width: 1.8em; height: 1.8em; }

.L-m.tighter.has-band .wl { padding: .3em .65em; }
.L-m.tighter.has-band .wl .tg b { padding: .2em .6em; }
.L-m.tightest .week svg { width: 1.1em; height: 1.1em; }
.L-m.tightest .hr { gap: 0; }
.L-m.tightest .hr .hi { width: 1.3em; height: 1.3em; }
.L-m.tightest .hours:not(.pops) .hr { grid-template-rows: auto auto 0 auto; }
.L-m.tightest .temp { font-size: 2.7em; }
.L-m.tightest .wl .dot { width: 1.6em; height: 1.6em; }
.L-l.tight .in { padding: .8em; gap: .6em; }
.L-l.tight .temp { font-size: 4.2em; }
.L-l.tight.has-band .temp { font-size: 3.4em; }
.L-l.tight .hero { gap: .15em; }
.L-l.tight .card { padding-top: .55em; padding-bottom: .6em; }
.L-l.tight h3 { margin-bottom: .3em; padding-bottom: .3em; }
.L-l.tight .days li { min-height: 0; gap: .4em; }
.L-l.tight .days .di svg { width: 1.15em; height: 1.15em; }
.L-l.tight .wear .dot { width: 2.1em; height: 2.1em; }
.L-l.tight .wear .dot svg { width: 1.3em; height: 1.3em; }
.L-l.tight .advice { margin-bottom: .3em; }
.L-l.tight .eg { margin-bottom: .2em; }
.L-l.tight .note { margin-top: .3em; }
.L-l.tight .wear .tg { margin-top: .4em; }
.L-l.tight .arc { max-height: 3em; }
.L-l.tight .moonline { margin-top: .35em; padding-top: .35em; }
.L-l.tight .daylight { margin-top: .15em; }
.L-l.tighter .in { padding: .6em .7em; gap: .45em; }
.L-l.tighter .temp { font-size: 3.6em; }
.L-l.tighter.has-band .temp { font-size: 3em; }
.L-l.tighter .card { padding-top: .45em; padding-bottom: .5em; }
.L-l.tighter h3 { margin-bottom: .2em; padding-bottom: .25em; }
.L-l.tighter .days li { gap: .3em; }
.L-l.tighter .days .di svg { width: 1em; height: 1em; }
.L-l.tighter .wear .dot { width: 1.8em; height: 1.8em; }
.L-l.tighter .arc { max-height: 2.2em; }
.L-l.tighter .eg { display: none; }
.V-detail.tight .in { padding: .7em .9em; gap: .5em; }
.V-detail.tight .rb { padding: .3em .8em .3em .5em; }
.V-detail.tight .dnow { gap: .45em; }
.V-detail.tight .dnow .hero { gap: 0 .8em; }
.V-detail.tight .dnow .cards { gap: .45em; }
.V-detail.tight .dnow .card { padding-top: .45em; padding-bottom: .5em; }
.V-detail.tight .dnow .card h3 { margin-bottom: .2em; padding-bottom: .25em; }
.V-detail.tight .windbody { gap: .6em; }
.V-detail.tight .dnow .big { font-size: 1.6em; }
.V-detail.tight .days li { gap: .4em; }
/* (The Now view closes its spacing first, then draws a smaller temperature and compass, and at its smallest puts its
   cards side by side, the wind without its compass.) */
.V-detail.tighter .dnow .temp { font-size: 2.9em; }
.V-detail.tighter .dnow .cards { grid-template-columns: 1fr 1.2fr; }
.V-detail.tighter .compass { width: 4.4em; height: 4.4em; }
.V-detail.tightest .dnow .cards { grid-template-columns: none; grid-auto-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-auto-flow: column; }
.V-detail.tightest .dnow .windc { grid-row: auto; }
.V-detail.tightest .dnow .compass { display: none; }
.V-detail.tightest .dnow .windbody { grid-template-columns: minmax(0, 1fr); }
/* (What to wear's view closes its spacing, then draws smaller clothes and hours.) */
.V-detail.tight .dwear { gap: .5em; }
.V-detail.tight .wtop { gap: .35em; }
.V-detail.tight .dwear.beside .wtop { column-gap: 1.4em; }
.V-detail.tighter .dwear .dot { width: 2.8em; height: 2.8em; }
.V-detail.tighter .dwear .dot svg { width: 1.7em; height: 1.7em; }
.V-detail.tighter .wh { padding-block: .1em .15em; gap: 0; }
.V-detail.tighter .wh.why { padding-inline: .25em; }
.V-detail.tightest .dwear .dot { width: 2.3em; height: 2.3em; }
.V-detail.tightest .dwear .dot svg { width: 1.4em; height: 1.4em; }
.V-detail.tightest .dwear .items { gap: .3em .8em; }

.V-detail.tightest .whrs { padding-block: .45em .5em; }

.L-xl.tight .hero { gap: .1em; }

.L-xl.tight .big { font-size: 1.6em; }
.L-xl.tight .stack { gap: .1em; }
.L-xl.tight .aqscale { margin: .4em 0 .1em; }
.L-xl.tight .arc { max-height: 3em; }

.L-xl.tight .daylight { margin-top: .1em; }

.L-xl.tight .wear .dot svg { width: 1.6em; height: 1.6em; }

.L-xl.tight .wear .note { font-size: max(14px, .9em); margin-top: .35em; }
.L-xl.tight .wear .tg { margin-top: .45em; }
.L-xl.tighter .temp { font-size: 3.8em; }
.L-xl.tighter .in { gap: .5em; }

.L-xl.tighter .days .di svg { width: 1em; height: 1em; }
.L-xl.tighter .arc { max-height: 2.2em; }

/* Fill the board: clear of the board's buttons in its corners, and of its padlocks while locked */
.wx.filled .in { padding-top: max(1em, var(--top, 0px) + 4px); padding-bottom: max(1em, var(--low, 0px) + 4px); }
.wx.filled.L-l .in { padding-top: max(1.1em, var(--top, 0px) + 4px); padding-bottom: max(1.1em, var(--low, 0px) + 4px); }
.wx.filled.L-xl .in { padding-top: max(1.3em, var(--top, 0px) + 4px); padding-bottom: max(1.3em, var(--low, 0px) + 4px); }

/* Filling the window (fill()): each part draws at its own size, set on it in px. The wind's compass and the moon fill
   the room their words leave (--pic), beside them or over them (.col). */
.wx .windc .compass, .wx .moonbody > svg { width: var(--pic, 5.4em); height: var(--pic, 5.4em); }
.wx .windc .compass { width: var(--pic, 6.2em); height: var(--pic, 6.2em); }
.L-xl .windc .compass { width: var(--pic, 5.6em); height: var(--pic, 5.6em); }
.wx.laid :is(.windbody, .moonbody):not(.col) { grid-template-columns: auto auto; justify-content: center; }
.wx .windbody.col, .wx .moonbody.col { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; align-content: center; gap: .6em; }
.wx .windbody.col .stack, .wx .moonbody.col .stack { justify-items: center; }
/* (Sized to its room, the moon fills its picture, edge to edge.) */
.wx:is(.laid, .V-detail) .moonbody > svg > * { transform: scale(1.5); transform-origin: 16px 16px; }
/* (Sun and moon: the moon's words never break mid-phrase. Its card takes the width they need; the sun's, the rest.) */
.wx.V-detail .moonbody .stack > * { white-space: nowrap; }
.wx.V-detail .cards > .moon { min-width: max-content; }
/* Measuring: each part on its own at its least size, out of the grid */
.wx.probe .in { display: block; }
.wx.probe .in > * { position: absolute; left: 0; top: 0; width: max-content; height: auto; min-height: 0; max-width: none; }
.wx.probe .card > *, .wx.probe .wear .body, .wx.probe .dnow > * { flex: none; }
.wx.probe .days { grid-auto-rows: 1fr; }
.wx.probe h3 { width: max-content; }
.wx.probe .hours { grid-auto-columns: max-content; column-gap: .45em; }
.wx.probe .hours.two { grid-template-columns: repeat(var(--cols, 6), max-content); }
.wx.probe .arc { width: 7.5em; height: 3em; }
.wx.probe .compass, .wx.probe .moonbody > svg { width: 4.2em; height: 4.2em; }
.wx.probe .aqscale { width: 7em; }
.wx.probe .chart { width: 15em; height: 9em; }
.wx.probe .days li { --barmin: 3.5em; }
.wx:is(.laid, .probe) :is(.windbody, .moonbody) .stack > *, .wx:is(.laid, .probe) .moonline { white-space: nowrap; }
/* Cards side by side: one heading size, the smallest any card's own size gives (--h3) */
.wx.laid .in h3 { font-size: var(--h3, max(14px, .74em)); }
/* A list longer than its window fades at the bottom */
.wx .scroll.fade { -webkit-mask: linear-gradient(#000 calc(100% - 2.5em), transparent); mask: linear-gradient(#000 calc(100% - 2.5em), transparent); }

/* Location: a sheet over the window, in the board's own colors */
#sheet[hidden] { display: none; }
#sheet { position: fixed; inset: 0; z-index: 2; background: rgba(4,12,30,.5); display: grid; place-items: center; font: 400 16px/1.25 var(--b21-font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
#sheet .panel { background: var(--b21-surface, #fff); color: var(--b21-text, #1f2937); border-radius: 14px; padding: 14px 16px 16px; width: min(380px, calc(100% - 24px)); max-height: calc(100% - 24px);
  box-shadow: 0 16px 48px rgba(0,0,0,.35); display: flex; flex-direction: column; min-height: 0; }
#sheet h4 { margin: 0 0 10px; font-size: 18px; }
#sheet .search { border: 2px solid var(--b21-accent, #2563eb); border-radius: 10px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; flex: none; }
#sheet .search svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--b21-muted, #5b6472); stroke-width: 2; stroke-linecap: round; }
#sheet .search input { border: 0; outline: 0; background: none; color: inherit; flex: 1; min-width: 0; font-size: 16px; padding: 2px 0; }
#sheet .res { list-style: none; margin: 8px 0 0; padding: 0; overflow: auto; min-height: 0; }
#sheet .res li { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-top: 1px solid var(--b21-border, #e2e5ea); cursor: pointer; border-radius: 8px; }
#sheet .res li:first-child { border-top: 0; }
#sheet .res li:hover, #sheet .res li:focus-visible { background: var(--b21-accent-soft, #e8f0fe); outline: 0; }
#sheet .res b { display: block; font-weight: 600; }
#sheet .res small { color: var(--b21-muted, #5b6472); display: block; font-size: 14px; }
#sheet .res .ok { margin-left: auto; color: var(--b21-accent, #2563eb); font-weight: 700; }
#sheet .msg { margin: 10px 2px 0; color: var(--b21-muted, #5b6472); font-size: 15px; }
#sheet .msg:empty { display: none; }
</style>

<script src="calendar.js"></script>
<script>
  // Content (Board21.save): { saved: { at, place, days, wear, from } }, the last forecast drawn, for offline.
  //   at     when what's saved last changed, in ms. place: the place's GeoNames id. from: "nws" when the Weather
  //          Service's forecast was the backup (else left out).
  //   days   the 7 days as drawn: { date: 'YYYY-MM-DD' (the place's), code, low, high, rain }, °F unrounded.
  //   wear   What to wear for today and the next school day, by date: { label, advice, items, feels8, high, at }, or
  //          { label, none: true } past the forecast. Never "Feels like … now": it changes every half hour.
  //   Saved only when it would draw differently (whole degrees, tens of percent), never because time passed.
  // Config (Board21.saveConfig): { place: { id, name, region, country, lat, lon, tz }, units: 'f' | 'c',
  //   hide: [...parts], simple, still, date: 'YYYY-MM-DD' | null }. Every menu setting and the place: no student's data.
  // Each window asks on its own: its own place, clocks, and saves. Nothing is kept outside the board.
  'use strict';
  const HOST = { forecast: 'https://api.open-meteo.com', air: 'https://air-quality-api.open-meteo.com', archive: 'https://archive-api.open-meteo.com',
    search: 'https://geocoding-api.open-meteo.com', nws: 'https://api.weather.gov' };
  const SITE = 'https://open-meteo.com/';
  const WHEELING = { id: 4916311, name: 'Wheeling', region: 'Illinois', country: 'United States', lat: 42.13919, lon: -87.92896, tz: 'America/Chicago' };
  const PARTS = [['hourly', 'Hourly forecast'], ['days', '7-day forecast'], ['wear', 'What to wear'], ['sun', 'Sunrise and sunset'], ['moon', 'Moon'], ['wind', 'Wind'], ['air', 'Air quality'], ['watches', 'Watches']];
  const MIN = 6e4, HOUR = 36e5;
  const EVERY = { now: 30 * MIN, forecast: HOUR, air: 4 * HOUR, alerts: 5 * MIN };
  const WAIT = 10000;          // a request's longest wait
  const TOO_OLD = 90 * MIN;    // Now from the Weather Service, before it comes from Open-Meteo instead
  const AIR_KEEP = 8 * HOUR;   // air quality from an older answer is hidden
  const NB = ' ';
  const EXT_ICON = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>';
  const CAL = self.B21WeatherCalendar || { noSchool: [], halfDays: [] };
  const NO_SCHOOL = new Set(CAL.noSchool), HALF = new Set(CAL.halfDays);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fin = v => typeof v === 'number' && isFinite(v);
  const num0 = v => (fin(v) ? v : null);
  // A time a date can be made from, in unix seconds: from 1900 to 2100. (Intl throws on one too far out.)
  const okT = t => fin(t) && t > -2208988800 && t < 4102444800;
  // A temperature that could be real, in °F: the air within ±150°, feels like within ±200° (a heat index can pass 150°).
  const tF = (v, max = 150) => (fin(v) && v > -max && v < max ? v : null);

  // ---- Dates and times, in the place's time zone. Every time is rounded to the minute before it is shown.
  const fmts = new Map();
  const fmt = (tz, o) => { const k = tz + JSON.stringify(o); if (!fmts.has(k)) fmts.set(k, new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz }, o))); return fmts.get(k); };
  function partsOf(ms, tz) {
    const o = {};
    for (const p of fmt(tz, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(ms)) o[p.type] = p.value;
    return { ymd: `${o.year}-${o.month}-${o.day}`, h: +o.hour % 24, m: +o.minute };
  }
  const ymdOf = (ms, tz) => partsOf(ms, tz).ymd;
  const round = ms => Math.round(ms / MIN) * MIN;
  function clock(ms, tz) { const p = partsOf(round(ms), tz), h12 = p.h % 12 || 12; return (p.m ? `${h12}:${String(p.m).padStart(2, '0')}` : `${h12}`) + NB + (p.h < 12 ? 'AM' : 'PM'); }
  const dUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const addDays = (s, n) => new Date(dUTC(s) + n * 864e5).toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 864e5);
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const wd = s => new Date(dUTC(s)).getUTCDay();
  const monthDay = s => `${MON[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}`;
  const YMD = /^\d{4}-\d{2}-\d{2}$/;
  const realDay = s => typeof s === 'string' && YMD.test(s) && new Date(dUTC(s)).toISOString().slice(0, 10) === s;
  // "Today", "Tue" within 6 days, then "Mon, Nov 30".
  const label = (d, today) => { const n = daysBetween(today, d); return n <= 6 ? WD[wd(d)] : `${WD[wd(d)]}, ${monthDay(d)}`; };
  // "7:02 AM" today, "Fri 7:02 AM" within 6 days, "Nov 20" before that.
  function updated(ms, tz) { const d = ymdOf(ms, tz), n = daysBetween(d, ymdOf(Date.now(), tz)); return n <= 0 ? clock(ms, tz) : n <= 6 ? `${WD[wd(d)]} ${clock(ms, tz)}` : monthDay(d); }
  // Quiet hours, by the device's own clock: no timed requests from 8 PM until 6 AM and this window's own minute.
  const OFFSET = Math.floor(Math.random() * 15);
  function quiet(ms) { const t = new Date(ms), h = t.getHours(); return h >= 20 || h < 6 || (h === 6 && t.getMinutes() < OFFSET); }

  // ---- School days: the district's calendar, whatever the place. After it, weekdays.
  const isSchool = s => { const d = wd(s); return d > 0 && d < 6 && !NO_SCHOOL.has(s); };
  function nextSchool(s) { for (let i = 1; i < 400; i++) { const d = addDays(s, i); if (isSchool(d)) return d; } return addDays(s, 1); }
  const schoolHours = s => (HALF.has(s) ? [8, 11] : [8, 15]);
  // Which day What to wear shows: Today on a school day before 2 PM, else the next school day (Today a tap away).
  function plan(ms) {
    const p = partsOf(ms, config.place.tz), school = isSchool(p.ymd), next = nextSchool(p.ymd);
    return { today: school ? p.ymd : null, show: school && p.h < 14 ? 'today' : 'next', next, label: label(next, p.ymd), day: p.ymd };
  }

  // ---- What to wear: by feels like over the school hours (°F, whatever the units). The coldest hour picks the row.
  const CLOTHES = { coat: 'Coat', jacket: 'Jacket', rain: 'Rain jacket', hat: 'Hat', gloves: 'Gloves', scarf: 'Scarf', boots: 'Boots', tshirt: 'T-shirt', shorts: 'Shorts' };
  const TIER = { 'very cold': ['coat', 'hat', 'gloves', 'scarf'], cold: ['coat', 'hat', 'gloves'], chilly: ['coat'], cool: ['jacket'], mild: ['tshirt'], warm: ['tshirt', 'shorts'] };
  function advise(list) {
    const f = list.map(h => h.feels).filter(fin);
    if (!f.length) return null;
    const lo = Math.min(...f), hi = Math.max(...f);
    const tier = lo < 10 ? 'very cold' : lo < 32 ? 'cold' : lo < 45 ? 'chilly' : lo < 60 ? 'cool' : hi >= 75 ? 'warm' : 'mild';
    const rain = list.some(h => h.pop >= 40 && h.temp > 32), snow = list.some(h => h.pop >= 40 && fin(h.temp) && h.temp <= 32);
    return { tier, advice: `Dress for ${tier} weather.` + (rain ? ' Bring a rain jacket.' : '') + (snow ? ' Wear boots.' : ''),
      items: TIER[tier].concat(rain ? ['rain'] : [], snow ? ['boots'] : []) };
  }
  const ADVICE = /^Dress for (very cold|cold|chilly|cool|mild|warm) weather\.( Bring a rain jacket\.)?( Wear boots\.)?$/;
  // A day's school hours in the hourly forecast, or null when the forecast doesn't reach them. Today, the hours still
  // ahead are enough: the Weather Service's forecast starts at this hour.
  function schoolList(day, hours, today) {
    const [a, b] = schoolHours(day), tz = config.place.tz, hr = h => partsOf(h.t * 1000, tz).h;
    const in_ = hours.filter(h => { const p = partsOf(h.t * 1000, tz); return p.ymd === day && p.h >= a && p.h <= b && p.m === 0; });
    const from = day === today ? Math.max(a, partsOf(Date.now(), tz).h) : a;
    return in_.length >= b - a + 1 || (from <= b && in_.filter(h => hr(h) >= from).length >= b - from + 1) ? in_ : null;
  }
  // A day's What to wear from those hours, or none.
  function wearFor(day, hours, today) {
    const tz = config.place.tz, in_ = schoolList(day, hours, today), got = in_ && advise(in_);
    if (!got) return { label: day === today ? 'Today' : label(day, today), none: true };
    let high = null, at = null;
    for (const h of in_) if (fin(h.temp) && (high === null || h.temp > high)) { high = h.temp; at = h.t; }
    const h8 = in_.find(h => partsOf(h.t * 1000, tz).h === 8);
    return { label: day === today ? 'Today' : label(day, today), advice: got.advice, items: got.items, feels8: h8 ? num0(h8.feels) : null, high, at };
  }

  // ---- Sun and moon, worked out on the device (NOAA sunrise and sunset, Meeus moon phases), for the place's day.
  const RAD = Math.PI / 180;
  function moonEventJd(k) {
    const T = k / 1236.85, q = Math.round((k - Math.floor(k)) * 4) % 4, s = Math.sin, E = 1 - 0.002516 * T;
    const M = (2.5534 + 29.1053567 * k) * RAD, m = (201.5643 + 385.81693528 * k + 0.0107582 * T * T) * RAD, F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T) * RAD;
    let jd = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T - 69 / 86400;   // minus delta T, about 69 s
    if (q % 2 === 0) jd += (q ? -0.40614 : -0.4072) * s(m) + (q ? 0.17302 : 0.17241) * E * s(M) + 0.01608 * s(2 * m) + 0.01039 * s(2 * F) + 0.00739 * E * s(m - M) - 0.00514 * E * s(m + M) + 0.00208 * E * E * s(2 * M);
    else jd += -0.62801 * s(m) + 0.17172 * E * s(M) - 0.01183 * E * s(m + M) + 0.00862 * s(2 * m) + 0.00804 * s(2 * F) + 0.00454 * E * s(m - M) + 0.00204 * E * E * s(2 * M) + (q === 1 ? 1 : -1) * (0.00306 - 0.00038 * E * Math.cos(M) + 0.00026 * Math.cos(m));
    return jd;
  }
  const MAIN = ['New moon', 'First quarter', 'Full moon', 'Last quarter'];
  // The moon at a moment: the four main names on the place's calendar day of the event, the in-between names on other
  // days, the fraction lit, and the times of the main phases from this lunation on.
  function moonPhase(ms, tz) {
    const jd = ms / 864e5 + 2440587.5, toMs = j => (j - 2440587.5) * 864e5;
    let k = Math.floor((jd - 2451550.09766) / 29.530588861);
    if (moonEventJd(k) > jd) k--;
    if (moonEventJd(k + 1) <= jd) k++;
    const ev = [0, 0.25, 0.5, 0.75, 1].map(f => moonEventJd(k + f));
    const T = (jd - 2451545) / 36525, s = Math.sin;
    const D = (297.8501921 + 445267.1114034 * T) * RAD, Ms = (357.5291092 + 35999.0502909 * T) * RAD, Mm = (134.9633964 + 477198.8675055 * T) * RAD;
    const i = Math.PI - D - (6.289 * s(Mm) - 2.1 * s(Ms) + 1.274 * s(2 * D - Mm) + 0.658 * s(2 * D) + 0.214 * s(2 * Mm) + 0.11 * s(D)) * RAD;
    const day = ymdOf(ms, tz);
    let seg = 0;
    while (seg < 3 && jd >= ev[seg + 1]) seg++;
    let name = ['Waxing crescent', 'Waxing gibbous', 'Waning gibbous', 'Waning crescent'][seg];
    for (let n = 0; n < 5; n++) if (ymdOf(toMs(ev[n]), tz) === day) name = MAIN[n % 4];
    const phases = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75].map(f => ({ name: MAIN[Math.round(f * 4) % 4], at: round(toMs(moonEventJd(k + f))) }));
    return { fraction: (1 + Math.cos(i)) / 2, waxing: seg < 2, name, phases };
  }
  // "Full moon today", "… tomorrow", "… on Thursday" within 6 days, or "… on Dec 23".
  function nextPhase(m, ms, tz) {
    const today = ymdOf(ms, tz), p = m.phases.find(x => ymdOf(x.at, tz) >= today);
    if (!p) return '';
    const d = ymdOf(p.at, tz), n = daysBetween(today, d);
    return p.name + (n === 0 ? ' today' : n === 1 ? ' tomorrow' : n <= 6 ? ` on ${WDL[wd(d)]}` : ` on ${monthDay(d)}`);
  }
  // Sunrise and sunset on the place's calendar day s, rounded to the minute. null for a sun that doesn't rise or set.
  function sunTimes(s, lat, lon) {
    const day0 = dUTC(s);
    function event(dir, min) {
      for (let pass = 0; pass < 2; pass++) {
        const T = ((day0 + min * 6e4) / 864e5 + 2440587.5 - 2451545) / 36525;
        const L = (280.46646 + T * (36000.76983 + T * 0.0003032)) * RAD, M = (357.52911 + T * (35999.05029 - 0.0001537 * T)) * RAD;
        const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
        const C = Math.sin(M) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M) * (0.019993 - 0.000101 * T) + Math.sin(3 * M) * 0.000289;
        const om = (125.04 - 1934.136 * T) * RAD, lam = L + (C - 0.00569 - 0.00478 * Math.sin(om)) * RAD;
        const eps = (23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om)) * RAD;
        const dec = Math.asin(Math.sin(eps) * Math.sin(lam)), y = Math.pow(Math.tan(eps / 2), 2);
        const eqt = 4 / RAD * (y * Math.sin(2 * L) - 2 * e * Math.sin(M) + 4 * e * y * Math.sin(M) * Math.cos(2 * L) - 0.5 * y * y * Math.sin(4 * L) - 1.25 * e * e * Math.sin(2 * M));
        const c = Math.cos(90.833 * RAD) / (Math.cos(lat * RAD) * Math.cos(dec)) - Math.tan(lat * RAD) * Math.tan(dec);
        if (c < -1 || c > 1) return null;
        min = 720 - 4 * lon - eqt + dir * 4 * Math.acos(c) / RAD;

      return round(day0 + min * 6e4);

    return { rise: event(-1, 720 - 4 * lon - 360), set: event(1, 720 - 4 * lon + 360) };
  }
  const sunOn = ms => { const pl = config.place; return sunTimes(ymdOf(ms, pl.tz), pl.lat, pl.lon); };
  function isDay(ms) { const s = sunOn(ms); return !s.rise || !s.set ? partsOf(ms, config.place.tz).h >= 6 && partsOf(ms, config.place.tz).h < 18 : ms >= s.rise && ms < s.set; }

  // ---- Weather codes and the Weather Service's words, as the groups the sky is drawn from.
  const group = c => c <= 0 ? 'clear' : c === 1 ? 'mostly' : c === 2 ? 'partly' : c === 3 ? 'cloudy' : c === 45 || c === 48 ? 'fog'
    : c <= 57 ? 'drizzle' : c <= 67 || (c >= 80 && c <= 82) ? 'rain' : c <= 77 || c === 85 || c === 86 ? 'snow' : c >= 95 ? 'storm' : 'cloudy';
  const CODE = { clear: 0, mostly: 1, partly: 2, cloudy: 3, fog: 45, drizzle: 53, rain: 63, snow: 73, storm: 95 };
  function codeOfText(t) {
    if (typeof t !== 'string' || !t.trim()) return null;
    const has = w => new RegExp('\\b' + w + '\\b', 'i').test(t);
    const g = has('Freezing Fog') ? 'fog' : has('Thunder\\w*') ? 'storm' : ['Snow', 'Flurries', 'Sleet', 'Ice', 'Freezing'].some(has) ? 'snow' : ['Rain', 'Showers'].some(has) ? 'rain'
      : has('Drizzle') ? 'drizzle' : ['Fog', 'Mist', 'Haze', 'Smoke'].some(has) ? 'fog' : has('Overcast') || (has('Cloudy') && !has('Partly Cloudy')) ? 'cloudy' : has('Partly') ? 'partly'
      : has('Mostly Sunny') || has('Mostly Clear') || has('Few') ? 'mostly' : ['Sunny', 'Clear', 'Fair'].some(has) ? 'clear' : 'cloudy';
    return CODE[g];
  }

  // ---- Settings and saved data. Both can come from an imported file, so every field is checked.
  function zoneOk(tz) { try { if (typeof tz !== 'string' || !tz || tz.length > 64) return false; new Intl.DateTimeFormat('en-US', { timeZone: tz }); return true; } catch (e) { return false; } }
  const text80 = v => (typeof v === 'string' ? v.replace(/\s+/g, ' ').trim() : '');
  function readPlace(p) {
    if (!p || typeof p !== 'object') return null;
    const name = text80(p.name), region = text80(p.region), country = text80(p.country);
    if (!Number.isInteger(p.id) || p.id <= 0 || !name || name.length > 80 || region.length > 80 || country.length > 80) return null;
    if (!fin(p.lat) || !fin(p.lon) || p.lat < -90 || p.lat > 90 || p.lon < -180 || p.lon > 180 || !zoneOk(p.tz)) return null;
    return { id: p.id, name, region, country, lat: p.lat, lon: p.lon, tz: p.tz };
  }
  function readConfig(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? c : {};
    const place = readPlace(c.place) || Object.assign({}, WHEELING);
    const keys = PARTS.map(p => p[0]);
    const hide = Array.isArray(c.hide) ? keys.filter(k => c.hide.includes(k)) : [];
    const date = realDay(c.date) && c.date >= '1940-01-01' && c.date < ymdOf(Date.now(), place.tz) ? c.date : null;
    return { place, units: c.units === 'c' ? 'c' : 'f', hide, simple: c.simple === true, still: c.still === true, date };
  }
  function readSaved(d) {
    const s = d && typeof d === 'object' && d.saved;
    if (!s || typeof s !== 'object' || !fin(s.at) || s.at < Date.UTC(2020, 0, 1) || s.at > Date.now() + 864e5 || !Number.isInteger(s.place) || !Array.isArray(s.days)) return null;
    const days = s.days.slice(0, 8).filter(x => x && realDay(x.date) && Number.isInteger(x.code) && x.code >= 0 && x.code <= 99)

  function note(d, o, k, hrs) {
    // (Each sentence stays on one line: the note breaks only between them. With the hours, in What to wear's view, today's
    // feels like now sits in .fnow, which shows only where the hours step aside.)
    const w = d.wear[k], tz = pl().tz, high = fin(w.high) && fin(w.at) ? `High${NB}of${NB}${T(w.high, o)}${NB}at${NB}${clock(w.at * 1000, tz)}.` : '';
    if (k === 'today') { const f = !d.offline && d.now && fin(d.now.feels) ? `Feels${NB}like${NB}${T(d.now.feels, o)}${NB}now. ` : ''; return (f && hrs && high ? `<span class="fnow">${f}</span>` : f) + high; }
    return (fin(w.feels8) ? `Feels${NB}like${NB}${T(w.feels8, o)}${NB}at${NB}8${NB}AM. ` : '') + high;
  }
  // The advice, where "Dress for" may break from its weather. (whole: each other sentence whole too, as Medium's strip
  // keeps them. The card keeps its own breaks: its size is planned with them.)
  const says = (a, whole) => { const s = a.replace(/^Dress for (.+? weather\.)/, 'Dress for <span class="nw">$1</span>'); return whole ? s.replace(/ (Bring a rain jacket\.|Wear boots\.)/g, ' <span class="nw">$1</span>') : s; };
  // (The card's heading is its button, for keys and screen readers, so the toggle isn't inside a button. A tap anywhere on

  function wear(d, o) {

    return `<section class="card wear" data-go="wear"><h3${go('wear')}>${use('u-shirt')}What to wear${chev}</h3><div class="body">${body}${toggle(d, o)}</div></section>`;
  }
  // Medium shows up to 4: rain jacket and boots first, then the row's clothes. (Its chevron, at the end of the last
  // phrase, is its button.)
  function wearLine(d, o) {

    if (w.none) return `<section class="card wl" data-go="wear">${toggle(d, o)}<span class="says">Its forecast isn’t <span class="nw">out yet.${open}</span></span></section>`;
    const items = w.items.filter(i => i === 'rain' || i === 'boots').concat(w.items.filter(i => i !== 'rain' && i !== 'boots')).slice(0, 4);
    return `<section class="card wl" data-go="wear">${toggle(d, o)}${wearItems(items, false)}<span class="says">${says(w.advice, true).replace(/<\/span>$/, open + '</span>')}</span></section>`;
  }

  // What to wear's view for a day: the toggle, the advice a sentence a line, the clothes, and the note, then each school

  function wearView(d, o, k) {
    const w = d.wear[k];

    const lines = w.advice.match(/[^.]+\./g).map((s, i) => `<span class="s${i ? ' nw' : ''}">${s.trim().replace(/^Dress for (.+)$/, 'Dress for <span class="nw">$1</span>')}</span>`).join(' ');
    const nt = note(d, o, k, !!w.hrs).trim();

  }
  // Each school hour's feels like, rain or snow where advise() counts it, and the hour that picks the advice: the coldest,
  // or on a warm day the warmest. (Two hours that show the same number: the first.) Today, the hours gone by are dim,
  // and this hour reads Now.
  function school(hs, o, k, advice) {
    const tz = pl().tz, warm = / warm /.test(advice), now = Date.now();
    const f = hs.map(h => (fin(h.feels) ? Math.round(o.c ? (h.feels - 32) * 5 / 9 : h.feels) : NaN)), fs = f.filter(fin);
    const at = fs.length ? f.indexOf((warm ? Math.max : Math.min)(...fs)) : -1;

    const marks = hs.some(mark);

      return `<div class="wh${i === at ? ' why' : ''}${past ? ' past' : ''}${cur ? ' now' : ''}"><span class="t">${cur ? 'Now' : clock(h.t * 1000, tz)}</span><b class="v">${T(h.feels, o)}</b>${marks ? `<i class="m">${mark(h)}</i>` : ''}${i === at ? `<span class="k">${warm ? 'Warmest' : 'Coldest'}</span>` : ''}</div>`;

    return `<section class="card whrs"><h3>${use('u-thermo')}Feels like</h3><div class="wrow" style="--n:${hs.length};--h:${Math.ceil(hs.length / 2)}">${cells}</div></section>`;
  }

  function sunArc(f) {
    const parts = ['<path d="M6 72H194" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>',
      '<path d="M16 72A84 58 0 0 1 184 72" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>'];
    if (f != null) {
      const th = Math.PI * (1 - f), x = (100 + 84 * Math.cos(th)).toFixed(1), y = (72 - 58 * Math.sin(th)).toFixed(1);
      parts.push(`<path d="M16 72A84 58 0 0 1 ${x} ${y}" fill="none" stroke="#FFD66B" stroke-width="3" stroke-linecap="round"/>`,

    }
    return `<svg class="arc" viewBox="0 0 200 80" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${parts.join('')}</svg>`;
  }
  function sun(d, o, L) {
    const s = d.sun, m = d.moon;
    const moonline = L !== 'l' || !shown('moon') ? '' : `<div class="moonline">${moonSvg(m.fraction, m.waxing)}${m.next}</div>`;
    return `<section class="card sun"${go('sun')}><h3>${use('u-sun')}Sunrise and sunset${chev}</h3>${sunArc(s.f)}
      <div class="sunrow"><div><small>Sunrise</small><b>${s.rise}</b></div><div><small>Sunset</small><b>${s.set}</b></div></div>
      ${s.daylight ? `<div class="daylight">${s.daylight} of daylight</div>` : ''}${moonline}</section>`;
  }
  function moon(d) {
    const m = d.moon;

  }
  // The arrow points where the wind blows to. A calm report has no direction: no arrow.
  function compass(dir) {
    let ticks = '';
    for (let a = 0; a < 360; a += 30) ticks += `<path d="M50 7v${a % 90 ? 4 : 7}" transform="rotate(${a} 50 50)"/>`;
    const arrow = fin(dir) ? `<g transform="rotate(${(dir + 180) % 360} 50 50)"><path d="M50 74V30" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M50 18l-7 13h14z" fill="#fff"/><circle cx="50" cy="76" r="4" fill="none" stroke="#fff" stroke-width="2.5"/></g>` : '';
    return `<svg class="compass" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>

  }

  function frame(L, sc, o, body, extra, grid) {

  // (Fill the board: Now over What to wear on the left, the hours across the top, then the days and the small cards, one

  function gridXL(band, wear, hr, dy, sm) {
    const n = sm.length, cols = ['minmax(0,1.2fr)'], lo = [[], []];
    if (dy) { cols.push('minmax(0,1.15fr)'); lo[0].push('days'); lo[1].push('days'); }
    if (n >= 3) { cols.push('minmax(0,.95fr)', 'minmax(0,.95fr)'); lo[0].push(sm[0], sm[1]); lo[1].push(sm[2], sm[3] || sm[2]); }

    if (hr && (dy || n)) { rows.push('auto', 'minmax(0,1fr)', 'minmax(0,1fr)'); areas.push(['hero'].concat(Array(k).fill('hourly')).join(' '), [left].concat(lo[0]).join(' '), [left].concat(lo[1]).join(' ')); }
    else if (hr) { rows.push('minmax(0,1fr)', 'minmax(0,1fr)'); areas.push(['hero'].concat(Array(k).fill('hourly')).join(' '), [left].concat(Array(k).fill('hourly')).join(' ')); }
    else { rows.push('minmax(0,1fr)', 'minmax(0,1fr)'); areas.push(['hero'].concat(lo[0]).join(' '), [left].concat(lo[1]).join(' ')); }

  }
  const sceneOf = d => {
    if (d.offline) return scene(group(d.days[0][1]), isDay(Date.now()));

  };

  // The small cards shown, in order: sunrise and sunset (in Large with the moon's line), wind, the moon, air quality.
  // Large's one slot takes the moon before wind and air quality, which Now already has as lines.
  function smalls(d, o, L) {
    const c = { sun: shown('sun') && sun(d, o, L), wind: !d.offline && shown('wind') && d.now && wind(d, o), moon: shown('moon') && moon(d), air: !d.offline && shown('air') && d.air && airCard(d) };
    return (L === 'l' ? ['sun', 'moon', 'wind', 'air'] : ['sun', 'wind', 'moon', 'air']).map(k => c[k])
      .filter(Boolean).filter((x, i, a) => !(L === 'l' && /class="card moon"/.test(x) && /class="card sun"/.test(a[0])));
  }
  function render(d, o) {
    if (d.empty) return message(o, d.loading ? ['Getting the weather…'] : !online() ? ['You’re offline.', 'The weather shows once you’re online.'] : ['Can’t get the weather.', 'It tries again on its own.'], d.loading);
    if (o.simple) return simple(d, o);

    if (v !== 'main') return detail(d, o, v, L);

    else if (L === 'm') {

      // the window with up to two small cards. What to wear alone, 480 px tall or more, is a card.)
      const tall = o.h >= 1.3 * o.w && o.h >= 560, hasWear = shown('wear') && d.wear;
      const sm0 = smalls(d, o, L), mid0 = shown('days') || (shown('hourly') && !d.offline);
      const sm = tall || (!mid0 && !hasWear && o.w >= 420 && o.h >= 300) ? sm0.slice(0, tall ? 4 : 2) : [];
      const mid = shown('days') ? (tall && !sm.length ? days(d, o) : week5(d, o)) : shown('hourly') && !d.offline ? hourly(d, o, tall ? 12 : 6, false, true) : '';
      const wl = hasWear ? ((tall && o.h >= 760) || (!mid && !sm.length && o.h >= 480) ? wear(d, o) : wearLine(d, o)) : '';

      // (The mockup's grid, for when nothing fits at 14 px: then the small cards don't show.)

      const top = shown('days') ? days(d, o) : hr, wr = shown('wear') && d.wear ? wear(d, o) : '';

  // Details: one part, filling the window. ‹ Back returns.
  const back = title => `<div class="bar2"><button type="button" class="rb" data-go="main">${use('u-left')}Back</button><span class="title">${title}</span></div>`;
  function detail(d, o, v, L0) {
    const L = L0 === 's' ? 's' : 'm', n = d.now;
    const foot = `<p class="foot">${credit(d)}</p>`, noHead = s => s.replace(/<h3>[\s\S]*?<\/h3>/, '').replace(/ data-go="\w+" role="button" tabindex="0"/, '');
    let body;
    if (v === 'days') body = back('7-day forecast') + noHead(days(d, o)) + foot;
    else if (v === 'hours') body = back('Hourly forecast') + noHead(hourly(d, o, 13, true)) + foot;
    else if (v === 'sun') {
      const cs = [shown('sun') && sun(d, o, 'xl'), shown('moon') && moon(d)].filter(Boolean).map(c => c.replace(chev, '').replace(/ data-go="sun" role="button" tabindex="0"/, ''));
      if (!cs.length) cs.push(sun(d, o, 'xl').replace(chev, '').replace(/ data-go="sun" role="button" tabindex="0"/, ''));
      body = back(shown('sun') || !shown('moon') ? (shown('moon') ? 'Sun and moon' : 'Sunrise and sunset') : 'Moon') + `<div class="cards" style="display:grid;grid-template-columns:${cs.length > 1 ? '1.3fr 1fr' : '1fr'};gap:.6em;min-height:0">${cs.join('')}</div>`;
    } else if (v === 'air') {
      const a = d.air.aqi, c = aqCat(a);
      body = back('Air quality') + `<div class="dair"><div class="big">${a}</div><span class="aqpill" style="background:${c[2]};color:${c[3]}">${c[1]}</span>
        <div class="aqscale"><b style="left:${aqPos(a)}%"></b></div><p>${c[4]}</p>${d.air.later ? `<p>${d.air.later}</p>` : ''}</div><p class="foot">U.S. Air Quality Index from Open-Meteo and Copernicus</p>`;
    } else if (v === 'wear') {
      // (The day the toggle picks. The other day waits in a template, so fillOne() sizes both together and the toggle
      // moves nothing. Left out where the two days show different parts.)
      const k = pickOf(d, o), j = k === 'today' ? 'next' : 'today', a = d.wear[k], b = d.wear.today ? d.wear[j] : null;
      const alt = b && !a.none && !b.none && !a.hrs === !b.hrs ? `<template>${wearView(d, Object.assign({}, o, { wear: j }), j)}</template>` : '';
      body = back('What to wear') + `<div class="dwear">${wearView(d, o, k)}${alt}</div><p class="foot">${credit(d)}</p>`;
    } else if (v === 'alert') {
      const list = d.alerts.filter(watchesOk).map(a => `<div class="alert"><h4>${esc(a.event)}</h4><span class="k">${span(a)}</span>${a.text.map(p => `<p>${esc(p)}</p>`).join('')}${a.todo.length ? `<p class="lab">What to do</p>${a.todo.map(p => `<p>${esc(p)}</p>`).join('')}` : ''}</div>`).join('');
      body = back('Watches and warnings') + `<div class="scroll">${list}</div><p class="foot">From the National Weather Service</p>`;
    } else {
      const g = n ? group(n.code) : 'cloudy', day = n ? n.day : true;
      const cards = [shown('wind') && n ? wind(d, o, true) : '', shown('air') && d.air ? airCard(d, true) : '',

      wx.classList.add(...one.steps); el.classList.toggle('side', one.side); if (mb) mb.classList.toggle('col', one.col); if (aq) aq.classList.toggle('nosay', !one.say);
      if (mb && one.pic) mb.closest('.card').style.setProperty('--pic', one.pic);
      if (dw) { wshape(one.wsh); if (one.ww) el.style.setProperty('--ww', one.ww); else el.style.removeProperty('--ww'); }
      el.style.fontSize = one.size.toFixed(2) + 'px';
      if (ok()) return;
      wx.classList.remove(...STEPS); el.classList.remove('side'); if (mb) { mb.classList.remove('col'); mb.closest('.card').style.removeProperty('--pic'); }
      if (dw) { wshape(null); el.style.removeProperty('--ww'); }
    }
    if (aq) aq.classList.add('nosay');
    const mc = mb && mb.closest('.card');
    if (mc) mc.style.removeProperty('--pic');
    const top = Math.max(FLOOR, Math.min(innerWidth, innerHeight) * (kind === 'simple' ? .09 : .08));
    const search = from => {
      let lo = from, hi = Math.max(from, top);
      el.style.fontSize = hi + 'px';
      if (ok()) lo = hi;
      for (let it = 0; it < 9 && hi - lo > .25; it++) { const m = (lo + hi) / 2; el.style.fontSize = m.toFixed(2) + 'px'; if (ok()) lo = m; else hi = m; }
      return lo;
    };
    if (list) {
      // (Watches and warnings: as big as the whole list fits, never smaller than before. A longer list scrolls, and fades
      // at the bottom.)
      el.style.removeProperty('font-size');
      const b = parseFloat(getComputedStyle(el).fontSize), size = ok() ? search(b) : 0;
      if (size) el.style.fontSize = size.toFixed(2) + 'px'; else el.style.removeProperty('font-size');
      el.classList.toggle('fade', el.scrollHeight > el.clientHeight + 1);
      one = { key, size, side: false, col: false, steps: [] };
      return;
    }
    let lo, wsh = null, ww = '';
    const steps = [];
    if (dw) {
      // (What to wear's view. Its shapes: the words beside the clothes or over them, and the hours in one row or two (two
      // rows only in a window less than 1.6 times as wide as it's tall). Each in turn, the first that draws biggest, a
      // later one only where it draws 3% bigger. Tight at 14 px, or not fitting there, it closes up a step at a time, as
      // the other views do, where that lets it fit or draw bigger. Each sentence of the advice is whole on its line; where
      // no shape fits that way, the first breaks after "Dress for" (brk). Where it's tight, more than three clothes also try
      // rows of three (r3). Where nothing fits, the clothes go without their names (bare). Then the hours step aside, and
      // the names come back. Both days fit at the size chosen: the other day is put in to check.)
      const fe = document.activeElement, items = !!el.querySelector('.wtop .items'), hrs = !!el.querySelector('.wrow'), sents = !!el.querySelector('.advice .s');
      const many = Math.max(...[el, tp && tp.content].filter(Boolean).map(e => e.querySelectorAll('.wtop .items > figure').length)) > 3;
      el.style.removeProperty('--ww');
      const swap = () => { const a = [...el.children].filter(e => e !== tp), b = [...tp.content.children]; tp.content.append(...a); tp.before(...b); };
      const both = () => { if (!ok()) return false; if (!tp) return true; swap(); const r = ok(); swap(); return r; };
      // (The biggest size on a .25 px grid from `from` up to `cap` that fits, or null. With a guess, such as the size the
      // last measure chose, it steps out from there, so a drag tests few sizes. The grid gives the same size from any
      // start.)
      const most = (from, cap, g) => {
        if (from > cap) return null;
        const n = Math.floor((cap - from) / .25 + 1e-6), at = k => { el.style.fontSize = (from + k * .25).toFixed(2) + 'px'; return ok(); };
        let lo = -1, hi = n + 1;
        if (g == null) { if (!at(0)) return null; lo = 0; } else {
          const k = Math.min(n, Math.max(0, Math.round((g - from) / .25)));
          let d = 1;
          if (at(k)) { lo = k; while (lo < n) { const j = Math.min(n, lo + d); if (at(j)) { lo = j; d *= 2; } else { hi = j; break; } } }
          else { hi = k; while (hi > 0) { const j = Math.max(0, hi - d); if (at(j)) { lo = j; break; } hi = j; d *= 2; } }
          if (lo < 0) return null;
        }
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (at(m)) lo = m; else hi = m; }
        return from + lo * .25;
      };
      // (The biggest size both days fit: this day's, then the other day's up to it. One swap each way.)
      const fit2 = (from, g) => {
        let s = most(from, top, g);
        if (s !== null && tp) { swap(); s = most(from, s, s); swap(); }
        return s === null ? { s: from, f: false } : { s, f: true };
      };
      const g0 = one.wsh ? one.size : null;
      const beats = (c, b) => !b || (c.f && !b.f) || (c.f === b.f && c.s > 1.03 * b.s);
      const run = v => {
        const SH = [];
        for (const [beside, two] of [[false, false], [true, false], [false, true], [true, true]]) if ((!beside || items) && (!two || (hrs && !v.nohrs && innerWidth < 1.6 * innerHeight))) SH.push(Object.assign({}, v, { beside, two }));
        // (A later shape is searched only from the size it must beat: one test where it can't.)
        const best = (b = null) => {
          for (const sh of SH) { wshape(sh); const c = Object.assign(b && b.f ? fit2(b.s * 1.03, g0 == null ? null : Math.max(b.s * 1.03, g0)) : fit2(FLOOR, g0), { sh }); if (beats(c, b)) b = c; }
          return b;
        };
        // (Each step closes up more than the one before, so a step that doesn't help may still lead to one that does.)
        wx.classList.remove(...STEPS);
        let b = best();
        b.steps = [];
        if (b.s < FLOOR * 1.2 || !b.f) STEPS.forEach((st, i) => { wx.classList.add(st); const c = best(b.f ? b : null); if (c !== b && (!b.f || (c.f && beats(c, b)))) { b = c; b.steps = STEPS.slice(0, i + 1); } });
        return b;
      };
      // (Each way whole first, then with the first sentence broken.)
      const go2 = v => { const c = run(v); return c.f || !sents ? c : run(Object.assign({ brk: true }, v)); };
      let b = go2({});
      if (many && (!b.f || b.s < FLOOR * 1.3)) { const c = run(Object.assign({ r3: true }, b.sh.brk ? { brk: true } : {})); if (beats(c, b)) b = c; }
      if (!b.f && items && hrs) { const c = go2({ r3: many, bare: true }); if (c.f) b = c; }
      if (!b.f && hrs) { const c = go2({ nohrs: true }); if (c.f) b = c; }
      wx.classList.remove(...STEPS); wx.classList.add(...b.steps); steps.push(...b.steps);
      wshape(b.sh); lo = b.s; wsh = b.sh;
      el.style.fontSize = lo.toFixed(2) + 'px';
      // (Beside the clothes, the words' column is as wide as the wider day's, so the clothes stay put when the toggle
      // turns: where both days still fit.)
      if (tp && wsh.beside && b.f) {
        const col = () => parseFloat(getComputedStyle(el.querySelector('.wtop')).gridTemplateColumns) || 0, c0 = col();
        swap(); const c1 = col(); swap();
        el.style.setProperty('--ww', Math.max(c0, c1).toFixed(1) + 'px');
        if (both()) ww = Math.max(c0, c1).toFixed(1) + 'px'; else el.style.removeProperty('--ww');
      }
      if (fe && fe.isConnected && document.activeElement !== fe) fe.focus({ preventScroll: true });
    } else {
      lo = search(FLOOR);
      // (A view that's tight at 14 px: closed up a step at a time, where that lets it draw bigger.)
      if (kind === 'detail' && lo < FLOOR * 1.2) for (const st of STEPS) { wx.classList.add(st); const s = search(FLOOR); if (s > lo * 1.03) { lo = s; steps.push(st); } else { wx.classList.remove(st); break; } }
    }
    // (Simple words in a wide window: the picture beside the sentence and the clothes, where that draws them bigger. The
    // moon in Sun and moon: its picture over its words, where that draws them bigger.)
    let side = false, col = false;
    if (kind === 'simple') {
      el.classList.add('side');
      const s = search(FLOOR);
      if (s > lo * (one.side ? .97 : 1.03)) { lo = s; side = true; } else el.classList.remove('side');
    }
    if (mb) {
      // (Over its words, the moon is sized after them: measured at its least, then grown into the room they leave.)
      mb.classList.add('col'); mc.style.setProperty('--pic', '3.4em');
      const s = search(FLOOR);
      if (s > lo * (one.col ? .97 : 1.03)) { lo = s; col = true; } else { mb.classList.remove('col'); mc.style.removeProperty('--pic'); }
    }
    el.style.fontSize = lo.toFixed(2) + 'px';
    // (Air quality's advice, in the Now view: where the view draws at least 90% as big with it, and no smaller than the
    // mockup's size.)
    let say = false;
    if (aq) {
      aq.classList.remove('nosay');
      const s = search(FLOOR);
      el.style.fontSize = s.toFixed(2) + 'px';
      if (s >= Math.max(parseFloat(getComputedStyle(wx).fontSize), lo * (one.say ? .88 : .9)) && ok()) { lo = s; say = true; } else aq.classList.add('nosay');
      el.style.fontSize = lo.toFixed(2) + 'px';
    }
    // (The moon over its words grows into the room they leave: the card's width, or its height less the words.)
    let pic = '';
    if (mc && col) {
      const b = rectOf(mb), st = rectOf(mb.querySelector('.stack')), f = parseFloat(getComputedStyle(mc).fontSize), p = Math.min(b.width, b.height - st.height - parseFloat(getComputedStyle(mb).rowGap), 16 * f);
      pic = Math.max(3.4 * f, p).toFixed(1) + 'px'; mc.style.setProperty('--pic', pic);
      if (!ok()) { pic = '3.4em'; mc.style.setProperty('--pic', pic); }
    }
    one = { key, size: lo, side, col, steps, say, pic, wsh, ww };
  }

  let drawSoon = 0;
  const redraw = () => { if (!drawSoon) drawSoon = requestAnimationFrame(() => { drawSoon = 0; fitCorners(); draw(); }); };
  // (A font that finishes loading keeps its family's name: the parts are measured again.)
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { fontTurn++; redraw(); });

  // ---- The window menu: the Show list, On a date, Location, Simple words, No motion, units, and the credits.
  // On a date… has a calendar page with one day marked, and Location… a map pin.
  const DATE_ICON = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/><circle cx="12" cy="15.2" r="1.7" fill="currentColor" stroke="none"/></svg>';
  const PLACE_ICON = '<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
  function setMenu() {
    const items = [{ heading: true, label: 'Show' }, ...PARTS.map(([k, l]) => ({ id: 'show:' + k, label: l, checked: shown(k) })), { separator: true },
      { id: 'date', label: 'On a date…', icon: DATE_ICON }, { id: 'place', label: 'Location…', icon: PLACE_ICON }, { id: 'simple', label: 'Simple words', checked: config.simple }, { id: 'still', label: 'No motion', checked: config.still },
      { separator: true }, { heading: true, label: 'Units' }, { id: 'units:f', label: '°F and mph', checked: config.units === 'f' }, { id: 'units:c', label: '°C and km/h', checked: config.units === 'c' },
      { separator: true }, ...(kiosk ? [] : [{ id: 'open', label: 'Forecast from Open-Meteo', icon: EXT_ICON }]),
      ...(nws && nws.abroad ? [] : [{ id: 'credit-nws', label: 'Now from the National Weather Service', disabled: true }]),
      { id: 'credit-air', label: 'Air quality from Open-Meteo and Copernicus', disabled: true }];
    const key = JSON.stringify(items);
    if (key !== menuWas) { menuWas = key; Board21.menu.set(items); }
  }
  Board21.on('menu', id => {
    id = String(id);
    if (id.startsWith('show:') && PARTS.some(p => p[0] === id.slice(5))) {
      const k = id.slice(5), hide = shown(k) ? config.hide.concat(k) : config.hide.filter(x => x !== k);
      config.hide = PARTS.map(p => p[0]).filter(x => hide.includes(x)); saveConfig(); draw();
    } else if (id === 'date') setDate(config.date || yesterday());
    else if (id === 'place') openSheet();
    else if (id === 'simple') { config.simple = !config.simple; saveConfig(); draw(); }
    else if (id === 'still') { config.still = !config.still; saveConfig(); draw(); }
    else if (id === 'units:f' || id === 'units:c') { config.units = id.slice(6); saveConfig(); draw(); }
    else if (id === 'open' && !kiosk) window.open(SITE, '_blank', 'noopener,noreferrer');
  });

  // ---- Location: search for a town. Other towns named Wheeling never show. No location services.
  let searchTimer = 0, searchTurn = 0;
  function openSheet() {
    const s = $('sheet');
    s.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Location"><h4>Location</h4><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>`
      + '<input type="search" placeholder="Search for a town" aria-label="Search for a town" autocomplete="off" spellcheck="false"></label><ul class="res"></ul><p class="msg" role="status"></p></div>';
    s.hidden = false;
    const input = s.querySelector('input');
    input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(input.value), 300); });
    showResults([pl()], '');
    try { window.focus(); } catch (e) { /* the board keeps the focus */ }
    input.focus();
  }
  function closeSheet() { clearTimeout(searchTimer); searchTurn++; $('sheet').hidden = true; $('sheet').textContent = ''; }
  function showResults(list, msg) {
    const s = $('sheet'), ul = s.querySelector('.res');
    if (!ul) return;
    ul.textContent = '';
    for (const p of list) {
      const li = document.createElement('li'), box = document.createElement('div'), b = document.createElement('b'), small = document.createElement('small');
      li.tabIndex = 0; b.textContent = p.name; small.textContent = [p.region, p.country].filter(Boolean).join(', ');
      box.append(b, small); li.append(box);
      if (p.id === pl().id) { const ok = document.createElement('span'); ok.className = 'ok'; ok.textContent = '✓'; li.append(ok); li.setAttribute('aria-current', 'true'); }
      li.addEventListener('click', () => choose(p));
      li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(p); } });
      ul.append(li);
    }
    s.querySelector('.msg').textContent = msg;
  }
  function search(text) {
    const t = String(text || '').trim().slice(0, 80), turn = ++searchTurn;
    if (t.length < 2) return showResults([pl()], '');
    if (!online()) return showResults([], 'Search needs the Internet.');
    get(`${HOST.search}/v1/search?` + q({ name: t, count: 10, language: 'en', format: 'json' })).then(j => {
      if (turn !== searchTurn) return;
      const wheeling = /^wheeling/i.test(t);
      const list = arr(j, 'results').map(r => r && readPlace({ id: r.id, name: r.name, region: r.admin1 || '', country: r.country || '', lat: r.latitude, lon: r.longitude, tz: r.timezone })).filter(Boolean)
        .filter(p => (wheeling ? p.id === WHEELING.id : !(/^wheeling$/i.test(p.name) && p.id !== WHEELING.id)));
      showResults(list, list.length ? '' : 'No towns found.');
    }).catch(e => { if (turn === searchTurn) showResults([], e && e.status ? 'No towns found.' : 'Search needs the Internet.'); });
  }
  function choose(p) {
    closeSheet();
    if (p.id === pl().id) return;
    config.place = p; config.date = null; saveConfig();
    newPlace(); draw();
  }
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

  // ---- Taps, keys, and the date picker.
  // By keys, a view gives its Back the focus, and Back or Escape gives it to the card that opened the view. A tap moves
  // no focus, so no ring shows.
  let opener = null, keyed = false;
  addEventListener('keydown', () => { keyed = true; }, true);
  addEventListener('pointerdown', () => { keyed = false; }, true);
  function goTo(to, from) {
    const v = $('view'), tabs = g => [...v.querySelectorAll(`[data-go="${g}"]`)].filter(e => e.tabIndex >= 0);
    if (view === 'main' && to !== 'main' && from) opener = { go: to, i: Math.max(0, tabs(to).findIndex(e => e === from || from.contains(e))) };
    const o = opener;
    if (to === 'main') opener = null;
    view = to; draw();
    if (!keyed) return;
    if (to !== 'main') { const b = v.querySelector('.bar2 [data-go="main"]'); if (b) b.focus(); }
    else if (o) { const all = tabs(o.go), e = all[o.i] || all[0]; if (e) e.focus(); }
  }
  $('view').addEventListener('click', e => {
    let t = e.target.closest('[data-go], [data-wear], [data-act]');
    // (A tap on What to wear's toggle, around or between its days: the nearer day, never the card under it.)
    const tg = e.target.closest('.tg'), days = tg ? [...tg.querySelectorAll('[data-wear]')] : [];
    if (days.length && !(t && tg.contains(t))) { const x = q => { const r = q.getBoundingClientRect(); return Math.abs(r.left + r.width / 2 - e.clientX); }; t = days.reduce((a, b) => (x(b) < x(a) ? b : a)); }
    if (!t) return;
    if (t.dataset.wear) { wearPick = t.dataset.wear; draw(); }
    else if (t.dataset.go) goTo(t.dataset.go, t);
    else if (t.dataset.act === 'today') setDate(null);
    else if (t.dataset.act === 'prev' || t.dataset.act === 'next') { const d = addDays(config.date, t.dataset.act === 'prev' ? -1 : 1); if (d >= '1940-01-01' && d <= yesterday()) setDate(d); }
  });
  $('view').addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('[data-go]:not(button), [data-wear]');
    if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
  });
  $('view').addEventListener('change', e => {
    if (!e.target.matches('input[type="date"]')) return;
    const v = e.target.value;
    if (realDay(v) && v >= '1940-01-01' && v <= yesterday()) setDate(v);
  });
  $('view').addEventListener('click', e => { const i = e.target.closest('input[type="date"]'); if (i && i.showPicker) try { i.showPicker(); } catch (err) { /* the browser opens it itself */ } });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('sheet').hidden) { e.preventDefault(); closeSheet(); } else if (view !== 'main' && !config.date) { e.preventDefault(); goTo('main'); }
  });

  // ---- The board's own buttons and padlocks over a window that fills it: the parts keep clear of them.
  function fitCorners() {
    const w = Board21.context && Board21.context.window, c = w && w.maximized && w.corners;
    const px = v => Math.min(2000, Math.max(0, Number(v) || 0));
    const low = c && (px(c.left) || px(c.right)) ? px(c.height) : 0;
    const t = c && c.top, top = t && (px(t.left) || px(t.right)) ? px(t.height) : 0;
    document.documentElement.style.setProperty('--low', low + 'px'); document.documentElement.style.setProperty('--top', top + 'px');
    corners.low = low; corners.top = top;
  }
  const corners = { low: 0, top: 0 };

  // ---- Changed in another tab or on another device, or by an import. Checked, taken, drawn. Never saved from here.
  Board21.on('config', c => {
    const was = config.place;
    config = readConfig(c);
    const p = config.place;
    if (p.id !== was.id || p.lat !== was.lat || p.lon !== was.lon || p.tz !== was.tz) newPlace();
    if (config.date) askDay(); else day = null;
    draw();
  });
  Board21.on('data', d => { saved = readSaved(d); draw(); });
  Board21.on('resize', redraw);
  addEventListener('resize', redraw);
  addEventListener('online', () => { stale(true); if (config.date) { day = null; askDay(); } draw(); });
  addEventListener('offline', () => { if (config.date) { day = null; askDay(); } draw(); });
  document.addEventListener('visibilitychange', () => { if (visible()) { stale(false); draw(); } });

  // The widget's own rules, for its tests: which day What to wear shows, a day's name, school hours, the advice.
  // (And how the window is laid out: the arrangement, each part's shape and size in px, and the steps closed up.)
  self.B21Weather = { plan: ms => plan(ms), label, hours: schoolHours, advise, refresh: () => stale(true),
    laid: () => (laid && !laid.fallback ? { id: laid.id, pick: Object.assign({}, laid.pick), f: Object.fromEntries(Object.entries(laid.f).map(([k, v]) => [k, +v.toFixed(1)])), steps: laid.steps.slice() } : laid ? { id: 'mockup' } : null) };

  async function start() {
    const ctx = await Board21.ready();
    kiosk = !!ctx.kiosk;
    config = readConfig(ctx.config);
    saved = readSaved(ctx.data);
    started = true;
    const p = plan(Date.now()); planWas = p.day + p.show;
    fitCorners();
    if (config.date) askDay();
    draw();
    stale(true);
    setInterval(tick, 20000);
  }
  start();
</script>
</body>
</html>

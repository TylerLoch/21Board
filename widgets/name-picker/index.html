<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Picker</title>
<script src="../../sdk/board21.js"></script>
<script>
/*
 * Name Picker: this page (the "host") and the pick styles that plug into it
 * ==========================================================================
 * The host owns everything except the stage: the names and the edit view, saving and syncing between copies,
 * the fair draw, the window menu, the main button, the status line, Start over, Undo, Sound, Quick, reduce motion,
 * the double-tap guard and what screen readers hear. A style owns only the stage: it draws the names, and puts
 * on the show that lands on the winners (or, for Groups, deals the groups; for Bracket, deals the names into the
 * bracket) the host has already drawn and saved. A style never draws winners, groups, or brackets.
 *
 * Each style is one file in this folder, style-<name>.js (Big name: style-bigname.js), loaded by a <script>
 * tag below and listed in widgets/registry.js (so it is in the offline copy). Its CSS goes in the same file, as
 * `css`, with every class starting with its id ("wheel-…"). The file registers the style:
 *
 *   NamePicker.register('wheel', {           // id: 'name' | 'wheel' | 'spotlight' | 'lotto' | 'versus' | 'groups' | 'bracket'
 *     css: `.wheel-hub { … }`,               // optional; added to the page once
 *     mount(root, host) {                    // root: an empty <div> that fills the stage (position: absolute; inset: 0)
 *       …build the stage inside root…
 *       return { show, play, skip, resize, theme, destroy };
 *     }
 *   });
 *
 * What the host calls (show and play are needed; the others if the style has a use for them):
 *   show(view, how)  Draw `view` as it is, with no show. The first draw; after a reload; after a change of style,
 *                    names, No repeats, Names at a time, Groups or Start over; and a pick that gets no show here.
 *                    It may come again with nothing new: leave the stage as it is then.
 *                    how.fade is true for a NEW pick (or new groups, or a new bracket) shown without its show (reduce
 *                    motion is on, or it was made in another copy a while ago), and for the bracket Undo brings back:
 *                    fade it in, about 0.3 s, nothing moving.
 *                    Bracket: how.moved is the spot whose name a tap here has just moved on (to spot >> 1): slide it
 *                    there, about 0.3 s (0.15 s with Quick, at once with reduce motion), with host.sound('pop') as it
 *                    lands, and 'champion' too when it lands in spot 1. how.back is the spot Undo here has just taken a name
 *                    back to, from spot >> 1: slide it back. A spot that had the keyboard focus passes it on to the next
 *                    ready spot, or lets it go when none is left (the host then puts it on the main button).
 *                    Only called while the stage is on screen with something on it: at least one name, or a bracket.
 *   play(view)       The show for a pick that has just been drawn. Start from what is on the stage (the last
 *                    show() or play()) and land on view.winners (Groups: deal out view.groups; Bracket: deal the
 *                    names into view.bracket), then call host.done() (within 10 s, or 4 s with Quick, or the host
 *                    calls skip()). Never called with reduce motion on.
 *   skip()           Jump to the end of the show at once: the winners on screen, nothing left running. The host
 *                    calls it for a tap after the double-tap guard, a menu change, a pick from another copy, the
 *                    page being hidden, or a show that ran too long. No need to call host.done() after it.
 *   resize()         The stage changed size, or the letters did (Settings → Text style): fit the names again.
 *   theme()          Light/dark or the accent color changed. CSS has the new colors already; redraw a canvas.
 *   destroy()        Another style was chosen: stop every timer and animation frame. (The host removes root.)
 *
 * `view`, a fresh object for each call (read it, don't change it):
 *   names      every name, in list order. Two students with the same name are two entries.
 *   picked     one true/false for each entry: picked in this round of No repeats, so out of the draw for the next
 *              pick. The last pick's winners are included. All false when No repeats is off.
 *              (So in play(view) the names that were in the draw are the ones not picked, plus the winners.)
 *   winners    the entries picked last time, in pick order (number 1 first): 1 to 6 of them, or none before the
 *              first pick and after Start over.
 *   pickId     changes with every pick (null before the first). The same pickId is the same pick.
 *   count      "Names at a time", 1 to 6, as the teacher chose it. Versus: always 2.
 *   next       how many the next pick will take: count, or fewer when fewer names are left (0: everyone has been
 *              picked, and the main button starts over). Versus: 2 until everyone has been picked, as the last one
 *              left is picked with someone else.
 *   noRepeats, quick   the menu's ticks. quick: make the show about 1.5 s long.
 *   reduced    the device asks for less motion (play() is never called then).
 *   groups     Groups: the entries in each group, one list per group in order (Group 1 first), each in deal order:
 *              [[4, 0, 9], [2, 7], …]. Every entry is in one group at most. [] before the first draw.
 *   groupId    changes with every draw of groups, as pickId does with picks (null before the first).
 *   bracket    Bracket: null before the first draw, else the bracket on the stage (see NamePicker.bracket below):
 *                seeds   its names, seed 1 first: a copy made at the draw, so editing the list doesn't change it.
 *                P       how many first-round spots: 2, 4, 8, 16, 32 or 64.
 *                at      for each spot 1 … 2P − 1, the seed in it (an index into seeds), or -1 for nobody yet.
 *                shown   for each spot, whether it is on the bracket (a bye's first-round pair isn't).
 *                picks   the taps so far, in order: each the spot whose name moved on.
 *                ready   the spots that can be tapped now (both names of a match there, no winner yet).
 *   bracketId  changes with every draw of a bracket, as pickId does (null before the first).
 *   versusLook Versus: the look the last pick plays in, an id in NamePicker.looks (see below). null: another style
 *              picked it, or a file named a look we don't have. Then choose one at random, once for that pick.
 *
 * `host`, one for each mount (its calls do nothing once the style is destroyed):
 *   host.done()                 the show has finished: the winners are on screen.
 *   host.pick()                 pick, as the main button does (for a control of the style's own, like SPIN).
 *   host.tap(spot)              Bracket: a tap (or Enter or Space) on a spot. If it is one of view.bracket.ready, its
 *                               name moves on: the host saves it, says it, and calls show(view, { moved: spot }).
 *                               Anything else, or a tap during the show, does nothing.
 *   host.sound(name, opts)      'tick' (a soft tick: the hopping light), 'click' (the wheel's clicker), 'clack'
 *                               (lotto balls knocking), 'pop' (a ball rolling out, a name landing), 'drum' (a soft
 *                               drum: Versus rolls it before the slam), 'slam' (a deep thud: Versus's emblem landing),
 *                               'chime' (the winners), 'challenge' (Versus's pair on screen), 'zap' (Bracket's
 *                               draw dealt), 'champion' (Bracket's champion).
 *                               opts: { volume: 0-1, pitch: 0.5-2 }. Silent unless Sound is ticked
 *                               and the window has been tapped; never throws. Don't call it more than ~30 times a
 *                               second.
 *   host.el(tag, cls, parent, text)   a new element; text goes in as text (a name is never markup).
 *   host.fitText(el, box, max, min)   sets el's font-size (px) to the largest at which el fits inside box's content
 *                               area, from max down to min. el must be as wide as its text (display: inline-block or
 *                               width: max-content; white-space: nowrap). Returns the size.
 *   host.token(name)            a theme value for a canvas: host.token('accent') is --b21-accent, host.token('font')
 *                               --b21-font, host.token('np-win') --np-win.
 *   host.zoom()                 how much bigger the board draws the window than its size here (1: the same). It is the
 *                               board's Size times how much the screen enlarges the 16:9 board: 0.57 at Size 80% on a
 *                               1366×768 Chromebook, 1.5 at Size 150% on a 1920×1080 panel. A canvas wants
 *                               devicePixelRatio × zoom pixels per CSS px to stay sharp (up to about 3); resize() is
 *                               called when it changes (once it stops changing: 150 ms after the last change).
 *
 * Versus's looks: each pick in Versus plays one of five VS emblems at random, its look. Each look is one file,
 * vs-<id>.js (vs-lightning.js, vs-forged.js, vs-crest.js, vs-comic.js, vs-flame.js), loaded by a <script> tag below,
 * listed in widgets/registry.js, and registered with NamePicker.look(id, emblem). The host deals the looks (see
 * dealLook()); style-versus.js draws them. An emblem:
 *   size, aspect     its box: height = size × the stage's smaller side, width = height × aspect. (Beside the names
 *                    the box takes at most 38% of the stage's width, so a narrow window leaves them room.)
 *   reach            optional: how far its art at rest goes past the box, above and below, as a share of the box's
 *                    height (0 when it stays inside). Names above and below the emblem clear it.
 *   hit              { normal, quick }: ms from the start of the slam's animations to the moment of impact
 *   css              optional; added to the page once
 *   markup(state, { dark, w, h })   SVG that fills the box: state 'final', or 'waiting' (no pair on the stage)
 *   slam(box, { quick, stage })     returns its Web Animations (fill 'both'). box is the emblem's div, centered on the
 *                    stage with translate(-50%, -50%); stage holds the sides, the slash (.vs-cut), the names and the box.
 *   impact(stage, { quick })        optional; returns its own Web Animations.
 *                    The show ends when they all finish, and the thud is timed from the first one's start. Neither is
 *                    called on 'waiting'.
 *
 * Colors and letters: use the board's CSS tokens (--b21-bg, -surface, -surface-2, -text, -muted, -border, -accent,
 * -on-accent, -accent-soft, -danger, -success, -warning, -radius, -font) and these extras, set below for light and
 * dark: --np-win (gold, for winners) with --np-ink (text on gold), and --np-c1 … --np-c8 (eight soft colors for
 * slices, tiles and balls). The demo page's names --np-bg, -surface, -text, -muted, -border, -accent, -on-accent,
 * -font-body and -font-display are the board's tokens too. Canvas text: host.token('font'), redrawn in resize().
 * The host handles taps on the stage during a show (skip, after the guard). Math.random is fine for decoration;
 * the winners come only from the host. A canvas on the stage can't be used to drag the window (the board's rule).
 * A spot you can tap is a plain element with a click listener: the board still moves the window when a drag starts
 * there, and then the click never comes.
 */
window.NamePicker = {
  styles: {},
  register(id, style) {
    if (typeof id !== 'string' || !style || typeof style.mount !== 'function') return;
    this.styles[id] = style;
    if (style.css) { const s = document.createElement('style'); s.dataset.style = id; s.textContent = style.css; document.head.appendChild(s); }
  },
  // Versus's looks (see above), by id, in the order they register.
  looks: {},
  look(id, emblem) {
    if (typeof id !== 'string' || !emblem || typeof emblem.markup !== 'function' || Object.prototype.hasOwnProperty.call(this.looks, id)) return;
    this.looks[id] = emblem;
    if (emblem.css) { const s = document.createElement('style'); s.dataset.look = id; s.textContent = emblem.css; document.head.appendChild(s); }
  },
  // Brackets, for the host and the Bracket style. N names (seeds, seed 1 first) go on a standard bracket of P first-round
  // spots, P the smallest power of 2 that is at least N. The spots are numbered as a tree: spot 1 is the champion's, the
  // two names in spots 2s and 2s + 1 play for spot s, and spots P … 2P − 1 are the first round. Seeds above N are byes:
  // a bye never meets a bye, and the student it meets starts in round 2.
  bracket: {
    size(n) { let P = 2; while (P < n) P *= 2; return P; },
    // The seeds of the first-round spots in order: 1 meets P, 2 meets P − 1, and so on, nested so that the top seeds meet
    // as late as they can, and the byes (the seeds above N) spread evenly over the halves and quarters. [1, 4, 2, 3] for 4.
    order(P) { let o = [1]; while (o.length < P) { const m = 2 * o.length + 1; o = o.flatMap(s => [s, m - s]); } return o; },
    // The bracket that seeds and these taps make (see `bracket` in view, above). A tap is the spot whose name moves on;
    // they count in order while each is one of the ready spots, and the rest are dropped.
    play(seeds, picks) {
      const N = seeds.length, P = this.size(N), o = this.order(P), at = new Array(2 * P).fill(-1), shown = new Array(2 * P).fill(true);
      shown[0] = false;
      for (let i = 0; i < P; i += 2) {
        if (o[i] <= N && o[i + 1] <= N) { at[P + i] = o[i] - 1; at[P + i + 1] = o[i + 1] - 1; }
        else { shown[P + i] = shown[P + i + 1] = false; at[(P + i) >> 1] = Math.min(o[i], o[i + 1]) - 1; }
      }
      const legal = s => Number.isInteger(s) && s >= 2 && s < 2 * P && at[s] >= 0 && at[s ^ 1] >= 0 && at[s >> 1] < 0;
      const kept = [];
      for (const s of picks || []) { if (!legal(s)) break; at[s >> 1] = at[s]; kept.push(s); }
      const ready = [];
      for (let s = 2; s < 2 * P; s++) if (legal(s)) ready.push(s);
      return { P, at, shown, picks: kept, ready };
    }
  }
};
</script>

<script src="style-wheel.js"></script>
<script src="style-spotlight.js"></script>

<script src="style-bracket.js"></script>
<style>
  :root {
    --np-bg: var(--b21-bg); --np-surface: var(--b21-surface); --np-text: var(--b21-text); --np-muted: var(--b21-muted); --np-border: var(--b21-border);
    --np-accent: var(--b21-accent); --np-on-accent: var(--b21-on-accent); --np-font-body: var(--b21-font); --np-font-display: var(--b21-font);
    --np-win: #f59e0b; --np-ink: #111827;
    --np-c1: #fca5a5; --np-c2: #fdba74; --np-c3: #fde047; --np-c4: #86efac; --np-c5: #67e8f9; --np-c6: #93c5fd; --np-c7: #c4b5fd; --np-c8: #f9a8d4;
  }
  [data-b21-theme="dark"] {
    --np-win: #fbbf24; --np-ink: #111827;
    --np-c1: #f87171; --np-c2: #fb923c; --np-c3: #facc15; --np-c4: #4ade80; --np-c5: #22d3ee; --np-c6: #60a5fa; --np-c7: #a78bfa; --np-c8: #f472b6;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  button, input, textarea { font-family: inherit; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: clamp(8px, 3vmin, 20px); box-sizing: border-box; gap: clamp(6px, 2vmin, 14px); }
  /* While the board is locked, the padlocks sit over the top corners of a window that fills it (--np-top: how far down
     they reach, from fitFoot()): the views start below them. Editing, Done sits in a top corner. */
  .view.clear-top { padding-top: calc(var(--np-top) + clamp(6px, 2vmin, 14px)); }
  .view.on { display: flex; }
  .stage { position: relative; flex: 1; min-height: 0; border-radius: 16px; background: var(--b21-surface); box-shadow: inset 0 0 0 1px var(--b21-border); overflow: hidden; }
  .showing .stage { cursor: pointer; }
  .style-root { position: absolute; inset: 0; }
  .style-root[hidden], #empty[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: var(--b21-muted); font-weight: 600; font-size: clamp(14px, min(5vw, 8vh), 40px); }
  /* The main button in the middle (in reach from either side of a flat panel), the status and Start over (Undo, in Bracket) beside it, all
     kept off the bottom corners, where the board's own buttons and clock sit over a window that fills the board
     (--np-corners: how far in they reach, from fitFoot()). Where that leaves too little room beside the main button
     (the status would need more than two lines, or Start over more than one), both go on a row above it. */
  .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; max-width: min(680px, 100vw - 2 * var(--np-corners, 0px)); margin: 0 auto; }
  .foot.stack { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); row-gap: 4px; }
  .foot.stack #go { grid-row: 2; grid-column: 1 / -1; justify-self: center; }
  .foot.stack:has(#round[hidden]):has(#undo[hidden]) #status { grid-column: 1 / -1; }
  .foot.measure #round, .foot.measure #undo { white-space: nowrap; }
  button { font: inherit; border: 0; cursor: pointer; border-radius: 999px; background: var(--b21-surface-2); color: var(--b21-text); height: clamp(36px, 12vh, 64px); padding: 0 clamp(12px, 4vw, 28px); font-size: clamp(14px, 4.5vh, 22px); font-weight: 650; }
  button.primary { background: var(--b21-accent); color: var(--b21-on-accent); min-width: min(40vw, 320px); white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
  button.small { height: auto; min-height: clamp(30px, 9vh, 44px); font-size: clamp(12px, 3.4vh, 16px); padding: 4px 14px; font-weight: 600; line-height: 1.1; }
  /* The status and Start over (or Undo) each sit in the middle of their space; the status wraps onto even lines. */
  #status { justify-self: center; text-align: center; text-wrap: balance; font-size: clamp(12px, 3.6vh, 17px); color: var(--b21-muted); line-height: 1.2; }
  #round, #undo { justify-self: center; }
  #undo:not([hidden]) { display: inline-flex; align-items: center; gap: .35em; padding-left: 11px; }
  #undo svg { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  textarea { flex: 1; min-height: 0; resize: none; border-radius: 12px; border: 1px solid var(--b21-border); background: var(--b21-surface); color: var(--b21-text); font: inherit; font-size: clamp(14px, 4vh, 20px); padding: 10px 12px; outline: none; line-height: 1.4; }
  textarea:focus { border-color: var(--b21-accent); }
  .edit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-size: clamp(14px, 4vh, 19px); }
  @media (max-height: 200px) { #status { visibility: hidden; } }
</style>
</head>
<body>
  <section class="view" id="pick">
    <div class="stage" id="stage"><div id="empty">Add names to get started</div></div>
    <div class="foot"><span id="status"></span><button class="primary" id="go">Pick a name</button><button class="small" id="round" hidden>Start over</button><button class="small" id="undo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button></div>
    <div class="sr" id="said" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>
  <section class="view" id="edit">
    <div class="edit-head"><span>One name per line</span><button class="small primary" id="done" style="min-width:0">Done</button></div>
    <textarea id="list" placeholder="Ada&#10;Grace&#10;Katherine&#10;…" spellcheck="false" aria-label="Names, one per line"></textarea>
  </section>
<script>
  // Content (Board21.save): { names, left, picked, pickId, current, versusLook, groups, groupId, bracket, bracketId }.
  // Names are content, so templates never carry them.
  //   names   the list. The same name can be in it more than once: two Emmas are two students.
  //   left    with No repeats: the names not picked yet in this round, once for each student still to go (null: all).
  //   picked  the winners of the last pick, in pick order; [] before the first pick and after Start over.
  //   pickId  a new one with every pick: when it was made (ms, base 36), a dash and a random part. A copy of the board
  //           that sees a new one shows the same winners: with the show if the pick is new and that copy is on screen
  //           and not busy, otherwise straight away.
  //   current picked[0], for copies of 21Board from before several winners (they only know names, left and current).
  //   versusLook  Versus: the look the pick plays in (see NamePicker.looks), so every copy and a reload show the same
  //           one; null for a pick made in another style. Saved with the pick.
  //   groups  Groups: the names in each group, one list per group, in deal order; [] before the first draw. Apart
  //           from the pick round: each keeps its own.
  //   groupId a new one with every draw of groups, made as pickId is, and ending with the menu's Groups number and how
  //           many groups that made: "…-43" is Groups 4 with 3 names. (So every copy, and a reload, knows whether the
  //           main button reads Shuffle again.)
  //   bracket Bracket: { seeds, picks, before }, or null before the first draw. Apart from the pick round and the groups.
  //           seeds: its names, seed 1 first (2 to 64), as they were at the draw: editing the list doesn't change it.
  //           picks: the taps in order, each the spot whose name moved on (see NamePicker.bracket). The bracket on the
  //           stage is always seeds played through picks. before: the bracket the last Shuffle again replaced, as
  //           { seeds, picks, id } (id: its bracketId), or null: Undo brings it back, with its id, once this one has no
  //           taps left. One level only.
  //   bracketId a new one with every draw of a bracket, made as pickId is: a copy that sees a new one plays the draw.
  // Config (Board21.saveConfig): { noRepeats, style: 'name' | 'wheel' | 'spotlight' | 'lotto' | 'versus' | 'groups' |
  //   'bracket', winners: 1-6, groups: 2-6, quick, sound }. Settings, so templates keep them. A new Name Picker starts as the wheel;
  //   one from before styles keeps Big name.
  const STYLES = [['name', 'Big name'], ['wheel', 'Spinning wheel'], ['spotlight', 'Spotlight'], ['lotto', 'Lotto'], ['versus', 'Versus'], ['groups', 'Groups'], ['bracket', 'Bracket']];
  const MOST = 6;           // names at a time
  const MOST_GROUPS = 6;    // groups (2 at least)
  const MOST_SEEDS = 64;    // names in a bracket (2 at least)
  const GUARD = 600;        // ms: a second tap this soon after Pick is a double tap, not "skip to the result"
  const FRESH = 10000;      // ms: a pick made in another copy this recently gets its show here too
  const $ = id => document.getElementById(id);
  const motion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reduced = () => !!(motion && motion.matches);

  let state = { names: [], left: null, picked: [], pickId: null, current: null, versusLook: null, groups: [], groupId: null, bracket: null, bracketId: null };
  let config = readConfig(null);
  let mounted = null;       // the style on the stage: { id, root, api, live }
  let showing = null;       // the show running: { at (when it started), timer (ends it if the style never says) }
  let editAsked = false;    // the names list was opened here on purpose (Edit names, Add names), not just for a new picker
  let drewAt = -1e9;        // when this copy last drew a pick, groups, or a bracket (performance.now())

  // How many of each name `list` holds, and taking one of them (false: none left). A long list from a file is read
  // once, not searched again for every name in it.
  const tally = list => { const m = new Map(); for (const n of list) m.set(n, (m.get(n) || 0) + 1); return m; };
  const takeOne = (m, n) => { const c = m.get(n); if (!c) return false; m.set(n, c - 1); return true; };
  // `list` without one of each name in `gone`.
  const without = (list, gone) => { const m = tally(gone); return list.filter(n => !takeOne(m, n)); };
  // The names of `list` that are in `names`, each student at most once, in the order of `list`.
  const among = (names, list) => { const m = tally(names); return list.filter(n => takeOne(m, n)); };

  // Saved content can come from an imported file, so it is checked before it is used: names are lines of text,
  // `left` and `picked` can only hold names that are in the list, and a pick is 1 to 6 names. Groups as picks are.
  const texts = v => Array.isArray(v) ? v.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : null;

  function tap(spot) {
    const B = !showing && bracketing() && pickVisible() && played();
    if (!B || !B.ready.includes(spot)) return;
    state.bracket.picks = B.picks.concat([spot]);
    save();
    moved({ moved: spot });
  }
  // Undo: the last tap, the name going back; with none left, the bracket the last Shuffle again replaced, with its taps
  // and its bracketId (so a copy that never saw the Shuffle again sees no new draw).
  function undo() {
    if (showing || !canUndo()) return;
    const b = state.bracket;
    if (b.picks.length) {
      const spot = b.picks[b.picks.length - 1];
      b.picks = b.picks.slice(0, -1);
      save();
      moved({ back: spot });
    } else {
      state.bracket = { seeds: b.before.seeds, picks: b.before.picks, before: null };
      if (b.before.id) state.bracketId = b.before.id;
      save();
      moved({ fade: true });
    }
  }
  // What screen readers hear for a tap: "Ava moves on.", or for the last one "Ava wins.".
  const tapSaid = spot => { const who = state.bracket.seeds[played().at[spot >> 1]]; return spot >> 1 === 1 ? `${who} wins.` : `${who} moves on.`; };
  // The stage and the foot after a tap or an Undo. The keyboard stays in the picker: a spot that had it passes it on (the
  // style's part), and when it can't, or Undo goes away, the main button takes it.
  function moved(how) {
    const had = document.activeElement, inStage = $('stage').contains(had);
    renderChrome();
    renderStage(how);
    if (how.moved) say(tapSaid(how.moved));
    keepKeys(had, inStage);
  }
  function keepKeys(had, inStage) {
    if ((inStage && !$('stage').contains(document.activeElement)) || (had === $('undo') && $('undo').hidden)) $('go').focus({ preventScroll: true });
  }
  function startShow() {
    say('');
    if (reduced() || document.hidden || !pickVisible() || !mounted || typeof mounted.api.play !== 'function') {
      render({ fade: true }); announce();
      // Reduce motion still plays the show's last sound, when Sound is ticked.
      if (reduced() && pickVisible()) Sound.play(ending());
      return;
    }
    showing = { at: performance.now(), timer: setTimeout(skipShow, config.quick ? 4000 : 10000) };
    document.body.classList.add('showing');
    render();
    if (!call('play', view())) { finishShow(); renderStage(); }
  }
  function finishShow() {
    if (!showing) return;
    clearTimeout(showing.timer);
    showing = null;
    document.body.classList.remove('showing');
    renderChrome();
    announce();
  }
  function skipShow() {
    if (!showing) return;
    const ok = call('skip');
    finishShow();
    if (!ok) renderStage();   // (the style couldn't jump to the end: draw the result as it is)
  }
  function startOver() {
    const had = document.activeElement === $('round');   // (it hides itself: the keyboard goes on from the main button)
    skipShow();
    state.left = state.names.slice(); state.picked = []; state.current = null; state.versusLook = null;
    save(); say(''); render();
    if (had && $('round').hidden) $('go').focus();
  }

  $('go').onclick = pick;
  // A key held down on the button picks once (its repeats would pick, skip and pick again).
  $('go').addEventListener('keydown', e => { if (e.repeat && (e.key === 'Enter' || e.key === ' ')) e.preventDefault(); });
  $('round').onclick = startOver;
  $('undo').onclick = undo;
  // A tap on the stage during the show skips to the result (not a second tap of a double tap, though).
  $('stage').addEventListener('click', () => { if (showing && performance.now() - showing.at >= GUARD) skipShow(); });
  // Nothing runs while the page can't be seen: a show ends there and then.
  document.addEventListener('visibilitychange', () => { if (document.hidden) skipShow(); });

  // The list is saved as it is typed, so it isn't lost if Done is never pressed. Editing it doesn't start the
  // round again: whoever was picked already stays picked, and new names join the ones still to go.
  function readList() {
    const names = $('list').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (names.join('\n') === state.names.join('\n')) return;
    const gone = without(state.names, state.left || state.names), picked = among(names, state.picked);
    state = { names, left: without(names, gone), picked, pickId: state.pickId, current: picked[0] || null, versusLook: state.versusLook, groups: regroup(names), groupId: state.groupId,
      bracket: state.bracket, bracketId: state.bracketId };   // (a bracket stays as it was drawn: Shuffle again uses the new list)
    if (!state.groups.length) state.groupId = null;
    save();
  }
  // The groups on screen, for an edited list: a name taken out leaves its group (a group left with no one goes, and the
  // ones after it move up), and a new name joins the smallest group (one of them at random).
  function regroup(names) {
    const room = tally(names);
    const groups = state.groups.map(g => g.filter(n => takeOne(room, n))).filter(g => g.length);
    if (groups.length) for (const n of names) {
      if (!takeOne(room, n)) continue;
      const least = Math.min(...groups.map(g => g.length)), small = groups.filter(g => g.length === least);
      small[random(small.length)].push(n);
    }
    return groups;
  }
  $('list').oninput = readList;
  $('done').onclick = () => { const had = document.activeElement === $('done'); readList(); setView('pick'); if (had) $('go').focus(); };

  // ---- Sound: off until a teacher ticks it. Made here with Web Audio (no sound files); the sound is started by
  // the first tap in the window (browsers allow sound only after one), and stays silent wherever it can't be.
  const Sound = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null, woke = 0, noiseBuf = null;
    let last = {};   // when each sound last played, on ctx's clock
    // One note from f0 to f1 Hz, `len` seconds long: a quick start, then it dies away.
    function tone(at, f0, f1, len, wave, vol) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = wave; o.frequency.setValueAtTime(f0, at);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + len);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + len + 0.02);
    }
    // A short burst of noise around one pitch: clicks and knocks.
    function noise(at, freq, q, len, vol) {
      if (!noiseBuf) {
        noiseBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.1), ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      // (Silent until it starts: a burst that starts between two samples would otherwise click, at full volume, on the
      // one before.)
      g.gain.setValueAtTime(0, 0); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      s.connect(f).connect(g).connect(ctx.destination); s.start(at); s.stop(at + len + 0.02);
    }
    // A note with a soft start and end, through a low-pass, so square, sawtooth, and pulse waves sound clean.
    // o: { cut: filter Hz, atk: seconds to full volume, sus: share left at the end, glide: seconds to f1, wob: [Hz, cents] }
    function synth(at, f0, f1, len, wave, vol, o = {}) {
      const s = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(), atk = o.atk || 0.008;
      if (wave !== 'pulse') s.type = wave;   // (pulse: a 25% pulse wave, the reedy lead of an arcade game)
      else s.setPeriodicWave(ctx.createPeriodicWave(Float32Array.from({ length: 32 }, (_, k) => k && Math.sin(Math.PI * k / 4) / k), new Float32Array(32)));
      s.frequency.setValueAtTime(f0, at);
      if (f1 !== f0) s.frequency.exponentialRampToValueAtTime(f1, at + (o.glide || len));
      f.type = 'lowpass'; f.frequency.value = o.cut || 3000; f.Q.value = 0.5;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + atk);
      g.gain.exponentialRampToValueAtTime(vol * (o.sus || 0.35), at + Math.max(atk + 0.005, len - 0.04));
      g.gain.linearRampToValueAtTime(0, at + len);
      if (o.wob) {   // (a shiver: the pitch wobbles wob[0] times a second, wob[1] cents each way)
        const w = ctx.createOscillator(), d = ctx.createGain();
        w.frequency.value = o.wob[0]; d.gain.value = o.wob[1]; w.connect(d).connect(s.detune); w.start(at); w.stop(at + len + 0.02);
      }
      s.connect(f).connect(g).connect(ctx.destination); s.start(at); s.stop(at + len + 0.02);
    }
    // Noise through a band-pass sweeping from f0 to f1 Hz, swelling in, then cut short: the fizz of a spark.
    function fizz(at, f0, f1, len, q, vol) {
      const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * (len + 0.03)), ctx.sampleRate), x = b.getChannelData(0);
      for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = b; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(f1, at + len);
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + len * 0.75); g.gain.linearRampToValueAtTime(0, at + len);
      s.connect(f).connect(g).connect(ctx.destination); s.start(at); s.stop(at + len + 0.02);
    }
    // (v: volume 0-1, p: pitch)
    const SOUNDS = {
      tick: (t, v, p) => tone(t, 1900 * p, 1700 * p, 0.035, 'triangle', 0.08 * v),
      click: (t, v, p) => { noise(t, 2800 * p, 1.6, 0.025, 0.45 * v); tone(t, 1200 * p, 700 * p, 0.02, 'square', 0.025 * v); },
      clack: (t, v, p) => { tone(t, 950 * p, 620 * p, 0.06, 'triangle', 0.14 * v); noise(t, 1600 * p, 3, 0.03, 0.22 * v); },
      pop: (t, v, p) => tone(t, 640 * p, 260 * p, 0.12, 'sine', 0.3 * v),
      // A short, deep thud: a sine sweeping down from 150 Hz to 45 Hz, with a low burst of noise. No louder than the chime.
      slam: (t, v, p) => { tone(t, 150 * p, 45 * p, 0.35, 'sine', 0.2 * v); noise(t, 90 * p, 0.7, 0.09, 0.2 * v); },
      // A soft drum: a short tap of noise with a low body, no louder than a tick. Versus rolls it, faster and faster.
      drum: (t, v, p) => { noise(t, 1500 * p, 0.9, 0.045, 0.07 * v); tone(t, 210 * p, 150 * p, 0.05, 'sine', 0.018 * v); },
      chime: (t, v, p) => { tone(t, 1046.5 * p, 1046.5 * p, 0.8, 'sine', 0.2 * v); tone(t + 0.12, 1318.5 * p, 1318.5 * p, 1, 'sine', 0.18 * v); tone(t + 0.24, 1568 * p, 1568 * p, 1.3, 'sine', 0.15 * v); },
      // Pixel rally, once Versus's pair is on screen: a quick arcade tune jumps up four notes and holds the last.
      challenge: (t, v, p) => {
        const lead = (at, f, len) => synth(t + at, f * p, f * p, len, 'pulse', 0.12 * v, { sus: 0.7 });
        const pad = (at, f, len, wave, vol) => synth(t + at, f * p, f * p, len, wave, vol * v);
        // D, A, C, then D, bent up into place with a shiver, over D major. The bass steps from C up to D.
        lead(0, 587.3, 0.07); pad(0, 293.7, 0.15, 'triangle', 0.04);
        lead(0.075, 880, 0.07);
        lead(0.15, 1046.5, 0.14); pad(0.15, 261.6, 0.14, 'triangle', 0.04);
        synth(t + 0.3, 1108.7 * p, 1174.7 * p, 0.85, 'pulse', 0.12 * v, { glide: 0.04, wob: [6, 15] });
        pad(0.3, 740, 0.8, 'square', 0.04); pad(0.3, 880, 0.8, 'square', 0.035);
        pad(0.3, 293.7, 0.85, 'triangle', 0.04); pad(0.3, 587.3, 0.85, 'triangle', 0.04);
      },
      // Neon zap, when Bracket's draw is dealt: an electric zap shoots up and lands on a bright ba-BAM chord.
      zap: (t, v, p) => {
        // The zap: two sawtooths rise two octaves, with a shiver and a fizz.
        synth(t, 220 * p, 880 * p, 0.24, 'sawtooth', 0.083 * v, { cut: 2600, atk: 0.2, sus: 0.6, wob: [30, 40] });
        synth(t, 440 * p, 1760 * p, 0.24, 'sawtooth', 0.042 * v, { cut: 3500, atk: 0.2, sus: 0.6, wob: [30, 40] });
        fizz(t, 900 * p, 3200 * p, 0.24, 3, 0.12 * v);
        // Then it lands, ba-BAM: an A power chord, then A major.
        const hit = (at, len, top) => {
          synth(at, 220 * p, 220 * p, len, 'triangle', 0.036 * v);
          synth(at, 440 * p, 440 * p, len, 'triangle', 0.06 * v);
          synth(at, 440 * p, 440 * p, len, 'square', 0.065 * v);
          synth(at, 659.3 * p, 659.3 * p, len, 'square', 0.054 * v);
          synth(at, top * p, top * p, len, 'square', 0.048 * v, { wob: [6, 12] });
        };
        hit(t + 0.23, 0.1, 880);
        hit(t + 0.34, 0.85, 1108.7);
      },
      // Neon zap for the champion: it zaps up once more, one step higher.
      champion: (t, v, p) => {
        // The zap's rise and ba-BAM, shorter.
        synth(t, 220 * p, 880 * p, 0.24, 'sawtooth', 0.083 * v, { cut: 2600, atk: 0.2, sus: 0.6, wob: [30, 40] });
        synth(t, 440 * p, 1760 * p, 0.24, 'sawtooth', 0.042 * v, { cut: 3500, atk: 0.2, sus: 0.6, wob: [30, 40] });
        fizz(t, 900 * p, 3200 * p, 0.24, 3, 0.12 * v);
        const hit = (at, len, root, top) => {
          synth(at, root / 2 * p, root / 2 * p, len, 'triangle', 0.036 * v);
          synth(at, root * p, root * p, len, 'triangle', 0.06 * v);
          synth(at, root * p, root * p, len, 'square', 0.065 * v);
          synth(at, root * 1.4983 * p, root * 1.4983 * p, len, 'square', 0.054 * v);
          synth(at, top * p, top * p, len, 'square', 0.048 * v, { wob: [6, 12] });
        };
        hit(t + 0.23, 0.1, 440, 880);
        hit(t + 0.34, 0.26, 440, 1108.7);
        // A second zap lifts it a whole step, to B major.
        synth(t + 0.56, 494 * p, 1976 * p, 0.13, 'sawtooth', 0.054 * v, { cut: 3500, atk: 0.11, sus: 0.6, wob: [30, 40] });
        fizz(t + 0.56, 1200 * p, 3600 * p, 0.13, 3, 0.107 * v);
        hit(t + 0.68, 0.9, 493.9, 1244.5);
      }
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    return {
      // A tap in the window: the sound can start now (only if Sound is ticked).
      wake() {
        if (!config.sound || !AC || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
        try {
          // (A new sound's clock starts again at 0, so the times kept from the last one mean nothing to it.)
          if (!ctx || ctx.state === 'closed') { ctx = new AC(); last = {}; }
          if (ctx.state !== 'running') { woke = performance.now(); ctx.resume().catch(() => {}); }
        } catch (e) { ctx = null; /* no sound on this device */ }
      },
      play(name, opts) {
        // (A sound that has just been started may still be getting ready: notes wait for it.)
        if (!config.sound || !ctx || document.hidden || !SOUNDS[name]) return;
        if (ctx.state !== 'running' && !(ctx.state === 'suspended' && performance.now() - woke < 1000)) return;
        const o = opts || {}, v = clamp(o.volume == null ? 1 : Number(o.volume) || 0, 0, 1), p = clamp(Number(o.pitch) || 1, 0.5, 2);
        const t = ctx.currentTime;
        if (!(v > 0) || t - (last[name] == null ? -1 : last[name]) < 0.015) return;   // (no pile-up of one sound)
        last[name] = t;
        try { SOUNDS[name](t + 0.005, v, p); } catch (e) { /* no sound on this device */ }
      },
      // What it sounds like, when Sound is ticked: the sound this style's show ends on.
      sample() {
        this.wake();
        if (ctx) Promise.resolve(ctx.state === 'running' || ctx.resume()).then(() => this.play(ending()), () => {});
      },
      stop() { if (ctx) ctx.close().catch(() => {}); ctx = null; }
    };
  })();
  for (const type of ['pointerdown', 'click', 'keydown']) addEventListener(type, () => Sound.wake(), true);

  // ---- The window menu: everything is here, nothing on the window for students to change.
  Board21.on('menu', id => {
    drewAt = -1e9;   // (a choice here between two taps on the main button: they are no double tap)
    const [what, val] = String(id).split(':');
    if (what === 'style' && STYLES.some(s => s[0] === val)) {
      skipShow();     // (a show ends first, with its own result read out, before the stage changes)
      config.style = val; saveConfig();
      mountStyle();
      render();
    } else if (what === 'winners' && +val >= 1 && +val <= MOST) {
      skipShow(); config.winners = +val; saveConfig(); render();
    } else if (what === 'groups' && +val >= 2 && +val <= MOST_GROUPS) {
      skipShow(); config.groups = +val; saveConfig(); render();   // (the groups on screen stay: the button says Make 3 groups)
    } else if (id === 'norepeat') {
      skipShow();
      config.noRepeats = !config.noRepeats;
      if (config.noRepeats) state.left = state.names.slice();   // a new round
      saveConfig(); save(); render();
    } else if (id === 'round') startOver();
    else if (id === 'edit') setView('edit', true);
    else if (id === 'sound') {
      config.sound = !config.sound; saveConfig(); setMenu();
      // No sample during a show. Its own sounds play.
      if (config.sound) { if (showing) Sound.wake(); else Sound.sample(); } else Sound.stop();
    } else if (id === 'quick') { config.quick = !config.quick; saveConfig(); setMenu(); }
  });

  // ---- Changed in another copy of the board (another tab, the smartboard), or by an import.
  Board21.on('data', d => {
    const next = readState(d), was = state;
    if (JSON.stringify(next) === JSON.stringify(state)) return;   // (nothing new: a show running goes on)
    const had = document.activeElement, inStage = $('stage').contains(had);
    skipShow();
    state = next;
    if ($('edit').classList.contains('on')) {
      // Names from another copy close a names list that opened here only because there were none (a new picker, or one
      // reset in another copy), unless someone is typing in it here or opened it from the menu. (Drawn below.)
      if (state.names.length && !editAsked && !(document.hasFocus() && document.activeElement === $('list'))) setView('pick', false, false);
      else $('list').value = state.names.join('\n');
    }
    const newPick = !!state.pickId && state.pickId !== was.pickId && state.picked.length > 0;
    if (newPick) lookPlayed(state.versusLook);   // (so this copy doesn't play it again next)
    const newGroups = !!state.groupId && state.groupId !== was.groupId && state.groups.length > 0;
    // (Undo brings back the bracket before, with its own bracketId: no new draw.)
    const undone = !!(was.bracket && was.bracket.before && was.bracket.before.id === state.bracketId);
    const newBracket = !!state.bracketId && state.bracketId !== was.bracketId && !!state.bracket && !undone;
    const isNew = grouping() ? newGroups : bracketing() ? newBracket : newPick, made = grouping() ? state.groupId : bracketing() ? state.bracketId : state.pickId;
    // A pick (or groups, or a bracket) made just now gets its show here too (if this copy is on screen); an older one is
    // shown as it is. A tap in a bracket just shows, and screen readers here hear it too.
    if (isNew && Math.abs(Date.now() - pickedAt(made)) < FRESH) startShow();
    else { render(isNew ? { fade: true } : undefined); if (isNew) announce(); }
    const b0 = was.bracket, b1 = state.bracket;
    if (bracketing() && !isNew && b0 && b1 && b1.picks.length === b0.picks.length + 1 && b1.seeds.join('\n') === b0.seeds.join('\n')) say(tapSaid(b1.picks[b1.picks.length - 1]));
    // The keyboard, if it is in this window, stays in the picker when the spot or Undo it was on goes.
    if (document.hasFocus()) keepKeys(had, inStage);
  });
  Board21.on('config', c => {
    const next = readConfig(c);
    if (!c && !state.names.length) next.style = 'wheel';   // (reset in another copy: it starts again as a new one)
    const changed = ['style', 'winners', 'groups', 'noRepeats'].some(k => next[k] !== config[k]);
    if (changed) skipShow();   // (before the change: the show's own result is read out)
    config = next;
    if (!config.sound) Sound.stop();
    if (changed) { mountStyle(); render(); }
    else renderChrome();
  });
  Board21.on('theme', () => call('theme'));
  // Names fit the stage: again when the window changes size, or the letters change (the SDK fires 'resize' then),
  // or the board draws the window at another size (Board21's 'resize': host.zoom() changed). On the 16:9 board the
  // zoom changes with almost every step of resizing the browser window: that refit waits until it stops (150 ms).
  let refitting = 0, zoomWas = 0, zoomTimer = 0;
  const refit = () => { if (!refitting) refitting = requestAnimationFrame(() => { refitting = 0; if (pickVisible() && staged()) call('resize'); }); };
  addEventListener('resize', () => { refit(); fitFoot(); });
  Board21.on('resize', () => {
    fitFoot();
    if (zoom() !== zoomWas) { zoomWas = zoom(); clearTimeout(zoomTimer); zoomTimer = setTimeout(refit, 150); }
  });
  if (window.ResizeObserver) new ResizeObserver(refit).observe($('stage'));

  Board21.ready().then(ctx => {
    state = readState(ctx.data);
    config = readConfig(ctx.config);
    lookPlayed(state.versusLook);
    // A brand-new Name Picker opens as the Spinning wheel. One that already has names or settings (from before there
    // were styles) keeps Big name, as it looked before.
    if (!ctx.config && !state.names.length) { config.style = 'wheel'; saveConfig(); }
    mountStyle();
    setView(state.names.length ? 'pick' : 'edit');
    announce();
  });
</script>
</body>
</html>

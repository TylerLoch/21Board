<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../../sdk/board21.js"></script>
<script type="application/json" id="board21-widget">
  {"id": "youtube-player", "name": "YouTube Player", "version": "1.0.0", "window": {"width": 480, "height": 270, "minWidth": 200, "minHeight": 200}}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Player</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font);
    font-size: clamp(15px, 4.5vmin, 20px); overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  [hidden] { display: none !important; }
  /* The link box. (In a small window the help line gives way and the rest packs closer.) */
  #ask { box-sizing: border-box; height: 100%; overflow: auto; display: flex; padding: clamp(12px, 5vmin, 32px); }
  #ask .box { margin: auto; width: 100%; max-width: 28em; display: flex; flex-direction: column; gap: .6em; }
  h1 { margin: 0; font-size: 1.25em; font-weight: 700; line-height: 1.25; }
  #help { margin: -.3em 0 0; color: var(--b21-muted); line-height: 1.35; }
  @media (max-height: 250px) { #help { display: none; } }
  input {
    box-sizing: border-box; width: 100%; min-width: 0; height: clamp(48px, 13vmin, 60px); padding: 0 .7em;
    font: inherit; color: var(--b21-text); background: var(--b21-surface); border: 2px solid var(--b21-border); border-radius: var(--b21-radius);
    outline: none; user-select: text; -webkit-user-select: text;
  }
  input::placeholder { color: var(--b21-muted); opacity: 1; }
  input:focus { border-color: var(--b21-accent); box-shadow: 0 0 0 3px var(--b21-accent-soft); }
  #err { margin: 0; color: var(--b21-danger); font-weight: 600; line-height: 1.3; }
  .buttons { display: flex; flex-wrap: wrap; gap: .5em; }
  button {
    flex: 1 1 auto; height: clamp(48px, 13vmin, 60px); padding: 0 1.1em; border: 0; border-radius: 999px; cursor: pointer;
    font: inherit; font-weight: 700; color: var(--b21-text); background: var(--b21-surface-2);
  }
  button:active { filter: brightness(.92); }
  button.primary { background: var(--b21-accent); color: var(--b21-on-accent); }
  @media (max-width: 280px), (max-height: 230px) {
    #ask { padding: 8px 10px; }
    #ask .box { gap: .4em; }
    h1 { font-size: 1em; }   /* (one line at 200 px in every text style) */
    button { padding: 0 .5em; font-size: 14px; }   /* (Cancel and Show video side by side at 200 px) */
  }
  /* The player: YouTube's own page, filling the window on black. Nothing is drawn over it (YouTube's rules), so in a
     window that fills the board it ends above the board's own buttons and clock in the bottom corners (--clear). */
  #player { position: fixed; inset: 0; background: #000; }
  #player iframe { position: absolute; inset: 0 0 auto; width: 100%; height: calc(100% - var(--clear, 0px)); border: 0; display: block; }
  #offline { position: fixed; inset: 0; box-sizing: border-box; padding: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4em; text-align: center; }
  #offline p { margin: 0; max-width: 24em; line-height: 1.35; }
  #offline p:first-child { font-weight: 700; font-size: 1.1em; }
  #offline p + p { color: var(--b21-muted); }
</style>
</head>
<body>
  <form id="ask" novalidate autocomplete="off" hidden>
    <div class="box">
      <h1>Show a YouTube video</h1>
      <p id="help">Paste the link to a video on YouTube.</p>
      <input id="link" type="url" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="youtube.com/watch?v=…" aria-label="Link to a YouTube video" aria-describedby="help err">
      <p id="err" role="alert" hidden></p>
      <div class="buttons"><button type="button" id="cancel" hidden>Cancel</button><button type="submit" id="go" class="primary">Show video</button></div>
    </div>
  </form>
  <div id="player" hidden></div>
  <div id="offline" role="status" hidden><p>YouTube needs an internet connection.</p><p>The video comes back once this device is online again.</p></div>
<script>
  // Content (Board21.save): { videoId, videoUrl, start, history }, or { videoId: null, videoUrl: '', history } for no
  // video.
  //   videoId: the video's 11-character YouTube id. videoUrl: its link as it was pasted (Change video shows it again).
  //   start: where the video starts, in whole seconds, from the link's t= or start= (left out: from the beginning).
  //   history: the window menu's History, the last 5 different videos shown in this window, newest first, the one
  //   showing among them: [{ videoId, videoUrl, start, title }], each as above, and title: the video's title from
  //   YouTube (cleaned, at most 200 characters; left out until it is known, and saved with the window's next change:
  //   see Titles). A video is listed once (the same videoId and start). Remove video keeps the history; a Reset clears
  //   it. Content from before the History (no history) is read as a history of just its video (or, arriving while the
  //   window is open, keeps the history it has, its video moved to the top).
  //   No video is saved as content of its own, not cleared: in Board Sync, content cleared (null) gives way to a video
  //   picked on another device at the same time, so a later Remove video would lose. (A Reset, or a window from a
  //   blank template, has null: no video either.)
  // No config.
  //
  // The video is YouTube's own embedded player, in a frame that fills the window. YouTube's rules for embeds: nothing
  // drawn over any part of the player (so its controls are in the window menu, and in a window that fills the board it
  // ends above the board's own buttons and clock: keepClear), at least 200 × 200 px (keepMinimum),
  // a Referer, no autoplay, and no playing out of sight. The frame is removed whenever the link box or the offline
  // message takes its place (Change video, Remove video here or anywhere else, a Reset, going offline), so nothing goes
  // on playing behind them. (A window that is closed, or on a page that isn't shown, has no frame at all: the board
  // removes it.) Taps on the video go to YouTube's page and never reach this one or the board, so they don't bring the
  // window forward or move it: that is done by its title bar.

  // Titles, for the History. When a video is shown here (from the link box or the History), the widget asks YouTube's
  // oEmbed for its title, with no cookies and no Referer (YouTube answers the board's site: it allows it by CORS). The
  // video never waits for it. A title is shown as soon as it comes, and saved with the window's next change (another
  // video, Remove video), so other tabs and devices, a reload and an export then have it without asking. It is never
  // saved by itself: Board Sync would count that as a newer change, and it would win over a video picked on another
  // device in the meantime. So each tab and device asks for the titles its History is missing: when the window opens
  // online, when content without them arrives, and when the device comes back online; once per video per page load,
  // and MAX_ASKING requests at most at a time in each window. Until a title is known (not yet, offline, a private or
  // removed video, the school's filter, no answer within TITLE_WAIT), the label is "YouTube video" and the id.

  // Where the player comes from. www.youtube.com, so that on a Chromebook the school's YouTube settings for the
  // signed-in student (Restricted Mode) apply to it. To use youtube-nocookie.com instead, change this one line to
  // 'https://www.youtube-nocookie.com' (ask the district's tech team first: Restricted Mode set by Chrome policy may
  // not reach it).
  const EMBED_HOST = 'https://www.youtube.com';

  const ID_RE = /^[A-Za-z0-9_-]{11}$/;
  const isId = s => ID_RE.test(s) && s !== 'videoseries';   // (embed/videoseries is a playlist's embed address, not a video)
  const MAX_LINK = 2000, MAX_START = 86400;   // characters; seconds (a day)
  const HISTORY_MAX = 5, MAX_TITLE = 200;   // videos; characters
  // A History label: two lines of the board's menu, in narrow letters (widths); the board cuts one at 80 UTF-16 units.
  const LABEL_MAX = 48, LABEL_UNITS = 80;
  const OEMBED = 'https://www.youtube.com/oembed', TITLE_WAIT = 5000, MAX_ASKING = 5;   // ms; requests
  const $ = id => document.getElementById(id);
  const ask = $('ask'), link = $('link'), err = $('err'), cancel = $('cancel'), player = $('player'), offline = $('offline');

  // "1h2m3s", "1m30s", "90s" or "90" → seconds (0: none, or not a time).
  function seconds(t) {
    const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/i.exec(String(t || '').trim());
    if (!m || !(m[1] || m[2] || m[3])) return 0;
    const s = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    return s > 0 && s <= MAX_START ? s : 0;
  }
  // A link to a YouTube video, or just the video's id → { id, start, link } (link: the part of the text that is the
  // link, so a sentence, quotes or brackets around it are left out, as is the rest of YouTube's Share › Embed code).
  // null if it isn't one.
  function parseLink(text) {
    const all = String(text == null ? '' : text).trim();
    if (isId(all)) return { id: all, start: 0, link: all };
    for (const word of all.split(/[\s"'\u200b-\u200d\u2060]+/)) {
      const v = fromAddress(word.replace(/^[(<\[]+|[)>\].,;:!?]+$/g, ''));
      if (v) return v;
    }
    return null;
  }
  // youtube.com (www., m., music.) /watch?v=…, /embed/…, /v/…, /shorts/…, /live/…; youtube-nocookie.com; youtu.be/….
  function fromAddress(word) {
    let u;
    try { u = new URL(/^[a-z][a-z\d+.-]*:\/\//i.test(word) ? word : 'https://' + word); } catch (e) { return null; }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
    const host = u.hostname, path = u.pathname.split('/').filter(Boolean);
    let id = null;
    if (host === 'youtu.be' || host === 'www.youtu.be') id = path.length === 1 ? path[0] : null;
    else if (/^((www|m|music)\.)?youtube\.com$/.test(host) || /^(www\.)?youtube-nocookie\.com$/.test(host)) {
      if (path.length === 1 && path[0] === 'watch') id = u.searchParams.get('v');
      else if (path.length === 2 && /^(embed|v|shorts|live)$/.test(path[0])) id = path[1];
    }
    if (!id || !isId(id)) return null;
    const t = u.searchParams.get('t') || u.searchParams.get('start') || new URLSearchParams(u.hash.slice(1)).get('t');
    return { id, start: seconds(t), link: word };
  }

  let video = null;       // the saved video: { videoId, videoUrl, start } (readVideo), or null
  let history = [];       // the History, newest first: [{ videoId, videoUrl, start, title }] (readHistory)
  const titles = new Map();   // videoId → the title YouTube gave this page (see Titles, above)
  let changing = false;   // the link box shows in place of a saved video (Change video): Cancel puts the video back
  let frame = null;       // YouTube's frame, while the player shows
  let kiosk = false;      // ChromeOS kiosk: no new windows, so no Open on YouTube
  let started = false;

  // Saved content can come from an imported file or another device, so it is checked before it is used: anything
  // else is no video. A damaged entry of the history is left out (the rest is kept), as is a damaged start or title.
  function readEntry(d) {
    if (!d || typeof d !== 'object' || typeof d.videoId !== 'string' || !isId(d.videoId) || typeof d.videoUrl !== 'string' || d.videoUrl.length > MAX_LINK) return null;
    const e = { videoId: d.videoId, videoUrl: d.videoUrl, start: Number.isInteger(d.start) && d.start > 0 && d.start <= MAX_START ? d.start : 0 };
    const title = cleanTitle(d.title);
    if (title) e.title = title;
    return e;
  }
  function readVideo(d) { const v = readEntry(d); if (v) delete v.title; return v; }
  // The history saved in d, with its video v (readVideo) among the five, at the top if it wasn't.
  function readHistory(d, v) {
    const list = [];
    for (const x of d && Array.isArray(d.history) ? d.history.slice(0, 50) : []) {
      const e = readEntry(x);
      if (e && !list.some(o => sameEntry(o, e))) list.push(e);
    }
    const i = v ? list.findIndex(o => sameEntry(o, v)) : -1;
    if (v && (i < 0 || i >= HISTORY_MAX)) list.unshift(i < 0 ? Object.assign({}, v) : list.splice(i, 1)[0]);
    return list.slice(0, HISTORY_MAX);
  }
  // A title is another site's text: only ever used as text (the board escapes the menu's labels too), with control
  // characters and direction overrides taken out, white space collapsed, and MAX_TITLE characters at most. '': none,
  // as for a title with nothing to see in it (only zero-width characters, say: the label is then the video's id).
  function cleanTitle(t) {
    if (typeof t !== 'string') return '';
    const s = t.slice(0, 2000).replace(/\s+/g, ' ').replace(/[\p{Cc}\u202a-\u202e\u2066-\u2069]/gu, '').replace(/ {2,}/g, ' ').trim();
    const c = Array.from(s).slice(0, MAX_TITLE).join('').trim();
    return /[^\p{Cf}\p{Mn}\p{Me}\p{Z}\u115f\u1160\u2800\u3164\uffa0]/u.test(c) ? c : '';
  }
  const sameVideo = (a, b) => !!a && !!b && a.videoId === b.videoId && a.videoUrl === b.videoUrl && a.start === b.start;
  const sameEntry = (a, b) => a.videoId === b.videoId && a.start === b.start;   // (the same video, in the History)
  const keyOf = e => e.videoId + ':' + e.start;
  const embedUrl = v => `${EMBED_HOST}/embed/${v.videoId}?rel=0&iv_load_policy=3&playsinline=1${v.start ? '&start=' + v.start : ''}`;
  const watchUrl = v => `https://www.youtube.com/watch?v=${v.videoId}${v.start ? '&t=' + v.start + 's' : ''}`;

  function save() {
    const d = video ? Object.assign({ videoId: video.videoId, videoUrl: video.videoUrl }, video.start ? { start: video.start } : {}) : { videoId: null, videoUrl: '' };
    d.history = history.map(e => {
      const title = e.title || titles.get(e.videoId);
      return Object.assign({ videoId: e.videoId, videoUrl: e.videoUrl }, e.start ? { start: e.start } : {}, title ? { title } : {});
    });
    Board21.save(d).catch(() => {});   // (not stored yet: the board keeps it, says so and tries again)
  }

  // What the window shows: the link box (no video, or Change video), the offline message, or the player.
  function show() {
    const view = !video || changing ? 'ask' : navigator.onLine === false ? 'offline' : 'player';
    if (view !== 'player') dropFrame();
    else if (!frame || frame.dataset.src !== embedUrl(video)) startPlayer();   // (the same video goes on playing)
    ask.hidden = view !== 'ask';
    offline.hidden = view !== 'offline';
    player.hidden = view !== 'player';
    cancel.hidden = !(view === 'ask' && video);
    setMenu();
  }
  function startPlayer() {
    dropFrame();
    const f = document.createElement('iframe');
    f.title = 'YouTube video player';
    f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');   // (the browser's default, stated: YouTube's embeds need the Referer)
    f.src = f.dataset.src = embedUrl(video);
    player.appendChild(f);
    frame = f;
  }
  // Removing the frame ends YouTube's page in it, and so the sound.
  function dropFrame() { if (frame) { frame.remove(); frame = null; } }

  // Window menu: the player's controls (nothing may be drawn over the player itself), then the History, the video
  // showing checked. (The link box: just the History.)
  let menuNow = null;
  function setMenu() {
    const items = !video || changing ? [] : [
      { id: 'change', label: 'Change video' },
      ...(kiosk ? [] : [{ id: 'open', label: 'Open on YouTube' }]),
      { separator: true },
      { id: 'remove', label: 'Remove video' }
    ];
    if (history.length) {
      if (items.length) items.push({ separator: true });
      const labels = history.map(e => labelOf(e)), twice = l => labels.filter(x => x === l).length > 1;
      items.push({ heading: true, label: 'History' }, ...history.map((e, i) => ({ id: 'history:' + keyOf(e), label: twice(labels[i]) ? labelOf(e, true) : labels[i], checked: !!video && sameEntry(e, video) })));
    }
    const sig = JSON.stringify(items);
    if (sig !== menuNow) { menuNow = sig; Board21.menu.set(items); }
  }
  // A History item's label: the video's title (until it is known, "YouTube video" and its id), shortened to two lines
  // of the board's menu, with its start time after it ("(from 1:30)": the same video from another time is listed apart).
  // both: keep the title's end as well (its label would be the same as another's: ends).
  function labelOf(e, both) {
    const from = e.start ? ` (from ${clock(e.start)})` : '';
    return (both ? ends : shorten)(e.title || titles.get(e.videoId) || `YouTube video ${e.videoId}`, LABEL_MAX - from.length, LABEL_UNITS - from.length) + from;
  }
  // 90 → "1:30"; 3723 → "1:02:03"
  function clock(s) {
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }
  // Text as the characters one sees (an emoji made of several code points is one), where the browser can tell.
  const seg = typeof Intl === 'object' && typeof Intl.Segmenter === 'function' ? new Intl.Segmenter() : null;
  const chars = t => (seg ? Array.from(seg.segment(t), x => x.segment) : Array.from(t));
  // How wide each character is, in narrow letters: Chinese, Japanese, Korean, a fullwidth form or an emoji 2, and in a
  // title in capitals a capital 4/3, so that a label is two lines of the board's menu in any script.
  const WIDE = /[\u1100-\u115f\u2e80-\u303e\u3041-\u33ff\u3400-\u4dbf\u4e00-\u9fff\ua000-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe4f\uff00-\uff60\uffe0-\uffe6\ufe0f\u{20000}-\u{3fffd}]|\p{Emoji_Presentation}/u;
  function widths(c) {
    const caps = c.filter(x => /\p{Lu}/u.test(x)).length > c.filter(x => /\p{Ll}/u.test(x)).length;
    return c.map(x => (WIDE.test(x) ? 2 : caps && /\p{Lu}/u.test(x) ? 4 / 3 : 1));
  }
  const sum = a => a.reduce((s, x) => s + x, 0);
  // Text wider than n, or longer than units (UTF-16 code units), cut at a word, with … (a word the cut leaves in an
  // open bracket goes too, and any separator before the …).
  function shorten(t, n, units) {
    const c = chars(t), w = widths(c);
    if (sum(w) <= n && t.length <= units) return t;
    let k = 0, sw = 0, su = 0;
    while (k < c.length && sw + w[k] <= n - 1 && su + c[k].length <= units - 1) { sw += w[k]; su += c[k].length; k++; }
    const s = c.slice(0, k).join(''), i = k < c.length && /\s/.test(c[k]) ? s.length : s.lastIndexOf(' ');
    const cut = (i >= s.length * 0.6 ? s.slice(0, i) : s).replace(/\s+[(\[{][^)\]}]*$/u, '').replace(/[\s|:;,.·•/&+\-–—([{]+$/u, '');
    return (cut || s) + '…';
  }
  // The same, keeping the text's end as well, from a word, at most half of it: for videos of one series, whose titles
  // start the same ("Phonics for Kids | Learn to… Lesson 2: Short E", not "Phonics for Kids | Learn to Read with…").
  function ends(t, n, units) {
    const c = chars(t), w = widths(c);
    if (sum(w) <= n && t.length <= units) return t;
    let k = c.length, sw = 0, su = 0;
    while (k > 0 && sw + w[k - 1] <= n / 2 && su + c[k - 1].length <= units / 2) { k--; sw += w[k]; su += c[k].length; }
    if (k > 0 && !/\s/.test(c[k - 1])) { const i = c.findIndex((x, j) => j >= k && /\s/.test(x)); if (i > 0) k = i; }   // (from a word)
    while (k < c.length && /^[\s|:;,.·•/&+\-–—)\]}]+$/u.test(c[k])) k++;
    const end = c.slice(k).join('');
    return end ? shorten(t, n - sum(w.slice(k)) - 1, units - end.length - 1) + ' ' + end : shorten(t, n, units);
  }
  Board21.on('menu', id => {
    const e = /^history:/.test(id) ? history.find(x => 'history:' + keyOf(x) === id) : null;
    if (e) { if (!video || changing || !sameEntry(e, video)) choose(e); return; }   // (the video showing: it goes on as it is)
    if (!video) return;
    if (id === 'change') { changing = true; link.value = video.videoUrl || watchUrl(video); say(''); show(); }
    else if (id === 'open' && !kiosk) window.open(watchUrl(video), '_blank', 'noopener,noreferrer');
    else if (id === 'remove') { video = null; changing = false; link.value = ''; say(''); save(); show(); }
  });

  function say(text) { err.textContent = text; err.hidden = !text; }
  link.addEventListener('input', () => { if (!err.hidden) say(''); });
  ask.addEventListener('submit', e => {
    e.preventDefault();
    const text = link.value.trim(), v = text ? parseLink(text) : null;
    if (!v) { say(text ? 'That isn’t a link to a YouTube video.' : 'Paste the link to a YouTube video first.'); return; }
    choose({ videoId: v.id, videoUrl: v.link.length <= MAX_LINK ? v.link : watchUrl({ videoId: v.id, start: v.start }), start: v.start });
  });
  // A video chosen here, from the link box or the History: it shows (in place of the link box, if that showed), goes
  // to the top of the History, and is saved.
  function choose(v) {
    say('');
    video = { videoId: v.videoId, videoUrl: v.videoUrl, start: v.start };
    changing = false;
    link.blur();   // (the on-screen keyboard goes away)
    remember(video);
    save(); show();
  }
  // v to the top of the History (listed once), with its title if it is known here; if not, YouTube is asked for it.
  function remember(v) {
    history = toTop(history, v);
    if (!history[0].title) askTitle(v.videoId);
  }
  function toTop(list, v) {
    const title = (list.find(e => e.videoId === v.videoId && e.title) || {}).title || titles.get(v.videoId);
    return [Object.assign({ videoId: v.videoId, videoUrl: v.videoUrl, start: v.start }, title ? { title } : {})]
      .concat(list.filter(e => !sameEntry(e, v))).slice(0, HISTORY_MAX);
  }
  cancel.addEventListener('click', () => { changing = false; say(''); show(); });

  // Changed in another tab or on another device (or imported). A link being typed here stays: Cancel then shows
  // the new video. Content saved by a release from before the History (no history: a tab or device not updated yet)
  // keeps the History here, with its video at the top; null (a Reset) clears it.
  Board21.on('data', d => {
    const v = readVideo(d), older = !!d && typeof d === 'object' && !Array.isArray(d) && d.history === undefined;
    history = older ? (v ? toTop(history, v) : history) : readHistory(d, v);
    askMissing();
    if (sameVideo(v, video) || (!v && !video && d)) { setMenu(); return; }   // (the same video, or still none: the History alone)
    const typing = !ask.hidden && document.activeElement === link;
    video = v;
    changing = !!v && typing;
    if (!typing) { link.value = ''; say(''); }
    show();
  });

  addEventListener('online', () => { if (started) { show(); askMissing(); } });
  addEventListener('offline', () => { if (started) show(); });

  // YouTube's player must be at least 200 × 200 px. The board draws this window `zoom` times its CSS size (the size
  // of windows and menus in Settings, and how far the screen shrinks the 16:9 board: 0.36 at 50% on a 1366 × 768
  // Chromebook, 0.57 at the usual 80%), so where it is drawn smaller the minimum is raised to keep the player 200 px
  // on screen as well as in its own frame. (The board sends zoom rounded to 0.01, hence the 0.005.)
  const MIN_PX = 200;
  let minNow = 0;
  function keepMinimum(info) {
    const zoom = info && typeof info.zoom === 'number' && info.zoom > 0 ? info.zoom : 1;   // (an older board sends none)
    const min = Math.max(MIN_PX, Math.ceil(MIN_PX / Math.max(0.1, zoom - 0.005)));
    if (min !== minNow) { minNow = min; Board21.window.setMinSize(min, min); }
  }
  // In a window that fills the board, the board's own buttons (▦, and the clock beside one) sit over its bottom
  // corners (the board sends how far up they reach: corners.height): the player ends above them, on black.
  function keepClear(info) {
    const c = info && info.maximized && info.corners, h = c ? Math.min(1000, Math.max(0, Number(c.height) || 0)) : 0;
    player.style.setProperty('--clear', h + 'px');
  }
  Board21.on('resize', info => { keepMinimum(info); keepClear(info); });

  // Titles (see the top). asked: the videos asked for in this page load (queue: not sent yet).
  const asked = new Set(), queue = [];
  let asking = 0;
  function askTitle(id) {
    if (titles.has(id) || asked.has(id) || navigator.onLine === false) return;
    asked.add(id); queue.push(id);
    next();
  }
  function next() {
    while (asking < MAX_ASKING && queue.length) {
      const id = queue.shift();
      asking++;
      fetchTitle(id).then(t => { if (t) gotTitle(id, t); }, () => { if (navigator.onLine === false) asked.delete(id); })   // (offline: asked again online)
        .catch(() => {}).then(() => { asking--; next(); });
    }
  }
  // YouTube's oEmbed: a video's title ('' if it gives none). No cookies; no Referer either: the Origin header, which
  // goes with every request to another site, is all YouTube needs to answer.
  function fetchTitle(id) {
    const stop = typeof AbortController === 'function' ? new AbortController() : null, timer = setTimeout(() => { if (stop) stop.abort(); }, TITLE_WAIT);
    return fetch(OEMBED + '?url=' + encodeURIComponent(watchUrl({ videoId: id, start: 0 })) + '&format=json', { credentials: 'omit', referrerPolicy: 'no-referrer', signal: stop ? stop.signal : undefined })
      .then(r => (r.ok ? r.json() : null)).then(j => cleanTitle(j && j.title)).finally(() => clearTimeout(timer));
  }
  // A title: shown at once, and saved with the window's next change (never by itself: see the top).
  function gotTitle(id, t) {
    titles.set(id, t);
    setMenu();
  }
  // Every video in the History without a title (asked for once per page load: askTitle).
  function askMissing() { for (const e of history) if (!e.title) askTitle(e.videoId); }

  Board21.ready().then(ctx => {
    kiosk = !!ctx.kiosk;
    video = readVideo(ctx.data);
    history = readHistory(ctx.data, video);
    started = true;
    keepMinimum(ctx.window);
    keepClear(ctx.window);
    show();
    askMissing();
  });
</script>
</body>
</html>

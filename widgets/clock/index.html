<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<script src="../../sdk/board21.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font); overflow: hidden; user-select: none; -webkit-user-select: none;
    --serif: Tinos, "Times New Roman", Times, "Liberation Serif", "Noto Serif", Georgia, serif;
    /* Teaching face: fixed colors, never the accent */
    --hour: #c2410c; --minute: #00468c; --rim: #cbd5e1;
    /* Old face: ivory and brass */
    --ro-face: #fbf6e9; --ro-face-2: #ede1c4; --ro-ink: #2b2219; --ro-hand: #1c2433; --ro-sec: #8f2f1f;
    --ro-ring-hi: #ecd496; --ro-ring: #b08a45; --ro-ring-lo: #6f5225;
    /* LCD look, in light theme: no glow. Lit segments cast a faint shadow on the panel. */
    --panel: color-mix(in srgb, var(--b21-accent) 8%, #e7eae3);
    --seg: color-mix(in srgb, var(--b21-accent) 24%, #161a1f);
    --seg-off: .075;
    --seg-shadow: rgba(20, 26, 20, .17);
  }
  [data-b21-theme="dark"] body {
    --hour: #ee6f1c; --minute: #93d2ff; --rim: #4b4b4b;
    --ro-face: #241f18; --ro-face-2: #12100c; --ro-ink: #d9b56c; --ro-hand: #f3dca0; --ro-sec: #e07a5f;
    --ro-ring-hi: #c49d58; --ro-ring: #7a5a2a; --ro-ring-lo: #3a2a12;
    /* LED look, in dark theme: a soft glow in the accent */
    --panel: color-mix(in srgb, var(--b21-accent) 5%, #0e0f10);
    --seg: color-mix(in srgb, var(--b21-accent) 88%, #ffffff);
    --seg-off: .07;
    --glow-a: color-mix(in srgb, var(--b21-accent) 55%, transparent);
    --glow-b: color-mix(in srgb, var(--b21-accent) 20%, transparent);
  }
  #clock { position: absolute; inset: 0; }
  #ana, #dig, #day, #words { position: absolute; }
  [hidden] { display: none !important; }

  /* ---- Analog faces: each draws into a 200 × 200 viewBox centered on (100, 100) */
  #analog { position: absolute; display: block; overflow: visible; }
  #analog text { font-family: var(--b21-font); }
  .face.settable { touch-action: none; cursor: grab; }
  .face.settable.dragging { cursor: grabbing; }
  .face.markable { cursor: pointer; }
  .face:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 4px; border-radius: 50%; }
  .grab, .halo { display: none; }
  .face.settable .grab, .face.settable .halo { display: inline; }
  .halo { fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 1.4; opacity: .45; }
  .face.drag-h .hand-h .halo, .face.drag-m .hand-m .halo { fill-opacity: .4; }
  .grab { fill: currentColor; stroke: var(--face-bg); stroke-width: 1.6; }
  /* Simple */
  .f-simple { --face-bg: var(--b21-surface); }
  .f-simple .hand-h, .f-simple .hand-m { color: var(--b21-text); }
  .fs-face { fill: var(--b21-surface); stroke: var(--b21-border); stroke-width: 1.5; }
  .fs-tick { stroke: var(--b21-muted); stroke-linecap: round; }
  .fs-tick.major { stroke: var(--b21-text); }
  #analog .fs-num { fill: var(--b21-text); font-weight: 600; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
  .fs-hand { stroke: var(--b21-text); stroke-linecap: round; }
  .fs-sec { stroke: var(--b21-danger); stroke-linecap: round; }
  .fs-hub { fill: var(--b21-text); }
  .secs .fs-hub { fill: var(--b21-danger); }   /* red only with the second hand */
  /* Old */
  .f-old { --face-bg: var(--ro-face); }
  .f-old .hand { color: var(--ro-hand); }
  .ro-s1 { stop-color: var(--ro-face); } .ro-s2 { stop-color: var(--ro-face-2); }
  .ro-b1 { stop-color: var(--ro-ring-hi); } .ro-b2 { stop-color: var(--ro-ring); } .ro-b3 { stop-color: var(--ro-ring-lo); }
  .ro-edge { fill: none; stroke: rgba(0, 0, 0, .28); stroke-width: .8; }
  .ro-line { fill: none; stroke: var(--ro-ink); }
  #analog .ro-num { fill: var(--ro-ink); font: 400 18px var(--serif); text-anchor: middle; dominant-baseline: central; letter-spacing: -.3px; }
  .ro-hand-f { fill: var(--ro-hand); stroke: var(--ro-face); stroke-width: 1.1; paint-order: stroke; stroke-linejoin: round; }
  .ro-hand-s { fill: none; stroke: var(--ro-hand); }
  .ro-hand-u { fill: none; stroke: var(--ro-face); }
  .ro-sec { stroke: var(--ro-sec); stroke-linecap: round; }
  .ro-sec-f { fill: var(--ro-sec); }
  .ro-hub-c { fill: var(--ro-ring); }
  /* Teaching */
  .f-teaching { --face-bg: var(--b21-bg); }
  .f-teaching .hand-h { color: var(--hour); }
  .f-teaching .hand-m { color: var(--minute); }
  .t-face { fill: var(--b21-bg); stroke: var(--rim); stroke-width: 2.5; }
  .t-tick { stroke: var(--b21-muted); stroke-width: 1; }
  .t-tick.major { stroke: var(--minute); stroke-width: 2.4; stroke-linecap: round; }
  #analog .t-mn { fill: var(--minute); font-weight: 700; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  #analog .t-hn { fill: var(--hour); font-weight: 700; font-size: 22px; text-anchor: middle; dominant-baseline: central; }
  #analog .t-hn.two { letter-spacing: -.6px; }
  #analog .t-ap { fill: var(--b21-text); font-weight: 700; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  .t-hh { fill: var(--hour); stroke: var(--b21-bg); stroke-width: 2.5; paint-order: stroke; stroke-linejoin: round; }
  .t-mh { fill: var(--minute); stroke: var(--b21-bg); stroke-width: 2.5; paint-order: stroke; stroke-linejoin: round; }
  .t-sec { stroke: var(--b21-text); stroke-width: 1.3; stroke-linecap: round; }
  .t-hub { fill: var(--b21-text); } .t-hub-c { fill: var(--b21-bg); }
  /* Mark a time: a wedge under the numerals and the hands */
  .mk-w, .mk-full { fill: var(--b21-accent); opacity: .24; }
  .mk-warn { fill: var(--b21-warning); opacity: .4; }
  .mk-edge { stroke: var(--b21-accent); stroke-width: 3.5; stroke-linecap: round; }
  .mk-edge.warn { stroke: var(--b21-warning); }

  /* ---- Digital */
  #dig.led { background: var(--panel); }
  .both #dig.led { border-radius: 12px; }
  /* (layout() sets the padding: --pt, --pr, --pb, and --pl) */
  #readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--pt, 5%) var(--pr, 4%) var(--pb, 5%) var(--pl, 4%); box-sizing: border-box; }
  .quiz #readout { cursor: pointer; }
  .quiz #readout:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: -4px; border-radius: 12px; }
  .set #readout { top: 52px; bottom: 52px; padding-block: 0; }
  #time { font-weight: 700; font-size: var(--fs, 40px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; color: var(--b21-text); }
  .pd-ap { font-size: .38em; font-weight: 600; color: var(--b21-muted); margin-left: .15em; letter-spacing: 0; }
  /* While setting the time, the hours keep a two-digit box and a.m./p.m. a fixed width, so the arrows never move. */
  .set .pd-h { display: inline-block; min-width: 2ch; text-align: right; }
  .set .pd-m { display: inline-block; }   /* (the same box as the hours, so their arrows line up) */
  .set .pd-ap { display: inline-block; min-width: 2.6em; text-align: left; }
  .teach .pd-h { color: var(--hour); }
  .teach .pd-m { color: var(--minute); }
  #q { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; color: var(--b21-text); }
  .led #q { color: var(--seg); text-shadow: 0 0 .06em var(--glow-a, transparent), 0 0 .25em var(--glow-b, transparent); }
  .led-svg { display: block; flex: 1 1 0; min-height: 0; width: 100%; overflow: visible; filter: drop-shadow(calc(var(--u, 1px) * 1.3) calc(var(--u, 1px) * 1.8) calc(var(--u, 1px) * .6) var(--seg-shadow)); }
  [data-b21-theme="dark"] .led-svg { filter: drop-shadow(0 0 calc(var(--u, 1px) * 2.2) var(--glow-a)) drop-shadow(0 0 calc(var(--u, 1px) * 9) var(--glow-b)); }
  .seg-p { fill: var(--seg); opacity: var(--seg-off); transition: opacity .18s ease-out; }
  .seg-p.on { opacity: 1; transition-duration: .12s; }
  .ind { fill: var(--seg); opacity: var(--seg-off); font: 700 15px var(--b21-font); letter-spacing: .6px; transition: opacity .18s ease-out; }
  .ind.on { opacity: 1; transition-duration: .12s; }
  .arrow { position: absolute; display: none; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 11px; color: var(--b21-muted); background: color-mix(in srgb, var(--b21-text) 6%, transparent); z-index: 4; touch-action: manipulation; cursor: pointer; }
  .arrow svg { width: 16px; height: 16px; fill: currentColor; }
  .arrow:hover { background: color-mix(in srgb, var(--b21-text) 11%, transparent); }
  .arrow:active { background: color-mix(in srgb, var(--b21-accent) 28%, transparent); }
  .arrow:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 2px; }
  .led .arrow { color: var(--seg); background: color-mix(in srgb, var(--seg) 10%, transparent); }
  .set #dig .arrow { display: grid; }

  /* ---- Time in words, and the date: a stack (the weekday; the month and day; the year) or one line. layout() sizes
     them. The ruler measures the date's words, 100px tall: every weekday and month, so the date gets the room of the
     longest. */
  #words { display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--b21-text); white-space: nowrap; overflow: hidden; }
  #day { display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; overflow: hidden; box-sizing: border-box; color: var(--b21-text); }
  #stack { display: flex; flex-direction: column; align-items: center; }
  #weekday, .r-wd { font-weight: 800; line-height: 1.08; }
  #monthday, .r-md { font-weight: 700; line-height: 1.12; }
  #year, .r-yr { font-weight: 600; line-height: 1.2; }
  #line, .r-ln { font-weight: 600; line-height: 1.2; }
  #year, #line .yr { color: var(--b21-muted); }
  #ruler { position: fixed; left: -20000px; top: 0; visibility: hidden; pointer-events: none; white-space: nowrap; font-size: 100px; }
  #ruler span { position: absolute; left: 0; top: 0; }
  /* What a screen reader hears: the date as one line, in the language's own order */
  #said { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  /* With the LCD or LED look and no analog clock, the whole window is the panel, and the date takes its colors. */
  #clock.panel { background: var(--panel); }
  .panel #day, .panel #words { color: var(--seg); text-shadow: .03em .04em .02em var(--seg-shadow); }
  .panel #year, .panel #line .yr { color: inherit; opacity: .72; }
  [data-b21-theme="dark"] .panel #day, [data-b21-theme="dark"] .panel #words { text-shadow: 0 0 .06em var(--glow-a), 0 0 .3em var(--glow-b); }

  /* ---- Set the time: the Set badge and Now stay on screen */
  #badge, #now { display: none; position: absolute; z-index: 5; font-family: var(--b21-font); }
  .set #badge, .set #now { display: block; }
  #badge { top: 9px; left: 9px; padding: 3px 10px; border-radius: 999px; background: var(--b21-accent); color: var(--b21-on-accent); font-size: 12.5px; font-weight: 700; letter-spacing: .03em; }
  #now { top: 6px; right: 6px; min-width: 66px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--b21-bg); color: var(--b21-text); box-shadow: 0 0 0 1.5px var(--b21-border), 0 2px 10px rgba(0, 0, 0, .08); font-size: 15px; font-weight: 700; cursor: pointer; }
  #now:hover { box-shadow: 0 0 0 1.5px var(--b21-accent), 0 2px 10px rgba(0, 0, 0, .08); }
  #now:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .seg-p, .ind, .seg-p.on, .ind.on { transition: none; }
  }
</style>
</head>
<body>
  <div id="clock">
    <div id="ana"></div>
    <div id="dig">
      <div id="readout"><div id="q" aria-hidden="true" hidden>?</div></div>
    </div>
    <div id="words" aria-hidden="true"></div>
    <div id="day"><div id="stack" aria-hidden="true"><div id="weekday"></div><div id="monthday"></div><div id="year"></div></div><div id="line" aria-hidden="true"></div><span id="said"></span></div>
    <span id="badge">Set</span>
    <button id="now" type="button">Now</button>
  </div>
  <div id="ruler" aria-hidden="true"></div>
<script>
  // Content: { set, markAt }, the lesson.
  //   set: null when not setting the time; { at: null } while setting it but following the real time (after Now);
  //   { at: 0 to 1439 }, minutes since midnight, for a set time, and { at, mark } once the teacher marks a time on it.
  //   mark is in minutes since midnight too. It belongs to the set time: Now and unchecking Set the time drop it.
  //   markAt: the teacher's mark (Mark a time) on the real time, a wall-clock time in ms, or null.
  // Config: { analog, digital, dateView, face: 'simple' | 'old' | 'teaching', led, seconds, hour24, words, upright, iv,
  //   hourOnly, mark, quiz, snap5 }. analog, digital, and dateView are the three views; at least one shows.
  //   For a 21Board before this one it also keeps dateOnly (the date alone), date (the date under the digital time, the
  //   old Show date), and style: 'analog' for analog only, 'digital' when digital shows, 'date' for the date alone.
  //   A config without dateView is from before: dateOnly is the date alone, and date adds the date only where digital
  //   shows. Older still is { style, hour24, seconds, date }.
  // Whether Quiz shows ? or the time is never saved.
  const NS = 'http://www.w3.org/2000/svg';
  const RAD = Math.PI / 180, DAY = 1440;
  const mod = (a, n) => ((a % n) + n) % n;
  const wrap180 = d => mod(d + 180, 360) - 180;
  const r2 = v => Math.round(v * 100) / 100;
  const P = (r, deg) => [r2(100 + r * Math.sin(deg * RAD)), r2(100 - r * Math.cos(deg * RAD))];
  const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const pad2 = n => String(n).padStart(2, '0');
  const h12 = hh => hh % 12 || 12;
  const hm = T => { const t = mod(Math.round(T), DAY); return [Math.floor(t / 60), t % 60]; };
  const nowMinutes = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000;
  const apOf = (hh, dots) => hh < 12 ? (dots ? 'a.m.' : 'AM') : (dots ? 'p.m.' : 'PM');
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);

  // ---------------------------------------------------------------- Time in words
  // 10:15 is "quarter past ten", 5:34 "twenty-six minutes to six", and 12:00 "noon" or "midnight".
  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty'];
  const num = n => n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  function inWords(hh, mm) {
    const hr = n => num(h12(mod(n, 24)));
    const mins = n => n % 5 ? num(n) + (n === 1 ? ' minute' : ' minutes') : num(n);
    if (mm === 0) return hh === 0 ? 'midnight' : hh === 12 ? 'noon' : hr(hh) + " o'clock";
    if (mm === 15) return 'quarter past ' + hr(hh);
    if (mm === 30) return 'half past ' + hr(hh);
    if (mm === 45) return 'quarter to ' + hr(hh + 1);
    if (mm < 30) return mins(mm) + ' past ' + hr(hh);
    return mins(60 - mm) + ' to ' + hr(hh + 1);
  }

  // ---------------------------------------------------------------- Saved state, checked before it is used
  // (Saved settings and content can come from an imported file.)
  const FACES_IDS = ['simple', 'old', 'teaching'];
  const FLAGS = ['led', 'seconds', 'hour24', 'words', 'upright', 'iv', 'hourOnly', 'mark', 'quiz', 'snap5'];
  function readConfig(c) {
    c = isObj(c) ? c : {};
    const out = { analog: true, digital: false, dateView: false, face: FACES_IDS.includes(c.face) ? c.face : 'simple' };
    FLAGS.forEach(k => { out[k] = c[k] === true; });
    const flag = (k, d) => typeof c[k] === 'boolean' ? c[k] : d;   // a bad value takes that key's default
    if (typeof c.dateView === 'boolean' || ['analog', 'digital', 'dateOnly'].some(k => typeof c[k] === 'boolean')) {
      const alone = typeof c.dateView !== 'boolean' && c.dateOnly === true;   // (before dateView: Date only)
      out.analog = !alone && flag('analog', true);
      out.digital = !alone && flag('digital', false);
      out.dateView = typeof c.dateView === 'boolean' ? c.dateView : alone || (out.digital && c.date === true);
    } else {   // an older config: style alone says what shows
      out.analog = c.style !== 'digital' && c.style !== 'date';
      out.digital = c.style === 'digital';
      out.dateView = c.style === 'date' || (out.digital && c.date === true);
    }
    if (!out.analog && !out.digital && !out.dateView) out.analog = true;   // (one view always shows)
    return out;
  }
  // An older 21Board reads dateOnly, date, and style. It shows the date with digital as a line under the time, and
  // leaves it out beside analog alone.
  function writeConfig(c) {
    const alone = c.dateView && !c.analog && !c.digital;
    return Object.assign({}, c, { dateOnly: alone, date: c.dateView && c.digital, style: alone ? 'date' : c.digital ? 'digital' : 'analog' });
  }
  const isMinute = v => Number.isInteger(v) && v >= 0 && v < DAY;
  const setOf = (at, mark) => at != null && isMinute(mark) ? { at, mark } : { at };   // (no mark: no key)
  function readState(d) {
    const s = isObj(d) && isObj(d.set) ? d.set : null;
    const at = s && (s.at === null || isMinute(s.at)) ? s.at : undefined;
    const m = isObj(d) && typeof d.markAt === 'number' && isFinite(d.markAt) && d.markAt > 0 ? d.markAt : null;
    return { set: at === undefined ? null : setOf(at, s.mark), markAt: m };
  }

  // ---------------------------------------------------------------- Faces
  // A grab dot on a hand while setting the time, with a thin ring that fills while that hand is dragged. The dots sit on
  // the tick ring, clear of the numerals.
  const grab = (y, r, ring = r * 1.8) => `<circle class="halo" cx="100" cy="${y}" r="${r2(ring)}"/><circle class="grab" cx="100" cy="${y}" r="${r}"/>`;
  // Each face: its hand lengths (len), how far out a Mark a time wedge reaches (wr), where the line at the wedge's end
  // starts (es, and esUp with upright numerals: outside the hour numbers, so it never looks like a hand), the dial (bg,
  // with the wedge's place under the ticks and numerals), and the hands.
  const FACES = {
    simple: {
      len: { h: 46, m: 81 }, wr: 88, es: 78,
      bg() {
        let s = '<circle class="fs-face" cx="100" cy="100" r="96"/><g class="under"></g>';
        for (let i = 0; i < 60; i++) {
          const major = i % 5 === 0, a = i * 6, [x1, y1] = P(major ? 80 : 86, a), [x2, y2] = P(91, a);
          s += `<line class="fs-tick${major ? ' major' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${major ? 2.5 : 1.2}"/>`;
          if (major) { const [x, y] = P(65.5, a); s += `<text class="fs-num" x="${x}" y="${y}">${i / 5 || 12}</text>`; }
        }
        return s;
      },
      hands() {
        return `<g class="hand hand-h"><line class="fs-hand" x1="100" y1="100" x2="100" y2="54" stroke-width="7"/>${grab(60, 5)}</g>` +
          `<g class="hand hand-m"><line class="fs-hand" x1="100" y1="100" x2="100" y2="19" stroke-width="4.5"/>${grab(18, 4.5)}</g>` +
          '<g class="hand hand-s"><line class="fs-sec" x1="100" y1="114" x2="100" y2="20" stroke-width="2"/></g>' +
          '<circle class="fs-hub" cx="100" cy="100" r="4.5"/>';
      }
    },
    old: {
      len: { h: 54, m: 84 }, wr: 85, es: 80, esUp: 83.5,   // (an upright VIII reaches into the minute track)
      bg(o, id) {
        const N = ['XII', 'I', 'II', 'III', o.iv ? 'IV' : 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
        let s = `<defs><linearGradient id="rb${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="ro-b1"/><stop offset=".5" class="ro-b2"/><stop offset="1" class="ro-b3"/></linearGradient>` +
          `<radialGradient id="rf${id}" cx=".5" cy=".44" r=".6"><stop offset=".55" class="ro-s1"/><stop offset="1" class="ro-s2"/></radialGradient></defs>` +
          `<circle cx="100" cy="100" r="96" fill="url(#rb${id})"/><circle class="ro-edge" cx="100" cy="100" r="95.6"/>` +
          `<circle cx="100" cy="100" r="90" fill="url(#rf${id})"/><circle class="ro-edge" cx="100" cy="100" r="90"/><g class="under"></g>` +
          '<circle class="ro-line" cx="100" cy="100" r="85" stroke-width=".8"/><circle class="ro-line" cx="100" cy="100" r="79.5" stroke-width=".6"/>' +
          '<circle class="ro-line" cx="100" cy="100" r="51" stroke-width=".6"/><circle class="ro-line" cx="100" cy="100" r="48.5" stroke-width=".35"/>';
        for (let i = 0; i < 60; i++) {   // the railroad minute track
          const a = i * 6, five = i % 5 === 0, [x1, y1] = P(79.5, a), [x2, y2] = P(85, a);

    else return;

  });

  // ---------------------------------------------------------------- Layout
  // The clocks lay out as they always have. One fills the window. Analog and digital sit side by side when the window
  // is wider than tall and stack when it's taller, and Time in words is a line under them.
  // The date goes where the clocks stay biggest with the date readable: beside them, under them, or, with analog and
  // digital together, under the digital time. It's a stack (the weekday; the month and day; the year) where there's
  // room for one, and one line where that keeps the clocks bigger. Readable: its month and day at least SIZE[0] of the
  // time's size, or of the dial's without digital, and 12 px. With room to spare it grows to SIZE[1], never more, so
  // the time always leads. (The LCD and LED looks grow it less: their thin segments are lighter than text.) Its room is
  // measured for the longest weekday and month, so the layout stays the same every day.
  const SIZE = { a: [.07, .09], d: [.2, .35], led: [.2, .3] }, MIN_PX = 12;
  const ST = { md: .8, yr: .6, h: 1.08 + .8 * 1.12 + .6 * 1.2 }, LINE_H = 1.2;   // the stack: sizes and height in weekdays

  // What the layout needs to know: the Set badge and Now, the board's buttons in the bottom corners, the digital time's
  // shape, and the date's widths in em. Boxes here are [left, top, right, bottom].
  let refKey = null, lowKey = '[]';
  // Filling the board, the board's own buttons sit in the window's bottom corners (▦, and the clock beside one). They
  // count once the window has the size the board gives it (i, Board21's window info), not while it grows to fill the
  // board.
  function lowOf(i, W, H) {
    const cn = i && i.maximized && i.corners && Math.abs(i.width - W) <= 2 && Math.abs(i.height - H) <= 2 ? i.corners : null;
    return cn && cn.height > 0 ? [[0, H - cn.height, cn.left, H], [W - cn.right, H - cn.height, W, H]].filter(c => c[2] > c[0]) : [];
  }
  function measure(W, H) {
    const corners = setOn && timeOn ? [badge, nowBtn].filter(el => el.offsetWidth)
      .map(el => [el.offsetLeft, el.offsetTop, el.offsetLeft + el.offsetWidth, el.offsetTop + el.offsetHeight]) : [];
    const low = lowOf(Board21.context && Board21.context.window, W, H);
    let emW = config.hour24 ? 2.7 : 3.6, vb = null;
    if (showD && disp && disp.vb) vb = disp.vb;
    else if (showD && disp) {

      if (fs > 0 && disp.el.scrollWidth) emW = disp.el.scrollWidth / fs;
    }
    let dm = null;
    if (showY && !ruler.firstChild) dateText(new Date());
    if (showY) {
      const key = getComputedStyle(document.body).fontFamily + dayKey;
      if (key !== refKey) { refKey = key; longestLine(); }
      const em = el => el.getBoundingClientRect().width / 100 * 1.02;   // (a little room for rounding)
      const widest = c => Math.max(.1, ...$$('.' + c, ruler).map(em));
      dm = { wd: widest('r-wd'), md: widest('r-md'), yr: widest('r-yr'), ln: widest('r-ln') };
    }

  }
  // A box's top, moved below the Set badge or Now when one sits over it.
  const below = (r, m) => m.corners.reduce((y, c) => c[0] < r[0] + r[2] && c[2] > r[0] && c[1] < r[1] + r[3] && c[3] + 6 > y ? Math.max(y, c[3] + 6) : y, r[1]);

  // Where everything goes with the date at `where` ('side', 'below', 'col', 'alone', or null for no date) in `style`,
  // taking x px of the width or height. Boxes are [left, top, width, height]. d: the dial's size. t: the time's size.
  function arrange(W, H, where, x, m, style, small) {
    const words = config.words && timeOn, wide = W > H;
    let B = [0, 0, W, H], Y = null;   // B: the clocks, with Time in words under them
    if (where === 'side') { B = [0, 0, W - x, H]; Y = [W - x, 0, x, H]; }
    else if (where === 'below') { B = [0, 0, W, H - x]; Y = [0, H - x, W, x]; }
    else if (where === 'alone') { B = null; Y = [0, 0, W, H]; }
    const o = { W, where, x, A: null, D: null, Y, L: null, d: 0, t: 0, pad: null };
    if (B) {
      const lineH = !words ? 0 : !showD ? Math.min(B[2] * WORDS_A, B[3] * WORDS_A / (1 + WORDS_A))
        : !showA ? Math.min(B[2] * WORDS_D, B[3] * .25) : Math.min(B[2], B[3]) * .13;
      const R = [B[0], B[1], B[2], B[3] - lineH];
      if (words) o.L = [B[0], R[1] + R[3], B[2], lineH];
      if (showA && showD) {
        // (Side by side with the date under both, the clocks keep the widths they have without it.)
        if (wide) { const s = Math.min(where === 'below' ? H - lineH : R[3], R[2] * .5); o.A = [R[0], R[1], s, R[3]]; o.D = [R[0] + s, R[1], R[2] - s, R[3]]; }
        else { const s = Math.min(R[2], R[3] * .6); o.A = [R[0], R[1], R[2], s]; o.D = [R[0], R[1] + s, R[2], R[3] - s]; }
      } else if (showA) o.A = R;
      else o.D = R;
      if (where === 'col') { const D = o.D; o.Y = [D[0], D[1] + D[3] - x, D[2], x]; o.D = [D[0], D[1], D[2], D[3] - x]; }
    }
    if (o.A) o.d = dialIn(o.A, m);
    if (o.D) digitalIn(o, W, H, m);
    if (o.Y) dateIn(o, m, style, small);
    return o;
  }

  function dialIn(A, m) {
    let s = Math.min(A[2], A[3]) * (showD ? .9 : .92);
    // While setting the time, the dial stays clear of the Set badge and Now in the top corners.
    if (m.corners.length) {
      const cx = A[0] + A[2] / 2, cy = A[1] + A[3] / 2;
      for (const c of m.corners) s = Math.min(s, 2 * (Math.hypot(Math.max(c[0] - cx, 0, cx - c[2]), Math.max(c[1] - cy, 0, cy - c[3])) - 4) / .96);
      s = Math.max(s, Math.min(A[2], A[3]) * .6);
    }
    return Math.max(0, s);
  }

  function digitalIn(o, W, H, m) {
    let D = o.D;
    const wide = W > H, module = config.led && showA;
    // Beside the dial, the LCD or LED panel keeps a margin on every side but the dial's, which has its own. (Not rounded,
    // so the time grows steadily with the window.)
    if (module) {
      const g = Math.min(W, H) * .045, l = wide ? 0 : g, t = wide ? g : 0;
      D = [D[0] + l, D[1] + t, D[2] - l - g, D[3] - t - g];
    }
    // The padding, top, right, bottom, and left: 5% and 4% of the width, as before. With the date, a box wider than 2.2:1
    // pads as a 2.2:1 box of its height, and right under the time the date gets close, as the old Show date was.
    const k = !showY ? D[2] / 2.2 : Math.max(0, Math.min(D[3], D[2] / 2.2)), pad = [.11 * k, .088 * k, .11 * k, .088 * k];
    const Y = o.Y;
    if (Y && !module && under(Y, D)) pad[2] = pad[0] * .2;
    const v = setOn ? 104 : pad[0] + pad[2];   // (setting the time: rows for the arrows instead)
    const w = D[2] - pad[1] - pad[3];
    // Side by side with the dial, the panel hugs the digits and sits centered in its place, like an LCD module. (Without
    // the date, as tall as before.)
    if (module && wide && m.vb) {
      const lo = below(D, m), hi = D[1] + D[3], r = m.vb[3] / m.vb[2];
      const need = Math.min(hi - lo, !showY ? D[2] * (.2 + .92 * r) + (setOn ? 104 : 0) : w * r + v);
      const top = Math.min(Math.max(D[1] + (D[3] - need) / 2, lo), hi - need);
      D = [D[0], top, D[2], need];
    }
    const h = D[3] - v;
    o.D = D; o.pad = pad;
    // t: the time's font size, or for the LCD or LED look, its digits' height.
    o.t = w <= 0 || h <= 0 ? 0 : m.vb ? Math.min(w / m.vb[2], h / m.vb[3]) * 100 : Math.max(10, Math.min(h * .86, w * .98 / m.emW));
  }

  const under = (Y, D) => Math.abs(Y[1] - D[1] - D[3]) < 1 && Y[0] < D[0] + D[2] && Y[0] + Y[2] > D[0];   // Y right under D
  function dateIn(o, m, style, small) {
    const Y = o.Y, A = o.A, D = o.D;
    if (o.where === 'col' && config.led && A) { Y[0] = D[0]; Y[2] = D[2]; }   // (under the LCD or LED module: its width)
    // Margins, top, right, bottom, and left: the clocks' own margin (E) on the far sides, half of it next to the clocks,
    // and none right under the digital time.
    const E = A ? (Math.min(A[2], A[3]) - o.d) / 2 : D ? o.pad[0] : Math.min(Y[2], Y[3]) * .07;
    const across = n => Math.max(E, n * .05), near = D && !(config.led && A) && under(Y, D) ? 0 : E / 2;
    const mg = o.where === 'side' ? [across(Y[3]), E, across(Y[3]), E / 2]
      : o.where === 'alone' ? [E, across(Y[2]), E, across(Y[2])] : [near, across(Y[2]), E, across(Y[2])];
    mg[0] = Math.max(mg[0], below(Y, m) - Y[1]);
    o.mg = mg;
    dateSize(o, m, style, small);
    if (m.low.length) lift(o, m);
  }
  // The date's size in the room its margins leave.
  function dateSize(o, m, style, small) {
    const Y = o.Y, A = o.A, D = o.D, mg = o.mg;
    const w = Y[2] - mg[1] - mg[3], h = Y[3] - mg[0] - mg[2];
    // (Filling the board, no bigger than keeps it clear of the board's buttons: see clearMax.)
    const clear = m.low.length ? (f, s) => clearMax(o, m, f, s) : null;
    if (o.where === 'alone') { o.date = dateFill(w, h, m.dm, clear); return; }
    // The month and day: readable at lo and 12 px, and as big as hi with room to spare, its biggest text never more
    // than a fifth of the dial. (small: a window too small for that, as big as one line can be across it.) A stack
    // needs its year (ST.yr / ST.md of it) at 12 px too, and may grow for that while its weekday stays under 40% of
    // the time and a fifth of the dial. Where 40% is too small for that, the weekday may reach 60% of the time.
    const stack = style === 'stack', k = stack ? ST.md : 1, cap = A ? .2 * o.d * k : Infinity;
    const [lo, hi] = D ? (config.led ? SIZE.led : SIZE.d).map(s => s * o.t) : SIZE.a.map(s => s * o.d);
    const read = small ? Math.min(MIN_PX, o.W * .9 / m.dm.ln) : Math.max(lo, MIN_PX), most = Math.max(read, Math.min(hi, cap));
    const year = MIN_PX * ST.md / ST.yr, lead = !D ? Infinity : stack ? Math.max(.4 * o.t * k, Math.min(year, .6 * o.t * k)) : .4 * o.t;

  // Filling the board, the board's buttons sit in the bottom corners (m.low). The date stays 8 px clear of them. It
  // moves up into empty room, or shrinks. Each line counts by its own width, for the longest weekday and month.
  // The date's lines at `size` with its top at y, each centered in its room: [left, top, right, bottom].
  function lines(o, dm, style, size, y) {
    const Y = o.Y, mg = o.mg, cx = Y[0] + mg[3] + (Y[2] - mg[1] - mg[3]) / 2;
    const rows = style === 'stack' ? [[dm.wd, 1, 1.08], [dm.md, ST.md, 1.12], [dm.yr, ST.yr, 1.2]] : [[dm.ln, 1, LINE_H]];
    return rows.map(([ew, k, lh]) => { const w = ew * k * size, h = lh * k * size, r = [cx - w / 2, y, cx + w / 2, y + h]; y += h; return r; });
  }
  const clearOf = (rs, low) => rs.every(r => low.every(c => r[2] <= c[0] - 8 || r[0] >= c[2] + 8 || r[3] <= c[1] - 8 || r[1] >= c[3] + 8));
  // The date's top, centered in its room.
  const dateTop = o => o.Y[1] + o.mg[0] + (o.Y[3] - o.mg[0] - o.mg[2] - o.date.eh * o.date.size) / 2;
  // The biggest size up to s that stays clear at the top of its room. It only grows with the room, so a bigger room
  // never makes the date fit less.
  function clearMax(o, m, f, s) {

    if (ok(s)) return s;

    return lo;
  }
  // The date moves up from the middle of its room just as far as it must to stay clear.
  function lift(o, m) {
    const f = o.date, y = dateTop(o), y0 = o.Y[1] + o.mg[0];
    let up = 0;
    for (const r of lines(o, m.dm, f.style, f.size, y)) for (const c of m.low) if (r[2] > c[0] - 8 && r[0] < c[2] + 8 && r[3] > c[1] - 8) up = Math.max(up, r[3] - c[1] + 8);

  // The date's shape as a stack or one line: its biggest text's size, and its width and height in that size.
  function dateAt(style, size, dm) {
    const stack = style === 'stack';
    return { style, size, md: stack ? size * ST.md : size, ew: stack ? Math.max(dm.wd, dm.md * ST.md, dm.yr * ST.yr) : dm.ln, eh: stack ? ST.h : LINE_H, fits: true, ok: true };
  }
  // The date alone fills its window: a stack, or one line where that's bigger or the stack's year would be too small.
  // (clear: what keeps it clear of the board's buttons.)
  function dateFill(w, h, dm, clear) {
    const s = dateAt('stack', 1, dm), l = dateAt('line', 1, dm);

    if (clear) { fs = clear(s, fs); fl = clear(l, fl); }

  }

  // The layout to use. Each place and style takes the least room that keeps the date readable, never more than half
  // the window, and the clocks left the biggest win (the one that shrinks less). Then the date takes the room the
  // clocks don't need. On a tie the bigger date wins, then the first: under the digital time, under the clocks, beside
  // them, and a stack before a line. With analog and digital, the date goes under both clocks only when it can't be
  // readable under the digital time. (A window too small for a 12 px date: the date as big as one line can be.)
  function choose(W, H, m) {

    const size = o => Math.min(o.A && base.d ? o.d / base.d : 1, o.D && base.t ? o.t / base.t : 1);
    const words = !showA || !showD || config.words;

      return at(hi).date.ok ? hi : 0;   // (not a stack whose year would be under 12 px, or bigger than the time allows)
    };
    // Taller than wide with analog and digital, the dial grows with the width and the digital time's room shrinks, until
    // the dial takes 60% of the height. The date goes under the digital time only in a style that still fits then, so
    // it never flips back and forth as the window grows. A stack goes under both clocks only where the dial still spans
    // the window, so the dial doesn't shrink when the stack comes as the window grows taller.
    const W2 = showA && showD && W <= H ? Math.max(W, H * .6) : W;

        lo = hi; hi = len - 1;

        tries.push({ s, o: at(lo) });

      if (!words) add('col', W > H ? H : H - Math.min(W, H * .6));

      // the line again. On a tie under both clocks, the line wins.
      const under = st => near.some(t => t.o.where === 'below' && t.o.date.style === st);
      if (showA && showD && W > H && under('line') && under('stack')) near = near.filter(t => !(t.o.where === 'below' && t.o.date.style === 'stack'));
      const big = Math.max(...near.map(t => t.o.date.md));

    }
    const o = arrange(W, H, 'below', H * .3, m, 'line', true), Y = o.Y, l = dateAt('line', 1, m.dm);   // (tinier still)
    const f = Math.max(0, Math.min((Y[2] - o.mg[1] - o.mg[3]) / l.ew, (Y[3] - o.mg[0] - o.mg[2]) / l.eh));
    o.date = Object.assign(l, { size: f, md: f });
    return o;
  }

  // The date's box shrinks to what it shows, and the clocks and the date move together to the middle.
  function settle(o) {
    const Y = o.Y, f = o.date;
    if (!Y || o.where === 'alone') return o;
    const side = o.where === 'side';
    const lo = side ? Y[2] - f.ew * f.size - o.mg[1] - o.mg[3] : Y[3] - f.eh * f.size - o.mg[0] - o.mg[2];
    if (lo >= 2) {
      const move = r => r && (side ? [r[0] + lo / 2, r[1], r[2], r[3]] : [r[0], r[1] + lo / 2, r[2], r[3]]);
      o.D = move(o.D);
      if (o.where !== 'col') { o.A = move(o.A); o.L = move(o.L); }
      o.Y = side ? [Y[0] + lo / 2, Y[1], Y[2] - lo, Y[3]] : [Y[0], Y[1] + lo / 2, Y[2], Y[3] - lo];
    }
    // A digital time has room above its digits for taller letters. With the date right under it, the two move up by
    // part of that room, so the space above the digits matches the space under the date.
    if (o.D && !setOn && under(o.Y, o.D)) {
      const dy = Math.min((config.led ? .025 : .09) * o.t, o.pad[0] * .8);
      o.D = [o.D[0], o.D[1] - dy, o.D[2], o.D[3]]; o.Y = [o.Y[0], o.Y[1] - dy, o.Y[2], o.Y[3]];
    }
    return o;
  }

  function layout() {
    const W = innerWidth, H = innerHeight;
    if (!W || !H) return;
    // Filling the board, a date already clear of the board's buttons changes nothing. Otherwise the layout keeps it clear.
    const m = measure(W, H);
    lowKey = JSON.stringify(m.low);
    let o = settle(choose(W, H, m.low.length ? Object.assign({}, m, { low: [] }) : m));
    if (m.low.length && o.Y && !clearOf(lines(o, m.dm, o.date.style, o.date.size, dateTop(o)), m.low)) o = settle(choose(W, H, m));
    root.classList.toggle('wide', showA && showD && W > H);   // (analog and digital side by side)
    const place = (el, r) => { if (r) Object.assign(el.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px' }); };
    place(ana, o.A); place(dig, o.D); place(dayEl, o.Y);
    if (o.A) { const s = o.d, A = o.A; Object.assign(face.svg.style, { width: s + 'px', height: s + 'px', left: (A[2] - s) / 2 + 'px', top: (A[3] - s) / 2 + 'px' }); }
    if (o.D) ['--pt', '--pr', '--pb', '--pl'].forEach((k, i) => readout.style.setProperty(k, o.pad[i].toFixed(1) + 'px'));
    if (o.Y) {
      const f = o.date, stack = f.style === 'stack', px = v => Math.max(8, v).toFixed(2) + 'px';
      stackEl.hidden = !stack; lineEl.hidden = stack;
      if (stack) { weekdayEl.style.fontSize = px(f.size); monthdayEl.style.fontSize = px(f.size * ST.md); yearEl.style.fontSize = px(f.size * ST.yr); }
      else lineEl.style.fontSize = px(f.size);
      dayEl.style.padding = o.mg.map(v => v.toFixed(1) + 'px').join(' ');
    }
    wordsEl.hidden = !o.L;
    // With the date, Time in words keeps to its line, padding and all, clear of the date. (With the date beside, it's the
    // last line in its column: it sits a little higher, clear of the edge.) Without the date, it's as before.
    if (o.L) {

    }
    readout.style.paddingLeft = readout.style.paddingRight = ''; nudge = 0;
    fit();
  }
  addEventListener('resize', layout);
  // Filling the board, the board's buttons come and go in the bottom corners with no change of size. (lowKey: the
  // buttons the last layout kept clear of.)
  Board21.on('resize', i => { if (JSON.stringify(lowOf(i, innerWidth, innerHeight)) !== lowKey) layout(); });

  function fitWords() {
    const el = wordsEl, H = el.clientHeight, W = el.clientWidth;
    if (!H || !W) return;
    el.style.fontSize = Math.max(10, H * .62) + 'px';
    const span = el.firstChild;
    if (span && span.offsetWidth > W * .94) el.style.fontSize = Math.max(8, H * .62 * W * .94 / span.offsetWidth) + 'px';
  }

  // Today's date in the window's language: the stack's three lines and the line, its year muted. A screen reader hears
  // the line, once, in the language's own order. The ruler gets every weekday and month too, so the layout can make room
  // for the longest.
  const LINE = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
  const fmt = (d, o) => d.toLocaleDateString(Board21.context ? Board21.context.locale : undefined, o);
  let dateYear = 0;
  function dateText(d) {
    const wd = fmt(d, { weekday: 'long' }), md = fmt(d, { month: 'long', day: 'numeric' }), yr = fmt(d, { year: 'numeric' });
    weekdayEl.textContent = wd; monthdayEl.textContent = md; yearEl.textContent = yr;
    lineEl.textContent = '';
    for (const p of new Intl.DateTimeFormat(Board21.context ? Board21.context.locale : undefined, LINE).formatToParts(d)) {
      if (p.type !== 'year') { lineEl.append(p.value); continue; }
      const s = document.createElement('span');
      s.className = 'yr'; s.textContent = p.value;
      lineEl.append(s);
    }
    saidEl.textContent = lineEl.textContent;
    ruler.textContent = '';
    const add = (c, t, k) => { const s = document.createElement('span'); s.className = c; s.textContent = t; if (k != null) s.dataset.k = k; ruler.append(s); };
    dateYear = d.getFullYear();
    for (let i = 0; i < 7; i++) { const x = new Date(dateYear, 0, 1 + i); add('r-wd', fmt(x, { weekday: 'long' }), x.getDay()); }
    for (let i = 0; i < 12; i++) add('r-md', fmt(new Date(dateYear, i, 28), { month: 'long', day: 'numeric' }), i);
    add('r-md', md); add('r-yr', yr); add('r-ln', lineEl.textContent); add('r-ln ref', '');
    refKey = null;
  }
  // The longest line: the longest weekday in the longest month, on a two-digit day.
  function longestLine() {
    const top = c => $$('.' + c, ruler).filter(s => s.dataset.k != null)
      .reduce((a, b) => b.getBoundingClientRect().width > a.getBoundingClientRect().width ? b : a);
    const wd = +top('r-wd').dataset.k, mo = +top('r-md').dataset.k;
    let day = 22;
    while (new Date(dateYear, mo, day).getDay() !== wd) day++;
    $('.ref', ruler).textContent = fmt(new Date(dateYear, mo, day), LINE);
  }

  function fit() {
    if (!showD || !disp) return;
    const R = readout, W = R.clientWidth, H = R.clientHeight;
    if (!W || !H) return;
    const cs = getComputedStyle(R), padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const avail = W - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    let qh;
    if (disp instanceof PlainDisplay) {
      // As big as the room is tall, then smaller only if it's too wide (el.style.fontSize: shrunk to fit).
      const el = disp.el, fs = Math.max(10, (H - padV) * .86);
      el.style.fontSize = ''; el.style.setProperty('--fs', fs + 'px');
      if (el.scrollWidth > avail) el.style.fontSize = (fs * avail / el.scrollWidth * .98) + 'px';
      qh = el.style.fontSize ? parseFloat(el.style.fontSize) : fs;
    } else {
      const r = disp.el.getBoundingClientRect(), vb = disp.vb;
      const u = Math.min(r.width / vb[2], r.height / vb[3]);
      if (u > 0) disp.el.style.setProperty('--u', u.toFixed(3) + 'px');
      qh = vb[3] * u * .85;
    }
    // Quiz: ? sits over the digits, which keep their place, so nothing moves when it flips.
    const b = R.getBoundingClientRect(), r = disp.el.getBoundingClientRect();
    Object.assign(qEl.style, { left: r.left - b.left + 'px', top: r.top - b.top + 'px', width: r.width + 'px', height: r.height + 'px', fontSize: Math.max(10, qh) + 'px' });
    placeArrows();
  }

  // ▲ and ▼ above and below the hours and the minutes. They stay where they are while the time changes.
  function placeArrows() {
    if (!setOn || !showD || !disp) return;
    const base = dig.getBoundingClientRect(), bh = base.height, at = {};
    const put = (k, el, upward) => {
      const r = el.getBoundingClientRect();
      const cx = el === disp.hourEl && disp.onesX ? r.right - r.width / 4 : (r.left + r.right) / 2;
      at[k] = [Math.round(cx - base.left - 22), Math.round(upward ? Math.max(3, r.top - base.top - 49) : Math.min(bh - 47, r.bottom - base.top + 5))];
    };
    put('hu', disp.hourEl, true); put('hd', disp.hourEl, false);
    put('mu', disp.minEl, true); put('md', disp.minEl, false);
    // Small digits: keep the hour and minute arrows a finger apart.
    const gap = at.mu[0] - at.hu[0];
    if (gap < 48) { const d = Math.ceil((48 - gap) / 2); at.hu[0] -= d; at.hd[0] -= d; at.mu[0] += d; at.md[0] += d; }
    // Now and the Set badge share the window's top corners. In a small window an arrow could land under one, so the
    // digits move away from it and fit again.
    if (nudge < 4) {
      let padL = 0, padR = 0;
      const blocks = [nowBtn, badge].map(e => e.getBoundingClientRect()).filter(b => b.width);
      for (const k in at) {
        const l = base.left + at[k][0] - 4, t = base.top + at[k][1] - 4, r = l + 52, b = t + 52;
        for (const o of blocks) {
          if (r <= o.left || l >= o.right || b <= o.top || t >= o.bottom) continue;
          if ((o.left + o.right) / 2 > base.left + base.width / 2) padR = Math.max(padR, r - o.left); else padL = Math.max(padL, o.right - l);
        }
      }
      if (padL || padR) {
        const cs = getComputedStyle(readout);
        if (padR) readout.style.paddingRight = (parseFloat(cs.paddingRight) || 0) + 2 * padR + 'px';
        if (padL) readout.style.paddingLeft = (parseFloat(cs.paddingLeft) || 0) + 2 * padL + 'px';
        nudge++;
        fit();
        return;
      }
    }
    for (const k in at) { arrows[k].style.left = at[k][0] + 'px'; arrows[k].style.top = at[k][1] + 'px'; }
  }

  // ---------------------------------------------------------------- Set the time
  const realMinute = () => Math.floor(nowMinutes(new Date()));
  function saveState() { Board21.save({ set: state.set ? setOf(state.set.at, state.set.mark) : null, markAt: state.markAt }); }
  function startSet() {
    T = realMinute(); anim = null;
    state.set = { at: T };
    saveState(); apply();
  }
  function endSet() {
    state.set = null; T = null; anim = null;
    saveState(); apply();
  }
  // A new set time, from a drag, an arrow, or a key. In Quiz the digital clock asks again, so the hands never give the answer away.
  function setTime(v, save) {
    const was = T == null ? null : Math.round(T);
    T = v;
    if (was !== Math.round(v) && revealed) { revealed = false; render(); }
    if (save) { state.set = setOf(mod(Math.round(T), DAY), state.set && state.set.mark); saveState(); }
  }
  // The shown time (with the hands on their way somewhere, where they are now).
  function shownT() {
    if (anim) { const p = Math.min(1, (performance.now() - anim.t0) / anim.dur); return anim.from + (anim.to - anim.from) * ease(p); }
    return T != null ? T : nowMinutes(new Date());
  }
  function tweenTo(to, dur) {
    const from = shownT();
    anim = reduceMotion.matches || !dur ? null : { from, to, t0: performance.now(), dur };
    setTime(to, true);
    if (!anim) T = mod(T, DAY);
    loop();
  }
  // ▲ and ▼: the minutes go to the next step (10:03 → 10:05 with 5-minute steps), wrap, and carry into the hours.
  function step(k) {
    if (!setOn) return;
    const s = snap(), base = T != null ? Math.round(T) : realMinute();
    const to = k === 'hu' ? base + 60 : k === 'hd' ? base - 60 : k === 'mu' ? Math.floor(base / s + 1e-9) * s + s : Math.ceil(base / s - 1e-9) * s - s;
    if (T == null) T = base;   // (after Now: from the real time)
    tweenTo(to, k[0] === 'h' ? 420 : 160);
  }
  // Now: back to the real time, still setting the time. The next drag or arrow sets a time again.
  nowBtn.addEventListener('click', () => {
    if (!setOn) return;
    const from = shownT(), diff = mod(nowMinutes(new Date()) - from + 720, DAY) - 720;
    T = null;
    anim = reduceMotion.matches ? null : { from, to: from + diff, t0: performance.now(), dur: Math.min(800, 260 + Math.abs(diff) * 1.2), now: true };
    state.set = { at: null };
    saveState(); apply(); loop();
  });
  // Hold an arrow to repeat it. A keyboard click (detail 0) steps once.
  function holdRepeat(btn, fn) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); stop(); fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 110); }, 450);
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* gone */ }
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  }

  // Drag a hand. The minute hand carries the hour hand like gears: a full turn is one hour, and the angle is unwrapped,
  // so passing 12 moves the hour on or back. Dragging the hour hand turns the minute hand too. A press grabs the hand
  // where it is: only movement changes the time.
  function toSvg(e) {
    const m = face.svg.getScreenCTM();
    if (!m) return { x: 100, y: 100 };
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  const angleAt = p => mod(Math.atan2(p.x - 100, -(p.y - 100)) / RAD, 360);
  function segDist(p, deg, len) {
    const [tx, ty] = P(len, deg), vx = tx - 100, vy = ty - 100;
    const t = Math.max(0, Math.min(1, ((p.x - 100) * vx + (p.y - 100) * vy) / (vx * vx + vy * vy)));
    return Math.hypot(p.x - 100 - t * vx, p.y - 100 - t * vy);
  }
  let drag = null, press = null;
  const hourOnly = () => config.hourOnly && config.face === 'teaching';
  face.svg.addEventListener('pointerdown', e => {
    press = null;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const p = toSvg(e);
    if (Math.hypot(p.x - 100, p.y - 100) > 100) return;
    const t = shownT(), dh = segDist(p, mod(t / 60, 12) * 30, face.len.h), dm = hourOnly() ? Infinity : segDist(p, mod(t, 60) * 6, face.len.m);
    press = { onHand: Math.min(dh, dm) < 14, moved: false };
    if (!setOn || !showA) return;
    const which = hourOnly() || (dh < dm && dh < 24) ? 'h' : 'm';
    if (anim) { anim = null; if (T != null) T = mod(T, DAY); }
    drag = { id: e.pointerId, which, last: angleAt(p) };
    e.preventDefault();
    try { face.svg.setPointerCapture(e.pointerId); } catch (err) { /* gone */ }
    face.svg.classList.add('dragging', 'drag-' + which);
  });
  const stopDrag = () => { drag = null; face.svg.classList.remove('dragging', 'drag-h', 'drag-m'); };
  face.svg.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!setOn) { stopDrag(); return; }   // Set the time turned off during the drag
    const a = angleAt(toSvg(e)), d = wrap180(a - drag.last);
    if (!d) return;
    drag.last = a;
    if (press) press.moved = true;
    if (T == null) T = nowMinutes(new Date());   // (after Now: from the real time)
    setTime(T + (drag.which === 'm' ? d / 6 : d * 2), false);
    tick();
  });
  const dragUp = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const moved = press && press.moved;
    stopDrag();
    if (setOn && moved && T != null) { const s = snap(); tweenTo(Math.round(T / s) * s, 180); }
  };
  face.svg.addEventListener('pointerup', dragUp);
  face.svg.addEventListener('pointercancel', dragUp);
  face.svg.addEventListener('keydown', e => {
    if (!setOn || !showA) return;
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 60, PageDown: -60 }[e.key];
    if (!d) return;
    e.preventDefault();
    step(Math.abs(d) > 1 ? (d > 0 ? 'hu' : 'hd') : (d > 0 ? 'mu' : 'md'));
  });

  // ---------------------------------------------------------------- Mark a time
  // A tap on the face marks that minute, the next time it comes round. On the real time it's markAt, a time today or
  // tomorrow. On a set time it's the set time's own mark, kept with it, so it never shades the real time later.
  face.svg.addEventListener('click', e => {
    const pr = press; press = null;
    if (!config.mark || !showA || !pr || pr.moved || (setOn && pr.onHand)) return;
    const p = toSvg(e);
    if (Math.hypot(p.x - 100, p.y - 100) > 100) return;
    const minute = mod(Math.round(angleAt(p) / 6), 60), from = T != null ? Math.round(T) : nowMinutes(new Date());
    let c = Math.floor(from / 60) * 60 + minute;
    if (c <= from + (T != null ? 0 : .25)) c += 60;
    if (T != null) state.set = setOf(mod(Math.round(T), DAY), mod(c, DAY));
    else {
      const d = new Date();
      d.setHours(Math.floor(c / 60), c % 60, 0, 0);
      state.markAt = d.getTime();
    }
    saveState();
    face.k.wedge = null;
    tick();
  });
  // The timer the wedge follows: the running one that ends soonest. null when none runs.
  function followedTimer(now) {
    let best = null;
    for (const t of timers) if (t.endsAt !== null && t.endsAt > now && (!best || t.endsAt < best.endsAt)) best = t;
    return best;
  }
  // The wedge, as minutes from the minute hand: [minutes, warning minutes], or null for none.
  function wedgeNow(t) {
    if (!config.mark || !showA) return null;
    const now = Date.now();
    if (T != null) {   // a set time: from it to its own mark, or to a real mark still to come. Timers aren't followed.
      let M = state.set && state.set.mark != null ? state.set.mark : null;
      if (M == null && state.markAt != null && state.markAt > now) { const m = new Date(state.markAt); M = m.getHours() * 60 + m.getMinutes(); }
      if (M == null) return null;
      const d = mod(M - t + 720, DAY) - 720;
      return d > 0 ? [d, 0] : null;
    }
    const f = followedTimer(now);
    if (f) return [(f.endsAt - now) / 60000, f.warnMs / 60000];
    if (state.markAt != null && state.markAt > now) return [(state.markAt - now) / 60000, 0];
    return null;
  }
  const num0 = v => typeof v === 'number' && isFinite(v);
  const readTimers = l => (Array.isArray(l) ? l : []).filter(t => t && typeof t.id === 'string' && (num0(t.endsAt) || num0(t.remaining)))
    .map(t => ({ id: t.id, endsAt: num0(t.endsAt) ? t.endsAt : null, remaining: num0(t.endsAt) ? null : t.remaining, warnMs: num0(t.warnMs) && t.warnMs > 0 ? t.warnMs : 0 }));

  // ---------------------------------------------------------------- Quiz
  // The digital clock shows ? until it's tapped. Another tap asks again. On a keyboard the readout is the button, in
  // both states, so focus stays on it and a screen reader hears "Show the time" and then "Hide the time".
  function flip() { if (!quizOn()) return; revealed = !revealed; render(); }
  dig.addEventListener('click', e => { if (!e.target.closest('.arrow')) flip(); });
  readout.addEventListener('keydown', e => { if (quizOn() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flip(); } });
  function showQuiz() {
    const ask = asked();
    qEl.hidden = !ask;
    if (disp) disp.el.style.visibility = ask ? 'hidden' : '';
    if (quizOn()) { readout.setAttribute('role', 'button'); readout.tabIndex = 0; readout.setAttribute('aria-label', revealed ? 'Hide the time' : 'Show the time'); }
    else ['role', 'tabindex', 'aria-label'].forEach(a => readout.removeAttribute(a));
  }
  function render() {
    showQuiz();
    wordsKey = null; lastLabel = null;
    tick();
  }

  // ---------------------------------------------------------------- Each tick
  function tick() {
    const d = new Date();
    let t, sec = null;
    if (anim) {
      const p = Math.min(1, (performance.now() - anim.t0) / anim.dur);
      t = anim.from + (anim.to - anim.from) * ease(p);
      if (p >= 1) { anim = null; if (T != null) T = mod(T, DAY); t = T != null ? T : nowMinutes(d); }
    } else if (T != null) t = T;
    else {
      t = nowMinutes(d);
      if (reduceMotion.matches) t = Math.floor(t);   // (reduced motion: no sweeping hands, a step each minute)
      if (config.seconds && !setOn) sec = d.getSeconds();
    }
    const live = T == null && !anim;
    const shown = live ? Math.floor(t) : drag ? Math.round(t / snap()) * snap() : Math.round(t);
    const [hh, mm] = hm(shown);
    if (showA) {
      face.draw(t, sec, hourOnly());
      const w = wedgeNow(t), lag = live ? nowMinutes(d) - t : 0;   // (a hand that steps each minute is behind the real time)
      face.wedge(mod(t, 60) * 6, w ? w[0] + lag : null, w ? w[1] : 0);
    }
    if (showD && disp) {
      const ss = sec;
      const k = shown + ':' + ss + ':' + config.hour24;
      if (k !== dkey) { dkey = k; if (disp.show(hh, mm, ss, config.hour24)) layout(); }   // (wider or narrower: lay out again)
    }
    if (config.words && timeOn) {
      const ask = asked(), wk = ask ? '?' : hh * 60 + mm;
      if (wk !== wordsKey) {
        wordsKey = wk;
        wordsEl.style.visibility = ask ? 'hidden' : '';
        wordsEl.innerHTML = '';
        const span = document.createElement('span');
        span.textContent = inWords(hh, mm);
        wordsEl.append(span);
        fitWords();
      }
    }
    if (showY && d.toDateString() !== dayKey) {   // always today's date, even on a set time
      dayKey = d.toDateString();
      dateText(d);
      layout();
    }
    // What a screen reader hears, once a minute.
    const label = `${h12(hh)}:${pad2(mm)} ${apOf(hh, true)}`, settable = setOn && showA;
    if (label + settable !== lastLabel) {
      lastLabel = label + settable;
      if (settable) { face.svg.setAttribute('aria-valuenow', hh * 60 + mm); face.svg.setAttribute('aria-valuetext', label); face.svg.setAttribute('aria-label', 'Set the time. Drag a hand or use the arrow keys.'); }
      else face.svg.setAttribute('aria-label', 'Clock showing ' + label);
    }
  }
  // While the hands are on their way somewhere, every frame; else four times a second.
  let looping = false;
  function loop() {
    if (looping) return;
    looping = true;
    const f = () => { tick(); if (anim) requestAnimationFrame(f); else looping = false; };
    requestAnimationFrame(f);
  }

  // ---------------------------------------------------------------- From the board
  function take(d) {
    const next = readState(d), was = T == null ? null : Math.round(T);
    state = next;
    if (drag) return;   // (a drag under way keeps its time; its release saves it)
    T = state.set && state.set.at != null ? state.set.at : null;
    if (T !== was && T != null && revealed) revealed = false;
    anim = null;
  }
  Board21.on('data', d => { take(d); apply(); render(); });
  Board21.on('config', c => { config = readConfig(c); apply(); render(); });
  Board21.on('timers', l => { timers = readTimers(l); face.k.wedge = null; tick(); });
  Board21.on('theme', menu);   // LED look in dark theme, LCD look in light
  Board21.ready().then(ctx => {
    config = readConfig(ctx.config);
    take(ctx.data);
    timers = readTimers(ctx.timers);
    apply();
    render();
    setInterval(() => { if (!anim) tick(); }, 250);
    // Fonts and the text style can arrive after the first layout.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../../sdk/board21.js"></script>
<script type="application/json" id="board21-widget">
  {"id": "calculator", "name": "Calculator", "version": "1.0.0", "window": {"width": 900, "height": 600, "minWidth": 280, "minHeight": 400}}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<script src="calc-engine.js"></script>
<!-- The engine's stylesheet for its math (the ce-* classes) goes first, so the rules below can adjust it. -->
<style id="engine-css"></style>
<script>document.getElementById('engine-css').textContent = window.CalcEngine ? CalcEngine.CSS : '';</script>
<style>
  /* Calculator: Teach's canvas and steps, its keys, and History drawn as Desmos draws its lines. The panels sit side by
     side, left to right (Swap sides mirrors them): the canvas, the keys, History. In a tall or narrow window the canvas
     sits above the keys, and History may go across the top. The script sets the grid for the window's size (layout());
     the rules here draw each panel. Colors come only from the --b21-* variables. */
  html, body { margin: 0; height: 100%; }
  body {
    --shadow: color-mix(in srgb, var(--b21-text) 16%, transparent);
    background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font); overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  [data-b21-theme="dark"] body { --shadow: rgba(0, 0, 0, .45); }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; margin: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 2px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #app { position: fixed; inset: 0; outline: none; container: app / size; }
  .kbd #app:focus { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--b21-accent) 60%, transparent); }
  #grid { position: absolute; inset: 0; display: grid; padding: var(--p, 10px); gap: var(--g, 6px); grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }

  /* ---- The canvas: Teach's card when there is room, otherwise a plain display above the keys, as on a phone */
  #canvas { grid-area: canvas; position: relative; min-width: 0; min-height: 0; container: cv / size; }
  #card { position: absolute; inset: 0; display: none; flex-direction: column; border-radius: 18px; --cp: clamp(10px, 2.6cqmin, 36px); padding: 0 var(--cp); background: var(--b21-surface); box-shadow: inset 0 0 0 1px var(--b21-border); }
  #disp { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; padding: 2px 6px 0; }
  @container cv (min-width: 340px) and (min-height: 190px) {
    #app:not(.nocanvas) #card { display: flex; }
    #app:not(.nocanvas) #disp { display: none; }
  }
  #player { display: none; }
  @container cv (min-width: 340px) and (min-height: 250px) {
    #app.steps #player { display: flex; }
  }
  #app[data-layout="stack"] #keys, #app.nocanvas[data-layout="stack"] #canvas { justify-self: center; width: min(100%, var(--kcap, 100%)); }

  /* The top bar: where the steps are, and the Hide the answer switch */
  .cbar { flex: 0 0 auto; display: flex; height: clamp(44px, 9cqh, 84px); align-items: center; gap: .6em; font-size: clamp(13px, min(3.4cqh, 2.4cqw), 28px); }
  .where { flex: 1 1 auto; min-width: 0; color: var(--b21-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rule:not(:empty)::before { content: "·"; margin: 0 .45em; color: var(--b21-muted); }
  #rule { color: var(--b21-text); font-weight: 500; }
  #rule.bad { color: var(--b21-danger); }
  @container cv (max-width: 619.98px) { #rule { display: none; } }
  #hide { flex: 0 0 auto; display: inline-flex; align-items: center; gap: .55em; height: 100%; min-height: 44px; margin-right: -.4em; padding: 0 .4em; border: 0; border-radius: 999px; background: transparent; font-weight: 600; color: var(--b21-text); cursor: pointer; white-space: nowrap; }
  .track { position: relative; width: 2.3em; height: 1.36em; border-radius: 999px; background: var(--b21-muted); transition: background-color .18s; }
  .knob { position: absolute; top: .16em; left: .16em; width: 1.04em; height: 1.04em; border-radius: 50%; background: var(--b21-bg); box-shadow: 0 1px 3px var(--shadow); transition: transform .18s; }
  #hide[aria-checked="true"] .track { background: var(--b21-accent); }
  #hide[aria-checked="true"] .knob { transform: translateX(.94em); background: var(--b21-on-accent); }

  /* The board: one big problem, or its steps written out under each other */
  #board { position: relative; flex: 1 1 0; display: flex; min-height: 0; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .eqv { display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 100%; min-height: 0; }
  .eqline { display: flex; align-items: center; gap: .3em; max-width: 100%; }
  #eq { flex: 0 0 auto; white-space: nowrap; font-size: clamp(24px, min(24cqh, 16cqw), 260px); line-height: 1.3; letter-spacing: -.01em; }
  #eq .ce-ans, #big .ce-num { font-weight: 700; }
  #eq .ce-ans { color: var(--b21-accent); }
  .prev { color: var(--b21-muted); }
  .zero { color: var(--b21-muted); opacity: .6; }
  #said { max-width: 100%; margin-top: .4em; text-align: center; color: var(--b21-text); font-size: clamp(14px, min(5cqh, 3.4cqw), 40px); line-height: 1.3; }
  #said:empty { display: none; }
  #note { max-width: 100%; margin-top: .55em; text-align: center; color: var(--b21-muted); font-size: clamp(13px, min(5cqh, 3.4cqw), 40px); line-height: 1.3; }
  #note:empty { display: none; }
  #note.tip { color: var(--b21-accent); font-weight: 600; }
  #note.bad { display: inline-flex; align-items: center; gap: .5em; padding: .42em .9em; border-radius: 999px; background: color-mix(in srgb, var(--b21-danger) 11%, var(--b21-surface)); color: var(--b21-text); text-align: left; }
  #note.bad svg { width: 1.2em; height: 1.2em; color: var(--b21-danger); }
  #chain { display: none; }
  #board.chain .eqv { display: none; }
  #board.chain { justify-content: safe center; overflow: auto; scrollbar-width: thin; }
  #board.chain #chain {
    display: grid; grid-template-columns: auto max-content minmax(0, auto); align-items: center; column-gap: .32em; row-gap: .1em;
    width: max-content; max-width: none; margin: 0; padding: .1em 0; list-style: none;
    font-size: clamp(18px, min(14cqh, 10cqw), 160px); line-height: 1.3;
  }
  .ln { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; }
  .ln:not(.on) { visibility: hidden; }
  .ln.on.in { animation: rise .34s cubic-bezier(.2, .8, .2, 1) both; }
  .lead { color: var(--b21-muted); text-align: right; min-width: .6em; }
  .lx { white-space: nowrap; }
  .ln.past .lx { color: var(--b21-muted); }
  .ln.past .ce-mark { background: none; box-shadow: none; color: inherit; }
  .ln.cur .ce-mark { color: var(--b21-accent); background: var(--b21-accent-soft); border-radius: .18em; box-shadow: 0 0 0 .07em var(--b21-accent-soft), 0 0 0 .11em color-mix(in srgb, var(--b21-accent) 35%, transparent); }
  .ln.bad .ce-mark { color: var(--b21-danger); background: color-mix(in srgb, var(--b21-danger) 13%, transparent); box-shadow: 0 0 0 .07em color-mix(in srgb, var(--b21-danger) 13%, transparent), 0 0 0 .11em color-mix(in srgb, var(--b21-danger) 35%, transparent); }
  .ln.fin .lx { color: var(--b21-accent); font-weight: 700; }
  .lw { display: flex; align-items: center; gap: .4em; min-width: 0; margin-left: .5em; font-size: .46em; }
  .lw:not(.on) { visibility: hidden; }
  .lw.on.in { animation: fade .3s ease-out both; }
  .work { padding: .2em .65em; border-radius: 999px; background: var(--b21-surface-2); color: var(--b21-text); white-space: nowrap; }
  .work.bad { background: color-mix(in srgb, var(--b21-danger) 11%, var(--b21-surface)); font-weight: 600; }
  @container cv (max-width: 539.98px) {
    #board.chain #chain { grid-template-columns: auto max-content; }
    .lw { grid-column: 2; margin: 0 0 .25em; font-size: .52em; }
  }

  /* Under the board: the rule cells, in Amplify's order, with the step on screen's rule lit; then the step buttons */
  #player { flex: 0 0 auto; align-items: center; gap: .55em; height: clamp(52px, 12cqh, 112px); font-size: clamp(14px, min(3.7cqh, 2.6cqw), 32px); border-top: 1px solid var(--b21-border); }
  .rules { flex: 1 1 auto; display: inline-flex; gap: .14em; min-width: 0; overflow: hidden; }
  .rules b { flex: 0 0 auto; display: inline-block; height: 1.4em; padding: 0 .27em; border-radius: .38em; font-size: max(16px, .9em); font-weight: 700; line-height: 1.4em; white-space: nowrap; word-spacing: -.12em; color: var(--b21-muted); transition: background-color .2s, color .2s; }
  .rules b.lit { background: var(--b21-accent); color: var(--b21-on-accent); }
  .rules b.soft { background: var(--b21-accent-soft); color: var(--b21-text); }
  .rules i { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  .rules sup { font-size: .62em; line-height: 0; vertical-align: baseline; position: relative; top: -.42em; margin-left: .04em; }
  .btn { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: .3em; height: max(44px, 2.5em); min-width: max(44px, 2.5em); padding: 0 1em; border: 0; border-radius: 999px; background: var(--b21-surface-2); font-weight: 600; white-space: nowrap; cursor: pointer; }
  .btn svg { width: 1.15em; height: 1.15em; stroke-width: 2.3; }
  .btn.icon { padding: 0; }
  .btn.primary { background: var(--b21-accent); color: var(--b21-on-accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:not(:disabled):active { filter: brightness(.92); }
  @container cv (max-width: 399.98px) { .rules { visibility: hidden; } }

  /* The compact display: the problem in small type above the big number */
  .xline { flex: 0 0 auto; display: flex; justify-content: flex-end; min-width: 0; overflow: hidden; }
  .xline.clip { -webkit-mask-image: linear-gradient(to right, transparent, var(--b21-text) 2.2em); mask-image: linear-gradient(to right, transparent, var(--b21-text) 2.2em); }
  #x { flex: 0 0 auto; white-space: nowrap; color: var(--b21-muted); font-size: clamp(13px, min(15cqh, 7cqw), 64px); line-height: 1.35; min-height: 1.35em; }
  .bigline { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
  #big { flex: 0 0 auto; white-space: nowrap; font-size: clamp(22px, min(46cqh, 18cqw), 200px); line-height: 1.12; letter-spacing: -.01em; }
  #big .ce-num { font-weight: 400; }
  #big.k-error, #big.k-warning { font-size: clamp(16px, min(22cqh, 8cqw), 90px); font-weight: 600; }
  #big.k-warning, #big .zero { color: var(--b21-muted); }
  #hint { text-align: right; color: var(--b21-muted); font-size: clamp(12px, min(10cqh, 4.2cqw), 30px); line-height: 1.3; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint.tip { color: var(--b21-accent); }

  /* Fraction or decimal, beside an answer, as in Desmos */
  .toggle { flex: 0 0 auto; display: grid; place-items: center; width: max(44px, .9em); height: max(44px, .9em); padding: 0; border: 0; border-radius: 999px; background: var(--b21-accent-soft); color: var(--b21-accent); cursor: pointer; font-size: inherit; }
  .toggle svg { width: 56%; height: 56%; stroke-width: 2.2; }
  .toggle[hidden] { display: none; }
  .eqline .toggle { font-size: clamp(24px, min(24cqh, 16cqw), 260px); width: max(44px, .62em); height: max(44px, .62em); }
  .lw .toggle { width: max(36px, 1.7em); height: max(36px, 1.7em); }

  /* The hidden answer: tap the box to show it */
  .reveal { display: inline-grid; place-items: center; min-width: 1.25em; height: 1.12em; margin: 0 .04em; padding: 0 .18em; vertical-align: -.12em; border: .07em dashed var(--b21-accent); border-radius: .2em; background: var(--b21-accent-soft); color: var(--b21-accent); font-weight: 700; line-height: 1; cursor: pointer; }
  .shown .ce-ans, #big.shown { animation: pop .42s cubic-bezier(.2, 1.4, .4, 1) both; display: inline-block; }

  /* ---- History: Desmos's lines. Each problem on a line of its own, its answer in a soft box at the right. */
  #history { grid-area: hist; display: none; flex-direction: column; min-width: 0; min-height: 0; border-radius: 18px; background: var(--b21-bg); box-shadow: inset 0 0 0 1px var(--b21-border); overflow: hidden; }
  #app.hist #history { display: flex; }
  #hlist { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; font-size: var(--hf, 20px); }
  .hline { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: .1em .4em; min-height: max(52px, 2.1em); padding: .2em .45em .2em .55em; border-bottom: 1px solid var(--b21-border); }
  .hline::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; }
  .hline.cur { background: color-mix(in srgb, var(--b21-accent-soft) 75%, transparent); }
  .hline.cur::before { background: var(--b21-accent); }
  .hpick { flex: 1 1 auto; min-width: 0; min-height: max(44px, 1.6em); display: flex; align-items: center; padding: 0 .1em; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 1em; overflow-x: auto; scrollbar-width: none; cursor: pointer; }
  .hpick::-webkit-scrollbar, .hans::-webkit-scrollbar { display: none; }
  /* (A long problem and its answer don't share a line: the answer goes under it, still at the right, as in Desmos.) */
  .hans { flex: 0 1 auto; display: inline-flex; align-items: center; gap: .3em; max-width: 100%; margin-left: auto; min-height: max(44px, 1.6em); padding: .06em .5em; border: 0; border-radius: .45em; background: var(--b21-surface-2); font-size: 1em; font-weight: 600; white-space: nowrap; overflow-x: auto; scrollbar-width: none; cursor: pointer; }
  .hans .heq { font-weight: 400; }
  .hans:disabled { cursor: default; color: var(--b21-accent); }
  .hans .ce-frac { font-size: .72em; }
  .hpick:active, .hans:not(:disabled):active { filter: brightness(.94); }
  @media (hover: hover) {
    .hpick:hover { color: var(--b21-accent); } .hans:not(:disabled):hover { background: color-mix(in srgb, var(--b21-accent) 18%, var(--b21-surface-2)); }
    /* In dark, a pale Custom… accent makes that background light. The R takes the light theme's mix there, 3:1 or more. */
    :root[data-b21-theme="dark"] .hans:not(:disabled):hover .ce-r { color: color-mix(in srgb, var(--b21-muted) 90%, var(--b21-text)); }
  }
  .hpick.clip, .hans.clip { -webkit-mask-image: linear-gradient(to left, transparent, #000 1.6em); mask-image: linear-gradient(to left, transparent, #000 1.6em); }
  .hempty { padding: .8em .7em; color: var(--b21-muted); font-size: .8em; }
  /* Across the top, each problem keeps to one line, its answer beside it, so three lines show in full. (A long problem is
     drawn smaller, then fades, as above. The band ends on whole lines: fitBand().) */
  #app.htop .hline { flex-wrap: nowrap; }
  #app.htop .hans { flex-shrink: 0; max-width: 60%; }

  /* ---- Keys: ÷ × − + = down the right, in the accent color. Advanced keys are two rows above. AC sits over (, ⌫ over )
     and √, and ± over ÷, so every edge meets the columns below. */
  #keys {
    grid-area: keys; container: pad / size; min-width: 0; min-height: 0; --rows: 6;
    display: grid; gap: var(--g, 6px); grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
    grid-template-areas:
      "ac ac ac del del del del del del neg neg neg"
      "open open open close close close sqrt sqrt sqrt div div div"
      "d7 d7 d7 d8 d8 d8 d9 d9 d9 mul mul mul"
      "d4 d4 d4 d5 d5 d5 d6 d6 d6 sub sub sub"
      "d1 d1 d1 d2 d2 d2 d3 d3 d3 add add add"
      "d0 d0 d0 pt pt pt ans ans ans eq eq eq";
  }
  #app.adv:not(.test) #keys {
    --rows: 8;
    grid-template-areas:
      "sq sq sq pow pow pow root root root cbrt cbrt cbrt"
      "pi pi pi pct pct pct frac frac frac right right right"
      "ac ac ac del del del del del del neg neg neg"
      "open open open close close close sqrt sqrt sqrt div div div"
      "d7 d7 d7 d8 d8 d8 d9 d9 d9 mul mul mul"
      "d4 d4 d4 d5 d5 d5 d6 d6 d6 sub sub sub"
      "d1 d1 d1 d2 d2 d2 d3 d3 d3 add add add"
      "d0 d0 d0 pt pt pt ans ans ans eq eq eq";
  }
  /* Test practice: Desmos Four-Function's keys, no ±. Its clear all and ⌫ sit flat in a strip on top, clear all in the
     middle of the pad, so the pad has 24 columns. clear all takes 8 of them, so its label has room for the focus ring and
     the pressed key. The keys below keep their size and place. */
  #app.test #keys {
    grid-template-columns: repeat(24, minmax(0, 1fr));
    grid-template-areas:
      ". . . . . . . . ac ac ac ac ac ac ac ac del del del del del del . ."
      "open open open open open open close close close close close close sqrt sqrt sqrt sqrt sqrt sqrt div div div div div div"
      "d7 d7 d7 d7 d7 d7 d8 d8 d8 d8 d8 d8 d9 d9 d9 d9 d9 d9 mul mul mul mul mul mul"
      "d4 d4 d4 d4 d4 d4 d5 d5 d5 d5 d5 d5 d6 d6 d6 d6 d6 d6 sub sub sub sub sub sub"
      "d1 d1 d1 d1 d1 d1 d2 d2 d2 d2 d2 d2 d3 d3 d3 d3 d3 d3 add add add add add add"
      "d0 d0 d0 d0 d0 d0 pt pt pt pt pt pt ans ans ans ans ans ans eq eq eq eq eq eq";
  }
  .key {
    --kb: color-mix(in srgb, var(--b21-surface-2), var(--b21-text) 4%);
    display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 0;
    border: 0; border-radius: clamp(10px, 3.4cqmin, 26px); background: var(--kb); cursor: pointer;
    font-size: calc(clamp(15px, min(calc(100cqh / var(--rows, 6) * .4), 8.6cqw), 80px) * var(--ks, 1));
    font-weight: 500; line-height: 1; transition: background-color .12s, transform .08s;
  }
  .key:active, .key.hit { background: color-mix(in srgb, var(--kb), var(--b21-text) 16%); transform: scale(.96); }
  .key.fn { --kb: color-mix(in srgb, var(--b21-surface-2), var(--b21-text) 13%); }
  .key.adv { --kb: var(--b21-accent-soft); --ks: .84; display: none; }
  #app.adv:not(.test) .key.adv { display: flex; }
  #app.test .key[data-key="negate"] { display: none; }
  #app.test .key[data-key="clear"], #app.test .key[data-key="backspace"] { --kb: transparent; --ks: .9; color: color-mix(in srgb, var(--b21-text) 78%, transparent); }
  #app.test .key[data-key="clear"] .w { font-size: max(.8em, 12px); font-weight: 400; white-space: nowrap; }
  .key.op { --kb: var(--b21-accent); color: var(--b21-on-accent); --ks: 1.22; font-weight: 400; }
  .key.op:active, .key.op.hit { background: color-mix(in srgb, var(--b21-accent), var(--b21-text) 22%); }
  .key.op.pending { background: var(--b21-on-accent); color: var(--b21-accent); box-shadow: inset 0 0 0 max(3px, .08em) var(--b21-accent); }
  [data-b21-theme="dark"] .key.op.pending { background: var(--b21-text); color: var(--b21-bg); box-shadow: none; }
  .key.adv.pending, .key.inbox { box-shadow: inset 0 0 0 max(3px, .08em) var(--b21-accent); }
  .key.adv.exit { background: var(--b21-accent); color: var(--b21-on-accent); }
  .key[aria-disabled="true"] { opacity: .38; }
  .key svg { width: 1.1em; height: 1.1em; stroke-width: 1.9; }
  .key .w { font-size: .8em; font-weight: 600; }
  .key i { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  .key sup { font-size: .62em; line-height: 0; position: relative; top: -.42em; margin-left: .04em; }
  .key .ri { margin: 0 -.12em 0 0; top: -.5em; }
  .key .fk { display: inline-flex; flex-direction: column; align-items: center; font-size: .74em; line-height: 1.02; }
  .key .fk i:first-child { border-bottom: .09em solid currentColor; padding: 0 .2em .04em; }

  /* ---- The engine's math, adjusted for a big canvas */
  .ce-radicand { display: inline-block; line-height: .84; padding: .14em .08em .02em .08em; }
  .ce-ansref { color: var(--b21-accent); }
  /* The R in 3 R 2 is muted (the engine's .ce-r). On the grey of History's answers and the steps' work, light muted
     reaches only 4.4:1, so it is a touch darker there: 4.9:1. */
  :root:not([data-b21-theme="dark"]) .hans .ce-r, :root:not([data-b21-theme="dark"]) .work .ce-r { color: color-mix(in srgb, var(--b21-muted) 90%, var(--b21-text)); }

  @keyframes rise { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .ln.on.in, .lw.on.in, .shown .ce-ans, #big.shown { animation: none; }
    .key, .track, .knob, .rules b { transition: none; }
    .key:active, .key.hit { transform: none; }
  }
</style>
</head>
<body>
<div id="app" tabindex="0" role="group" aria-label="Calculator" data-layout="side">
  <div id="grid">
    <section id="canvas" aria-label="Problem">
      <div id="card">
        <div class="cbar">
          <span class="where"><span id="count"></span><span id="rule"></span></span>
          <button type="button" id="hide" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><span class="knob"></span></span><span>Hide the answer</span></button>
        </div>
        <div id="board">
          <div class="eqv">
            <div class="eqline"><div id="eq"></div><button type="button" class="toggle" id="eqToggle" hidden></button></div>
            <div id="said" aria-hidden="true"></div>
            <div id="note"></div>
          </div>
          <ol id="chain" aria-label="Steps"></ol>
        </div>
        <div id="player">
          <span class="rules" aria-hidden="true"><b data-rule="P">( )</b><b data-rule="E"><i>x</i><sup><i>n</i></sup> √</b><b data-rule="MD">× ÷</b><b data-rule="AS">+ −</b></span>
          <button type="button" class="btn icon" id="back" aria-label="Back"></button>
          <button type="button" class="btn primary" id="next"><span>Next step</span></button>
          <button type="button" class="btn" id="all">Show all</button>
        </div>
      </div>
      <div id="disp">
        <div class="xline"><div id="x"></div></div>
        <div class="bigline"><button type="button" class="toggle" id="bigToggle" hidden></button><div id="big"></div></div>
        <div id="hint"></div>
      </div>
    </section>
    <div id="keys"></div>
    <section id="history" aria-label="History"><ol id="hlist"></ol></section>
  </div>
  <div id="live" class="vh" aria-live="polite"></div>
</div>
<script>
(function () {
  'use strict';
  const E = window.CalcEngine;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const noCursor = html => html.replace(/<span class="ce-cursor"><\/span>/g, '');
  const clamp = (lo, v, hi) => Math.max(lo, Math.min(v, hi));
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // Content (Board21.save): the engine's serialize(), the problem on the canvas and History (docs/DATA-FORMAT.md):
  //   { v: 2, expr, mode, pct?, closed?, frac?, history: [{ expr, pct }] }. The engine checks it all on load.
  // Config (Board21.saveConfig): every menu setting, and which panels show:
  //   { canvas, history, steps, words, advanced, hide, answers: 'decimal' | 'fraction' | 'remainder', fractions, test,
  //     percent: 'of' | 'apple', swap }
  // fractions is answers === 'fraction', written for older releases, which read only it (answers came in 2026.11.23-1).
  // A config without answers reads fractions: true as 'fraction'. test is Test practice: off while TEST_PRACTICE is.
  const DEFAULTS = Object.freeze({ canvas: true, history: false, steps: true, words: false, advanced: false, hide: false, answers: 'decimal', test: false, percent: 'of', swap: false });
  const FLAGS = ['canvas', 'history', 'steps', 'words', 'advanced', 'hide', 'test', 'swap'];
  const ANSWERS = ['decimal', 'fraction', 'remainder'];
  function readConfig(c) {
    const out = Object.assign({}, DEFAULTS);
    if (!c || typeof c !== 'object' || Array.isArray(c)) return out;
    for (const k of FLAGS) if (own(c, k) && typeof c[k] === 'boolean') out[k] = c[k];
    if (!TEST_PRACTICE) out.test = false;   // (a window from an older release, here or on another device)
    if (c.percent === 'of' || c.percent === 'apple') out.percent = c.percent;
    out.answers = ANSWERS.includes(c.answers) ? c.answers : c.fractions === true ? 'fraction' : 'decimal';
    return out;
  }
  let cfg = Object.assign({}, DEFAULTS);

  // Test practice: Desmos Four-Function's keys and its 7 digits, as on NWEA MAP. It isn't in the menu for now.
  const TEST_PRACTICE = false;   // true brings back the Test practice menu item
  const TEST_KEYS = ['digits', 'point', 'add', 'subtract', 'multiply', 'divide', 'open', 'close', 'sqrt', 'ans'];
  const NOT_IN_TEST = new Set(['negate', 'percent', 'power', 'square', 'root', 'cbrt', 'pi', 'fraction', 'over']);
  const TEST_WORDS = { pi: 'pi', cbrt: 'cbrt', nthroot: 'root', frac: 'fraction' };   // ...and those typed as words
  const engineOptions = () => cfg.test
    ? { digits: 7, keys: TEST_KEYS, toggle: false, answerAs: 'decimal', slash: 'divide', percent: cfg.percent }
    : { digits: 10, keys: null, toggle: true, answerAs: cfg.answers, slash: cfg.advanced ? 'fraction' : 'divide', percent: cfg.percent };
  const calc = E.create(Object.assign({ separators: 'faint', historySize: 20 }, engineOptions()));

  const SVG = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const ICON = {
    del: SVG('<path d="M21 5H9l-6.5 7L9 19h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>'),
    right: SVG('<path d="M4 12h15M13 6l6 6-6 6"/>'),
    back: SVG('<path d="M15 6l-6 6 6 6"/>'),
    replay: SVG('<path d="M4.87 11.48A7.5 7.5 0 1 0 13.19 6.4"/><path d="M7.2 6.3L12 2.3L12 10.3Z" fill="currentColor" stroke-width="1.5"/>'),
    alert: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>'),
    swap: SVG('<path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/>'),
    trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    // Hide the answer: the hidden answer itself, a ? in a dashed rounded square (8 dashes, one on each corner and side)
    hidden: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" stroke-dasharray="3 5.142" stroke-dashoffset="-3.5"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>'
  };

  // [engine key, grid area, kind, label]: the Advanced keys first (they sit above the others), then row by row.
  const KEYS = [
    ['square', 'sq', 'adv', '<i>a</i><sup>2</sup>'], ['power', 'pow', 'adv', '<i>a</i><sup><i>b</i></sup>'],
    ['root', 'root', 'adv', '<sup class="ri"><i>n</i></sup>√'], ['cbrt', 'cbrt', 'adv', '<sup class="ri">3</sup>√'],
    ['pi', 'pi', 'adv', 'π'], ['percent', 'pct', 'adv', '%'], ['fraction', 'frac', 'adv', '<span class="fk"><i>a</i><i>b</i></span>'], ['right', 'right', 'adv', ICON.right],
    ['clear', 'ac', 'fn', '<span class="w">AC</span>'], ['backspace', 'del', 'fn', ICON.del], ['negate', 'neg', 'fn', '±'],
    ['open', 'open', 'fn', '('], ['close', 'close', 'fn', ')'], ['sqrt', 'sqrt', 'fn', '√'], ['divide', 'div', 'op', '÷'],
    ['7', 'd7', 'num', '7'], ['8', 'd8', 'num', '8'], ['9', 'd9', 'num', '9'], ['multiply', 'mul', 'op', '×'],
    ['4', 'd4', 'num', '4'], ['5', 'd5', 'num', '5'], ['6', 'd6', 'num', '6'], ['subtract', 'sub', 'op', '−'],
    ['1', 'd1', 'num', '1'], ['2', 'd2', 'num', '2'], ['3', 'd3', 'num', '3'], ['add', 'add', 'op', '+'],
    ['0', 'd0', 'num', '0'], ['point', 'pt', 'num', '.'], ['ans', 'ans', 'num', '<span class="w">ans</span>'], ['equals', 'eq', 'op', '=']
  ];
  const BOX_KEYS = ['power', 'root', 'fraction', 'sqrt'];
  const PENDING = { '+': 'add', '-': 'subtract', '*': 'multiply', '/': 'divide', '^': 'power', '%': 'percent' };
  const DIMMABLE = ['close', 'right', 'ans'];
  const FLASH = { clearEntry: 'clear', over: 'fraction' };

  const el = {
    app: $('app'), grid: $('grid'), canvas: $('canvas'), card: $('card'), board: $('board'), eq: $('eq'), eqline: document.querySelector('.eqline'),
    eqToggle: $('eqToggle'), said: $('said'), note: $('note'), chain: $('chain'), player: $('player'), rules: Array.from(document.querySelectorAll('.rules b')),
    count: $('count'), rule: $('rule'), back: $('back'), next: $('next'), all: $('all'), hide: $('hide'),
    disp: $('disp'), xline: document.querySelector('.xline'), x: $('x'), bigline: document.querySelector('.bigline'), big: $('big'), bigToggle: $('bigToggle'), hint: $('hint'),
    keys: $('keys'), history: $('history'), hlist: $('hlist'), live: $('live')
  };
  el.back.innerHTML = ICON.back;
  el.eqToggle.innerHTML = el.bigToggle.innerHTML = ICON.swap;

  const keyBtn = {};
  for (const [k, area, kind, html] of KEYS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'key ' + kind; b.dataset.key = k; b.style.gridArea = area;
    b.innerHTML = html; b.setAttribute('aria-label', E.KEYS[k].name);
    el.keys.appendChild(b); keyBtn[k] = b;
  }
  // In Test practice, AC is Desmos's clear all, in its words, as its label and its name. Leaving brings AC back.
  const TEST_CLEAR = 'clear all';
  const AC = { html: keyBtn.clear.innerHTML, name: keyBtn.clear.getAttribute('aria-label') };

  // ---- What isn't saved: the steps on screen, a hidden answer shown, a message
  let shown = 0;            // steps on screen: 0 is the whole problem; 1 to n write them out, the answer last
  let problem = '';         // the worked-out problem the steps and a hidden answer belong to
  let revealed = false;     // the hidden answer has been shown for this problem
  let popAnswer = false;    // the answer pops in once, as it is shown
  let lastShown = 0, chainKey = null, histKey = null, histTop = '';
  let message = '';         // a key Test practice has no button for, typed: said until the next key
  let blocked = false;      // ...and the digits typed right after it are kept out too (2^3 mustn't become 23)
  let letters = '';         // the last letters typed, for a word Test practice has no key for (2pi3 mustn't become 23)

  // ---- Saving
  let savedData = '';
  function save() {
    const d = calc.serialize(), j = JSON.stringify(d);
    if (j === savedData) return;
    savedData = j;
    Board21.save(d).catch(() => {});   // (not stored yet: the board keeps it and tries again)
  }
  const saveConfig = () => Board21.saveConfig(Object.assign({}, cfg, { fractions: cfg.answers === 'fraction' })).catch(() => {});

  // ---- Pressing keys
  function press(k) {
    const before = calc.state();
    calc.press(k);
    after(before);
  }
  // After any change: draw, save, and tell screen readers what happened.
  function after(before) {
    message = '';
    const s = render();
    save();
    let msg = '';
    const fresh = s.mode === 'done' && (before.mode !== 'done' || before.expression.text !== s.expression.text || before.history.length !== s.history.length);
    if (s.mode === 'done' && (fresh || before.display !== s.display)) msg = answerHidden(s) ? 'Answer hidden.' : s.equation.speech;
    else if (s.mode === 'error' && before.mode !== 'error') msg = s.error.short + '. ' + s.error.message;
    else if (s.notice && (!before.notice || before.notice.message !== s.notice.message)) msg = s.notice.message;
    if (msg) say(msg);
  }
  const say = msg => { el.live.textContent = ''; el.live.textContent = msg; };
  const hitTimers = new Map();
  function flash(k) {
    const b = keyBtn[FLASH[k] || k];
    if (!b || !b.offsetParent) return;
    b.classList.add('hit');
    clearTimeout(hitTimers.get(b));
    hitTimers.set(b, setTimeout(() => b.classList.remove('hit'), 140));
  }
  el.keys.addEventListener('click', e => {
    const b = e.target.closest('.key');
    if (b && b.getAttribute('aria-disabled') !== 'true') { blocked = false; press(b.dataset.key); }
  });
  // A tap keeps the keyboard on the calculator, so Enter after a tap means = (not the button tapped last).
  el.app.addEventListener('mousedown', e => {
    if (e.target.closest('button')) e.preventDefault();
    if (document.activeElement !== el.app) el.app.focus({ preventScroll: true });
  });

  // ---- The keyboard, as in Desmos. Page Down and Page Up step, so a presentation clicker works.
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Tab') { document.documentElement.classList.add('kbd'); return; }
    if (t !== el.app && t.closest && t.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    if (e.key === 'PageDown' || e.key === 'PageUp') {
      if (!stepsShowing()) return;
      e.preventDefault();
      if (e.key === 'PageDown') next(); else back();
      return;
    }
    const k = E.keyFromEvent(e, calc.options());
    if (!k && e.key === ',') return;   // (a comma groups digits here: 1,500 is typed as drawn)
    let refused = cfg.test && k && NOT_IN_TEST.has(k) ? k : null;
    if (cfg.test && !k && /^[a-zA-Z]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      letters = (letters + e.key.toLowerCase()).slice(-7);
      const w = Object.keys(TEST_WORDS).find(x => letters.endsWith(x));
      if (w) { letters = ''; refused = TEST_WORDS[w]; }
    } else letters = '';
    if (refused) {
      e.preventDefault();
      blocked = true;
      message = `Test practice has no ${E.KEYS[refused].label} key.`;
      render();
      say(message);
      return;
    }
    if (blocked && k && (/^[0-9]$/.test(k) || k === 'point')) { e.preventDefault(); return; }
    blocked = false;
    const before = calc.state();
    if (calc.handleKey(e)) {
      e.preventDefault();
      if (k) flash(k);
      after(before);
    }
  });
  document.addEventListener('pointerdown', () => document.documentElement.classList.remove('kbd'), true);

  // ---- Hide the answer, ⇄, the steps
  const answerHidden = s => cfg.hide && s.mode === 'done' && !revealed;
  function setHide(on) {
    cfg.hide = on;
    revealed = false;
    saveConfig(); setMenu(); render();
    say(on ? 'Answers hidden.' : 'Answers shown.');
  }
  function reveal() {
    if (revealed) return;
    revealed = true; popAnswer = true;
    const s = render();
    if (s.mode === 'done') say(s.equation.speech);
  }
  el.hide.addEventListener('click', () => setHide(!cfg.hide));
  el.canvas.addEventListener('click', e => {
    if (e.target.closest('.reveal')) reveal();
    else if (e.target.closest('.toggle')) { blocked = false; press('toggle'); }
  });

  const stepsOf = s => (s.mode === 'done' || s.mode === 'error') && s.steps ? s.steps : [];
  const hasWork = steps => steps.some(st => !st.final);
  const stepsShowing = () => cfg.canvas && cfg.steps && el.player.offsetParent !== null;
  // Next step also works the problem out first, when it is finished but = hasn't been pressed.
  function solveFirst() {
    const s = calc.state();
    if (s.mode !== 'edit' || !s.preview) return s.mode !== 'edit';
    calc.press('equals');
    after(s);
    return calc.state().mode !== 'edit';
  }
  function go(to) {
    const steps = stepsOf(calc.state());
    if (!hasWork(steps)) return;
    shown = clamp(0, to, steps.length);
    if (shown >= steps.length) revealed = true;
    render();
    if (shown > 0) {
      const st = steps[shown - 1], prev = steps[shown - 2], parts = [];
      if (prev && prev.work) parts.push(prev.work.speech);
      parts.push(st.final ? 'Answer, ' + st.speech : st.error ? st.speech + '. ' + st.error.short : st.speech);
      say(parts.join('. '));
    }
  }
  function next() { if (!solveFirst()) return; const n = stepsOf(calc.state()).length; go(shown >= n ? 1 : shown + 1); }
  function back() { go(shown - 1); }
  function showAll() { if (solveFirst()) go(stepsOf(calc.state()).length); }
  el.chain.addEventListener('animationend', e => { const n = e.target.closest('.in'); if (n) n.classList.remove('in'); });
  el.next.addEventListener('click', next);
  el.back.addEventListener('click', back);
  el.all.addEventListener('click', showAll);

  // ---- History: tap a line to change its problem, its answer to use it
  el.hlist.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const i = +b.dataset.i, before = calc.state();
    blocked = false;
    if (b.classList.contains('hans')) calc.useAnswer(i); else calc.useExpression(i);
    after(before);
  });

  // ---- Drawing
  // A node is written only when what it shows has changed: a tap that lands as the board brings the window to the front
  // (it redraws then) still finds the button it started on.
  const drawn = new Map();
  function setHTML(node, html) { if (drawn.get(node) === html) return; drawn.set(node, html); node.innerHTML = html; }
  function render() {
    const s = calc.state();
    const key = s.mode === 'edit' ? 'edit' : s.mode + '|' + s.expression.text + '|' + s.history.length;
    if (key !== problem) { problem = key; shown = 0; revealed = false; lastShown = 0; }
    const steps = stepsOf(s);
    if (shown > steps.length) shown = steps.length;
    el.app.classList.toggle('adv', cfg.advanced);
    el.app.classList.toggle('test', cfg.test);
    el.app.classList.toggle('steps', cfg.steps);
    el.app.classList.toggle('nocanvas', !cfg.canvas);
    el.hide.setAttribute('aria-checked', String(cfg.hide));
    renderBoard(s, steps);
    renderPlayer(s, steps);
    renderDisplay(s);
    renderKeys(s);
    renderHistory(s);
    setMenu(s);
    fitAll();
    popAnswer = false;
    return s;
  }

  const REVEAL = '<button type="button" class="reveal" aria-label="Show the answer">?</button>';
  function problemHTML(s) {
    if (s.mode === 'done') return answerHidden(s) ? noCursor(s.expression.html) + '<span class="ce-eq"> = </span>' + REVEAL : s.equation.html;
    if (s.mode === 'error') return noCursor(s.expression.html);
    if (s.displayKind === 'empty') return '<span class="zero">0</span>';
    let html = s.expression.html;
    if (!cfg.hide && s.preview && !s.preview.error) html += `<span class="prev"><span class="ce-eq"> = </span>${s.preview.html}</span>`;
    return html;
  }
  function noteFor(s) {
    if (message) return { cls: 'tip', html: esc(message) };
    if (s.mode === 'error') return { cls: 'bad', html: `${ICON.alert}<span><b>${esc(s.error.short)}.</b> ${esc(s.error.message)}</span>` };
    if (s.notice) return { cls: 'tip', html: esc(s.notice.message) };
    if (s.mode === 'edit' && s.preview && s.preview.error) return { cls: '', html: esc(s.preview.error.short) };
    return { cls: '', html: '' };
  }
  // In words: the problem read aloud, as Lines writes it under each line. Its digit groups get the faint comma too.
  function wordsFor(s) {
    if (!cfg.words) return '';
    let t = '';
    if (s.mode === 'done') t = answerHidden(s) ? s.expression.speech : s.equation.speech;
    else if (s.mode === 'error') t = s.expression.speech;
    else if (s.displayKind !== 'empty') {
      t = s.expression.speech;
      if (t && !cfg.hide && s.preview && !s.preview.error && s.preview.speech) t += ' equals ' + s.preview.speech;
    }
    return esc(t).replace(/(\d),(?=\d{3}(?!\d))/g, '$1<span class="ce-sep">,</span>');
  }
  const TOGGLE = { decimal: 'Show as a decimal', fraction: 'Show as a fraction', remainder: 'Show with a remainder' };
  const toggleLabel = s => TOGGLE[(s.answer && s.answer.toggleTo) || 'fraction'];
  function setToggle(btn, s) {
    const on = s.mode === 'done' && !!s.answer && s.answer.canToggle && !answerHidden(s);
    btn.hidden = !on;
    if (on) { const t = toggleLabel(s); btn.setAttribute('aria-label', t); btn.title = t; }
  }

  function renderBoard(s, steps) {
    const chain = cfg.steps && shown > 0 && steps.length > 0;
    el.board.classList.toggle('chain', chain);
    setHTML(el.eq, problemHTML(s));
    el.eq.classList.toggle('shown', popAnswer);
    setHTML(el.said, wordsFor(s));
    const note = noteFor(s);
    el.note.className = note.cls;
    setHTML(el.note, note.html);
    setToggle(el.eqToggle, s);
    // The steps, written out as on a whiteboard: each line is the one before with the marked part worked out. Every
    // line is laid out from the start (hidden until its turn), so the text never jumps as they appear.
    const ck = steps.map(st => st.html).join('|') + '|' + (s.answer ? s.answer.toggleTo : '');
    if (ck !== chainKey) {
      chainKey = ck;
      el.chain.innerHTML = steps.map((st, i) => {
        let work = '';
        if (st.error) work = `<span class="work bad">${esc(st.error.short)}</span>`;
        else if (st.work) work = `<span class="work">${st.work.html}</span>`;
        else if (st.final && s.answer && s.answer.canToggle) work = `<button type="button" class="toggle" aria-label="${toggleLabel(s)}" title="${toggleLabel(s)}">${ICON.swap}</button>`;
        return `<li class="ln${st.final ? ' fin' : ''}${st.error ? ' bad' : ''}"><span class="lead" aria-hidden="true">${i ? '=' : ''}</span>` +
          `<span class="lx">${st.html}</span><span class="lw">${work}</span></li>`;
      }).join('');
    }
    // A line (or its sum) that has just appeared slides in once; 'in' comes off when that is done.
    const grew = shown > lastShown;
    Array.from(el.chain.children).forEach((li, i) => {
      const on = i < shown, st = steps[i];
      li.classList.toggle('on', on);
      li.classList.toggle('cur', i === shown - 1 && !st.final);
      li.classList.toggle('past', i < shown - 1);
      if (!on) li.classList.remove('in'); else if (grew && i >= lastShown) li.classList.add('in');
      li.setAttribute('aria-hidden', String(!on));
      const lw = li.lastElementChild, workOn = i < shown - 1 || (on && !!(st.error || st.final));
      lw.classList.toggle('on', workOn);
      if (!workOn) lw.classList.remove('in'); else if (grew && i >= lastShown - 1) lw.classList.add('in');
    });
    lastShown = shown;
  }

  function renderPlayer(s, steps) {
    const n = steps.length, work = hasWork(steps);
    const ready = s.mode === 'edit' && !!s.preview;   // finished, not worked out yet
    const cur = shown > 0 ? steps[shown - 1] : null;
    const lit = new Set(), soft = new Set();
    let words = '', bad = false;
    if (cur && cur.error) { words = cur.error.short; bad = true; }
    if (cur && !cur.final && cur.rule) {
      // P lights ( ), E xⁿ √, MD × ÷, and AS + −. O (the opposite) lights none.
      if (cur.rule !== 'O') (cur.inside && cur.rule !== 'P' ? soft : lit).add(cur.rule);
      // Inside parentheses, ( ) is why it goes first and the operation's cell shows softly. Inside a √, a power or a
      // fraction, nothing lights ( ): the words say "Inside first".
      if (cur.inside === 'parens') lit.add('P');
      if (!bad) words = cur.inside === 'parens' ? E.RULES.P : cur.inside === 'box' ? E.RULES.G : (E.RULES[cur.rule] || '');
    }
    el.rules.forEach(b => { const r = b.dataset.rule; b.className = lit.has(r) ? (bad ? 'soft' : 'lit') : soft.has(r) ? 'soft' : ''; });
    el.rule.textContent = cfg.steps ? words : '';
    el.rule.classList.toggle('bad', bad);
    const end = n > 0 && shown >= n, canGo = (work && !end) || ready;
    el.back.disabled = shown === 0;
    el.next.disabled = !(canGo || (end && work));
    const nextHTML = end && work ? `${ICON.replay}<span>Replay</span>` : '<span>Next step</span>';
    setHTML(el.next, nextHTML);
    el.all.disabled = !canGo;
    el.count.textContent = cfg.steps && shown > 0 ? `Step ${shown} of ${n}` : '';
  }

  function renderDisplay(s) {
    let x = '';
    if (s.mode === 'done' || s.mode === 'error') x = noCursor(s.expression.html);
    else if (s.displayKind !== 'empty') {
      x = s.expression.html;
      if (!cfg.hide && s.preview && !s.preview.error) x += `<span class="prev"><span class="ce-eq"> = </span>${s.preview.html}</span>`;
    }
    setHTML(el.x, x);
    let big = s.displayHtml, kind = s.displayKind;
    if (answerHidden(s)) { big = REVEAL; kind = 'answer'; }
    else if (cfg.hide && kind === 'running') big = '<span class="zero">?</span>';   // the part worked out so far would give it away
    else if (kind === 'empty') big = '<span class="zero">0</span>';
    setHTML(el.big, big);
    el.big.className = 'k-' + kind + (popAnswer ? ' shown' : '');
    let hint = '', tip = false;
    if (message) { hint = message; tip = true; }
    else if (s.error) hint = s.error.message;
    else if (s.notice) { hint = s.notice.message; tip = true; }
    else if (s.mode === 'edit' && s.preview && s.preview.error) hint = s.preview.error.short;
    el.hint.textContent = hint;
    el.hint.classList.toggle('tip', tip);
    setToggle(el.bigToggle, s);
  }

  function renderKeys(s) {
    const pend = PENDING[s.pendingOp] || null;
    Object.values(PENDING).forEach(k => {
      const b = keyBtn[k], on = k === pend;
      b.classList.toggle('pending', on);
      if (b.classList.contains('op')) b.setAttribute('aria-pressed', String(on));
    });
    DIMMABLE.forEach(k => keyBtn[k].setAttribute('aria-disabled', String(s.can[k] === false)));
    keyBtn.percent.setAttribute('aria-label', cfg.percent === 'apple' ? 'percent' : E.KEYS.percent.name);
    setHTML(keyBtn.clear, cfg.test ? `<span class="w">${TEST_CLEAR}</span>` : AC.html);
    keyBtn.clear.setAttribute('aria-label', cfg.test ? TEST_CLEAR : AC.name);
    // The key whose box holds the cursor is ringed, and → is filled: it is the way out.
    const box = s.mode === 'edit' && (s.boxKey === 'cbrt' ? 'root' : s.boxKey);
    BOX_KEYS.forEach(k => keyBtn[k].classList.toggle('inbox', k === box));
    keyBtn.right.classList.toggle('exit', BOX_KEYS.includes(box));
  }

  function renderHistory(s) {
    if (!el.app.classList.contains('hist')) { histKey = null; return; }   // (drawn when it shows)
    const hideNewest = answerHidden(s), cur = s.mode === 'done' && s.history.length > 0 && s.history[0].equation.text === s.equation.text;
    const key = s.history.map(h => h.equation.html).join('|') + '|' + hideNewest + '|' + cur;
    if (key === histKey) return;
    // It scrolls to the newest line when History shows, moves, and when a line is added. Otherwise it stays where it was.
    const top = s.history.length + '|' + (s.history.length ? s.history[0].equation.html : ''), toEnd = histKey === null || top !== histTop;
    histKey = key; histTop = top;
    if (!s.history.length) { el.hlist.innerHTML = '<li class="hempty">Your problems show here.</li>'; fitBand(); return; }
    let html = '';
    for (let i = s.history.length - 1; i >= 0; i--) {   // the oldest at the top, the newest at the bottom
      // (An answer with a remainder is named in words, "Use 3 remainder 2", as a screen reader hears it everywhere else.)
      const h = s.history[i], hid = i === 0 && hideNewest, useName = h.answer.form === 'remainder' ? h.answer.speech : h.answer.text;
      html += `<li class="hline${i === 0 && cur ? ' cur' : ''}"><button type="button" class="hpick" data-i="${i}" aria-label="Change ${esc(h.expression.text)}" title="Change this problem">${noCursor(h.expression.html)}</button>` +
        `<button type="button" class="hans" data-i="${i}"${hid ? ' disabled aria-label="Answer hidden"' : ` aria-label="Use ${esc(useName)}" title="Use this answer"`}><span class="heq" aria-hidden="true">=</span>${hid ? '?' : h.answer.html}</button></li>`;
    }

    fitBand();
    el.hlist.scrollTop = toEnd ? el.hlist.scrollHeight : was;
  }
  // Across the top, the band ends on whole lines: as many of the newest as fit, so none shows cut through at its top
  // edge. The rest of the band is plain panel, under the newest line. (Each line is a whole number of px tall there, so
  // the band ends exactly on one.)
  function fitBand() {
    const lines = [...el.hlist.children], top = el.app.classList.contains('htop');
    lines.forEach(l => { l.style.minHeight = ''; });
    let max = '';
    if (top) {
      const hs = lines.map(l => Math.ceil(l.getBoundingClientRect().height - .01)), room = el.history.clientHeight;
      lines.forEach((l, i) => { l.style.minHeight = hs[i] + 'px'; });
      let sum = 0, i = hs.length - 1;
      for (; i >= 0 && sum + hs[i] <= room; i--) sum += hs[i];

  }

  let histEnd = true;
  el.hlist.addEventListener('scroll', () => { histEnd = el.hlist.scrollTop + el.hlist.clientHeight >= el.hlist.scrollHeight - 2; }, { passive: true });

  // A line too long for History is drawn smaller, down to 3/4 of its size. Still too long, its cut edge fades.
  let histFit = '';
  function fitHistory(fresh) {
    const k = el.hlist.clientWidth + '|' + getComputedStyle(el.hlist).fontSize;
    if (!fresh && k === histFit) return;

    el.hlist.querySelectorAll('.hpick, .hans').forEach(b => {
      const m = b.querySelector('.ce-math');
      if (!m) return;
      m.style.fontSize = '';

      if (over > 1) fitTo(m, m.offsetWidth - over - 1, null, .75);
      b.classList.toggle('clip', b.scrollWidth > b.clientWidth + 1);
    });
  }

  // ---- The window menu (the board adds its own items after these)
  let menuNow = '';
  function setMenu(s) {
    s = s || calc.state();
    const off = !cfg.canvas;
    // Answers: one of three, under its heading. Desmos % shows under Advanced keys while they're on, as % is one of them.
    const items = [
      { heading: true, label: 'Show' },
      { id: 'canvas', label: 'Canvas', checked: cfg.canvas },
      { id: 'history', label: 'History', checked: cfg.history },
      { id: 'steps', label: 'Steps', checked: cfg.steps, disabled: off },
      { id: 'words', label: 'In words', checked: cfg.words, disabled: off },
      { id: 'swap', label: 'Swap sides', checked: cfg.swap },
      { separator: true },
      { heading: true, label: 'Answers' },
      { id: 'answers-decimal', label: 'As decimals', checked: cfg.answers === 'decimal', disabled: cfg.test },
      { id: 'answers-fraction', label: 'As fractions', checked: cfg.answers === 'fraction', disabled: cfg.test },
      { id: 'answers-remainder', label: 'With remainders', checked: cfg.answers === 'remainder', disabled: cfg.test },
      { separator: true },
      { id: 'advanced', label: 'Advanced keys', checked: cfg.advanced, disabled: cfg.test },
      cfg.advanced && { id: 'percent', label: 'Desmos %', checked: cfg.percent === 'of', disabled: cfg.test },
      { id: 'hide', label: 'Hide the answer', icon: ICON.hidden, checked: cfg.hide },
      TEST_PRACTICE && { id: 'test', label: 'Test practice', checked: cfg.test },
      { separator: true },
      { id: 'clear-history', label: 'Clear history', icon: ICON.trash, disabled: !s.history.length }
    ].filter(Boolean);
    const sig = JSON.stringify(items);
    if (sig !== menuNow) { menuNow = sig; Board21.menu.set(items); }
  }
  Board21.on('menu', id => {
    if (id === 'clear-history') { calc.clearHistory(); render(); save(); return; }
    if (id === 'hide') { setHide(!cfg.hide); return; }
    const was = cfg, next = Object.assign({}, cfg), answers = /^answers-(\w+)$/.exec(id);
    if (answers) { if (!ANSWERS.includes(answers[1]) || answers[1] === cfg.answers) return; next.answers = answers[1]; }
    else if (id === 'percent') next.percent = cfg.percent === 'apple' ? 'of' : 'apple';
    else if (FLAGS.includes(id) && (id !== 'test' || TEST_PRACTICE)) next[id] = !cfg[id];
    else return;
    // A panel turned on widens the window by its width, and Advanced keys make it taller; turned off, they give it back.
    const change = id === 'history' || id === 'canvas' || id === 'advanced' ? sizeChange(id, next[id]) : null;
    if (change) hold();
    useConfig(next, was);
    saveConfig();
    if (change) change();
  });

  // A new config, from the menu or from elsewhere (another tab, an import, Reset).
  function useConfig(next, was) {
    cfg = next;
    if (was.steps !== cfg.steps || was.canvas !== cfg.canvas) { shown = 0; lastShown = 0; }
    // The answer on screen follows the Answers choice at once (a new answerAs shows it in that form, ⇄ undone).
    calc.setOptions(engineOptions());
    if (was.answers !== cfg.answers || was.test !== cfg.test) save();
    layout();
    render();
  }

  // ---- The window's size: panels and Advanced keys turned on or off
  // Turning History or the canvas on widens the window by that panel's width, where the board has room. (In a window
  // taller than wide, a canvas that fits above the keys with its steps needs no more width, nor does History across the
  // top.) Advanced keys make it taller, so the keys keep their size. Turning one off gives the room back: turned back
  // while the window is still the size the board gave it, it goes back to the size it had before, exactly. A window that
  // fills the board keeps its size, and its panels share it.
  const sized = {};   // 'history', 'canvas' or 'advanced' → { on, from, to, look }: its last change, the size before, the size given, and where things went
  // The window's own size. While Advanced keys raise its smallest height, the board draws it taller than that.
  function ownSize(info) {
    const h = info.height || innerHeight;
    return { w: info.width || innerWidth, h: minNow && baseH && h <= minNow + 1 ? baseH : h };
  }
  function sizeChange(what, on) {
    const info = Board21.context && Board21.context.window;
    if (!Board21.embedded || !info || info.maximized) return null;
    const { w, h } = ownSize(info), M = metrics(w, h), rec = sized[what];
    delete sized[what];
    let to;
    // (History or the canvas gives back the size it took only while things are where they went then: at the same size,
    // History or the canvas may sit in the other place, with no width to give back.)
    const same = !rec || what === 'advanced' || !rec.look || rec.look === el.app.dataset.layout + '|' + histNow;
    if (rec && rec.on !== on && Math.abs(rec.to.w - w) <= 2 && Math.abs(rec.to.h - h) <= 2 && same) to = rec.from;
    else if (what === 'advanced') {
      // Two more rows of keys: taller by enough that a key's shorter side stays as it is (advancedHeight()). Under the
      // small display, the board draws the window taller meanwhile, in layout().
      if (!on) return null;
      const r = keyBtn[7].getBoundingClientRect(), H = advancedHeight(w, h, Math.min(r.width, r.height), cfg, placed.own);
      if (H <= h + 2) return null;
      to = { w, h: H };
    }
    else if (on) {
      if (what === 'canvas' && h > w) {
        const L = plan(w, h, Object.assign({}, cfg, { canvas: true }), placed.own);
        if (!L.side && L.mainW >= CANVAS_MIN && L.canvasH >= STEPS_MIN - .5) return null;
      }
      // (History across the top needs no more width: in a window taller than wide, or where it was across the top.)
      if (what === 'history' && (h > w || placed.own.hist === 'top') && plan(w, h, Object.assign({}, cfg, { history: true }), placed.own).top) return null;
      to = { w: w + (what === 'history' ? histWidth(h) : canvasWidth(h)) + M.G, h };
    }
    else {
      // (Only a panel beside the others has a width to give back: a canvas above the keys has none, nor History across
      // the top.)
      const beside = what === 'history' ? el.app.classList.contains('hist') && !el.app.classList.contains('htop') : el.app.dataset.layout === 'side';
      if (!beside) return null;
      to = { w: Math.round(w - (what === 'history' ? el.history : el.canvas).getBoundingClientRect().width - M.G), h };
    }
    return () => {
      const r = sized[what] = { on, from: { w, h }, to };
      // (The board keeps a window inside the board: what it gave is the size to compare with later. And a raised
      // smallest height is lifted meanwhile, or the board would keep it as the window's own height.)
      const lift = minNow && to.h < minNow;
      if (lift) Board21.window.setMinSize(null, null);
      Board21.window.setSize(to.w, to.h).then(() => Board21.window.getInfo()).then(i => {
        if (sized[what] === r && i && !i.maximized) r.to = { w: i.width, h: minNow && i.height <= minNow + 1 ? to.h : i.height };
      }).catch(() => {});
      if (lift) Board21.window.setMinSize(280, minNow);
    };
  }

  // ---- Layout: which panels show where, for the window's size. Every key stays 44 px or more.
  const KEY = 44.5, HIST_MIN = 200, CANVAS_MIN = 340, DISP_MIN = 76, STEPS_MIN = 252, LEAN = .02, BAND = 8;
  function metrics(W, H, rows = !cfg.test && cfg.advanced ? 8 : 6) {
    const m = Math.min(W, H);
    const P = clamp(8, m * .02, 28), G = clamp(5, m * .013, 16);
    // Filling the board, the window keeps clear of the board's buttons in its bottom corners, and of the padlocks in its
    // top ones while the board is locked.
    const info = Board21.context && Board21.context.window, cn = info && info.maximized && info.corners, ct = cn && cn.top;
    const PB = cn && (cn.left > 0 || cn.right > 0) && cn.height > 0 ? Math.max(P, cn.height + G) : P;
    const PT = ct && (ct.left > 0 || ct.right > 0) && ct.height > 0 ? Math.max(P, Math.min(1000, ct.height) + G) : P;
    return { W, H, P, PT, PB, G, rows, keysMinW: 4 * KEY + 3 * G, keysMinH: rows * KEY + (rows - 1) * G };
  }
  const histWidth = h => Math.round(clamp(240, h * .6, 480));
  const canvasWidth = h => Math.round(h * .86);
  // History across the top: a band about a quarter of the window's height. Its lines are sized by the window's width,
  // and small enough that three show in full, even with a fraction or a power in each.
  const histBand = availH => Math.round(clamp(180, availH * .24, 300));
  const bandFont = (W, band) => clamp(16, Math.min(W * .04, (band - 6) / 7.3), 30);
  // Where the panels go in a window W × H, with config c. The canvas sits beside the keys or above them, whichever gives a
  // key the longer shorter side. Basic keys decide, so turning Advanced keys on or off never moves the canvas. Above the
  // keys, in a window wide enough to have it beside them, the canvas keeps 252 px for its steps. History sits beside the
  // keys or across the top, chosen the same way (histAt()). Under History across the top, the canvas and the keys lay out
  // as in a window that size without History.
  // `was` is where they went last: { canvas: 'side' or 'stack'; under: the same, for the canvas under History across the
  // top; hist: 'beside' or 'top' }. Each stays there until the other place is 2% better, and the canvas goes back beside
  // the keys only with 8 px of width to spare, so dragging an edge across moves each only once.
  function plan(W, H, c, was = {}) {
    const M = metrics(W, H, !c.test && c.advanced ? 8 : 6), { P, PT, PB, G } = M, availW = W - 2 * P, availH = H - PT - PB;
    if (c.history && histAt(W, H, c, was) === 'top') {

      return Object.assign(fit(M, availW, availH - band - G, 0, c, was.under, true), { top: true, band });
    }
    return fit(M, availW, availH, c.history ? besideWidth(M, availW, availH, c, was.canvas) : 0, c, was.canvas);
  }
  // History beside everything else: at its width, or narrower down to 200 px. Where even that doesn't fit, 0.
  function besideWidth(M, availW, availH, c, was) {
    const { G } = M, spare = was === 'stack' ? BAND : 0;
    let hw = Math.min(histWidth(M.H), availW - G - M.keysMinW);
    // (Narrower still, where that keeps the canvas beside the keys. The 8 px to spare are for the canvas going back
    // beside them: where it stays above them, they don't count, so History doesn't change its width at the same size.)
    const room = Math.floor(availW - G - (CANVAS_MIN + G) / .6);
    if (c.canvas && availH >= M.keysMinH && room >= HIST_MIN && room < hw && (room >= HIST_MIN + spare / .6 || !fit(M, availW, availH, room, c, was).side)) hw = room;
    return hw < HIST_MIN ? 0 : hw;
  }
  // The canvas and the keys in availW × availH, beside History hw px wide or none. `below`: under History across the top,
  // or 'above' there with the canvas held above the keys, as histAt() weighs it.
  function fit(M, availW, availH, hw, c, was, below) {
    const { G, rows } = M, spare = was === 'stack' ? BAND : 0;
    const mainW = availW - (hw ? hw + G : 0);
    // (Whether the canvas could sit beside the keys is a matter of width, and of where it was, so the room asked for
    // Advanced keys in layout() never moves it. With History, the 8 px are History's to give up. Under History across
    // the top, a window at least 1.2 times as tall as wide keeps the canvas above the keys, as it does without History.
    // Once there, it stays until the window is 8 px shorter than that.)
    const tall = below === 'above' || (!!below && M.H >= 1.2 * M.W - spare);
    const besideByWidth = !tall && c.canvas && mainW * .6 - G >= CANVAS_MIN + (hw ? 0 : spare);
    // (Under History across the top, a canvas 340 px wide keeps its steps too, where every key still gets 44.5 px.)
    const steps = n => besideByWidth || (!!below && c.canvas && mainW >= CANVAS_MIN && availH - G - STEPS_MIN >= n * KEY + (n - 1) * G);
    // For n rows of keys: their column beside the canvas, and their height and width under it. Under the canvas, a key
    // is at most 1.5 times as wide as tall.
    const keysW = n => clamp(M.keysMinW, availH * 4 / n * 1.12, mainW * .4);
    const keysH = n => clamp(n * KEY + (n - 1) * G, Math.min(mainW * n / 4 * .72, availH * .7, steps(n) ? availH - G - STEPS_MIN : Infinity), availH - G - DISP_MIN);
    const kcap = n => Math.round(c.canvas ? 6 * (keysH(n) - (n - 1) * G) / n + 3 * G : keysH(n) * 4 / n * 1.5);
    // A Basic key's shorter side, beside the canvas and under it
    const beside = Math.min((keysW(6) - 3 * G) / 4, (availH - 5 * G) / 6);
    const under = Math.min((Math.min(mainW, kcap(6)) - 3 * G) / 4, (keysH(6) - 5 * G) / 6);
    const lean = was === 'side' ? LEAN : was === 'stack' ? -LEAN : 0;
    const side = besideByWidth && availH >= M.keysMinH && mainW - keysW(rows) - G >= CANVAS_MIN && under <= beside * (1 + lean);
    const L = { M, availH, hw, mainW, besideByWidth, side, keysW: keysW(rows), keysH: keysH(rows), kcap: kcap(rows) };

    L.key = side ? Math.min((L.keysW - 3 * G) / 4, (availH - (rows - 1) * G) / rows) : Math.min((Math.min(mainW, L.kcap) - 3 * G) / 4, (L.keysH - (rows - 1) * G) / rows);

  // is weighed with the canvas above it, even where the canvas then sits beside the keys: weighed there, History would
  // move back and forth as the right edge is dragged. Across the top fits in a window taller than wide, where every key
  // still gets 44.5 px and the canvas or display above them 76. (The band always holds three lines: bandFont().) In a
  // wide window, History stays beside the keys, as today: turned on, it widens the window for that. Basic keys with the

  function histAt(W, H, c, was) {

      const hw = besideWidth(M, availW, availH, b, was.canvas), under = availH - histBand(availH) - G;
      // (Across the top starts to fit 8 px past where it keeps fitting, so the canvas or display above the keys keeps 76.)
      const slack = from === 'top' ? BAND : 0, top = H > W - slack && under >= M.keysMinH + G + DISP_MIN + BAND - slack;
      return { hw, top, kb: hw ? fit(M, availW, availH, hw, b, was.canvas).key : 0, kt: top ? fit(M, availW, under, 0, b, 'stack', 'above').key : 0 };
    };
    const L = look(W, H);
    if (!L.top) return L.hw ? 'beside' : '';
    if (!L.hw) return 'top';
    // (A thousandth of a px is a tie.)
    const wins = (l, lean) => l.kt > l.kb * (1 + lean) + .001;
    if (from !== 'top' && from !== 'beside') return wins(L, 0) ? 'top' : 'beside';
    const better = from === 'top' ? l => !!l.hw && (!l.top || !wins(l, -LEAN)) : l => l.top && (!l.hw || wins(l, LEAN));
    const go = from === 'top' ? 'beside' : 'top';

  }
  // Advanced keys turned on in a window w × h, where things went `was` and a key's shorter side is k: the height that
  // keeps each key so, or 0 for none. Beside the canvas, the window grows only as far as the canvas stays beside the
  // keys: History widens as it grows. Above the keys, where the canvas could sit beside them, it grows until the keys
  // keep their size and the canvas its steps, or failing that, its steps. Under History across the top, it grows the same
  // way. History and the canvas stay where they are. Elsewhere the keys share the window, as today.
  function advancedHeight(w, h, k, c, was) {
    if (c.test || !c.canvas) return 0;
    const a = Object.assign({}, c, { advanced: true }), L = plan(w, h, c, was);

        if (A.key >= k - 1) return H;
        if (!steps && A.key >= now) steps = H;
      }
      return steps;
    }
    if (L.side) {
      let H = h;
      for (let i = 0; i < 2; i++) { const m = metrics(w, H); H = Math.ceil(8 * k + 7 * m.G + m.PT + m.PB); }
      while (H > h && (!at(H, 'side').side || at(H, 'side').top)) H--;

    }

    for (let H = h + 1; H <= most; H++) {
      const A = at(H, 'stack');
      if (A.side || A.top || A.canvasH < STEPS_MIN - .5) continue;
      if (A.key >= k - 1) return H;
      if (!steps && A.key >= now) steps = H;
    }
    return steps;
  }
  let minNow = null, baseH = 0;   // the smallest height asked of the board for Advanced keys, and the height before it
  // Where things went last (plan()'s `was`): in the window at its own size, and filling the board. They're kept while the
  // window changes size for a panel, or fills the board or stops: at sizes on the way, the canvas or History may sit in
  // the other place for a moment.
  const placed = { own: {}, fill: {} };
  let held = 0, filled = null, histNow = '';
  function hold() { held = performance.now() + 600; setTimeout(soon, 650); }
  function layout() {
    const W = innerWidth, H = innerHeight;
    if (!W || !H) return;
    const info = Board21.context && Board21.context.window, at = info && info.maximized ? 'fill' : 'own';
    if (filled !== null && filled !== at) hold();
    filled = at;
    const L = plan(W, H, cfg, placed[at]), { M, hw, side } = L, { P, PT, PB, G, rows } = M;
    if (performance.now() >= held) {
      if (cfg.canvas) placed[at][L.top ? 'under' : 'canvas'] = side ? 'side' : 'stack';
      if (cfg.history) placed[at].hist = L.top ? 'top' : hw ? 'beside' : '';
    }
    const s = el.grid.style, swap = cfg.swap;
    if (L.top) {
      // History across the top. Under it, the canvas and the keys as in a window that size without History.
      const cols = side ? [['canvas', 'minmax(0, 1fr)'], ['keys', L.keysW + 'px']] : [['main', 'minmax(0, 1fr)']];
      if (swap) cols.reverse();
      const band = `"${cols.map(() => 'hist').join(' ')}"`;
      s.gridTemplateColumns = cols.map(c => c[1]).join(' ');
      s.gridTemplateRows = side ? `${L.band}px minmax(0, 1fr)` : `${L.band}px minmax(0, 1fr) ${L.keysH}px`;
      s.gridTemplateAreas = side ? `${band} "${cols.map(c => c[0]).join(' ')}"` : `${band} "canvas" "keys"`;
      if (!side) el.app.style.setProperty('--kcap', L.kcap + 'px');
    } else if (side) {
      const cols = [['canvas', 'minmax(0, 1fr)'], ['keys', L.keysW + 'px']].concat(hw ? [['hist', hw + 'px']] : []);
      if (swap) cols.reverse();
      s.gridTemplateColumns = cols.map(c => c[1]).join(' ');
      s.gridTemplateRows = 'minmax(0, 1fr)';
      s.gridTemplateAreas = `"${cols.map(c => c[0]).join(' ')}"`;
    } else {
      const cols = [['main', 'minmax(0, 1fr)']].concat(hw ? [['hist', hw + 'px']] : []);
      if (swap) cols.reverse();
      const row = top => cols.map(c => c[0] === 'main' ? top : 'hist').join(' ');
      s.gridTemplateColumns = cols.map(c => c[1]).join(' ');
      s.gridTemplateRows = `minmax(0, 1fr) ${L.keysH}px`;
      s.gridTemplateAreas = `"${row('canvas')}" "${row('keys')}"`;
      el.app.style.setProperty('--kcap', L.kcap + 'px');
    }
    el.app.dataset.layout = side ? 'side' : 'stack';
    el.app.classList.toggle('hist', !!(hw || L.top));
    el.app.classList.toggle('htop', !!L.top);
    el.app.classList.toggle('swap', swap);
    s.padding = `${PT}px ${P}px ${PB}px`; s.setProperty('--g', G + 'px');
    el.app.style.setProperty('--hf', (L.top ? bandFont(W, L.band) : clamp(16, (hw || 240) * .072, 40)) + 'px');
    // History moved: it scrolls to the newest line, as when it shows.
    const where = L.top ? 'top' : hw ? 'beside' : '';
    if (where && histNow && where !== histNow) histKey = null;
    histNow = where;
    // (Once a panel's change has landed, it notes where things went.)
    if (performance.now() >= held) for (const k in sized) if (!sized[k].look) sized[k].look = el.app.dataset.layout + '|' + where;
    // Advanced keys need a taller window when they sit under a display: the board draws it taller meanwhile. (Under
    // History across the top, by its band too, as high as it is at that height.)
    let need = rows > 6 ? Math.ceil(2 * P + M.keysMinH + (L.besideByWidth ? 0 : G + DISP_MIN)) + 1 : 0;
    if (need && L.top) { const base = need + Math.ceil(G); for (let i = 0; i < 3; i++) need = base + histBand(Math.max(H, need) - PT - PB); }
    const min = need > 400 ? need : null;
    if (min !== minNow && Board21.embedded) {
      if (min && !minNow) baseH = (Board21.context && Board21.context.window && Board21.context.window.height) || H;
      minNow = min; Board21.window.setMinSize(min ? 280 : null, min);
    }
  }

  // ---- Fitting text: the largest size that fits, from the size the CSS gives down to minRatio of it
  function fitTo(node, maxW, maxH, minRatio) {
    node.style.fontSize = '';
    const base = parseFloat(getComputedStyle(node).fontSize);
    const fits = px => { node.style.fontSize = px + 'px'; return node.offsetWidth <= maxW + .5 && (maxH == null || node.offsetHeight <= maxH + .5); };
    if (!(maxW > 0) || fits(base)) { if (!(maxW > 0)) node.style.fontSize = ''; return true; }
    let lo = Math.max(12, base * minRatio), hi = base;
    if (!fits(lo)) return false;
    for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    node.style.fontSize = lo + 'px';
    return true;
  }
  const shows = node => node.offsetParent !== null;
  function fitAll() {
    if (!el.app.clientWidth) return;
    if (el.app.classList.contains('hist')) fitHistory(false);
    if (shows(el.board)) {
      const w = el.board.clientWidth, h = el.board.clientHeight;
      if (el.board.classList.contains('chain')) {
        const fit = fitTo(el.chain, w - 2, h - 2, .3), cur = el.chain.children[shown - 1];   // too many steps to fit: keep the newest in view
        if (!fit && cur) cur.scrollIntoView({ block: 'nearest' });
      } else {
        const tw = el.eqToggle.hidden ? 0 : el.eqToggle.offsetWidth + parseFloat(getComputedStyle(el.eqline).columnGap || 0);
        const below = [el.said, el.note].reduce((a, n) => a + (n.innerHTML ? n.offsetHeight + parseFloat(getComputedStyle(n).marginTop) : 0), 0);
        fitTo(el.eq, w - tw - 4, h - below - 4, .2);
        el.eqToggle.style.fontSize = el.eq.style.fontSize;   // the toggle keeps to the size of the answer beside it
      }
    }
    if (shows(el.disp)) {
      const lineW = el.xline.clientWidth, okX = fitTo(el.x, lineW, null, .72);
      el.xline.classList.toggle('clip', !okX || el.x.offsetWidth > lineW + 1);
      const d = el.disp, cs = getComputedStyle(d);
      const availH = d.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - el.xline.offsetHeight - el.hint.offsetHeight;
      const availW = el.bigline.clientWidth - (el.bigToggle.hidden ? 0 : el.bigToggle.offsetWidth + 10);
      fitTo(el.big, availW, Math.max(availH, 12), .2);
    }
  }

  // (Work is done in the next frame: changing sizes inside a ResizeObserver callback makes the browser complain.)
  let frame = 0;
  function refit() {
    frame = 0; layout(); histFit = ''; render(); fitBand();
    if (histEnd && el.app.classList.contains('hist')) el.hlist.scrollTop = el.hlist.scrollHeight;
  }
  const soon = () => { if (!frame) frame = requestAnimationFrame(refit); };
  new ResizeObserver(soon).observe(el.app);
  Board21.on('resize', soon);   // (also when the text style changes, and once its font has loaded)

  // ---- Changes from elsewhere: another tab, an import, Board history
  Board21.on('data', d => { calc.load(d); savedData = JSON.stringify(calc.serialize()); render(); });
  Board21.on('config', c => useConfig(readConfig(c), cfg));

  Board21.ready().then(ctx => {
    cfg = readConfig(ctx.config);
    calc.setOptions(engineOptions());
    calc.load(ctx.data);
    savedData = JSON.stringify(calc.serialize());
    layout();
    render();
  });
  layout();
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../sdk/board21.js"></script>
<script type="application/json" id="board21-widget">{"id":"stopwatch","name":"Stopwatch","version":"1.0.0","description":"Count up with laps and a class record.","color":"#a16207","window":{"width":600,"height":380,"minWidth":280,"minHeight":200}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--b21-bg); color: var(--b21-text); font-family: var(--b21-font);
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The face. JS works out where everything goes from the window alone; CSS draws it. */
  .face {
    --ease: cubic-bezier(.2, .7, .2, 1);
    --veil: var(--b21-accent);
    --rest: .48;                                   /* a hidden digit at rest: 2:1 on the background */
    --good: color-mix(in srgb, var(--b21-success) 68%, var(--b21-text));
    --hair: var(--b21-border);
    position: fixed; inset: 0; visibility: hidden;
  }
  [data-b21-theme="dark"] .face { --rest: .38; }
  .face.ready { visibility: visible; }
  .box { position: absolute; left: 0; top: 0; }
  .none { display: none !important; }

  /* The time. One fixed slot per character, so nothing shifts as it counts. */
  .time-wrap { display: flex; align-items: center; justify-content: center; transition: translate .42s var(--ease); }
  .face.line-empty .time-wrap { translate: 0 calc(var(--drop) * 1px); }
  .face.settle-late .time-wrap { transition-delay: .9s; }
  .time {
    position: relative; display: flex; align-items: flex-end; white-space: nowrap;
    font-weight: 500; line-height: 1;
    font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1;
    color: var(--b21-text); transition: color .9s ease;
  }
  .slot { display: block; position: relative; text-align: center; text-box: trim-both cap alphabetic; }
  .slot > i { display: inline-block; font-style: normal; }
  .slot.off { display: none; }
  .dig { width: calc(var(--dw) * 1em); }
  .colon { width: calc(var(--cw) * 1em); }
  .colon > i { translate: 0 calc(var(--cy) * 1em); }
  .pt { width: calc(var(--pw) * 1em); }
  .frac { font-size: calc(var(--s) * 1em); transition: color .9s ease; }
  .face[data-phase="idle"] .time { color: color-mix(in srgb, var(--b21-text) 55%, var(--b21-bg)); }
  .face[data-phase="running"] .frac { color: var(--b21-muted); }

  /* Hide time: a tile the height of a digit covers each one. While it runs, a wave hops across them every 1.2 s:
     each tile lifts, grows a little, and turns full accent in turn, and the colon brightens as it passes. */
  .face.veiled .time { color: var(--veil); }
  .face.veiled .dig > i { opacity: 0; }
  .face.veiled .colon > i { opacity: var(--rest); }
  .face.veiled .dig::after, .face.reveal .dig::after {
    content: ""; position: absolute; left: 19%; right: 19%; top: 0; bottom: 0; border-radius: .085em; background: var(--veil);
  }
  .face.veiled .dig::after { opacity: var(--rest); }
  .face.veiled[data-phase="running"] .dig::after { animation: hop 1.2s ease-in-out infinite both; animation-delay: calc(var(--w) * 200ms - 1.2s); }
  .face.veiled[data-phase="running"] .colon > i { animation: pulse 1.2s ease-in-out infinite both; animation-delay: calc(var(--w) * 200ms - 1.2s); }
  @keyframes hop {
    0% { opacity: var(--rest); transform: none; }
    22% { opacity: 1; transform: translateY(-.1em) scale(1.1); }
    48%, 100% { opacity: var(--rest); transform: none; }
  }
  @keyframes pulse {
    0% { opacity: var(--rest); scale: 1; }
    22% { opacity: 1; scale: 1.1; }
    48%, 100% { opacity: var(--rest); scale: 1; }
  }
  /* Stop: each tile fades, then its digit rises into the same slot, left to right. */
  .face.reveal .dig::after { opacity: 0; animation: blockOut .24s ease-in both; animation-delay: calc(var(--i) * 80ms); }
  .face.reveal .dig > i, .face.reveal .pt > i { animation: digIn .5s var(--ease) both; animation-delay: calc(var(--i) * 80ms + 170ms); }
  .face.reveal .colon > i { animation: fadeIn .4s ease-out both; }
  .face.reveal .time { transition: color .5s ease .1s; }
  @keyframes blockOut { from { opacity: var(--rest); } to { opacity: 0; } }
  @keyframes digIn { from { opacity: 0; transform: translateY(.06em); } }
  @keyframes fadeIn { from { opacity: 0; } }
  .face.reveal .frac::after { display: none; }

  /* One line under the time: the latest lap, or that the time is hidden. */
  .note {
    text-align: center; white-space: nowrap; line-height: 1; text-box: trim-both cap alphabetic;
    font-variant-numeric: tabular-nums; transition: opacity .2s;
  }
  .note.gone { opacity: 0; visibility: hidden; transition: opacity .15s, visibility 0s .15s; }
  .note .lbl { color: var(--b21-muted); font-weight: 500; }
  .note .val { font-weight: 600; margin-left: .45em; }
  .note .lbl2 { margin-left: 1.3em; }
  .note.short .lbl2, .note.short .val2 { display: none; }
  .note .eye { display: none; width: 1em; height: 1em; vertical-align: -.12em; margin-right: .4em;
    fill: none; stroke: var(--b21-muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .note[data-kind="hidden"] .eye { display: inline-block; }
  .note[data-kind="hidden"] .val, .note[data-kind="hidden"] .lbl2 { display: none; }
  .note.new .val { animation: ping 1.2s ease-out; }
  @keyframes ping { from { color: var(--b21-accent); } }

  /* Beat the record: a line above the time, and a track under it with the record's mark. The mark is one color
     wherever it shows: the line's flag, the pole, and the pennant. */
  .rec {
    display: flex; align-items: center; justify-content: center; gap: .34em; white-space: nowrap; overflow: hidden;
    line-height: 1; font-weight: 500; color: var(--b21-muted); font-variant-numeric: tabular-nums;
  }
  .rec > span, .rec > b { text-box: trim-both cap alphabetic; }
  .rec svg { flex: none; width: 1em; height: 1em; }
  .rec .flag { color: var(--b21-text); fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .rec .flag .pen { fill: currentColor; }
  .rec .star { fill: currentColor; }
  .rec b { color: var(--b21-text); font-weight: 650; }
  .rec .diff::before { content: "\00b7"; margin: 0 .34em 0 .1em; opacity: .7; }
  .face.best .rec { color: var(--good); }
  .face.best .rec .lbl { font-weight: 650; }
  .face.best .rec .diff { color: var(--b21-muted); }
  .face.cheer .rec { animation: rise .5s var(--ease) both; }
  .face.cheer .rec .star { animation: star .6s var(--ease) both .1s; transform-origin: 50% 55%; }
  @keyframes rise { from { opacity: 0; transform: translateY(.45em); } }
  @keyframes star { from { opacity: 0; transform: scale(.5) rotate(-30deg); } }
  .face.cheer .time, .face.cheer .frac { color: var(--good); transition-duration: .25s; }
  /* In a window too small for the line, a new record still shows: the time stays green. */
  .face.best.noline .time, .face.best.noline .frac { color: var(--good); }

  .track {
    --rail: color-mix(in srgb, var(--b21-text) 16%, var(--b21-bg));
    --run-a: var(--b21-accent); --run-b: color-mix(in srgb, var(--b21-muted) 42%, var(--b21-bg));
    --mark: var(--b21-text);
    --pen: max(calc(var(--th) * 1.05), var(--penmin, 0px));
  }
  .face.long .track { --run-b: var(--b21-success); }
  .face.best .track { --run-a: var(--b21-success); --run-b: var(--b21-success); --mark: var(--b21-success); }
  .rail, .fill, .gain { position: absolute; left: 0; top: calc(var(--th) * 1.55); height: var(--th); border-radius: 999px; }
  .rail { right: 0; background: var(--rail); }
  .fill { width: var(--runp, 0px); background: linear-gradient(to right, var(--run-a) 0 var(--splitp, 0px), var(--run-b) var(--splitp, 0px) 100%); }
  .track.nofill .fill { opacity: 0; }
  .gain { left: var(--lop, 0px); width: calc(var(--hip, 0px) - var(--lop, 0px)); border-radius: 0; opacity: 0;
    background: color-mix(in srgb, var(--b21-success) 30%, var(--b21-bg)); }
  .pole, .was { position: absolute; left: var(--flagp, 0px); width: max(2px, calc(var(--th) * .26)); transform: translateX(-50%); border-radius: 99px; background: var(--mark); }
  .pole { top: 0; bottom: 0; transition: opacity .3s ease; }
  .pole::after { content: ""; position: absolute; left: 50%; top: 0; width: calc(var(--pen) * 1.3); height: var(--pen); background: var(--mark); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .track.noflag .pole { opacity: 0; }
  .was { left: var(--ghostp, 0px); top: calc(var(--th) * 1.15); height: calc(var(--th) * 1.8); opacity: 0; background: var(--b21-muted); }
  .face.best.has-ghost .gain { opacity: 1; }
  .face.best.has-ghost .was { opacity: .6; }
  .face.glide .fill { transition: width .8s var(--ease), opacity .4s ease; }
  .face.glide .pole, .face.glide .was { transition: left .8s var(--ease), opacity .5s ease .3s; }
  .face.glide .gain { transition: left .8s var(--ease), width .8s var(--ease), opacity .6s ease .25s; }

  /* Buttons share one row with one place for each window size, the same in every mode. Idle Start fills it.
     Running, Stop takes the wider right part and Lap the left, so the middle of Start is always Stop. Stopped,
     Resume takes Stop's place and Reset takes Lap's. Each has a small icon beside its word, as tall as the word's
     capitals and as heavy as its strokes. The icon never steps aside: in a tight row the gap and padding shrink. */
  .controls { flex: none; }
  .btn {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; gap: .36em; padding: 0 .35em;
    border-radius: 999px; font-weight: 600; line-height: 1; white-space: nowrap;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .16s, visibility 0s .16s;
  }
  .btn.on {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .22s .05s, left .3s var(--ease), width .3s var(--ease), transform .15s var(--ease), filter .15s;
  }
  .btn .ico { flex: none; width: calc(var(--ico) * 1em); height: calc(var(--ico) * 1em);
    fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .btn .ico.solid { fill: currentColor; stroke-width: 2; }
  .btn .bl { display: block; text-box: trim-both cap alphabetic; }
  .controls.tight .btn { gap: .26em; padding: 0 .2em; }
  .btn[data-at="left"] { width: calc((100% - var(--bgap) * 1px) * var(--ls, .36)); }
  .btn[data-at="right"] { left: calc((100% - var(--bgap) * 1px) * var(--ls, .36) + var(--bgap) * 1px); width: calc((100% - var(--bgap) * 1px) * (1 - var(--ls, .36))); }
  .btn:active { transform: scale(.97); filter: brightness(.94); }
  [data-b21-theme="dark"] .btn:active { filter: brightness(1.12); }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 3px; }
  #start { background: var(--b21-accent); color: var(--b21-on-accent); }
  #stop { background: var(--b21-text); color: var(--b21-bg); }
  #lap, #reset, #undo { background: color-mix(in srgb, var(--b21-text) 11%, var(--b21-bg)); color: var(--b21-text); }
  [data-b21-theme="dark"] #lap, [data-b21-theme="dark"] #reset, [data-b21-theme="dark"] #undo { background: color-mix(in srgb, var(--b21-text) 16%, var(--b21-bg)); }

  /* Lap list: every lap in a numbered list, oldest first. Its rows are ruled from the start, so a new lap only
     fills the next one. On a big board the rows flow into a second column, so a class of 30 fits at once. */
  .llist { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; line-height: 1; transition: opacity .3s ease-out .1s; }
  .llist.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .15s, visibility 0s .15s; }
  .lscroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .lscroll::-webkit-scrollbar, .lrows::-webkit-scrollbar { display: none; }
  .lheads { display: flex; gap: var(--cg); height: var(--headh); }
  .lhead { flex: none; width: var(--colw); display: grid; grid-template-columns: var(--gcols); align-items: start;
    border-bottom: 1px solid color-mix(in srgb, var(--b21-text) 22%, var(--b21-bg)); font-size: var(--tf); font-weight: 600; color: var(--b21-muted); }
  .lhead span { text-box: trim-both cap alphabetic; text-align: right; }
  .lrows { list-style: none; width: var(--colw); height: calc(var(--R) * var(--rowh)); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: none; scroll-snap-type: y mandatory; }
  .lrows:focus, .lscroll:focus { outline: none; }
  .lrows:focus-visible, .lscroll:focus-visible { outline: 3px solid var(--b21-accent); outline-offset: 3px; border-radius: 4px; }
  .lrows.flow { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--R), var(--rowh)); grid-auto-columns: var(--colw);
    column-gap: var(--cg); width: max-content; overflow: visible; scroll-snap-type: none; }
  .lrow { display: grid; grid-template-columns: var(--gcols); align-items: center; height: var(--rowh); white-space: nowrap;
    border-bottom: 1px solid var(--hair); scroll-snap-align: start; }
  .lrow.empty { border-bottom-color: color-mix(in srgb, var(--hair) 60%, var(--b21-bg)); }
  .lrow > span { text-box: trim-both cap alphabetic; }
  .lrow .n, .lhead span:first-child { text-align: right; padding-right: var(--g); }
  .lrow .n { font-weight: 600; color: var(--b21-muted); }
  .lrow .lt { text-align: right; font-weight: 500; }
  .lrow .tag { padding-left: var(--g2); font-size: var(--tf); font-weight: 650; color: var(--good); }
  .lrow .tot { text-align: right; font-weight: 650; }
  .lrow.fast .lt { color: var(--good); font-weight: 600; }
  .lrow.ghost { color: color-mix(in srgb, var(--b21-muted) 70%, var(--b21-bg)); }
  .lrow.ghost .n { color: inherit; }
  .lrow .sq { display: inline-block; width: .5em; height: .5em; border-radius: .1em; background: currentColor; vertical-align: .11em; }
  .lrow.new { animation: rowIn 1.4s var(--ease); }
  @keyframes rowIn {
    0% { opacity: 0; background: var(--b21-accent-soft); }
    25% { opacity: 1; background: var(--b21-accent-soft); }
    100% { background: transparent; }
  }
  .lrows.up { -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 calc(var(--rowh) * .9)); mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 calc(var(--rowh) * .9)); }
  .lrows.down { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--rowh) * .9), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - var(--rowh) * .9), transparent); }
  .lrows.up.down { -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 calc(var(--rowh) * .9), #000 calc(100% - var(--rowh) * .9), transparent);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 calc(var(--rowh) * .9), #000 calc(100% - var(--rowh) * .9), transparent); }
  .lscroll.left { -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.3), #000 calc(var(--g) + 1.4em)); mask-image: linear-gradient(to right, rgba(0,0,0,.3), #000 calc(var(--g) + 1.4em)); }

  #probe { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; font-size: 100px; font-weight: 600;
    line-height: 1; font-variant-numeric: tabular-nums; }

  @supports not (text-box: trim-both cap alphabetic) {
    .slot, .note, .btn .bl, .rec > span, .lhead span, .lrow > span { line-height: .74; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .face.veiled .dig::after, .face.veiled .colon > i { opacity: calc(var(--rest) + .22); }
  }
</style>
</head>
<body>
<main class="face" id="face" data-phase="idle" data-mode="note">
  <p class="rec box none" id="rec"></p>
  <div class="time-wrap box" id="timeWrap">
    <div class="time" id="time" role="timer">
      <span class="sr" id="timeText">0:00.00</span>
      <span class="slot dig" data-k="h1" aria-hidden="true"><i></i></span><span class="slot dig" data-k="h2" aria-hidden="true"><i></i></span><span
        class="slot colon" data-k="c1" aria-hidden="true"><i>:</i></span><span class="slot dig" data-k="m1" aria-hidden="true"><i></i></span><span
        class="slot dig" data-k="m2" aria-hidden="true"><i></i></span><span class="slot colon" data-k="c2" aria-hidden="true"><i>:</i></span><span
        class="slot dig" data-k="s1" aria-hidden="true"><i></i></span><span class="slot dig" data-k="s2" aria-hidden="true"><i></i></span><span
        class="slot pt frac" data-k="pt" aria-hidden="true"><i>.</i></span><span class="slot dig frac" data-k="f1" aria-hidden="true"><i></i></span><span
        class="slot dig frac" data-k="f2" aria-hidden="true"><i></i></span>
    </div>
  </div>
  <div class="track box none" id="track" aria-hidden="true"><div class="rail"></div><div class="gain"></div><div class="fill"></div><div class="was"></div><div class="pole"></div></div>
  <p class="note box" id="note"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 4M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span
    class="lbl" id="noteLbl"></span><span class="val" id="noteVal"></span><span class="lbl lbl2" id="noteLbl2">Total</span><span class="val val2" id="noteVal2"></span></p>
  <div class="controls box" id="controls">
    <button class="btn" id="lap" type="button" data-at="left"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.6" r="7.4"/><path d="M12 13.6V10"/><path d="M9.6 2.4h4.8"/><path d="M12 2.6v3.4"/></svg><span class="bl">Lap</span></button>
    <button class="btn" id="reset" type="button" data-at="left"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 12.8a7.1 7.1 0 1 0 2.2-5.8"/><path d="M4.6 3.6v4.5h4.5"/></svg><span class="bl">Reset</span></button>
    <button class="btn" id="undo" type="button" data-at="left" aria-label="Undo reset"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.8 13.4L4.4 9l4.4-4.4"/><path d="M4.6 9h9.9a5.1 5.1 0 0 1 0 10.2H10.8"/></svg><span class="bl">Undo</span></button>
    <button class="btn" id="start" type="button" data-at="full"><svg class="ico solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.6 5.1v13.8a1.2 1.2 0 0 0 1.8 1l10.6-6.9a1.2 1.2 0 0 0 0-2L9.4 4.1a1.2 1.2 0 0 0-1.8 1z"/></svg><span class="bl" id="startLbl">Start</span></button>
    <button class="btn" id="stop" type="button" data-at="right"><svg class="ico solid" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.8" y="4.8" width="14.4" height="14.4" rx="2.8"/></svg><span class="bl">Stop</span></button>
  </div>
  <section class="llist box off" id="llist" aria-label="Lap list">
    <div class="lscroll" id="lscroll"><div class="lheads" id="lheads" aria-hidden="true"></div><ol class="lrows" id="lrows" aria-label="Laps"></ol></div>
  </section>
</main>
<span id="probe" aria-hidden="true"></span>
<div class="sr" id="announce" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var face = $('face'), timeWrap = $('timeWrap'), timeEl = $('time'), timeText = $('timeText');
  var note = $('note'), noteLbl = $('noteLbl'), noteVal = $('noteVal'), noteVal2 = $('noteVal2'), controls = $('controls');
  var announceEl = $('announce'), probe = $('probe');
  var recEl = $('rec'), track = $('track'), llist = $('llist'), lscroll = $('lscroll'), lheads = $('lheads'), lrows = $('lrows'), startLbl = $('startLbl');
  var B = { start: $('start'), stop: $('stop'), lap: $('lap'), reset: $('reset'), undo: $('undo') };
  var slots = {}, glyph = {};
  Array.prototype.forEach.call(timeEl.querySelectorAll('.slot'), function (el) { slots[el.dataset.k] = el; glyph[el.dataset.k] = el.firstChild; });
  var ALL = ['h1', 'h2', 'c1', 'm1', 'm2', 'c2', 's1', 's2', 'pt', 'f1', 'f2'];
  var DIGS = ['h1', 'h2', 'm1', 'm2', 's1', 's2', 'f1', 'f2'];
  var reduced = matchMedia('(prefers-reduced-motion: reduce)');

  var MAX_MS = 100 * 3600 * 1000 - 10;   // 99:59:59.99
  var TEN = 600000, HOUR = 3600000;
  var MAX_LAPS = 999;
  var HUND = 0.52;                        // hundredths, as a share of the main digits
  var GUARD = 450;                        // a button ignores taps this long after it appears
  var SLOW_GUARD = 700;                   // Reset, Undo, a fresh Start, and any button that just moved wait longer
  var LAP_GAP = 250;                      // two laps closer than this are one hard tap
  var UNDO_FACE = 10000;                  // Undo stays on the face this long after Reset; the menu keeps it until Start
  var MIN_REC = 5000;                     // no class routine takes under 5 seconds: a shorter run is a slip, never a record
